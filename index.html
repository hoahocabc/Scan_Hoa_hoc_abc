      function handleFilesSelected(fileList) {
        if (!fileList || !fileList.length) return;
        const files = Array.from(fileList);
        files.forEach((file) => {
          if (file.type && !file.type.startsWith("image/")) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement("canvas");
              const maxSide = 1800;
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              if (Math.max(w, h) > maxSide) {
                const sc = maxSide / Math.max(w, h);
                w = Math.round(w * sc);
                h = Math.round(h * sc);
              }
              c.width = w;
              c.height = h;
              c.getContext("2d").drawImage(img, 0, 0, w, h);
              const cleanName = (file.name || `ScanhoahocABC_${state.pages.length + 1}`).replace(/\.[^.]+$/, "");
              addNewPageFromCanvas(c, cleanName, null, null, 0, "");
              showToast(`Đã bắt đối tượng & làm phẳng "${cleanName}"!`);
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function applyCameraZoomValue(zVal) {
        if (!state.cameraStream) return;
        const track = state.cameraStream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== "function") return;
        try {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            const minZ = caps.zoom.min || 1;
            const maxZ = caps.zoom.max || 1;
            const clamped = Math.max(minZ, Math.min(maxZ, zVal));
            await track.applyConstraints({ advanced: [{ zoom: clamped }] });
          }
        } catch (_) {}
      }

      async function applyCameraZoom(targetZoomMode) {
        if (!state.cameraStream) return;
        const track = state.cameraStream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== "function") return;
        try {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            const minZ = caps.zoom.min || 1;
            const maxZ = caps.zoom.max || 1;
            let zVal = minZ;
            if (targetZoomMode === "1") zVal = Math.max(minZ, Math.min(maxZ, 1.0));
            else if (targetZoomMode === "1.5") zVal = Math.max(minZ, Math.min(maxZ, 1.5));
            await track.applyConstraints({ advanced: [{ zoom: zVal }] });
          }
        } catch (_) {}
      }

      async function startCamera() {
        stopCamera();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast("Trình duyệt hiện tại không cấp quyền Camera trực tiếp.");
          return;
        }
        try {
          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
              },
              audio: false
            });
          } catch (_) {
            stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });
          }
          state.cameraStream = stream;
          el.cameraModal.classList.add("open");
          el.cameraVideo.srcObject = stream;
          await el.cameraVideo.play();
          await applyCameraZoom("min");
          runCameraLiveOverlay();
        } catch (err) {
          el.cameraModal.classList.remove("open");
          stopCamera();
          showToast("Không thể mở Camera. Vui lòng cấp quyền Camera cho trình duyệt.");
        }
      }

      function stopCamera() {
        if (state.cameraAnimId) {
          cancelAnimationFrame(state.cameraAnimId);
          state.cameraAnimId = null;
        }
        if (state.cameraStream) {
          state.cameraStream.getTracks().forEach((t) => t.stop());
          state.cameraStream = null;
        }
      }

      function runCameraLiveOverlay() {
        const video = el.cameraVideo;
        const overlay = el.cameraOverlay;
        const octx = overlay.getContext("2d");
        const off = document.createElement("canvas");
        let frameCount = 0;
        state.lastCameraCorners = null;

        function loop() {
          if (!state.cameraStream) return;
          if (video.readyState >= 2 && video.videoWidth > 0) {
            overlay.width = video.videoWidth;
            overlay.height = video.videoHeight;
            frameCount++;
            if (frameCount % 5 === 1) {
              const maxSide = 360;
              const sc = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight));
              off.width = Math.max(72, Math.round(video.videoWidth * sc));
              off.height = Math.max(72, Math.round(video.videoHeight * sc));
              off.getContext("2d").drawImage(video, 0, 0, off.width, off.height);
              const corners = detectDocumentCorners(off, true);
              const sx = video.videoWidth / off.width;
              const sy = video.videoHeight / off.height;
              const nextCorners = corners.map((p) => ({
                x: Math.round(p.x * sx),
                y: Math.round(p.y * sy)
              }));
              if (!state.lastCameraCorners) {
                state.lastCameraCorners = nextCorners;
              } else {
                state.lastCameraCorners = state.lastCameraCorners.map((prev, idx) => ({
                  x: Math.round(prev.x * 0.35 + nextCorners[idx].x * 0.65),
                  y: Math.round(prev.y * 0.35 + nextCorners[idx].y * 0.65)
                }));
              }
            }
            octx.clearRect(0, 0, overlay.width, overlay.height);
            if (state.lastCameraCorners) {
              const c = state.lastCameraCorners;
              octx.save();
              octx.fillStyle = "rgba(15, 23, 42, 0.44)";
              octx.beginPath();
              octx.rect(0, 0, overlay.width, overlay.height);
              octx.moveTo(c[0].x, c[0].y);
              octx.lineTo(c[1].x, c[1].y);
              octx.lineTo(c[2].x, c[2].y);
              octx.lineTo(c[3].x, c[3].y);
              octx.closePath();
              octx.fill("evenodd");
              octx.restore();

              octx.strokeStyle = "#ffffff";
              octx.lineWidth = Math.max(4, overlay.width / 200);
              octx.beginPath();
              octx.moveTo(c[0].x, c[0].y);
              octx.lineTo(c[1].x, c[1].y);
              octx.lineTo(c[2].x, c[2].y);
              octx.lineTo(c[3].x, c[3].y);
              octx.closePath();
              octx.stroke();
            }
          }
          state.cameraAnimId = requestAnimationFrame(loop);
        }
        loop();
      }

      function rotateCurrentPage(dir) {
        const page = getCurrentPage();
        if (!page) return;
        const sC = page.srcCanvas;
        const rot = document.createElement("canvas");
        rot.width = sC.height;
        rot.height = sC.width;
        const rctx = rot.getContext("2d");
        rctx.save();
        if (dir > 0) {
          rctx.translate(rot.width, 0);
          rctx.rotate(Math.PI / 2);
        } else {
          rctx.translate(0, rot.height);
          rctx.rotate(-Math.PI / 2);
        }
        rctx.drawImage(sC, 0, 0);
        rctx.restore();

        page.srcCanvas = rot;
        page.corners = detectDocumentCorners(rot);
        page.edgeOffsets = rot._detectedEdgeOffsets ? cloneEdgeOffsets(rot._detectedEdgeOffsets) : createZeroEdgeOffsets();
        updateGeometryAndProcess(page);
        resetStageZoom();
        resetFsZoom();
        renderPageList();
        renderStage();
        if (el.fullScreenEditorModal.classList.contains("open")) {
          renderFullScreenEditor();
        }
      }

          if (evt.touches && evt.touches.length === 2) {
            const t0 = evt.touches[0], t1 = evt.touches[1];
            const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
            const stRect = el.stageContainer.getBoundingClientRect();
            state.pinchState = {
              target: "stage",
              startDist: Math.max(12, dist),
              startZoom: state.stageZoom,
              startPanX: state.stagePanX,
              startPanY: state.stagePanY,
              startMidX: (t0.clientX + t1.clientX) * 0.5,
              startMidY: (t0.clientY + t1.clientY) * 0.5,
              centerX: stRect.left + stRect.width * 0.5,
              centerY: stRect.top + stRect.height * 0.5
            };
            evt.preventDefault();
          } else if (evt.touches && evt.touches.length === 1) {

          if (!page) return;
          page.corners = detectDocumentCorners(page.srcCanvas);
          page.edgeOffsets = page.srcCanvas._detectedEdgeOffsets
            ? cloneEdgeOffsets(page.srcCanvas._detectedEdgeOffsets)
            : createZeroEdgeOffsets();
          state.alignPointMode = page.srcCanvas._hasCurvedRim ? "multipt" : "4pt";
          syncAlignModeButtons();
          updateGeometryAndProcess(page);
          renderFullScreenEditor();
          showToast(page.srcCanvas._hasCurvedRim ? "Đã tự động bắt chuẩn đường lượn rìa tài liệu!" : "Đã tự động bắt chuẩn rìa tài liệu!");
        });

        el.btnFullFrameCorners.addEventListener("click", () => {
          const page = getCurrentPage();
          if (!page) return;
          const w = page.srcCanvas.width;
          const h = page.srcCanvas.height;
          page.corners = [
            { x: 4, y: 4 },
            { x: w - 4, y: 4 },
            { x: w - 4, y: h - 4 },
            { x: 4, y: h - 4 }
          ];
          page.edgeOffsets = createZeroEdgeOffsets();
          updateGeometryAndProcess(page);
          renderFullScreenEditor();
          showToast("Đã chọn toàn khung ảnh!");
        });

        el.btnAlignMode4Pt.addEventListener("click", () => {
          state.alignPointMode = "4pt";
          const page = getCurrentPage();
          if (page) {
            page.edgeOffsets = createZeroEdgeOffsets();
          }
          syncAlignModeButtons();
          renderFullScreenEditor();
          showToast("Chế độ Căn 4 góc (4 điểm ở 4 góc)!");
        });

        el.btnAlignModeMultiPt.addEventListener("click", () => {
          state.alignPointMode = "multipt";
          syncAlignModeButtons();
          renderFullScreenEditor();
          showToast("Chế độ Căn đa điểm (5 điểm uốn mỗi cạnh)!");
        });
        el.btnCancelCrop.addEventListener("click", () => setFsCropMode(false));

        el.btnApplyCropNow.addEventListener("click", () => {
          const page = getCurrentPage();
          if (!page) return;
          updateGeometryAndProcess(page);
          setFsCropMode(false);
          renderPageList();
          renderStage();
          renderFullScreenEditor();
          showToast("Đã cắt & dàn phẳng trang tài liệu!");
        });

        // Full-Screen Stage Touch & Mouse Listeners
        el.fsStageWrap.addEventListener("wheel", (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
          state.fsZoom = Math.max(0.8, Math.min(5.0, state.fsZoom * factor));
          applyFsTransform();
        }, { passive: false });

        el.fsStageWrap.addEventListener("touchstart", onFsTouchStart, { passive: false });
        el.fsStageWrap.addEventListener("mousedown", onFsMouseDown);
        window.addEventListener("touchmove", onGlobalPointerMove, { passive: false });
        window.addEventListener("touchend", onGlobalPointerUp);
        window.addEventListener("touchcancel", onGlobalPointerUp);
        window.addEventListener("mousemove", onGlobalPointerMove);
        window.addEventListener("mouseup", onGlobalPointerUp);

        // Full-Screen Bottom Buttons
        el.btnFsTriggerImgExport.addEventListener("click", () => openExportPopup("image"));
        el.btnFsTriggerPdfExport.addEventListener("click", () => openExportPopup("pdf"));
        el.btnFsDeletePage.addEventListener("click", () => deletePageAtIndex(state.currentPageIndex));

        // Upload & Paste
        el.btnTriggerUpload.addEventListener("click", () => el.fileInput.click());
        el.fileInput.addEventListener("change", (e) => {
          handleFilesSelected(e.target.files);
          el.fileInput.value = "";
        });

        window.addEventListener("paste", (e) => {
          if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) {
            handleFilesSelected(e.clipboardData.files);
          }
        });

        // Clean "Thư viện" (Library) Modal Controls
        el.btnOpenLibrary.addEventListener("click", () => {
          renderPageList();
          el.libraryModal.classList.add("open");
        });
        el.btnCloseLibrary.addEventListener("click", () => {
          exitMultiSelectMode();
          el.libraryModal.classList.remove("open");
        });

        el.btnViewList.addEventListener("click", () => {
          state.libViewMode = "list";
          el.btnViewList.classList.add("active");
          el.btnViewGrid.classList.remove("active");
          renderPageList();
        });
        el.btnViewGrid.addEventListener("click", () => {
          state.libViewMode = "grid";
          el.btnViewGrid.classList.add("active");
          el.btnViewList.classList.remove("active");
          renderPageList();
        });

        // Multi-Select Controls inside Library
        el.btnSelectAllInLib.addEventListener("click", () => {
          if (state.selectedPageIds.size === state.pages.length) {
            state.selectedPageIds.clear();
          } else {
            state.pages.forEach((p) => state.selectedPageIds.add(p.id));
          }
          renderPageList();
        });

        el.btnExitMultiSelect.addEventListener("click", exitMultiSelectMode);

        el.btnBatchPdfSelected.addEventListener("click", () => {
          const selPages = getSelectedPagesList();
          if (!selPages.length) return;
          const blob = generatePdfBlobFromPages(selPages, 0.94);
          triggerBlobDownload(blob, `ScanhoahocABC_${selPages.length}_trang_chon.pdf`);
          showToast(`Đã lưu PDF (${selPages.length} ảnh đã chọn)!`);
        });

        el.btnBatchDownloadSelected.addEventListener("click", () => {
          const selPages = getSelectedPagesList();
          if (!selPages.length) return;
          selPages.forEach((p, i) => {
            setTimeout(() => downloadSinglePageObj(p, "jpeg", p.name), i * 220);
          });
          showToast(`Đang tải về ${selPages.length} ảnh đã chọn!`);
        });

        el.btnBatchDeleteSelected.addEventListener("click", deleteSelectedPagesInLibrary);

        // Export Popup Controls ("Lưu PDF" & "Tải ảnh này")
        el.btnCloseExportPopup.addEventListener("click", () => el.exportPopupModal.classList.remove("open"));
        el.btnCancelExportPopup.addEventListener("click", () => el.exportPopupModal.classList.remove("open"));
        el.exportQualitySlider.addEventListener("input", () => {
          el.exportQualityVal.textContent = `${el.exportQualitySlider.value}%`;
        });
        el.btnConfirmExportNow.addEventListener("click", executeConfirmedExportFromPopup);

        // Tap outside modal-card on backdrop to close popups naturally on touchscreen
        [el.libraryModal, el.exportPopupModal].forEach((modalEl) => {
          modalEl.addEventListener("click", (e) => {
            if (e.target === modalEl) {
              if (modalEl === el.libraryModal) exitMultiSelectMode();
              modalEl.classList.remove("open");
            }
          });
        });

        // Camera Button ("📷 Chụp ảnh" — Opens Full-Screen Live Camera Viewfinder)
        el.btnOpenCamera.addEventListener("click", () => {
          startCamera();
        });
        if (el.btnCancelCameraBottom) {
          el.btnCancelCameraBottom.addEventListener("click", () => {
            el.cameraModal.classList.remove("open");
            stopCamera();
          });
        }

        [el.btnZoomMin, el.btnZoom1x, el.btnZoom15x].forEach((zBtn) => {
          zBtn.addEventListener("click", () => {
            [el.btnZoomMin, el.btnZoom1x, el.btnZoom15x].forEach((b) => b.classList.remove("active"));
            zBtn.classList.add("active");
            applyCameraZoom(zBtn.getAttribute("data-zoom"));
          });
        });

        let camPinchStartDist = 0;
        let camCurrentZoom = 1.0;
        el.cameraVideoWrap.addEventListener("touchstart", (e) => {
          if (e.touches && e.touches.length === 2) {
            camPinchStartDist = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            e.preventDefault();
          }
        }, { passive: false });
        el.cameraVideoWrap.addEventListener("touchmove", (e) => {
          if (e.touches && e.touches.length === 2 && camPinchStartDist > 10) {
            const dist = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            camCurrentZoom = Math.max(0.5, Math.min(3.0, camCurrentZoom * (dist / camPinchStartDist)));
            camPinchStartDist = dist;
            applyCameraZoomValue(camCurrentZoom);
            e.preventDefault();
          }
        }, { passive: false });

        el.btnCapturePhoto.addEventListener("click", () => {
          const video = el.cameraVideo;
          if (!video.videoWidth) return;
          const c = document.createElement("canvas");
          c.width = video.videoWidth;
          c.height = video.videoHeight;
          c.getContext("2d").drawImage(video, 0, 0);
          const capturedCorners = detectDocumentCorners(c);
          el.cameraModal.classList.remove("open");
          stopCamera();
          addNewPageFromCanvas(c, `Scan_${state.pages.length + 1}`, capturedCorners, null, 0, "");
          showToast("Đã chụp và lưu vào Thư viện!");
        });
      }

      // =========================================================================
      // 11. INITIALIZATION
      // =========================================================================
      function initApp() {
        initEvents();
        const c = createInitialSampleCanvas();
        addNewPageFromCanvas(c, "ScanhoahocABC_1", null, null, 0, "");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
