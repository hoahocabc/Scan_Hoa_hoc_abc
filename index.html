<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover" />
  <title>ScanhoahocABC</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="ScanhoahocABC (v33.0) — Ứng dụng quét tài liệu chuyên nghiệp trên smartphone: Nhận diện siêu tốc & chính xác rìa tài liệu đồng sáng với nền, tùy chỉnh ghi chú (có/không nền, có/không viền, màu nền, màu viền, màu chữ), bật đèn Flash và giữ 1 ngón di chuyển ảnh." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 1. TWO-TIER HEADER: Clean App Title on Top (NO "Trang x/y"), 3 Main Buttons Below -->
    <header class="app-header"><span id="cvStatusBadge" style="display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;border:1px solid rgba(245,158,11,0.35);background:rgba(245,158,11,0.16);color:#b45309;vertical-align:middle;">⏳ OpenCV...</span>
      <div class="header-top-row">
        <div class="brand-group">
          <div class="brand-logo" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/>
              <rect x="7" y="7" width="10" height="10" rx="1.5"/>
            </svg>
          </div>
          <span class="brand-title">ScanhoahocABC</span>
        </div>
      </div>

      <div class="header-btn-row">
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
        <button type="button" class="btn btn-hdr-primary" id="btnOpenCamera">
          📷 Chụp ảnh
        </button>
        <button type="button" class="btn btn-hdr-outline" id="btnTriggerUpload">
          📂 Chọn ảnh
        </button>
        <button type="button" class="btn btn-hdr-outline" id="btnOpenLibrary">
          🗂 Thư viện
        </button>
      </div>
    </header>

    <!-- 2. DOCUMENT STAGE VIEWPORT + SECONDARY INFO BAR BELOW IMAGE -->
    <main class="workspace">
      <section class="stage-panel" id="panelStage" aria-label="Khung tài liệu">
        <div class="stage-container" id="stageContainer">
          <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas" width="720" height="1018"></canvas>
          </div>
        </div>

        <!-- Secondary Info Bar Directly Below Image -->
        <div class="under-image-bar">
          <div class="under-image-inner">
            <div class="under-meta-text" id="mainUnderMetaText">
              1:1.41 (A4) • 720×1018 px • Ảnh gốc
            </div>
            <button type="button" class="stage-mini-btn" id="btnZoomReset" style="display:none;">100%</button>
          </div>
        </div>
      </section>

      <!-- 3. MAIN BOTTOM BAR: Col 1 = Sửa, Col 2 = Tải ảnh, Col 3 = Lưu PDF -->
      <section class="bottom-dock" id="panelControls" aria-label="Điều khiển">
        <div class="dock-inner">
          <div class="grid-3">
            <button type="button" class="btn btn-sec" id="btnOpenFullEditor">
              🛠 Sửa
            </button>
            <button type="button" class="btn btn-main" id="btnOpenImgExport">
              ⬇ Tải ảnh
            </button>
            <button type="button" class="btn btn-main" id="btnOpenPdfExport">
              📕 Lưu PDF
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ========================================================================= -->
  <!-- FULL-SCREEN VIEW & EDIT SCREEN (v21.0 — CLEAN SCIENTIFIC LAYOUT)          -->
  <!-- ========================================================================= -->
  <div class="fs-editor-backdrop" id="fullScreenEditorModal" role="dialog" aria-modal="true" aria-label="Chỉnh sửa ảnh toàn màn hình">

    <!-- TOP BAR: Left = ☰, Center = ◀ / ▶, Right = ✕ Đóng -->
    <div class="fs-top-bar">
      <div class="fs-top-bar-inner">
        <button type="button" class="fs-corner-hamburger" id="btnToggleEditDropdown" title="Mở / Đóng menu công cụ" aria-label="Menu công cụ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div class="fs-top-center-nav">
          <button type="button" class="fs-corner-btn" id="btnFsPrev" title="Ảnh trước">◀ Trước</button>
          <button type="button" class="fs-corner-btn" id="btnFsResetView" title="Đặt lại vị trí & thu phóng 100%" style="display:none; color:#38bdf8; border-color:rgba(56,189,248,0.45);">100%</button>
          <button type="button" class="fs-corner-btn" id="btnFsNext" title="Ảnh sau">Sau ▶</button>
        </div>

        <button type="button" class="fs-corner-btn" id="btnCloseFsEditor" title="Đóng màn hình sửa">✕ Đóng</button>
      </div>
    </div>

    <!-- POPUP 1: SEMI-TRANSPARENT VERTICAL HAMBURGER MENU (No redundant section headers!) -->
    <div class="edit-vertical-popup" id="editDropdownMenu">
      <button type="button" class="vpop-action-btn primary-item" id="btnDdStartCrop">
        📐 Căn chỉnh
      </button>
      <button type="button" class="vpop-action-btn" id="btnDdRotate90">
        ↻ Xoay 90°
      </button>

      <div class="vpop-divider"></div>
      <div id="ddColorModeGrid" style="display:flex; flex-direction:column; gap:4px; width:100%;">
        <button type="button" class="dd-mode-btn active" data-mode="original">🖼 Ảnh gốc</button>
        <button type="button" class="dd-mode-btn" data-mode="magic_color">🎨 Tài liệu màu</button>
        <button type="button" class="dd-mode-btn" data-mode="bw_sauvola">◐ Đen trắng</button>
        <button type="button" class="dd-mode-btn" data-mode="faint_boost">✒ Làm rõ chữ</button>
        <button type="button" class="dd-mode-btn" id="btnDdToggleAlpha">🪄 Tách nền</button>
        <button type="button" class="dd-mode-btn active" id="btnDdToggleLineAlign" title="Tự động nhận diện dòng chữ & đường kẻ để căn thẳng khớp với trang giấy">📏 Căn thẳng dòng & kẻ</button>
      </div>

      <div class="vpop-divider"></div>
      <div class="vpop-slider-item">
        <div class="vpop-slider-top">
          <span class="vpop-slider-lbl">📖 Độ phẳng</span>
          <span class="vpop-slider-val" id="ddBookCurveVal" title="Chạm để đặt lại 0%" style="cursor:pointer;">0%</span>
        </div>
        <input type="range" id="ddBookCurveSlider" min="-100" max="100" value="0" />
      </div>

      <div class="vpop-slider-item">
        <div class="vpop-slider-top">
          <span class="vpop-slider-lbl">☀️ Độ sáng</span>
          <span class="vpop-slider-val" id="ddBrightnessVal" title="Chạm để đặt lại 0" style="cursor:pointer;">0</span>
        </div>
        <input type="range" id="ddBrightnessSlider" min="-50" max="50" value="0" />
      </div>

      <div class="vpop-slider-item">
        <div class="vpop-slider-top">
          <span class="vpop-slider-lbl">🧹 Sạch nền</span>
          <span class="vpop-slider-val" id="ddCleanVal">68%</span>
        </div>
        <input type="range" id="ddCleanSlider" min="0" max="100" value="68" />
      </div>

      <div class="vpop-divider"></div>
      <div class="vpop-note-input-wrap">
        <input type="text" class="vpop-input" id="ddNoteInput" placeholder="Nhập ghi chú lên ảnh..." />
        <button type="button" class="vpop-note-clear" id="btnClearNote" title="Xóa ghi chú">✕</button>
      </div>

      <div class="vpop-slider-item">
        <div class="vpop-slider-top">
          <span class="vpop-slider-lbl">🔤 Cỡ chữ</span>
          <span class="vpop-slider-val" id="ddNoteSizeVal">28px</span>
        </div>
        <input type="range" id="ddNoteSizeSlider" min="14" max="64" value="28" />
      </div>

      <div class="vpop-pair-row">
        <button type="button" class="dd-mode-btn active" id="btnNoteToggleBg" title="Bật / Tắt nền ghi chú">
          ⬛ Có nền
        </button>
        <button type="button" class="dd-mode-btn active" id="btnNoteToggleBorder" title="Bật / Tắt viền ghi chú">
          🔲 Có viền
        </button>
      </div>

      <div class="note-style-block" id="noteTextColorBlock">
        <div class="note-style-hdr">
          <span>✒ Màu chữ</span>
        </div>
        <div class="vpop-color-row" id="ddNoteColorRow" aria-label="Màu chữ ghi chú">
          <button type="button" class="note-color-swatch active" data-color="#dc2626" style="background:#dc2626;" title="Chữ đỏ"></button>
          <button type="button" class="note-color-swatch" data-color="#2563eb" style="background:#2563eb;" title="Chữ xanh dương"></button>
          <button type="button" class="note-color-swatch" data-color="#16a34a" style="background:#16a34a;" title="Chữ xanh lá"></button>
          <button type="button" class="note-color-swatch" data-color="#d97706" style="background:#d97706;" title="Chữ cam"></button>
          <button type="button" class="note-color-swatch" data-color="#7c3aed" style="background:#7c3aed;" title="Chữ tím"></button>
          <button type="button" class="note-color-swatch" data-color="#0f172a" style="background:#0f172a;" title="Chữ đen"></button>
          <input type="color" class="note-color-picker" id="ddNoteTextColorPicker" value="#dc2626" title="Chọn màu chữ tùy ý" />
        </div>
      </div>

      <div class="note-style-block" id="noteBgColorBlock">
        <div class="note-style-hdr">
          <span>🎨 Màu nền</span>
        </div>
        <div class="vpop-color-row" id="ddNoteBgColorRow" aria-label="Màu nền ghi chú">
          <button type="button" class="note-color-swatch active" data-bg-color="#ffffff" style="background:#ffffff;" title="Nền trắng"></button>
          <button type="button" class="note-color-swatch" data-bg-color="#fef08a" style="background:#fef08a;" title="Nền vàng nhạt"></button>
          <button type="button" class="note-color-swatch" data-bg-color="#dbeafe" style="background:#dbeafe;" title="Nền xanh nhạt"></button>
          <button type="button" class="note-color-swatch" data-bg-color="#dcfce7" style="background:#dcfce7;" title="Nền lục nhạt"></button>
          <button type="button" class="note-color-swatch" data-bg-color="#fee2e2" style="background:#fee2e2;" title="Nền hồng nhạt"></button>
          <button type="button" class="note-color-swatch" data-bg-color="#0f172a" style="background:#0f172a;" title="Nền đen"></button>
          <input type="color" class="note-color-picker" id="ddNoteBgColorPicker" value="#ffffff" title="Chọn màu nền tùy ý" />
        </div>
      </div>

      <div class="note-style-block" id="noteBorderColorBlock">
        <div class="note-style-hdr">
          <span>🖼 Màu viền</span>
        </div>
        <div class="vpop-color-row" id="ddNoteBorderColorRow" aria-label="Màu viền ghi chú">
          <button type="button" class="note-color-swatch active" data-border-color="#dc2626" style="background:#dc2626;" title="Viền đỏ"></button>
          <button type="button" class="note-color-swatch" data-border-color="#2563eb" style="background:#2563eb;" title="Viền xanh dương"></button>
          <button type="button" class="note-color-swatch" data-border-color="#16a34a" style="background:#16a34a;" title="Viền xanh lá"></button>
          <button type="button" class="note-color-swatch" data-border-color="#d97706" style="background:#d97706;" title="Viền cam"></button>
          <button type="button" class="note-color-swatch" data-border-color="#7c3aed" style="background:#7c3aed;" title="Viền tím"></button>
          <button type="button" class="note-color-swatch" data-border-color="#0f172a" style="background:#0f172a;" title="Viền đen"></button>
          <input type="color" class="note-color-picker" id="ddNoteBorderColorPicker" value="#dc2626" title="Chọn màu viền tùy ý" />
        </div>
      </div>

      <input type="text" class="vpop-input" id="ddFilenameInput" placeholder="Tên tệp ảnh..." />
    </div>

    <!-- POPUP 2: SEMI-TRANSPARENT VERTICAL "CĂN CHỈNH" POPUP (Scientific paired rows!) -->
    <div class="edit-vertical-popup" id="fsCropBar">
      <button type="button" class="dd-mode-btn active" id="btnAlignMode4Pt">
        ◰ Căn 4 góc
      </button>
      <button type="button" class="dd-mode-btn" id="btnAlignModeMultiPt">
        ❖ Căn đa điểm
      </button>

      <div class="vpop-divider"></div>
      <button type="button" class="vpop-action-btn" id="btnAutoDetectCorners">
        🎯 Tự động
      </button>
      <button type="button" class="vpop-action-btn" id="btnAlignByTextLines" title="Nhận diện dòng chữ & đường kẻ ngang/dọc bên trong để căn thẳng đồng bộ với khung trang">
        📏 Căn theo dòng
      </button>
      <button type="button" class="vpop-action-btn" id="btnFullFrameCorners">
        ⛶ Toàn ảnh
      </button>

      <div class="vpop-divider"></div>
      <div class="vpop-pair-row">
        <button type="button" class="vpop-action-btn danger-item" id="btnCancelCrop">
          ✕ Hủy
        </button>
        <button type="button" class="vpop-action-btn primary-item" id="btnApplyCropNow">
          ✓ Áp dụng
        </button>
      </div>
    </div>

    <!-- Center Full-Screen Image Viewport -->
    <div class="fs-stage-wrap" id="fsStageWrap">
      <div class="fs-canvas-holder" id="fsCanvasHolder">
        <canvas id="fsCanvas" width="720" height="1018"></canvas>
      </div>

      <!-- 4x Magnifier Loupe when dragging handles in Alignment Mode -->
      <div class="magnifier-loupe" id="magnifierLoupe">
        <canvas id="loupeCanvas" width="114" height="114"></canvas>
        <div class="magnifier-label" id="loupeLabel">Góc TL</div>
      </div>
    </div>

    <!-- Secondary Info Directly Below Image + Synchronized Bottom Actions (Col 1=Xóa, Col 2=Tải ảnh, Col 3=Lưu PDF) -->
    <div class="fs-bottom-area" id="fsBottomArea">
      <div class="fs-note-preview" id="fsNotePreview"></div>
      <div class="fs-meta-strip" id="fsMetaSingleLine">
        1:1.41 (A4) • 720×1018 px • Ảnh gốc • Hôm nay
      </div>
      <div class="dock-inner">
        <div class="grid-3">
          <button type="button" class="btn btn-danger-soft" id="btnFsDeletePage">🗑 Xóa</button>
          <button type="button" class="btn btn-main" id="btnFsTriggerImgExport">⬇ Tải ảnh</button>
          <button type="button" class="btn btn-main" id="btnFsTriggerPdfExport">📕 Lưu PDF</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- POPUP 3: SEMI-TRANSPARENT VERTICAL LIBRARY ("THƯ VIỆN") MODAL             -->
  <!-- ========================================================================= -->
  <div class="modal-backdrop" id="libraryModal" role="dialog" aria-modal="true" aria-labelledby="libraryModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <span id="libraryModalTitle">Thư Viện Ảnh</span>
        <button type="button" class="btn btn-hdr-outline" id="btnCloseLibrary" style="height:31px; padding:0 10px;">✕ Đóng</button>
      </div>
      <div class="modal-body">
        <div class="lib-toolbar" id="libNormalToolbar">
          <div class="view-toggle-group" role="tablist">
            <button type="button" class="view-toggle-btn active" id="btnViewList">≣ Danh sách</button>
            <button type="button" class="view-toggle-btn" id="btnViewGrid">⊞ Thu nhỏ</button>
          </div>
          <span class="lib-page-badge" id="libPageStatusBadge">Trang 1 / 1</span>
        </div>

        <div class="lib-multiselect-bar" id="libMultiSelectBar">
          <span class="lib-ms-count" id="libSelectedCountText">Chọn 1/1</span>
          <div style="display:flex; align-items:center; gap:5px;">
            <button type="button" class="btn btn-sec" id="btnSelectAllInLib" style="height:28px; padding:0 8px; font-size:0.71rem;">☑ Tất cả</button>
            <button type="button" class="btn btn-danger-soft" id="btnExitMultiSelect" style="height:28px; padding:0 8px; font-size:0.71rem;">✕ Hủy</button>
          </div>
        </div>

        <div class="lib-container list-mode" id="pageListContainer"></div>

        <!-- Synchronized Col 1 = Xóa, Col 2 = Tải ảnh, Col 3 = Lưu PDF -->
        <div class="lib-ms-actions" id="libMultiSelectActions">
          <button type="button" class="btn btn-danger-soft" id="btnBatchDeleteSelected">🗑 Xóa</button>
          <button type="button" class="btn btn-main" id="btnBatchDownloadSelected">⬇ Tải ảnh</button>
          <button type="button" class="btn btn-main" id="btnBatchPdfSelected">📕 Lưu PDF</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- POPUP 4: SEMI-TRANSPARENT VERTICAL EXPORT POPUP ("LƯU PDF" / "TẢI ẢNH")  -->
  <!-- ========================================================================= -->
  <div class="modal-backdrop" id="exportPopupModal" role="dialog" aria-modal="true" aria-labelledby="exportPopupTitle" style="z-index: 190;">
    <div class="modal-card" style="max-width: 340px;">
      <div class="modal-header">
        <span id="exportPopupTitle">⬇ Tải Ảnh</span>
        <button type="button" class="btn btn-hdr-outline" id="btnCloseExportPopup" style="height:31px; padding:0 10px;">✕ Đóng</button>
      </div>
      <div class="modal-body" style="gap: 10px;">
        <div class="form-field">
          <label for="exportFilename">Tên tệp</label>
          <input type="text" id="exportFilename" value="ScanhoahocABC_1" />
        </div>

        <div class="form-field" id="exportFormatFieldWrap">
          <label for="exportFormat">Định dạng</label>
          <select id="exportFormat">
            <option value="jpeg" selected>Ảnh JPEG (.jpg)</option>
            <option value="png">Ảnh PNG (.png)</option>
            <option value="webp">Ảnh WebP (.webp)</option>
            <option value="tiff">Ảnh TIFF (.tif)</option>
            <option value="svg">Ảnh SVG (.svg)</option>
            <option value="pdf">Tài liệu PDF (.pdf)</option>
          </select>
        </div>

        <div class="form-field" id="exportPdfScopeFieldWrap" style="display:none;">
          <label for="exportPdfScope">Phạm vi trang</label>
          <select id="exportPdfScope">
            <option value="current" selected>Trang đang xem (1 trang)</option>
            <option value="all">Tất cả trang trong Thư viện</option>
          </select>
        </div>

        <div class="form-field">
          <label for="exportScale">Độ phân giải</label>
          <select id="exportScale">
            <option value="0.75">150 DPI (Nhẹ)</option>
            <option value="1" selected>200 DPI (Tiêu chuẩn)</option>
            <option value="1.5">300 DPI (Sắc nét)</option>
            <option value="2">600 DPI (Cao nhất)</option>
          </select>
        </div>

        <div class="dd-slider-row">
          <div class="dd-slider-top">
            <span class="dd-slider-label">Chất lượng</span>
            <span class="dd-slider-val" id="exportQualityVal">94%</span>
          </div>
          <input type="range" id="exportQualitySlider" min="50" max="100" value="94" />
        </div>

        <!-- Paired "✕ Hủy" beside "✓ Lưu" at the bottom of Export Popup! -->
        <div class="vpop-pair-row" style="margin-top: 2px;">
          <button type="button" class="btn btn-sec" id="btnCancelExportPopup" style="width:100%;">✕ Hủy</button>
          <button type="button" class="btn btn-main" id="btnConfirmExportNow" style="width:100%;">✓ Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FULL-SCREEN LIVE CAMERA VIEWFINDER (No popup header, 100% edge-to-edge camera + Flash/Torch Control) -->
  <div class="modal-backdrop" id="cameraModal" role="dialog" aria-modal="true" aria-label="Máy ảnh quét tài liệu">
    <div class="modal-card">
      <div class="modal-body" style="padding: 8px; gap: 8px;">
        <div class="camera-video-wrap" id="cameraVideoWrap">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <canvas id="cameraOverlay"></canvas>
          <div class="screen-flash-assist" id="screenFlashAssist" aria-hidden="true"></div>
          <div class="cam-top-bar">
            <button type="button" class="cam-floating-pill" id="btnCamTorchFloating" title="Bật / Tắt đèn Flash khi chụp">
              🔦 Đèn: Tắt
            </button>
          </div>
          <div class="zoom-pill-bar" id="zoomPillBar">
            <button type="button" class="zoom-pill active" data-zoom="min" id="btnZoomMin">0.5x</button>
            <button type="button" class="zoom-pill" data-zoom="1" id="btnZoom1x">1.0x</button>
            <button type="button" class="zoom-pill" data-zoom="1.5" id="btnZoom15x">1.5x</button>
          </div>
        </div>
        <div class="grid-3" style="flex-shrink: 0;">
          <button type="button" class="btn btn-sec" id="btnCancelCameraBottom" style="width:100%;">✕ Hủy</button>
          <button type="button" class="btn btn-sec" id="btnToggleFlash" style="width:100%;" title="Bật / Tắt đèn Flash khi chụp">🔦 Bật đèn</button>
          <button type="button" class="btn btn-main" id="btnCapturePhoto" style="width:100%;">📷 Chụp</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hold-to-Pan Visual Ring Indicator -->
  <div class="hold-pan-ring" id="holdPanRing" aria-hidden="true">✋</div>

    <!-- TOAST -->
  <div class="toast-box" id="toastBox" role="status" aria-live="polite">Đã xử lý xong!</div>

  <script defer src="./app.js"></script>
</body>
</html>
