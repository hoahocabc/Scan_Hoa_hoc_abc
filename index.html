              const w01 = (1 - dx) * dy;
              const w11 = dx * dy;

              dData[di]     = sData[i00] * w00 + sData[i10] * w10 + sData[i01] * w01 + sData[i11] * w11;
              dData[di + 1] = sData[i00 + 1] * w00 + sData[i10 + 1] * w10 + sData[i01 + 1] * w01 + sData[i11 + 1] * w11;
              dData[di + 2] = sData[i00 + 2] * w00 + sData[i10 + 2] * w10 + sData[i01 + 2] * w01 + sData[i11 + 2] * w11;
              dData[di + 3] = 255;
            } else {
              dData[di] = 255;
              dData[di + 1] = 255;
              dData[di + 2] = 255;
              dData[di + 3] = 255;
            }
          }
        }

        outCtx.putImageData(outImg, 0, 0);
        return outCanvas;
      }

      // =========================================================================
      // 6. LAZY HALO-FREE PAPER WHITENING & SAUVOLA B&W ENGINE (<18ms ON DEMAND)
      // =========================================================================
      function computeFinePaperSurfaceGrid(chArray, w, h) {
        // scale = 4 => 16x fewer pixels than full-res, runs in <3ms!
        const scale = 4;
        const sw = Math.max(8, Math.floor(w / scale));
        const sh = Math.max(8, Math.floor(h / scale));
        const sub = new Float32Array(sw * sh);

        for (let sy = 0; sy < sh; sy++) {
          const y0 = sy * scale;
          const rOff = y0 * w;
          for (let sx = 0; sx < sw; sx++) {
            sub[sy * sw + sx] = chArray[rOff + sx * scale];
          }
        }

        const dil = sepMaxFilter(sub, sw, sh, 2);
        const clo = sepMinFilter(dil, sw, sh, 1);
        const sm1 = sepBoxBlur(clo, sw, sh, 2);

        return { grid: sm1, sw, sh, scale };
      }

      function sampleEnvelopeGrid(envObj, x, y) {
        const gx = Math.min(envObj.sw - 1.001, Math.max(0, x / envObj.scale));
        const gy = Math.min(envObj.sh - 1.001, Math.max(0, y / envObj.scale));
        const x0 = gx | 0;
        const y0 = gy | 0;
        const dx = gx - x0;
        const dy = gy - y0;
        const g = envObj.grid;
        const sw = envObj.sw;
        const r0 = y0 * sw + x0;
        const r1 = (y0 + 1) * sw + x0;
        return (
          g[r0] * (1 - dx) * (1 - dy) +
          g[r0 + 1] * dx * (1 - dy) +
          g[r1] * (1 - dx) * dy +
          g[r1 + 1] * dx * dy
        );
      }

      function buildPageFilterCache(dewarpedCanvas) {
        const w = dewarpedCanvas.width;
        const h = dewarpedCanvas.height;
        const nPixels = w * h;
        const rawData = dewarpedCanvas.getContext("2d").getImageData(0, 0, w, h).data;

        const chR = new Float32Array(nPixels);
        const chG = new Float32Array(nPixels);
        const chB = new Float32Array(nPixels);
        const lum = new Float32Array(nPixels);

        for (let i = 0; i < nPixels; i++) {
          const idx = i * 4;
          const r = rawData[idx];
          const g = rawData[idx + 1];
          const b = rawData[idx + 2];
          chR[i] = r;
          chG[i] = g;
          chB[i] = b;
          lum[i] = 0.299 * r + 0.587 * g + 0.114 * b;
        }

        const gridL = computeFinePaperSurfaceGrid(lum, w, h);
        const gridR = computeFinePaperSurfaceGrid(chR, w, h);
        const gridG = computeFinePaperSurfaceGrid(chG, w, h);
        const gridB = computeFinePaperSurfaceGrid(chB, w, h);

        const uR = new Uint8Array(nPixels);
        const uG = new Uint8Array(nPixels);
        const uB = new Uint8Array(nPixels);
        const uL = new Float32Array(nPixels);
        const dL = new Float32Array(nPixels);

        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const i = rOff + x;
            const eL = Math.max(22.0, sampleEnvelopeGrid(gridL, x, y));
            const eR = Math.max(22.0, sampleEnvelopeGrid(gridR, x, y));
            const eG = Math.max(22.0, sampleEnvelopeGrid(gridG, x, y));
            const eB = Math.max(22.0, sampleEnvelopeGrid(gridB, x, y));

            const nr = Math.min(255, Math.max(0, Math.round((255.0 * chR[i]) / eR)));
            const ng = Math.min(255, Math.max(0, Math.round((255.0 * chG[i]) / eG)));
            const nb = Math.min(255, Math.max(0, Math.round((255.0 * chB[i]) / eB)));
            const nl = Math.min(255.0, Math.max(0.0, (255.0 * lum[i]) / eL));

            uR[i] = nr;
            uG[i] = ng;
            uB[i] = nb;
            uL[i] = nl;
            dL[i] = 255.0 - nl;
          }
        }

        const dMaxLocalF = sepMaxFilter(dL, w, h, 3);
        const dMaxLocal = new Uint8Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          dMaxLocal[i] = Math.min(255, Math.round(dMaxLocalF[i]));
        }

        return {
          w,
          h,
          rawData,
          uR,
          uG,
          uB,
          uL,
          dMaxLocal,
          meanL: null,
          stdL: null
        };
      }

      function ensureSauvolaStats(fc) {
        if (fc.meanL && fc.stdL) return;
        const w = fc.w, h = fc.h, nPixels = w * h;
        const uL = fc.uL;
        const uLSq = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) uLSq[i] = uL[i] * uL[i];
        const meanL = sepBoxBlur(uL, w, h, 14);
        const meanSqL = sepBoxBlur(uLSq, w, h, 14);
        const stdL = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          stdL[i] = Math.sqrt(Math.max(0.0, meanSqL[i] - meanL[i] * meanL[i]));
        }
        fc.meanL = meanL;
        fc.stdL = stdL;
      }

      function applyCachedFiltersToPage(page) {
        if (!page || !page.dewarpedCanvas) return;
        const w = page.dewarpedCanvas.width;
        const h = page.dewarpedCanvas.height;
        const settings = page.settings;
        const mode = settings.colorMode || "original";
        const transparentBg = !!settings.transparentBg;

        if (!page.processedCanvas || page.processedCanvas.width !== w || page.processedCanvas.height !== h) {
          page.processedCanvas = document.createElement("canvas");
          page.processedCanvas.width = w;
          page.processedCanvas.height = h;
        }
        const outCtx = page.processedCanvas.getContext("2d");

        // FAST PATH (<1ms!): Default "Ảnh gốc" without alpha copies dewarpedCanvas directly!
        if (mode === "original" && !transparentBg) {
          outCtx.clearRect(0, 0, w, h);
          outCtx.drawImage(page.dewarpedCanvas, 0, 0);
          return;
        }

        // Lazy-build filterCache only when switching to enhanced modes or alpha background
        if (!page.filterCache) {
          page.filterCache = buildPageFilterCache(page.dewarpedCanvas);
        }

        const fc = page.filterCache;
        const nPixels = w * h;
        const cleanAmt = (settings.bgSuppress ?? 68) / 100.0;
        const contrastAmt = (settings.contrast ?? 55) / 100.0;

        const outImg = outCtx.createImageData(w, h);
        const data = outImg.data;

        const rawData = fc.rawData;
        const uR = fc.uR;
        const uG = fc.uG;
        const uB = fc.uB;
        const uL = fc.uL;
        const dMaxLocal = fc.dMaxLocal;

        if (mode === "original") {
          data.set(rawData);
          if (transparentBg) {
            for (let i = 0; i < nPixels; i++) {
              const idx = i * 4;
              const d = 255 - uL[i];
              data[idx + 3] = d < 18 ? 0 : d < 48 ? Math.round(((d - 18) / 30) * 255) : 255;
            }
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        if (mode === "bw_sauvola") {
          ensureSauvolaStats(fc);
          const meanL = fc.meanL;
          const stdL = fc.stdL;
          const k = 0.16 + (1.0 - contrastAmt) * 0.10;
          const minDip = 14.0 + cleanAmt * 20.0 - contrastAmt * 6.0;
          const haloRatio = 0.24 + cleanAmt * 0.16;

          for (let i = 0; i < nPixels; i++) {
            const nl = uL[i];
            const mL = meanL[i];
            const sL = stdL[i];
            const sauvolaT = mL * (1.0 - k * (1.0 - sL / 128.0));
            const haloGuard = Math.max(minDip, dMaxLocal[i] * haloRatio);
            const effT = Math.min(sauvolaT, 255.0 - haloGuard);

            const diff = nl - effT;
            let bw;
            if (diff >= 5.0) bw = 255;
            else if (diff <= -5.0) bw = 10;
            else bw = Math.round(10.0 + ((diff + 5.0) / 10.0) * 245.0);

            const idx = i * 4;
            data[idx] = bw;
            data[idx + 1] = bw;
            data[idx + 2] = bw;
            data[idx + 3] = transparentBg ? (255 - bw) : 255;
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        let baseFloor, haloRatio, gain;
        if (mode === "faint_boost") {
          baseFloor = 11.0 + cleanAmt * 16.0;
          haloRatio = 0.22 + cleanAmt * 0.14;
          gain = 1.65 + contrastAmt * 1.45;
        } else {
          baseFloor = 15.0 + cleanAmt * 26.0;
          haloRatio = 0.28 + cleanAmt * 0.16;
          gain = 1.40 + contrastAmt * 1.25;
        }

        for (let i = 0; i < nPixels; i++) {
          const nr = uR[i];
          const ng = uG[i];
          const nb = uB[i];
          const nl = uL[i];
          const dL = 255.0 - nl;

          const maxC = nr > ng ? (nr > nb ? nr : nb) : (ng > nb ? ng : nb);
          const minC = nr < ng ? (nr < nb ? nr : nb) : (ng < nb ? ng : nb);
          const chroma = maxC - minC;

          const adaptiveFloor = Math.max(baseFloor, dMaxLocal[i] * haloRatio);
          const effFloor = Math.max(3.0, adaptiveFloor - chroma * 0.35);

          let smoothGain = 0.0;
          const lowEdge = effFloor * 0.80;
          if (dL > lowEdge) {
            const bandW = Math.max(2.0, effFloor * 0.35);
            const t = Math.min(1.0, (dL - lowEdge) / bandW);
            smoothGain = t * t * (3.0 - 2.0 * t) * gain;
          }

          const r = Math.min(255, Math.max(0, Math.round(255.0 - (255 - nr) * smoothGain)));
          const g = Math.min(255, Math.max(0, Math.round(255.0 - (255 - ng) * smoothGain)));
          const b = Math.min(255, Math.max(0, Math.round(255.0 - (255 - nb) * smoothGain)));

          const idx = i * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;

          if (transparentBg) {
            const lumOut = 0.299 * r + 0.587 * g + 0.114 * b;
            const dark = (255 - lumOut) + chroma * 0.85;
            data[idx + 3] = dark < 12 ? 0 : dark < 46 ? Math.round(((dark - 12) / 34) * 255) : 255;
          } else {
            data[idx + 3] = 255;
          }
        }

        outCtx.putImageData(outImg, 0, 0);
      }

      function updateGeometryAndProcess(page) {
        if (!page) return;
        const dewarped = dewarpQuad(
          page.srcCanvas,
          page.corners,
          page.settings.paperSize,
          page.midOffsets,
          page.settings.bookCurve || 0
        );
        page.dewarpedCanvas = dewarped;
        page.filterCache = null; // Lazy: only built when non-original mode is selected!
        applyCachedFiltersToPage(page);
      }

      // =========================================================================
      // 7. STAGE RENDERING (INCLUDING EMPTY STATE 0 IMAGES) & TOUCH HANDLERS
      // =========================================================================
      function getMidHandlePos(page, i) {
        const c = page.corners;
        const p1 = c[i];
        const p2 = c[(i + 1) % 4];
        const mOff = (page.midOffsets && page.midOffsets[i]) || { x: 0, y: 0 };
        return {
          x: (p1.x + p2.x) * 0.5 + mOff.x,
          y: (p1.y + p2.y) * 0.5 + mOff.y
        };
      }

      function drawCurvedQuadPath(ctx, page) {
        const c = page.corners;
        ctx.moveTo(c[0].x, c[0].y);
        for (let i = 0; i < 4; i++) {
          const p1 = c[i];
          const p2 = c[(i + 1) % 4];
          const mOff = (page.midOffsets && page.midOffsets[i]) || { x: 0, y: 0 };
          const cpX = (p1.x + p2.x) * 0.5 + mOff.x * 2.0;
          const cpY = (p1.y + p2.y) * 0.5 + mOff.y * 2.0;
          ctx.quadraticCurveTo(cpX, cpY, p2.x, p2.y);
        }
        ctx.closePath();
      }

      function renderStage() {
        const page = getCurrentPage();
        const ctx = el.mainCanvas.getContext("2d");

        if (!page) {
          // Clean Empty State on Main Stage when all images are deleted (0 images)
          el.mainCanvas.width = 640;
          el.mainCanvas.height = 820;
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(0, 0, 640, 820);
          ctx.strokeStyle = "rgba(255,255,255,0.22)";
          ctx.lineWidth = 3;
          ctx.setLineDash([10, 8]);
          ctx.strokeRect(42, 42, 556, 736);
          ctx.setLineDash([]);

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 24px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Thư viện đang trống (0 ảnh)", 320, 360);

          ctx.fillStyle = "#cbd5e1";
          ctx.font = "17px Arial";
          ctx.fillText("Bấm '📸 Chụp ảnh' hoặc '📁 Chọn ảnh' ở trên", 320, 405);
          ctx.fillText("hoặc mở '🗂 Thư viện' để nạp mẫu thử.", 320, 435);
          return;
        }

        if (state.viewMode === "crop") {
          const sW = page.srcCanvas.width;
          const sH = page.srcCanvas.height;
          el.mainCanvas.width = sW;
          el.mainCanvas.height = sH;

          ctx.clearRect(0, 0, sW, sH);
          ctx.drawImage(page.srcCanvas, 0, 0);

          const c = page.corners;
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.48)";
          ctx.beginPath();
          ctx.rect(0, 0, sW, sH);
          drawCurvedQuadPath(ctx, page);
          ctx.fill("evenodd");
          ctx.restore();

          const strokeW = Math.max(4, sW / 210);
          ctx.save();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = strokeW + 2;
          ctx.beginPath();
          drawCurvedQuadPath(ctx, page);
          ctx.stroke();

          ctx.strokeStyle = "#0a467d";
          ctx.lineWidth = strokeW;
          ctx.stroke();
          ctx.restore();

          const midR = Math.max(11, sW / 72);
          for (let i = 0; i < 4; i++) {
            const mp = getMidHandlePos(page, i);
            ctx.save();
            ctx.fillStyle = "#eaf2fb";
            ctx.strokeStyle = "#0a467d";
            ctx.lineWidth = Math.max(2.5, sW / 280);
            ctx.beginPath();
            ctx.arc(mp.x, mp.y, midR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          const cornerR = Math.max(17, sW / 48);
          const labels = ["TL", "TR", "BR", "BL"];
          for (let i = 0; i < 4; i++) {
            drawHandle(ctx, c[i].x, c[i].y, cornerR, "#0a467d", labels[i]);
          }
        } else {
          if (!page.processedCanvas) updateGeometryAndProcess(page);
          const targetCanvas = page.processedCanvas;
          el.mainCanvas.width = targetCanvas.width;
          el.mainCanvas.height = targetCanvas.height;
          ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
          ctx.drawImage(targetCanvas, 0, 0);
        }
      }

      function drawHandle(ctx, x, y, r, color, label) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = Math.max(3, r * 0.22);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${Math.max(11, Math.round(r * 0.72))}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, x, y);
        ctx.restore();
      }

      function updateMagnifierLoupe(imgX, imgY, clientX, clientY, labelText) {
        const page = getCurrentPage();
        if (!page || state.viewMode !== "crop") {
          el.magnifierLoupe.style.display = "none";
          return;
        }
        el.magnifierLoupe.style.display = "block";
        el.loupeLabel.textContent = labelText;

        const stRect = el.stageContainer.getBoundingClientRect();
        const relX = clientX - stRect.left;
        const leftPx = relX < stRect.width * 0.5 ? Math.max(10, stRect.width - 126) : 10;
        const topPx = 10;

        el.magnifierLoupe.style.left = `${leftPx}px`;
        el.magnifierLoupe.style.top = `${topPx}px`;

        const lCtx = el.loupeCanvas.getContext("2d");
        const lw = el.loupeCanvas.width;
        const lh = el.loupeCanvas.height;
        lCtx.fillStyle = "#0f172a";
        lCtx.fillRect(0, 0, lw, lh);

        const zoom = 3.8;
        const srcRadius = (lw / 2) / zoom;
        lCtx.drawImage(
          page.srcCanvas,
          imgX - srcRadius,
          imgY - srcRadius,
          srcRadius * 2,
          srcRadius * 2,
          0,
          0,
          lw,
          lh
        );

        lCtx.strokeStyle = "#ffffff";
        lCtx.lineWidth = 1.8;
        lCtx.beginPath();
        lCtx.moveTo(lw / 2, 0);
        lCtx.lineTo(lw / 2, lh);
        lCtx.moveTo(0, lh / 2);
        lCtx.lineTo(lw, lh / 2);
        lCtx.stroke();
      }

      function getCanvasCoords(clientX, clientY) {
        const rect = el.mainCanvas.getBoundingClientRect();
        const scaleX = el.mainCanvas.width / Math.max(1, rect.width);
        const scaleY = el.mainCanvas.height / Math.max(1, rect.height);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
          clientX,
          clientY,
          scaleX
        };
      }

      function findHitHandle(page, pt) {
        if (state.viewMode !== "crop") return null;
        const hitRadius = Math.max(32, 44 * (pt.scaleX || 1));
        const c = page.corners;

        let bestCorner = -1;
        let bestDist = hitRadius;
        for (let i = 0; i < 4; i++) {
          const d = Math.hypot(pt.x - c[i].x, pt.y - c[i].y);
          if (d <= bestDist) {
            bestDist = d;
            bestCorner = i;
          }
        }
        if (bestCorner !== -1) {
          return {
            type: "corner",
            index: bestCorner,
            startX: pt.x,
            startY: pt.y,
            origX: c[bestCorner].x,
            origY: c[bestCorner].y,
            label: ["Góc TL", "Góc TR", "Góc BR", "Góc BL"][bestCorner]
          };
        }

        for (let i = 0; i < 4; i++) {
          const mp = getMidHandlePos(page, i);
          if (Math.hypot(pt.x - mp.x, pt.y - mp.y) <= hitRadius) {
            const mOff = (page.midOffsets && page.midOffsets[i]) || { x: 0, y: 0 };
            return {
              type: "curve_mid",
              index: i,
              startX: pt.x,
              startY: pt.y,
              origOffX: mOff.x,
              origOffY: mOff.y,
              label: ["Uốn Cạnh Trên", "Uốn Cạnh Phải", "Uốn Cạnh Dưới", "Uốn Cạnh Trái"][i]
            };
          }
        }
        return null;
      }

      function onStageTouchStart(evt) {
        const page = getCurrentPage();
        if (!page) return;

        if (evt.touches && evt.touches.length === 2) {
          if (state.draggingHandle) {
            if (state.preTouchCorners) page.corners = state.preTouchCorners.map((p) => ({ ...p }));
            if (state.preTouchMidOffsets) page.midOffsets = state.preTouchMidOffsets.map((p) => ({ ...p }));
            renderStage();
          }
          state.draggingHandle = null;
          el.magnifierLoupe.style.display = "none";

          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const midX = (t0.clientX + t1.clientX) * 0.5;
          const midY = (t0.clientY + t1.clientY) * 0.5;
          const stRect = el.stageContainer.getBoundingClientRect();
          state.pinchState = {
            startDist: Math.max(12, dist),
            startZoom: state.stageZoom,
            startPanX: state.stagePanX,
            startPanY: state.stagePanY,
            startMidX: midX,
            startMidY: midY,
            centerX: stRect.left + stRect.width * 0.5,
            centerY: stRect.top + stRect.height * 0.5
          };
          evt.preventDefault();
          return;
        }

        if (evt.touches && evt.touches.length === 1) {
          if (Date.now() < state.pinchCooldownUntil) {
            evt.preventDefault();
            return;
          }
          const t0 = evt.touches[0];
          const pt = getCanvasCoords(t0.clientX, t0.clientY);
          state.preTouchCorners = page.corners.map((p) => ({ ...p }));
          state.preTouchMidOffsets = page.midOffsets.map((p) => ({ ...p }));

          const hit = findHitHandle(page, pt);
          if (hit) {
            state.draggingHandle = hit;
            if (hit.type === "corner") {
              updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label);
            } else if (hit.type === "curve_mid") {
              const mp = getMidHandlePos(page, hit.index);
              updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label);
            }
            evt.preventDefault();
            return;
          }

          const now = Date.now();
          if (now - state.lastTapTime < 280 && Math.hypot(t0.clientX - state.lastTapX, t0.clientY - state.lastTapY) < 32) {
            state.lastTapTime = 0;
            if (state.stageZoom > 1.15) {
              resetStageZoom();
            } else {
              const stRect = el.stageContainer.getBoundingClientRect();
              const cx = stRect.left + stRect.width * 0.5;
              const cy = stRect.top + stRect.height * 0.5;
              state.stageZoom = 2.4;
              state.stagePanX = (cx - t0.clientX) * 1.1;
              state.stagePanY = (cy - t0.clientY) * 1.1;
              applyStageTransform();
            }
            evt.preventDefault();
            return;
          }
          state.lastTapTime = now;
          state.lastTapX = t0.clientX;
          state.lastTapY = t0.clientY;

          if (state.stageZoom > 1.02) {
            state.draggingHandle = {
              type: "pan",
              startClientX: t0.clientX,
              startClientY: t0.clientY,
              origPanX: state.stagePanX,
              origPanY: state.stagePanY
            };
            evt.preventDefault();
          }
        }
      }

      function onStageMouseDown(evt) {
        const page = getCurrentPage();
        if (!page) return;
        const pt = getCanvasCoords(evt.clientX, evt.clientY);
        state.preTouchCorners = page.corners.map((p) => ({ ...p }));
        state.preTouchMidOffsets = page.midOffsets.map((p) => ({ ...p }));
        const hit = findHitHandle(page, pt);
        if (hit) {
          state.draggingHandle = hit;
          if (hit.type === "corner") {
            updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label);
          } else if (hit.type === "curve_mid") {
            const mp = getMidHandlePos(page, hit.index);
            updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label);
          }
          evt.preventDefault();
          return;
        }
        if (state.stageZoom > 1.02) {
          state.draggingHandle = {
            type: "pan",
            startClientX: evt.clientX,
            startClientY: evt.clientY,
            origPanX: state.stagePanX,
            origPanY: state.stagePanY
          };
          evt.preventDefault();
        }
      }

      function onStagePointerMove(evt) {
        if (state.pinchState && evt.touches && evt.touches.length === 2) {
          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const currDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const currMidX = (t0.clientX + t1.clientX) * 0.5;
          const currMidY = (t0.clientY + t1.clientY) * 0.5;

          const newZoom = Math.max(0.8, Math.min(5.0, state.pinchState.startZoom * (currDist / state.pinchState.startDist)));
          const zoomRatio = newZoom / state.pinchState.startZoom;
          const relX = state.pinchState.startMidX - state.pinchState.centerX;
          const relY = state.pinchState.startMidY - state.pinchState.centerY;

          state.stageZoom = newZoom;
          state.stagePanX = (currMidX - state.pinchState.startMidX) + relX - (relX - state.pinchState.startPanX) * zoomRatio;
          state.stagePanY = (currMidY - state.pinchState.startMidY) + relY - (relY - state.pinchState.startPanY) * zoomRatio;
          applyStageTransform();
          evt.preventDefault();
          return;
        }

        if (!state.draggingHandle) return;
        const page = getCurrentPage();
        if (!page) return;

        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        if (state.draggingHandle.type === "pan") {
          state.stagePanX = state.draggingHandle.origPanX + (clientX - state.draggingHandle.startClientX);
          state.stagePanY = state.draggingHandle.origPanY + (clientY - state.draggingHandle.startClientY);
          applyStageTransform();
          evt.preventDefault();
          return;
        }

        const pt = getCanvasCoords(clientX, clientY);
        const w = el.mainCanvas.width;
        const h = el.mainCanvas.height;

        if (state.draggingHandle.type === "corner") {
          const idx = state.draggingHandle.index;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          const nx = Math.max(0, Math.min(w, Math.round(state.draggingHandle.origX + dx)));
          const ny = Math.max(0, Math.min(h, Math.round(state.draggingHandle.origY + dy)));
          page.corners[idx].x = nx;
          page.corners[idx].y = ny;
          updateMagnifierLoupe(nx, ny, pt.clientX, pt.clientY, state.draggingHandle.label);
          renderStage();
        } else if (state.draggingHandle.type === "curve_mid") {
          const idx = state.draggingHandle.index;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          page.midOffsets[idx].x = Math.round(state.draggingHandle.origOffX + dx);
          page.midOffsets[idx].y = Math.round(state.draggingHandle.origOffY + dy);
          const mp = getMidHandlePos(page, idx);
          updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, state.draggingHandle.label);
          renderStage();
        }
        evt.preventDefault();
      }

      function onStagePointerUp(evt) {
        if (state.pinchState && (!evt.touches || evt.touches.length < 2)) {
          state.pinchState = null;
          state.pinchCooldownUntil = Date.now() + 180;
          state.draggingHandle = null;
          return;
        }
        if (!state.draggingHandle) return;
        const dragType = state.draggingHandle.type;
        state.draggingHandle = null;
        el.magnifierLoupe.style.display = "none";
        if (dragType === "corner" || dragType === "curve_mid") {
          const page = getCurrentPage();
          if (page) {
            updateGeometryAndProcess(page);
            renderPageList();
          }
        }
      }

      // =========================================================================
      // 8. "THƯ VIỆN" (LIBRARY) MANAGEMENT: SUPPORTS DELETING DOWN TO 0 IMAGES!
      // =========================================================================
      function addNewPageFromCanvas(srcCanvas, name, customCorners, customMidOffsets, initialBookCurve) {
        const detectedCorners = customCorners ? customCorners.map((p) => ({ ...p })) : detectDocumentCorners(srcCanvas);
        const midOffsets = customMidOffsets
          ? customMidOffsets.map((p) => ({ ...p }))
          : [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

        const settings = cloneSettings(state.defaultSettings);
        if (typeof initialBookCurve === "number") {
          settings.bookCurve = initialBookCurve;
        }

        const pageObj = {
          id: "page_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
          name: name || `ScanhoahocABC_${state.pages.length + 1}`,
          srcCanvas,
          corners: detectedCorners,
          midOffsets,
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,
          settings
        };
        updateGeometryAndProcess(pageObj);
        state.pages.push(pageObj);
        state.currentPageIndex = state.pages.length - 1;
        resetStageZoom();
        syncControlsFromPage(pageObj);
        renderPageList();
        renderStage();
      }

      function deletePageAtIndex(idx) {
        if (idx < 0 || idx >= state.pages.length) return;
        const removedName = state.pages[idx].name;
        state.pages.splice(idx, 1);

        if (state.pages.length === 0) {
          state.currentPageIndex = -1;
          state.viewMode = "result";
          el.paneCrop.classList.remove("active");
          el.paneResult.classList.add("active");
          resetStageZoom();
          syncControlsFromPage(null);
          renderPageList();
          renderStage();
          showToast(`Đã xóa "${removedName}" (Thư viện trống)!`);
          return;
        }

        if (state.currentPageIndex >= state.pages.length) {
          state.currentPageIndex = state.pages.length - 1;
        } else if (idx < state.currentPageIndex) {
          state.currentPageIndex--;
        }
        resetStageZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        showToast(`Đã xóa "${removedName}"!`);
      }

      function deleteAllPages() {
        if (!state.pages.length) return;
        state.pages = [];
        state.currentPageIndex = -1;
        state.viewMode = "result";
        el.paneCrop.classList.remove("active");
        el.paneResult.classList.add("active");
        resetStageZoom();
        syncControlsFromPage(null);
        renderPageList();
        renderStage();
        showToast("Đã xóa toàn bộ ảnh trong Thư viện!");
      }

      function goToAdjacentPage(delta) {
        const nextIdx = state.currentPageIndex + delta;
        if (nextIdx < 0 || nextIdx >= state.pages.length) return;
        state.currentPageIndex = nextIdx;
        resetStageZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
      }

      function getModeLabel(mode) {
        if (mode === "magic_color") return "Tài liệu màu";
        if (mode === "bw_sauvola") return "Đen trắng";
        if (mode === "faint_boost") return "Rõ chữ mờ";
        return "Ảnh gốc";
      }

      function renderPageList() {
        const total = state.pages.length;
        const hasPages = total > 0 && state.currentPageIndex >= 0;
        const curr = hasPages ? state.currentPageIndex + 1 : 0;

        el.pageCountText.textContent = `${total}`;
        el.headerPageStatus.textContent = hasPages ? `Trang ${curr} / ${total}` : `0 ảnh`;
        el.stagePageIndicator.textContent = `${curr} / ${total}`;

        el.btnPrevPage.disabled = !hasPages || state.currentPageIndex <= 0;
        el.btnNextPage.disabled = !hasPages || state.currentPageIndex >= total - 1;
        el.btnDeleteCurrentPage.disabled = !hasPages;
        el.btnEnterCrop.disabled = !hasPages;
        el.btnQuickJpg.disabled = !hasPages;
        el.btnQuickPdf.disabled = !hasPages;
        el.btnDeleteSelectedInLib.disabled = !hasPages;
        el.btnDeleteAllInLib.disabled = !hasPages;
        el.btnEditCropFromLib.disabled = !hasPages;
        el.btnDownloadCurrent.disabled = !hasPages;
        el.btnDownloadAllPdf.disabled = !hasPages;

        el.pageListContainer.className = "lib-container " + (state.libViewMode === "grid" ? "grid-mode" : "list-mode");
        el.pageListContainer.innerHTML = "";

        if (!hasPages) {
          const emptyDiv = document.createElement("div");
          emptyDiv.className = "lib-empty-box";
          emptyDiv.innerHTML = "Thư viện đang trống (0 ảnh).<br/>Hãy bấm <b>📸 Chụp ảnh</b>, <b>📁 Chọn ảnh</b> hoặc chọn <b>Mẫu kiểm thử</b> bên dưới.";
          el.pageListContainer.appendChild(emptyDiv);
          return;
        }

        state.pages.forEach((p, idx) => {
          const src = p.processedCanvas || p.srcCanvas;

          if (state.libViewMode === "grid") {
            const card = document.createElement("div");
            card.className = "lib-item-grid" + (idx === state.currentPageIndex ? " active" : "");

            const thumb = document.createElement("canvas");
            thumb.className = "lib-thumb-grid";
            thumb.width = 120;
            thumb.height = 156;
            const tctx = thumb.getContext("2d");
            tctx.fillStyle = "#ffffff";
            tctx.fillRect(0, 0, thumb.width, thumb.height);
            const sc = Math.min(thumb.width / src.width, thumb.height / src.height);
            const dw = src.width * sc;
            const dh = src.height * sc;
            tctx.drawImage(src, (thumb.width - dw) / 2, (thumb.height - dh) / 2, dw, dh);

            const title = document.createElement("div");
            title.className = "lib-meta-title";
            title.style.fontSize = "0.72rem";
            title.style.width = "100%";
            title.style.textAlign = "center";
            title.textContent = `${idx + 1}. ${p.name}`;

            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "lib-grid-del";
            delBtn.title = "Xóa ảnh này";
            delBtn.textContent = "✕";
            delBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              deletePageAtIndex(idx);
            });

            card.appendChild(thumb);
            card.appendChild(title);
            card.appendChild(delBtn);

            card.addEventListener("click", () => {
              state.currentPageIndex = idx;
              resetStageZoom();
              syncControlsFromPage(getCurrentPage());
              renderPageList();
              renderStage();
            });
            el.pageListContainer.appendChild(card);
          } else {
            const row = document.createElement("div");
            row.className = "lib-item-list" + (idx === state.currentPageIndex ? " active" : "");

            const thumb = document.createElement("canvas");
            thumb.className = "lib-thumb-list";
            thumb.width = 64;
            thumb.height = 84;
            const tctx = thumb.getContext("2d");
            tctx.fillStyle = "#ffffff";
            tctx.fillRect(0, 0, thumb.width, thumb.height);
            const sc = Math.min(thumb.width / src.width, thumb.height / src.height);
            const dw = src.width * sc;
            const dh = src.height * sc;
            tctx.drawImage(src, (thumb.width - dw) / 2, (thumb.height - dh) / 2, dw, dh);

            const meta = document.createElement("div");
            meta.className = "lib-meta-list";
            const title = document.createElement("div");
            title.className = "lib-meta-title";
            title.textContent = `${idx + 1}. ${p.name}`;
            const sub = document.createElement("div");
            sub.className = "lib-meta-sub";
            sub.textContent = `${src.width}×${src.height} px • ${getModeLabel(p.settings.colorMode)}`;
            meta.appendChild(title);
            meta.appendChild(sub);

            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "btn btn-danger-soft";
            delBtn.style.height = "30px";
            delBtn.style.padding = "0 9px";
            delBtn.style.fontSize = "0.72rem";
            delBtn.textContent = "🗑 Xóa";
            delBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              deletePageAtIndex(idx);
            });

            row.appendChild(thumb);
            row.appendChild(meta);
            row.appendChild(delBtn);

            row.addEventListener("click", () => {
              state.currentPageIndex = idx;
              resetStageZoom();
              syncControlsFromPage(getCurrentPage());
              renderPageList();
              renderStage();
            });
            el.pageListContainer.appendChild(row);
          }
        });
      }

      function splitCurrentPageIntoTwoHalves() {
        const page = getCurrentPage();
        if (!page) return;
        const c = page.corners;
        const midTop = {
          x: Math.round((c[0].x + c[1].x) * 0.5),
          y: Math.round((c[0].y + c[1].y) * 0.5)
        };
        const midBot = {
          x: Math.round((c[3].x + c[2].x) * 0.5),
          y: Math.round((c[3].y + c[2].y) * 0.5)
        };

        const baseName = page.name.replace(/_Tr[12].*$/, "");
        const leftSettings = cloneSettings(page.settings);
        leftSettings.bookCurve = 0;
        const rightSettings = cloneSettings(page.settings);
        rightSettings.bookCurve = 0;

        const leftPage = {
          id: "page_" + Date.now() + "_L",
          name: `${baseName}_Tr1`,
          srcCanvas: page.srcCanvas,
          corners: [
            { x: c[0].x, y: c[0].y },
            { x: midTop.x, y: midTop.y },
            { x: midBot.x, y: midBot.y },
            { x: c[3].x, y: c[3].y }
          ],
          midOffsets: [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }],
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,
          settings: leftSettings
        };
        const rightPage = {
          id: "page_" + Date.now() + "_R",
          name: `${baseName}_Tr2`,
          srcCanvas: page.srcCanvas,
          corners: [
            { x: midTop.x, y: midTop.y },
            { x: c[1].x, y: c[1].y },
            { x: c[2].x, y: c[2].y },
            { x: midBot.x, y: midBot.y }
          ],
          midOffsets: [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }],
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,

        };

        updateGeometryAndProcess(leftPage);
        updateGeometryAndProcess(rightPage);

        state.pages.splice(state.currentPageIndex + 1, 0, leftPage, rightPage);
        state.currentPageIndex = state.currentPageIndex + 1;
        setViewMode("result");
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        showToast("Đã tách thành 2 trang sách riêng biệt!");
      }

      // =========================================================================
      // 9. EXPORT ENGINE
      // =========================================================================
      function getScaledExportCanvas(page) {
        if (!page.processedCanvas) updateGeometryAndProcess(page);
        const src = page.processedCanvas;
        const scale = parseFloat(el.exportScale.value) || 1;
        if (Math.abs(scale - 1) < 0.01) return src;

        const out = document.createElement("canvas");
        out.width = Math.round(src.width * scale);
        out.height = Math.round(src.height * scale);
        const ctx = out.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(src, 0, 0, out.width, out.height);
        return out;
      }

      function generatePdfBlobFromPages(pagesToExport, quality) {
        const enc = new TextEncoder();
        const chunks = [];
        let offset = 0;
        const xref = [0];

        function pushStr(str) {
          const bytes = enc.encode(str);
          chunks.push(bytes);
          offset += bytes.length;
        }
        function pushBytes(bytes) {
          chunks.push(bytes);
          offset += bytes.length;
        }
        function startObj(id) {
          xref[id] = offset;
          pushStr(`${id} 0 obj\n`);
        }
        function endObj() {
          pushStr(`\nendobj\n`);
        }

        pushStr("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");

        const numPages = pagesToExport.length;
        startObj(1);
        pushStr(`<< /Type /Catalog /Pages 2 0 R >>`);
        endObj();

        const kidsRefs = pagesToExport.map((_, i) => `${3 + i * 3} 0 R`).join(" ");
        startObj(2);
        pushStr(`<< /Type /Pages /Kids [ ${kidsRefs} ] /Count ${numPages} >>`);
        endObj();

        for (let i = 0; i < numPages; i++) {
          const p = pagesToExport[i];
          const expCanvas = getScaledExportCanvas(p);
          const flat = document.createElement("canvas");
          flat.width = expCanvas.width;
          flat.height = expCanvas.height;
          const fctx = flat.getContext("2d");
          fctx.fillStyle = "#ffffff";
          fctx.fillRect(0, 0, flat.width, flat.height);
          fctx.drawImage(expCanvas, 0, 0);

          const dataUrl = flat.toDataURL("image/jpeg", quality);
          const b64 = dataUrl.split(",")[1];
          const binStr = atob(b64);
          const jpgBytes = new Uint8Array(binStr.length);
          for (let k = 0; k < binStr.length; k++) jpgBytes[k] = binStr.charCodeAt(k);

          const ptW = 595.28;
          const ptH = Math.round((flat.height / flat.width) * 595.28 * 100) / 100;

          const pageObjId = 3 + i * 3;
          const contentObjId = 4 + i * 3;
          const imgObjId = 5 + i * 3;

          const contentCmd = `q\n${ptW} 0 0 ${ptH} 0 0 cm\n/Im${i} Do\nQ\n`;

          startObj(pageObjId);
          pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im${i} ${imgObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>`);
          endObj();

          startObj(contentObjId);
          pushStr(`<< /Length ${contentCmd.length} >>\nstream\n${contentCmd}endstream`);
          endObj();

          startObj(imgObjId);
          pushStr(`<< /Type /XObject /Subtype /Image /Width ${flat.width} /Height ${flat.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgBytes.length} >>\nstream\n`);
          pushBytes(jpgBytes);
          pushStr(`\nendstream`);
          endObj();
        }

        const totalObjs = 3 + numPages * 3;
        const startXrefOffset = offset;
        pushStr(`xref\n0 ${totalObjs}\n0000000000 65535 f \n`);
        for (let id = 1; id < totalObjs; id++) {
          const offStr = String(xref[id]).padStart(10, "0");
          pushStr(`${offStr} 00000 n \n`);
        }
        pushStr(`trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${startXrefOffset}\n%%EOF`);

        return new Blob(chunks, { type: "application/pdf" });
      }

      function generateTiffBlob(canvas, dpi) {
        const w = canvas.width;
        const h = canvas.height;
        const ctx = canvas.getContext("2d");
        const rgba = ctx.getImageData(0, 0, w, h).data;
        const rgbLen = w * h * 3;
        const headerAndIfdSize = 8 + 2 + 12 * 12 + 4 + 16 + 6;
        const buf = new ArrayBuffer(headerAndIfdSize + rgbLen);
        const view = new DataView(buf);
        const bytes = new Uint8Array(buf);

        view.setUint16(0, 0x4949, true);
        view.setUint16(2, 42, true);
        view.setUint32(4, 8, true);

        const numEntries = 12;
        view.setUint16(8, numEntries, true);
        let pos = 10;
        function writeTag(tag, type, count, valOrOffset) {
          view.setUint16(pos, tag, true);
          view.setUint16(pos + 2, type, true);
          view.setUint32(pos + 4, count, true);
          view.setUint32(pos + 8, valOrOffset, true);
          pos += 12;
        }

        const extraOffset = 10 + numEntries * 12 + 4;
        const stripOffset = headerAndIfdSize;

        view.setUint16(extraOffset + 16, 8, true);
        view.setUint16(extraOffset + 18, 8, true);
        view.setUint16(extraOffset + 20, 8, true);

        view.setUint32(extraOffset, dpi, true);
        view.setUint32(extraOffset + 4, 1, true);
        view.setUint32(extraOffset + 8, dpi, true);
        view.setUint32(extraOffset + 12, 1, true);

        writeTag(256, 4, 1, w);
        writeTag(257, 4, 1, h);
        writeTag(258, 3, 3, extraOffset + 16);
        writeTag(259, 3, 1, 1);
        writeTag(262, 3, 1, 2);
        writeTag(273, 4, 1, stripOffset);
        writeTag(277, 3, 1, 3);
        writeTag(278, 4, 1, h);
        writeTag(279, 4, 1, rgbLen);
        writeTag(282, 5, 1, extraOffset);
        writeTag(283, 5, 1, extraOffset + 8);
        writeTag(296, 3, 1, 2);

        view.setUint32(pos, 0, true);

        let dst = stripOffset;
        for (let i = 0; i < w * h; i++) {
          const si = i * 4;
          const a = rgba[si + 3] / 255;
          bytes[dst++] = Math.round(rgba[si] * a + 255 * (1 - a));
          bytes[dst++] = Math.round(rgba[si + 1] * a + 255 * (1 - a));
          bytes[dst++] = Math.round(rgba[si + 2] * a + 255 * (1 - a));
        }

        return new Blob([buf], { type: "image/tiff" });
      }

      function generateSvgBlob(canvas) {
        const pngUrl = canvas.toDataURL("image/png");
        const svgContent = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${canvas.width} ${canvas.height}" width="${canvas.width}" height="${canvas.height}">\n  <image href="${pngUrl}" width="${canvas.width}" height="${canvas.height}" />\n</svg>`;
        return new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
      }

      function formatByteSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
      }

      function triggerBlobDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 500);
      }

      function downloadCurrentPage(overrideFmt) {
        const page = getCurrentPage();
        if (!page) return;
        const fmt = overrideFmt || el.exportFormat.value;
        const q = 0.94;
        const baseName = (el.exportFilename.value || page.name || "ScanhoahocABC").trim();
        const expCanvas = getScaledExportCanvas(page);

        if (fmt === "pdf") {
          const blob = generatePdfBlobFromPages([page], q);
          triggerBlobDownload(blob, `${baseName}.pdf`);
          showToast(`Đã lưu PDF (${formatByteSize(blob.size)})!`);
          return;
        }
        if (fmt === "tiff") {
          const scale = parseFloat(el.exportScale.value) || 1;
          const dpi = scale >= 2 ? 600 : scale >= 1.5 ? 300 : 200;
          const blob = generateTiffBlob(expCanvas, dpi);
          triggerBlobDownload(blob, `${baseName}.tif`);
          showToast(`Đã lưu TIFF ${dpi} DPI!`);
          return;
        }
        if (fmt === "svg") {
          const blob = generateSvgBlob(expCanvas);
          triggerBlobDownload(blob, `${baseName}.svg`);
          showToast(`Đã lưu SVG!`);
          return;
        }

        let targetCanvas = expCanvas;
        if (fmt === "jpeg") {
          const flat = document.createElement("canvas");
          flat.width = expCanvas.width;
          flat.height = expCanvas.height;
          const fctx = flat.getContext("2d");
          fctx.fillStyle = "#ffffff";
          fctx.fillRect(0, 0, flat.width, flat.height);
          fctx.drawImage(expCanvas, 0, 0);
          targetCanvas = flat;
        }

        const mime = fmt === "png" ? "image/png" : fmt === "webp" ? "image/webp" : "image/jpeg";
        const ext = fmt === "png" ? "png" : fmt === "webp" ? "webp" : "jpg";
        targetCanvas.toBlob((blob) => {
          if (!blob) return;
          triggerBlobDownload(blob, `${baseName}.${ext}`);
          showToast(`Đã lưu ${baseName}.${ext}!`);
        }, mime, q);
      }

      function downloadAllPagesAsPdf() {
        if (!state.pages.length) return;
        const blob = generatePdfBlobFromPages(state.pages, 0.94);
        triggerBlobDownload(blob, `ScanhoahocABC_${state.pages.length}_trang.pdf`);
        showToast(`Đã xuất PDF (${state.pages.length} trang)!`);
      }

      // =========================================================================
      // 10. UI SYNC & CAMERA CONTROLLER
      // =========================================================================
      function syncControlsFromPage(page) {
        if (!page) {
          el.selectedImgCustomTitle.textContent = "Chưa có ảnh nào được chọn";
          el.exportFilename.value = "";
          el.cleanSliderRow.classList.remove("visible");
          return;
        }
        const s = page.settings;
        el.activeParamSlider.value = s.bgSuppress;
        el.activeSliderVal.textContent = `${s.bgSuppress}%`;
        el.bookCurveSlider.value = s.bookCurve || 0;
        el.bookCurveVal.textContent = `${s.bookCurve || 0}%`;
        el.btnToggleAlpha.classList.toggle("active", !!s.transparentBg);
        el.exportFilename.value = page.name;
        el.libColorSelect.value = s.colorMode;
        el.selectedImgCustomTitle.textContent = `Tùy chỉnh: ${page.name} (${state.currentPageIndex + 1}/${state.pages.length})`;

        el.colorPresetGrid.querySelectorAll("[data-mode]").forEach((b) => {
          b.classList.toggle("active", b.getAttribute("data-mode") === s.colorMode);
        });

        el.cleanSliderRow.classList.toggle("visible", s.colorMode !== "original");
      }

      function handleFilesSelected(fileList) {
        if (!fileList || !fileList.length) return;
        Array.from(fileList).forEach((file) => {
          if (!file.type.startsWith("image/")) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement("canvas");
              const maxSide = 1800;
              let w = img.width;
              let h = img.height;
              if (Math.max(w, h) > maxSide) {
                const sc = maxSide / Math.max(w, h);
                w = Math.round(w * sc);
                h = Math.round(h * sc);
              }
              c.width = w;
              c.height = h;
              c.getContext("2d").drawImage(img, 0, 0, w, h);
              const cleanName = file.name.replace(/\.[^.]+$/, "");
              addNewPageFromCanvas(c, cleanName, null, null, 0);
              setViewMode("result");
              showToast(`Đã nhận diện & làm phẳng "${file.name}"!`);
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function applyCameraZoomValue(zVal) {
        if (!state.cameraStream) return;
        const track = state.cameraStream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== "function") return;
        try {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            const minZ = caps.zoom.min || 1;
            const maxZ = caps.zoom.max || 1;
            const clamped = Math.max(minZ, Math.min(maxZ, zVal));
            await track.applyConstraints({ advanced: [{ zoom: clamped }] });
          }
        } catch (_) {}
      }

      async function applyCameraZoom(targetZoomMode) {
        if (!state.cameraStream) return;
        const track = state.cameraStream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== "function") return;
        try {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            const minZ = caps.zoom.min || 1;
            const maxZ = caps.zoom.max || 1;
            let zVal = minZ;
            if (targetZoomMode === "1") zVal = Math.max(minZ, Math.min(maxZ, 1.0));
            else if (targetZoomMode === "1.5") zVal = Math.max(minZ, Math.min(maxZ, 1.5));
            await track.applyConstraints({ advanced: [{ zoom: zVal }] });
          }
        } catch (_) {}
      }

      async function startCamera() {
        stopCamera();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1600 },
              height: { ideal: 1200 }
            },
            audio: false
          });
          state.cameraStream = stream;
          el.cameraVideo.srcObject = stream;
          await el.cameraVideo.play();
          await applyCameraZoom("min");
          runCameraLiveOverlay();
        } catch (err) {
          showToast("Không thể mở Camera trực tiếp. Hãy bấm '📁 Chọn ảnh' để chụp bằng Camera máy.");
        }
      }

      function stopCamera() {
        if (state.cameraAnimId) {
          cancelAnimationFrame(state.cameraAnimId);
          state.cameraAnimId = null;
        }
        if (state.cameraStream) {
          state.cameraStream.getTracks().forEach((t) => t.stop());
          state.cameraStream = null;
        }
      }

      function runCameraLiveOverlay() {
        const video = el.cameraVideo;
        const overlay = el.cameraOverlay;
        const octx = overlay.getContext("2d");
        const off = document.createElement("canvas");
        let frameCount = 0;
        state.lastCameraCorners = null;

        function loop() {
          if (!state.cameraStream) return;
          if (video.readyState >= 2 && video.videoWidth > 0) {
            overlay.width = video.videoWidth;
            overlay.height = video.videoHeight;
            frameCount++;
            if (frameCount % 6 === 0) {
              off.width = 280;
              off.height = Math.round((video.videoHeight / video.videoWidth) * 280);
              off.getContext("2d").drawImage(video, 0, 0, off.width, off.height);
              const corners = detectDocumentCorners(off);
              const sx = video.videoWidth / off.width;
              const sy = video.videoHeight / off.height;
              state.lastCameraCorners = corners.map((p) => ({
                x: Math.round(p.x * sx),
                y: Math.round(p.y * sy)
              }));
            }
            octx.clearRect(0, 0, overlay.width, overlay.height);
            if (state.lastCameraCorners) {
              const c = state.lastCameraCorners;
              octx.save();
              octx.fillStyle = "rgba(15, 23, 42, 0.44)";
              octx.beginPath();
              octx.rect(0, 0, overlay.width, overlay.height);
              octx.moveTo(c[0].x, c[0].y);
              octx.lineTo(c[1].x, c[1].y);
              octx.lineTo(c[2].x, c[2].y);
              octx.lineTo(c[3].x, c[3].y);
              octx.closePath();
              octx.fill("evenodd");
              octx.restore();

              octx.strokeStyle = "#ffffff";
              octx.lineWidth = Math.max(4, overlay.width / 200);
              octx.beginPath();
              octx.moveTo(c[0].x, c[0].y);
              octx.lineTo(c[1].x, c[1].y);
              octx.lineTo(c[2].x, c[2].y);
              octx.lineTo(c[3].x, c[3].y);
              octx.closePath();
              octx.stroke();
            }
          }
          state.cameraAnimId = requestAnimationFrame(loop);
        }
        loop();
      }

      function rotateCurrentPage(dir) {
        const page = getCurrentPage();
        if (!page) return;
        const sC = page.srcCanvas;
        const rot = document.createElement("canvas");
        rot.width = sC.height;
        rot.height = sC.width;
        const rctx = rot.getContext("2d");
        rctx.save();
        if (dir > 0) {
          rctx.translate(rot.width, 0);
          rctx.rotate(Math.PI / 2);
        } else {
          rctx.translate(0, rot.height);
          rctx.rotate(-Math.PI / 2);
        }
        rctx.drawImage(sC, 0, 0);
        rctx.restore();

        page.srcCanvas = rot;
        page.corners = detectDocumentCorners(rot);
        page.midOffsets = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];
        updateGeometryAndProcess(page);
        resetStageZoom();
        renderPageList();
        renderStage();
      }

      function initEvents() {
        // Prev / Next / Delete on Stage
        el.btnPrevPage.addEventListener("click", () => goToAdjacentPage(-1));
        el.btnNextPage.addEventListener("click", () => goToAdjacentPage(1));
        el.stagePageIndicator.addEventListener("click", () => el.libraryModal.classList.add("open"));
        el.btnDeleteCurrentPage.addEventListener("click", () => deletePageAtIndex(state.currentPageIndex));

        // Crop / Result Mode Switching
        el.btnEnterCrop.addEventListener("click", () => setViewMode("crop"));
        el.btnCancelCrop.addEventListener("click", () => setViewMode("result"));
        el.btnZoomReset.addEventListener("click", resetStageZoom);

        el.stageContainer.addEventListener("wheel", (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
          state.stageZoom = Math.max(0.8, Math.min(5.0, state.stageZoom * factor));
          applyStageTransform();
        }, { passive: false });

        el.stageContainer.addEventListener("touchstart", onStageTouchStart, { passive: false });
        window.addEventListener("touchmove", onStagePointerMove, { passive: false });
        window.addEventListener("touchend", onStagePointerUp);
        window.addEventListener("touchcancel", onStagePointerUp);

        el.stageContainer.addEventListener("mousedown", onStageMouseDown);
        window.addEventListener("mousemove", onStagePointerMove);
        window.addEventListener("mouseup", onStagePointerUp);

        // Upload & Paste
        el.btnTriggerUpload.addEventListener("click", () => el.fileInput.click());
        el.fileInput.addEventListener("change", (e) => {
          handleFilesSelected(e.target.files);
          el.fileInput.value = "";
        });

        window.addEventListener("paste", (e) => {
          if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) {
            handleFilesSelected(e.clipboardData.files);
          }
        });

        // "Thư viện" (Library) Modal Controls
        el.btnOpenLibrary.addEventListener("click", () => {
          renderPageList();
          syncControlsFromPage(getCurrentPage());
          el.libraryModal.classList.add("open");
        });
        el.btnCloseLibrary.addEventListener("click", () => el.libraryModal.classList.remove("open"));

        el.btnViewList.addEventListener("click", () => {
          state.libViewMode = "list";
          el.btnViewList.classList.add("active");
          el.btnViewGrid.classList.remove("active");
          renderPageList();
        });
        el.btnViewGrid.addEventListener("click", () => {
          state.libViewMode = "grid";
          el.btnViewGrid.classList.add("active");
          el.btnViewList.classList.remove("active");
          renderPageList();
        });

        el.btnDeleteSelectedInLib.addEventListener("click", () => {
          deletePageAtIndex(state.currentPageIndex);
        });

        el.btnDeleteAllInLib.addEventListener("click", () => {
          deleteAllPages();
        });

        el.exportFilename.addEventListener("input", () => {
          const page = getCurrentPage();
          if (!page) return;
          page.name = el.exportFilename.value.trim() || `ScanhoahocABC_${state.currentPageIndex + 1}`;
          renderPageList();
        });

        el.libColorSelect.addEventListener("change", () => {
          const page = getCurrentPage();
          if (!page) return;
          page.settings.colorMode = el.libColorSelect.value;
          syncControlsFromPage(page);
          applyCachedFiltersToPage(page);
          renderPageList();
          renderStage();
        });

        el.btnEditCropFromLib.addEventListener("click", () => {
          if (!getCurrentPage()) return;
          el.libraryModal.classList.remove("open");
          setViewMode("crop");
        });

        // Built-in Samples in Library
        function addSampleToLib(type) {
          const sample = createProceduralSample(type);
          addNewPageFromCanvas(sample.canvas, sample.name, null, null, sample.bookCurve || 0);
          el.libraryModal.classList.remove("open");
          setViewMode("result");
          showToast(`Đã nạp mẫu: ${sample.name}`);
        }
        el.btnSampleWoodFlat.addEventListener("click", () => addSampleToLib("wood_flat"));
        el.btnSampleLowLight.addEventListener("click", () => addSampleToLib("low_light"));
        el.btnSampleBookWave.addEventListener("click", () => addSampleToLib("book_wave"));

        // Crop Toolbar Actions
        el.btnAutoDetectCorners.addEventListener("click", () => {
          const page = getCurrentPage();
          if (!page) return;
          page.corners = detectDocumentCorners(page.srcCanvas);
          page.midOffsets = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];
          updateGeometryAndProcess(page);
          renderStage();
          showToast("Đã tự động bắt chuẩn 4 góc!");
        });

        el.btnFullFrameCorners.addEventListener("click", () => {
          const page = getCurrentPage();
          if (!page) return;
          const w = page.srcCanvas.width;
          const h = page.srcCanvas.height;
          page.corners = [
            { x: 4, y: 4 },
            { x: w - 4, y: 4 },
            { x: w - 4, y: h - 4 },
            { x: 4, y: h - 4 }
          ];
          page.midOffsets = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];
          updateGeometryAndProcess(page);
          renderStage();
          showToast("Đã chọn toàn khung ảnh!");
        });

        el.btnRotateRight.addEventListener("click", () => rotateCurrentPage(1));

        el.bookCurveSlider.addEventListener("input", () => {
          const page = getCurrentPage();
          if (!page) return;
          const v = parseInt(el.bookCurveSlider.value, 10) || 0;
          page.settings.bookCurve = v;
          el.bookCurveVal.textContent = `${v}%`;
        });

        el.btnApplyCropNow.addEventListener("click", () => {
          const page = getCurrentPage();
          if (!page) return;
          updateGeometryAndProcess(page);
          renderPageList();
          setViewMode("result");
          showToast("Đã cắt & làm phẳng tài liệu!");
        });

        el.btnSplitTwoPagesOptional.addEventListener("click", splitCurrentPageIntoTwoHalves);

        // Mode Pills & Slider
        el.colorPresetGrid.querySelectorAll("[data-mode]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const page = getCurrentPage();
            if (!page) return;
            page.settings.colorMode = btn.getAttribute("data-mode");
            syncControlsFromPage(page);
            applyCachedFiltersToPage(page);
            renderPageList();
            renderStage();
          });
        });

        el.btnToggleAlpha.addEventListener("click", () => {
          const page = getCurrentPage();
          if (!page) return;
          page.settings.transparentBg = !page.settings.transparentBg;
          if (page.settings.transparentBg && el.exportFormat.value === "jpeg") {
            el.exportFormat.value = "png";
          }
          syncControlsFromPage(page);
          applyCachedFiltersToPage(page);
          renderPageList();
          renderStage();
          showToast(page.settings.transparentBg ? "Đã bật Tách nền Alpha!" : "Đã tắt Tách nền.");
        });

        el.activeParamSlider.addEventListener("input", () => {
          const page = getCurrentPage();
          if (!page) return;
          const v = parseInt(el.activeParamSlider.value, 10) || 0;
          page.settings.bgSuppress = v;
          el.activeSliderVal.textContent = `${v}%`;
          if (state.sliderRafId) cancelAnimationFrame(state.sliderRafId);
          state.sliderRafId = requestAnimationFrame(() => {
            state.sliderRafId = null;
            applyCachedFiltersToPage(page);
            renderStage();
          });
        });

        el.btnQuickPdf.addEventListener("click", () => downloadCurrentPage("pdf"));
        el.btnQuickJpg.addEventListener("click", () => downloadCurrentPage("jpeg"));
        el.btnDownloadCurrent.addEventListener("click", () => downloadCurrentPage());
        el.btnDownloadAllPdf.addEventListener("click", downloadAllPagesAsPdf);

        // Camera Modal
        el.btnOpenCamera.addEventListener("click", () => {
          el.cameraModal.classList.add("open");
          startCamera();
        });
        el.btnCloseCamera.addEventListener("click", () => {
          el.cameraModal.classList.remove("open");
          stopCamera();
        });

        [el.btnZoomMin, el.btnZoom1x, el.btnZoom15x].forEach((zBtn) => {
          zBtn.addEventListener("click", () => {
            [el.btnZoomMin, el.btnZoom1x, el.btnZoom15x].forEach((b) => b.classList.remove("active"));
            zBtn.classList.add("active");
            applyCameraZoom(zBtn.getAttribute("data-zoom"));
          });
        });

        let camPinchStartDist = 0;
        let camCurrentZoom = 1.0;
        el.cameraVideoWrap.addEventListener("touchstart", (e) => {
          if (e.touches && e.touches.length === 2) {
            camPinchStartDist = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            e.preventDefault();
          }
        }, { passive: false });
        el.cameraVideoWrap.addEventListener("touchmove", (e) => {
          if (e.touches && e.touches.length === 2 && camPinchStartDist > 10) {
            const dist = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            camCurrentZoom = Math.max(0.5, Math.min(3.0, camCurrentZoom * (dist / camPinchStartDist)));
            camPinchStartDist = dist;
            applyCameraZoomValue(camCurrentZoom);
            e.preventDefault();
          }
        }, { passive: false });

        el.btnCapturePhoto.addEventListener("click", () => {
          const video = el.cameraVideo;
          if (!video.videoWidth) return;
          const c = document.createElement("canvas");
          c.width = video.videoWidth;
          c.height = video.videoHeight;
          c.getContext("2d").drawImage(video, 0, 0);
          const capturedCorners = state.lastCameraCorners || detectDocumentCorners(c);
          el.cameraModal.classList.remove("open");
          stopCamera();
          addNewPageFromCanvas(c, `Scan_${state.pages.length + 1}`, capturedCorners, null, 0);
          setViewMode("result");
          showToast("Đã chụp và lưu vào Thư viện!");
        });
      }

      // =========================================================================
      // 11. INITIALIZATION (Preloads 1 Fast Flat A4 Sample in <25ms!)
      // =========================================================================
      function initApp() {
        initEvents();
        const s1 = createProceduralSample("wood_flat");
        addNewPageFromCanvas(s1.canvas, s1.name, null, null, 0);
        setViewMode("result");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
