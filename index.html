              let nl = uL[i] + sh + bShift * 0.5;
              if (nl < 0.0) nl = 0.0; else if (nl > 255.0) nl = 255.0;
              const sauvolaT = meanL[i] * (1.0 - k * (1.0 - stdL[i] * 0.0078125));
              const hDip = dMaxHalf[hOff + (x >> 1)] * haloRatio;
              const haloGuard = minDip > hDip ? minDip : hDip;
              const effT = sauvolaT < (255.0 - haloGuard) ? sauvolaT : (255.0 - haloGuard);

              const diff = nl - effT;
              const bw = diff >= 4.0 ? 255 : (diff <= -4.0 ? 8 : ((8.0 + (diff + 4.0) * 30.875) | 0));
              const idx = i << 2;
              data[idx] = bw;
              data[idx + 1] = bw;
              data[idx + 2] = bw;
              data[idx + 3] = transparentBg ? (255 - bw) : 255;
            }
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        // INTER-LINE SPOT & HALO ERASER PIPELINE (ultra_sharp, magic_color, faint_boost):
        // 1) Wide ±10px dMaxHalf * haloRatio erases dirty halos AND back-page bleed-through between lines of text!
        // 2) Flat-Blotch Guard: soft low-gradient shadow/bleed-through spots (|detailFine| < 5) get extra floor (+22)
        //    so inter-line spaces stay 100% spotless white while sharp ink strokes stay jet-black & crisp!
        let paperFloor, haloRatio, gain, sharpDarkGain, paperWhiteTarget, flatBlotchGuard;
        if (mode === "faint_boost") {
          paperFloor = (isBrightOutdoor ? 8.0 : 14.0) + cleanAmt * (isBrightOutdoor ? 9.0 : 18.0);
          haloRatio = 0.34 + cleanAmt * 0.16;
          gain = 1.85 + contrastAmt * 1.40;
          sharpDarkGain = sharpAmt * 1.55;
          paperWhiteTarget = isBrightOutdoor ? 248 : 255;
          flatBlotchGuard = 8.0;
        } else {
          // magic_color
          paperFloor = (isBrightOutdoor ? 11.0 : 18.0) + cleanAmt * (isBrightOutdoor ? 12.0 : 24.0);
          haloRatio = 0.38 + cleanAmt * 0.18;
          gain = 1.55 + contrastAmt * 1.20;
          sharpDarkGain = sharpAmt * 1.25;
          paperWhiteTarget = isBrightOutdoor ? 248 : 255;
          flatBlotchGuard = 14.0;
        }

        const paperChromaFloor = isLowLight ? Math.min(38.0, 18.0 + (fc.isoNoiseEst || 2.0) * 1.5) : 16.0;
        const whiteOutVal = paperWhiteTarget + bShift;
        const cleanWhite = whiteOutVal < 0 ? 0 : (whiteOutVal > 255 ? 255 : whiteOutVal);

        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          const hOff = (y >> 1) * hw;
          for (let x = 0; x < w; x++) {
            const i = rOff + x;
            const nr = uR[i], ng = uG[i], nb = uB[i];
            const nl = uL[i];
            const dL = 255.0 - nl;
            const df = detailFine[i];
            const absDf = df < 0.0 ? -df : df;

            const maxC = nr > ng ? (nr > nb ? nr : nb) : (ng > nb ? ng : nb);
            const minC = nr < ng ? (nr < nb ? nr : nb) : (ng < nb ? ng : nb);
            const chroma = maxC - minC;

            // Adaptive Inter-Line & Halo-Eraser threshold:
            // Rises around dark text (±10px) AND adds flatBlotchGuard when local edge contrast is flat (bleed-through/shadow spots!)
            const hFloor = dMaxHalf[hOff + (x >> 1)] * haloRatio;
            let adaptiveFloor = paperFloor > hFloor ? paperFloor : hFloor;
            if (absDf < 5.5 && dL < 125.0) {
              adaptiveFloor += flatBlotchGuard * (1.0 - absDf / 5.5);
            }
            const excessChroma = chroma > paperChromaFloor ? (chroma - paperChromaFloor) : 0.0;
            const effFloor = adaptiveFloor - excessChroma * 0.50;
            const cutFloor = effFloor > 6.0 ? effFloor : 6.0;

            const idx = i << 2;
            if (dL <= cutFloor && chroma < paperChromaFloor) {
              data[idx] = cleanWhite;
              data[idx + 1] = cleanWhite;
              data[idx + 2] = cleanWhite;
              data[idx + 3] = transparentBg ? 0 : 255;
              continue;
            }

            const bandW = cutFloor * 0.32 > 6.0 ? cutFloor * 0.32 : 6.0;
            const excessInk = (dL - cutFloor) > (excessChroma * 0.85) ? (dL - cutFloor) : (excessChroma * 0.85);
            let t = excessInk / bandW;
            if (t > 1.0) t = 1.0; else if (t < 0.0) t = 0.0;
            const sStep = t * t * (3.0 - 2.0 * t);

            let boost = 0.0;
            if (sharpAmt > 0.01 && df < -noiseDeadzone) {
              boost = (df + noiseDeadzone) * sharpDarkGain * sStep;
              if (boost < -52.0) boost = -52.0;
            }

            const effGain = sStep * gain;
            let r = (paperWhiteTarget - (paperWhiteTarget - (nr + boost)) * effGain + bShift + 0.5) | 0;
            let g = (paperWhiteTarget - (paperWhiteTarget - (ng + boost)) * effGain + bShift + 0.5) | 0;
            let b = (paperWhiteTarget - (paperWhiteTarget - (nb + boost)) * effGain + bShift + 0.5) | 0;

            data[idx]     = r < 0 ? 0 : (r > 255 ? 255 : r);
            data[idx + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
            data[idx + 2] = b < 0 ? 0 : (b > 255 ? 255 : b);

            if (transparentBg) {
              // Compute alpha from PRE-GAIN normalized depth dL (so gain amplification never turns thin-paper bleed-through opaque!)
              const alphaBase = 30.0 + cleanAmt * 42.0;
              const hAlpha = dMaxHalf[hOff + (x >> 1)] * (0.34 + cleanAmt * 0.16);
              let aCut = alphaBase > hAlpha ? alphaBase : hAlpha;
              if (absDf < 6.0 && dL < 120.0) aCut += 20.0 * (1.0 - absDf / 6.0);
              const cSig = chroma > paperChromaFloor ? (chroma - paperChromaFloor) * 1.35 : 0.0;
              const effInkA = dL > cSig ? dL : cSig;
              const effCutA = chroma > paperChromaFloor ? Math.max(12.0, aCut - cSig * 0.65) : aCut;
              if (effInkA <= effCutA) {
                data[idx + 3] = 0;
              } else {
                const aVal = (((effInkA - effCutA) / 26.0) * 255.0) | 0;
                data[idx + 3] = aVal > 255 ? 255 : aVal;
              }
            } else {
              data[idx + 3] = 255;
            }
          }
        }

        outCtx.putImageData(outImg, 0, 0);
        page._thumbDataUrl = "";
      }

      function updateGeometryAndProcess(page, keepAutoModesCache, previewMaxSide) {
        if (!page || !page.srcCanvas) return;
        if (!keepAutoModesCache) {
          page.cachedAutoModes = undefined;
        }
        const dewarped = dewarpQuad(
          page.srcCanvas,
          page.corners,
          page.settings.paperSize,
          page.edgeOffsets,
          page.settings.bookCurve || 0,
          page.settings.autoLineDewarp === true,
          page,
          previewMaxSide
        );
        page.dewarpedCanvas = dewarped;
        page.filterCache = null;
        page._thumbDataUrl = "";
        applyCachedFiltersToPage(page);
      }

      // =========================================================================
      // 7. RENDERING MAIN STAGE & FULL-SCREEN EDITOR STAGE ("CĂN 4 GÓC" & "CĂN ĐA ĐIỂM")
      // =========================================================================
      function getEdgeSubHandlePos(page, edgeIdx, subIdx) {
        const c = page.corners;
        const p1 = c[edgeIdx];
        const p2 = c[(edgeIdx + 1) % 4];
        const t = (subIdx + 1) / (NUM_EDGE_SUBPOINTS + 1); // t = 1/6, 2/6, 3/6, 4/6, 5/6 (5 intermediate points per edge!)
        const eOff = (page.edgeOffsets && page.edgeOffsets[edgeIdx] && page.edgeOffsets[edgeIdx][subIdx]) || { x: 0, y: 0 };
        return {
          x: p1.x * (1.0 - t) + p2.x * t + eOff.x,
          y: p1.y * (1.0 - t) + p2.y * t + eOff.y
        };
      }

      function drawCurvedQuadPath(ctx, page) {
        const c = page.corners;
        const eOffAll = page.edgeOffsets || createZeroEdgeOffsets();
        ctx.moveTo(c[0].x, c[0].y);
        const steps = 24;
        for (let i = 0; i < 4; i++) {
          const p1 = c[i];
          const p2 = c[(i + 1) % 4];
          const e3 = eOffAll[i];
          for (let s = 1; s <= steps; s++) {
            const t = s / steps;
            const d = state.alignPointMode === "multipt" ? evalEdge3PointOffset(e3, t) : { x: 0, y: 0 };
            const px = p1.x * (1.0 - t) + p2.x * t + d.x;
            const py = p1.y * (1.0 - t) + p2.y * t + d.y;
            ctx.lineTo(px, py);
          }
        }
        ctx.closePath();
      }

      function drawHandle(ctx, x, y, r, color, label) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = Math.max(3, r * 0.22);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${Math.max(11, Math.round(r * 0.72))}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, x, y);
        ctx.restore();
      }

      // =========================================================================
      // INTERACTIVE ON-DOCUMENT NOTE ENGINE (MOVABLE, RESIZABLE, COLORABLE)
      // - Renders the user's note directly onto the document canvas at (noteX, noteY)
      //   with customizable font size (noteSize) and ink color (noteColor).
      // - Computes bounding box & bottom-right resize handle (⤡) so the user can
      //   drag the note freely or resize it with their finger on the touchscreen!
      // =========================================================================
      function drawNoteOverlayOnCanvas(ctx, w, h, page, showInteractiveHandles) {
        if (!page || !page.note || !page.note.trim()) {
          page._noteBounds = null;
          return;
        }
        const text = page.note.trim();
        const nx = typeof page.noteX === "number" ? page.noteX : 0.50;
        const ny = typeof page.noteY === "number" ? page.noteY : 0.88;
        const baseSize = page.noteSize || 28;
        const color = page.noteColor || "#dc2626";

        const scaleFactor = Math.max(0.45, w / 760.0);
        const fontPx = Math.max(12, Math.round(baseSize * scaleFactor));
        const padX = Math.round(fontPx * 0.45);
        const padY = Math.round(fontPx * 0.30);

        ctx.save();
        ctx.font = `bold ${fontPx}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const lines = text.split(/\n/);
        let maxLineW = 0;
        for (let i = 0; i < lines.length; i++) {
          const m = ctx.measureText(lines[i]).width;
          if (m > maxLineW) maxLineW = m;
        }

        const lineHeight = Math.round(fontPx * 1.24);
        const boxW = Math.round(maxLineW + padX * 2);
        const boxH = Math.round(lines.length * lineHeight + padY * 2);

        // Clamp center (cx, cy) so note box stays inside document page
        const halfW = boxW * 0.5;
        const halfH = boxH * 0.5;
        const cx = Math.max(halfW + 6, Math.min(w - halfW - 6, nx * w));
        const cy = Math.max(halfH + 6, Math.min(h - halfH - 6, ny * h));
        const boxX = cx - halfW;
        const boxY = cy - halfH;

        const hasBg = page.noteHasBg !== false;
        const hasBorder = page.noteHasBorder !== false;
        const bgColor = page.noteBgColor || "#ffffff";
        const borderColor = page.noteBorderColor || color;
        const cornerRadius = Math.max(6, Math.round(fontPx * 0.25));

        // 1. Optional Background Fill (Có nền / Không nền + Màu nền)
        if (hasBg) {
          ctx.save();
          ctx.globalAlpha = 0.90;
          ctx.fillStyle = bgColor;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(boxX, boxY, boxW, boxH, cornerRadius);
          } else {
            ctx.rect(boxX, boxY, boxW, boxH);
          }
          ctx.fill();
          ctx.restore();
        }

        // 2. Optional Border Stroke (Có viền / Không viền + Màu viền)
        if (hasBorder) {
          ctx.save();
          ctx.strokeStyle = borderColor;
          ctx.lineWidth = Math.max(2.0, fontPx * 0.085);
          ctx.setLineDash([]);
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(boxX, boxY, boxW, boxH, cornerRadius);
          } else {
            ctx.rect(boxX, boxY, boxW, boxH);
          }
          ctx.stroke();
          ctx.restore();
        } else if (
          showInteractiveHandles &&
          state.draggingHandle &&
          (state.draggingHandle.type === "note_move" || state.draggingHandle.type === "note_resize")
        ) {
          ctx.save();
          ctx.strokeStyle = "rgba(56, 189, 248, 0.65)";
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.rect(boxX, boxY, boxW, boxH);
          ctx.stroke();
          ctx.restore();
        }

        // Draw note text lines
        ctx.fillStyle = color;
        const startY = cy - ((lines.length - 1) * lineHeight) * 0.5;
        for (let i = 0; i < lines.length; i++) {
          ctx.fillText(lines[i], cx, startY + i * lineHeight);
        }

        const handleR = Math.max(12, Math.round(14 * scaleFactor));
        const resizeHx = boxX + boxW;
        const resizeHy = boxY + boxH;

        if (showInteractiveHandles) {
          // Draw bottom-right corner resize handle (⤡)
          ctx.fillStyle = color;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = Math.max(2, handleR * 0.2);
          ctx.beginPath();
          ctx.arc(resizeHx, resizeHy, handleR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${Math.max(10, Math.round(handleR * 0.95))}px Arial`;
          ctx.fillText("⤡", resizeHx, resizeHy);
        }

        ctx.restore();

        page._noteBounds = {
          cx,
          cy,
          boxX,
          boxY,
          boxW,
          boxH,
          resizeHx,
          resizeHy,
          handleR
        };
      }

      function renderStage(forceRender) {
        if (!forceRender && el.fullScreenEditorModal.classList.contains("open")) {
          state.stageDirty = true;
          return;
        }
        state.stageDirty = false;
        const page = getCurrentPage();
        const ctx = el.mainCanvas.getContext("2d");

        if (!page) {
          if (el.mainCanvas.width !== 640) el.mainCanvas.width = 640;
          if (el.mainCanvas.height !== 820) el.mainCanvas.height = 820;
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(0, 0, 640, 820);
          ctx.strokeStyle = "rgba(255,255,255,0.22)";
          ctx.lineWidth = 3;
          ctx.setLineDash([10, 8]);
          ctx.strokeRect(42, 42, 556, 736);
          ctx.setLineDash([]);

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 24px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Chưa có ảnh tài liệu", 320, 365);

          ctx.fillStyle = "#cbd5e1";
          ctx.font = "17px Arial";
          ctx.fillText("Bấm '📷 Chụp ảnh' hoặc '📂 Chọn ảnh' ở trên", 320, 410);
          ctx.fillText("để bắt đầu quét tài liệu.", 320, 440);
          el.mainUnderMetaText.textContent = "Chưa có ảnh nào • Hãy chụp hoặc chọn ảnh";
          return;
        }

        if (!page.srcCanvas) {
          ensurePageHydrated(page).then((ok) => { if (ok) renderStage(true); });
          return;
        }
        if (!page.processedCanvas) updateGeometryAndProcess(page);
        const targetCanvas = page.processedCanvas;
        if (el.mainCanvas.width !== targetCanvas.width) el.mainCanvas.width = targetCanvas.width;
        if (el.mainCanvas.height !== targetCanvas.height) el.mainCanvas.height = targetCanvas.height;
        ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
        ctx.drawImage(targetCanvas, 0, 0);
        drawNoteOverlayOnCanvas(ctx, targetCanvas.width, targetCanvas.height, page, true);

        const ratioStr = describeAspectRatio(targetCanvas.width, targetCanvas.height);
        const noteSuffix = page.note && page.note.trim() ? ` • 📝 ${page.note.trim()}` : "";
        el.mainUnderMetaText.textContent = `${ratioStr} • ${targetCanvas.width}×${targetCanvas.height} px • ${getModeLabel(page.settings.colorMode)} • ${page.createdAt || "Hôm nay"}${noteSuffix}`;
      }

      function syncAlignModeButtons() {
        const isMulti = state.alignPointMode === "multipt";
        if (el.btnAlignMode4Pt) el.btnAlignMode4Pt.classList.toggle("active", !isMulti);
        if (el.btnAlignModeMultiPt) el.btnAlignModeMultiPt.classList.toggle("active", isMulti);
      }

      function alignQuadWithInternalLines(page) {
        if (!page || !page.srcCanvas) return { aligned: false, maxDisp: 0 };
        const baseCanvas = dewarpQuad(
          page.srcCanvas,
          page.corners,
          page.settings.paperSize,
          createZeroEdgeOffsets(),
          0,
          false,
          null
        );
        const dstW = baseCanvas.width;
        const dstH = baseCanvas.height;
        const bCtx = baseCanvas.getContext("2d");
        const rgba = bCtx.getImageData(0, 0, dstW, dstH).data;
        const modes = estimate2DBookSurfaceModes(rgba, dstW, dstH);
        page.settings.autoLineDewarp = true;
        page.cachedAutoModes = undefined;

        if (!modes || !modes.coeffs) {
          return { aligned: false, maxDisp: 0 };
        }

        const c = page.corners;
        const topVec = { x: c[1].x - c[0].x, y: c[1].y - c[0].y };
        const botVec = { x: c[2].x - c[3].x, y: c[2].y - c[3].y };
        const leftVec = { x: c[3].x - c[0].x, y: c[3].y - c[0].y };
        const rightVec = { x: c[2].x - c[1].x, y: c[2].y - c[1].y };
        const avgH = 0.5 * (Math.hypot(leftVec.x, leftVec.y) + Math.hypot(rightVec.x, rightVec.y)) || 1.0;
        const scaleFromDstY = avgH / dstH;

        const coeffs = modes.coeffs;
        const K = 5;
        const newOffsets = cloneEdgeOffsets(page.edgeOffsets || page.srcCanvas._detectedEdgeOffsets);
        let maxHarmonicPx = 0;

        const downUnitX = 0.5 * (leftVec.x / (Math.hypot(leftVec.x, leftVec.y) || 1) + rightVec.x / (Math.hypot(rightVec.x, rightVec.y) || 1));
        const downUnitY = 0.5 * (leftVec.y / (Math.hypot(leftVec.x, leftVec.y) || 1) + rightVec.y / (Math.hypot(rightVec.x, rightVec.y) || 1));

        for (let m = 0; m < NUM_EDGE_SUBPOINTS; m++) {
          const uTop = (m + 1) / 6.0;
          const BTop = evalCoupledHorizBasis5(uTop);
          let harm0 = 0, harm1 = 0, harm2 = 0;
          for (let j = 1; j < K; j++) {
            harm0 += BTop[j] * coeffs[j];
            harm1 += BTop[j] * coeffs[K + j];
            harm2 += BTop[j] * coeffs[2 * K + j];
          }
          const dyTopDst = harm0 - 0.38 * harm1 + 0.05 * harm2;
          const dyBotDst = harm0 + 0.38 * harm1 + 0.05 * harm2;

          const topShiftSrc = Math.max(-28.0, Math.min(28.0, dyTopDst * scaleFromDstY));
          const botShiftSrc = Math.max(-28.0, Math.min(28.0, dyBotDst * scaleFromDstY));
          if (Math.abs(topShiftSrc) > maxHarmonicPx) maxHarmonicPx = Math.abs(topShiftSrc);
          if (Math.abs(botShiftSrc) > maxHarmonicPx) maxHarmonicPx = Math.abs(botShiftSrc);

          if (Math.abs(topShiftSrc) >= 1.2) {
            newOffsets[0][m] = {
              x: Math.round(downUnitX * topShiftSrc),
              y: Math.round(downUnitY * topShiftSrc)
            };
          }
          const mBot = NUM_EDGE_SUBPOINTS - 1 - m;
          if (Math.abs(botShiftSrc) >= 1.2) {
            newOffsets[2][mBot] = {
              x: Math.round(downUnitX * botShiftSrc),
              y: Math.round(downUnitY * botShiftSrc)
            };
          }
        }

        if (maxHarmonicPx >= 1.8) {
          page.edgeOffsets = newOffsets;
          state.alignPointMode = "multipt";
        }
        return { aligned: true, maxDisp: modes.maxSurfaceDisp || 0, maxHarmonicPx };
      }

      function renderFullScreenEditor() {
        const page = getCurrentPage();
        if (!page) {
          el.fullScreenEditorModal.classList.remove("open");
          return;
        }

        const total = state.pages.length;
        el.btnFsPrev.disabled = state.currentPageIndex <= 0;
        el.btnFsNext.disabled = state.currentPageIndex >= total - 1;
        el.btnFsPrev.style.display = total > 1 ? "inline-flex" : "none";
        el.btnFsNext.style.display = total > 1 ? "inline-flex" : "none";
        syncAlignModeButtons();

        const ctx = el.fsCanvas.getContext("2d");

        if (state.fsCropMode) {
          if (!page.srcCanvas) {
            ensurePageHydrated(page).then((ok) => { if (ok) renderFullScreenEditor(); });
            return;
          }
          const sW = page.srcCanvas.width;
          const sH = page.srcCanvas.height;
          if (el.fsCanvas.width !== sW) el.fsCanvas.width = sW;
          if (el.fsCanvas.height !== sH) el.fsCanvas.height = sH;

          ctx.clearRect(0, 0, sW, sH);
          ctx.drawImage(page.srcCanvas, 0, 0);

          const c = page.corners;
          ctx.save();
          ctx.fillStyle = "rgba(9, 13, 22, 0.50)";
          ctx.beginPath();
          ctx.rect(0, 0, sW, sH);
          drawCurvedQuadPath(ctx, page);
          ctx.fill("evenodd");
          ctx.restore();

          const strokeW = Math.max(4, sW / 210);
          ctx.save();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = strokeW + 2;
          ctx.beginPath();
          drawCurvedQuadPath(ctx, page);
          ctx.stroke();

          ctx.strokeStyle = "#2563eb";
          ctx.lineWidth = strokeW;
          ctx.stroke();

          // Draw synchronized internal text/ruled-line alignment grid inside the document quad
          ctx.strokeStyle = "rgba(56, 189, 248, 0.52)";
          ctx.lineWidth = Math.max(1.5, sW / 420);
          ctx.setLineDash([Math.max(6, Math.round(sW / 95)), Math.max(5, Math.round(sW / 110))]);
          const eOff = page.edgeOffsets || createZeroEdgeOffsets();
          for (let gi = 1; gi <= 5; gi++) {
            const v = gi / 6.0;
            ctx.beginPath();
            const gridSteps = state.draggingHandle ? 10 : 24;
            for (let s = 0; s <= gridSteps; s++) {
              const u = s / gridSteps;
              const bx = (c[0].x * (1 - u) + c[1].x * u) * (1 - v) + (c[3].x * (1 - u) + c[2].x * u) * v;
              const by = (c[0].y * (1 - u) + c[1].y * u) * (1 - v) + (c[3].y * (1 - u) + c[2].y * u) * v;
              const tTop = evalEdge3PointOffset(eOff[0], u);
              const tBot = evalEdge3PointOffset(eOff[2], 1.0 - u);
              const tRight = evalEdge3PointOffset(eOff[1], v);
              const tLeft = evalEdge3PointOffset(eOff[3], 1.0 - v);
              const gx = bx + (1 - v) * tTop.x + v * tBot.x + (1 - u) * tLeft.x + u * tRight.x;
              const gy = by + (1 - v) * tTop.y + v * tBot.y + (1 - u) * tLeft.y + u * tRight.y;
              if (s === 0) ctx.moveTo(gx, gy);
              else ctx.lineTo(gx, gy);
            }
            ctx.stroke();
          }
          for (let gj = 1; gj <= 3; gj++) {
            const u = gj / 4.0;
            ctx.beginPath();
            const gridStepsV = state.draggingHandle ? 10 : 24;
            for (let s = 0; s <= gridStepsV; s++) {
              const v = s / gridStepsV;
              const bx = (c[0].x * (1 - u) + c[1].x * u) * (1 - v) + (c[3].x * (1 - u) + c[2].x * u) * v;
              const by = (c[0].y * (1 - u) + c[1].y * u) * (1 - v) + (c[3].y * (1 - u) + c[2].y * u) * v;
              const tTop = evalEdge3PointOffset(eOff[0], u);
              const tBot = evalEdge3PointOffset(eOff[2], 1.0 - u);
              const tRight = evalEdge3PointOffset(eOff[1], v);
              const tLeft = evalEdge3PointOffset(eOff[3], 1.0 - v);
              const gx = bx + (1 - v) * tTop.x + v * tBot.x + (1 - u) * tLeft.x + u * tRight.x;
              const gy = by + (1 - v) * tTop.y + v * tBot.y + (1 - u) * tLeft.y + u * tRight.y;
              if (s === 0) ctx.moveTo(gx, gy);
              else ctx.lineTo(gx, gy);
            }
            ctx.stroke();
          }
          ctx.setLineDash([]);

          // v51.0: Draw detected center spine divider line for open 2-page books!
          const spineInfo = page.spineDivider || (page.srcCanvas && page.srcCanvas._detectedSpine);
          if (spineInfo) {
            const st = spineInfo.t;
            let sp1, sp2;
            if (spineInfo.orientation === "vertical") {
              const tTop = evalEdge3PointOffset(eOff[0], st);
              const tBot = evalEdge3PointOffset(eOff[2], 1.0 - st);
              sp1 = { x: c[0].x * (1 - st) + c[1].x * st + tTop.x, y: c[0].y * (1 - st) + c[1].y * st + tTop.y };
              sp2 = { x: c[3].x * (1 - st) + c[2].x * st + tBot.x, y: c[3].y * (1 - st) + c[2].y * st + tBot.y };
            } else {
              const tLeft = evalEdge3PointOffset(eOff[3], 1.0 - st);
              const tRight = evalEdge3PointOffset(eOff[1], st);
              sp1 = { x: c[0].x * (1 - st) + c[3].x * st + tLeft.x, y: c[0].y * (1 - st) + c[3].y * st + tLeft.y };
              sp2 = { x: c[1].x * (1 - st) + c[2].x * st + tRight.x, y: c[1].y * (1 - st) + c[2].y * st + tRight.y };
            }
            ctx.strokeStyle = "#f59e0b";
            ctx.lineWidth = Math.max(3.5, sW / 240);
            ctx.setLineDash([Math.max(10, Math.round(sW / 60)), Math.max(7, Math.round(sW / 85))]);
            ctx.beginPath();
            ctx.moveTo(sp1.x, sp1.y);
            ctx.lineTo(sp2.x, sp2.y);
            ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.restore();

          // In "❖ Căn đa điểm" mode, draw 5 intermediate points (t = 1/6, 2/6, 3/6, 4/6, 5/6) on each of the 4 edges!
          if (state.alignPointMode === "multipt") {
            const subR = Math.max(9.5, sW / 82);
            for (let edgeIdx = 0; edgeIdx < 4; edgeIdx++) {
              for (let subIdx = 0; subIdx < NUM_EDGE_SUBPOINTS; subIdx++) {
                const mp = getEdgeSubHandlePos(page, edgeIdx, subIdx);
                ctx.save();
                ctx.fillStyle = subIdx === 2 ? "#38bdf8" : "#eff6ff";
                ctx.strokeStyle = "#1d4ed8";
                ctx.lineWidth = Math.max(2.4, sW / 290);
                ctx.beginPath();
                ctx.arc(mp.x, mp.y, subR, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
              }
            }
          }

          // Always draw the 4 primary corner handles (TL, TR, BR, BL)
          const cornerR = Math.max(17, sW / 48);
          const labels = ["TL", "TR", "BR", "BL"];
          for (let i = 0; i < 4; i++) {
            drawHandle(ctx, c[i].x, c[i].y, cornerR, "#2563eb", labels[i]);
          }
        } else {
          if (!page.srcCanvas) {
            ensurePageHydrated(page).then((ok) => { if (ok) renderFullScreenEditor(); });
            return;
          }
          if (!page.processedCanvas) updateGeometryAndProcess(page);
          const target = page.processedCanvas;
          if (el.fsCanvas.width !== target.width) el.fsCanvas.width = target.width;
          if (el.fsCanvas.height !== target.height) el.fsCanvas.height = target.height;
          ctx.clearRect(0, 0, target.width, target.height);
          ctx.drawImage(target, 0, 0);
          drawNoteOverlayOnCanvas(ctx, target.width, target.height, page, true);
        }

        const dispW = page.processedCanvas ? page.processedCanvas.width : page.srcCanvas.width;
        const dispH = page.processedCanvas ? page.processedCanvas.height : page.srcCanvas.height;
        el.fsMetaSingleLine.textContent = `${describeAspectRatio(dispW, dispH)} • ${dispW}×${dispH} px • ${getModeLabel(page.settings.colorMode)} • ${page.createdAt || "Hôm nay"}`;

        if (page.note && page.note.trim()) {
          el.fsNotePreview.textContent = `📝 ${page.note.trim()} (Chạm kéo trên ảnh để di chuyển / đổi cỡ)`;
          el.fsNotePreview.classList.add("visible");
        } else {
          el.fsNotePreview.textContent = "";
          el.fsNotePreview.classList.remove("visible");
        }
      }

      function openFullScreenEditorForIndex(idx) {
        if (idx < 0 || idx >= state.pages.length) return;
        state.currentPageIndex = idx;
        state.fsCropMode = false;
        el.fsCropBar.classList.remove("visible");
        toggleEditDropdown(false);
        resetFsZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        renderFullScreenEditor();
        el.fullScreenEditorModal.classList.add("open");
      }

      // Smart Local Magnetic Edge-Snap for Corner & Multi-Point Handles
      function snapPointToLocalEdge(srcCanvas, rawX, rawY, normX, normY, searchRadPx) {
        const w = srcCanvas.width;
        const h = srcCanvas.height;
        const data = getCachedSrcImageData(srcCanvas);
        if (!data) return { x: Math.round(rawX), y: Math.round(rawY), snapped: false };

        const rad = searchRadPx || 7;
        let bestS = 0;
        let bestGrad = 0;
        let baseGrad = 0;

        // If normal vector is provided (e.g. edge sub-point), search along normal; otherwise search 2D cross
        const hasNorm = Math.hypot(normX || 0, normY || 0) > 0.5;
        if (hasNorm) {
          for (let s = -rad; s <= rad; s++) {
            const cx = Math.min(w - 3, Math.max(2, Math.round(rawX + s * normX)));
            const cy = Math.min(h - 3, Math.max(2, Math.round(rawY + s * normY)));
            const pInX = Math.min(w - 1, Math.max(0, Math.round(cx + 2 * normX)));
            const pInY = Math.min(h - 1, Math.max(0, Math.round(cy + 2 * normY)));
            const pOutX = Math.min(w - 1, Math.max(0, Math.round(cx - 2 * normX)));
            const pOutY = Math.min(h - 1, Math.max(0, Math.round(cy - 2 * normY)));

            const iIn = (pInY * w + pInX) * 4;
            const iOut = (pOutY * w + pOutX) * 4;
            const iCtr = (cy * w + cx) * 4;
            const lIn = 0.299 * data[iIn] + 0.587 * data[iIn + 1] + 0.114 * data[iIn + 2];
            const lOut = 0.299 * data[iOut] + 0.587 * data[iOut + 1] + 0.114 * data[iOut + 2];
            const lCtr = 0.299 * data[iCtr] + 0.587 * data[iCtr + 1] + 0.114 * data[iCtr + 2];
            const dR = data[iIn] - data[iOut];
            const dG = data[iIn + 1] - data[iOut + 1];
            const dB = data[iIn + 2] - data[iOut + 2];
            const dL = Math.abs(lIn - lOut);
            const crease = Math.max(0, Math.min(lIn, lOut) - lCtr);
            const dC = Math.sqrt(dR * dR + dG * dG + dB * dB);
            const gScore = (dL + 0.72 * dC + 2.2 * crease) * (1.0 - 0.04 * Math.abs(s));
            if (s === 0) baseGrad = gScore;
            if (gScore > bestGrad) {
              bestGrad = gScore;
              bestS = s;
            }
          }
          if (bestGrad > 8.5 && bestGrad > baseGrad * 1.14) {
            return {
              x: Math.max(0, Math.min(w, Math.round(rawX + bestS * normX))),
              y: Math.max(0, Math.min(h, Math.round(rawY + bestS * normY))),
              snapped: true
            };
          }
        } else {
          let bestX = Math.round(rawX);
          let bestY = Math.round(rawY);
          for (let dy = -rad; dy <= rad; dy += 1) {
            const cy = Math.min(h - 3, Math.max(2, Math.round(rawY + dy)));
            for (let dx = -rad; dx <= rad; dx += 1) {
              if (dx * dx + dy * dy > rad * rad) continue;
              const cx = Math.min(w - 3, Math.max(2, Math.round(rawX + dx)));
              const idxL = (cy * w + (cx - 2)) * 4;
              const idxR = (cy * w + (cx + 2)) * 4;
              const idxT = ((cy - 2) * w + cx) * 4;
              const idxB = ((cy + 2) * w + cx) * 4;
              const gx = Math.hypot(data[idxR] - data[idxL], data[idxR + 1] - data[idxL + 1], data[idxR + 2] - data[idxL + 2]);
              const gy = Math.hypot(data[idxB] - data[idxT], data[idxB + 1] - data[idxT + 1], data[idxB + 2] - data[idxT + 2]);
              const cornerness = Math.min(gx, gy) + 0.35 * (gx + gy);
              const distPen = 1.0 - 0.035 * Math.hypot(dx, dy);
              const sc = cornerness * distPen;
              if (dx === 0 && dy === 0) baseGrad = sc;
              if (sc > bestGrad) {
                bestGrad = sc;
                bestX = cx;
                bestY = cy;
              }
            }
          }
          if (bestGrad > 42.0 && bestGrad > baseGrad * 1.22) {
            return { x: bestX, y: bestY, snapped: true };
          }
        }
        return { x: Math.max(0, Math.min(w, Math.round(rawX))), y: Math.max(0, Math.min(h, Math.round(rawY))), snapped: false };
      }

      function updateMagnifierLoupe(imgX, imgY, clientX, clientY, labelText, isSnapped) {
        const page = getCurrentPage();
        if (!page || !state.fsCropMode) {
          el.magnifierLoupe.style.display = "none";
          return;
        }
        el.magnifierLoupe.style.display = "block";
        el.loupeLabel.textContent = isSnapped ? `🧲 ${labelText}` : labelText;
        el.magnifierLoupe.style.borderColor = isSnapped ? "#22c55e" : "#38bdf8";

        const stRect = el.fsStageWrap.getBoundingClientRect();
        const relX = clientX - stRect.left;
        const leftPx = relX < stRect.width * 0.5 ? Math.max(10, stRect.width - 124) : 10;
        const topPx = 12;

        el.magnifierLoupe.style.left = `${leftPx}px`;
        el.magnifierLoupe.style.top = `${topPx}px`;

        const lCtx = el.loupeCanvas.getContext("2d");
        const lw = el.loupeCanvas.width;
        const lh = el.loupeCanvas.height;
        lCtx.fillStyle = "#0f172a";
        lCtx.fillRect(0, 0, lw, lh);

        const zoom = 4.2;
        const srcRadius = (lw / 2) / zoom;
        lCtx.drawImage(
          page.srcCanvas,
          imgX - srcRadius,
          imgY - srcRadius,
          srcRadius * 2,
          srcRadius * 2,
          0,
          0,
          lw,
          lh
        );

        lCtx.strokeStyle = isSnapped ? "#22c55e" : "#38bdf8";
        lCtx.lineWidth = 1.8;
        lCtx.beginPath();
        lCtx.moveTo(lw / 2, 0);
        lCtx.lineTo(lw / 2, lh);
        lCtx.moveTo(0, lh / 2);
        lCtx.lineTo(lw, lh / 2);
        lCtx.stroke();

        lCtx.beginPath();
        lCtx.arc(lw / 2, lh / 2, 6, 0, Math.PI * 2);
        lCtx.stroke();
      }

      function getFsCanvasCoords(clientX, clientY) {
        const rect = el.fsCanvas.getBoundingClientRect();
        const scaleX = el.fsCanvas.width / Math.max(1, rect.width);
        const scaleY = el.fsCanvas.height / Math.max(1, rect.height);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
          clientX,
          clientY,
          scaleX
        };
      }

      function findNoteHitHandle(page, pt, targetCanvasName) {
        if (!page || !page.note || !page.note.trim() || !page._noteBounds) return null;
        const nb = page._noteBounds;
        const hitPad = Math.max(24, 30 * (pt.scaleX || 1));

        // 1. Check bottom-right resize handle (⤡) first
        if (Math.hypot(pt.x - nb.resizeHx, pt.y - nb.resizeHy) <= Math.max(nb.handleR * 2.2, hitPad)) {
          return {
            type: "note_resize",
            targetCanvas: targetCanvasName || "fs",
            startX: pt.x,
            startY: pt.y,
            origSize: page.noteSize || 28,
            cx: nb.cx,
            cy: nb.cy,
            startDist: Math.max(16, Math.hypot(pt.x - nb.cx, pt.y - nb.cy))
          };
        }

        // 2. Check inside note bounding box for free movement
        if (
          pt.x >= nb.boxX - 12 &&
          pt.x <= nb.boxX + nb.boxW + 12 &&
          pt.y >= nb.boxY - 12 &&
          pt.y <= nb.boxY + nb.boxH + 12
        ) {
          return {
            type: "note_move",
            targetCanvas: targetCanvasName || "fs",
            startX: pt.x,
            startY: pt.y,
            origNoteX: typeof page.noteX === "number" ? page.noteX : 0.50,
            origNoteY: typeof page.noteY === "number" ? page.noteY : 0.88
          };
        }
        return null;
      }

      function getMainCanvasCoords(clientX, clientY) {
        const rect = el.mainCanvas.getBoundingClientRect();
        const scaleX = el.mainCanvas.width / Math.max(1, rect.width);
        const scaleY = el.mainCanvas.height / Math.max(1, rect.height);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
          clientX,
          clientY,
          scaleX
        };
      }

      function findHitHandle(page, pt) {
        if (!state.fsCropMode) {
          return findNoteHitHandle(page, pt, "fs");
        }
        // High-sensitivity touch radius on smartphones so grabbing corners & 20 multi-point handles is effortless
        const hitRadius = Math.max(42, 56 * (pt.scaleX || 1));
        const c = page.corners;

        let bestCorner = -1;
        let bestCornerDist = hitRadius;
        for (let i = 0; i < 4; i++) {
          const d = Math.hypot(pt.x - c[i].x, pt.y - c[i].y);
          if (d <= bestCornerDist) {
            bestCornerDist = d;
            bestCorner = i;
          }
        }

        // In "❖ Căn đa điểm" mode, compare distance to all 20 intermediate edge points so nearby edge handles (1/5 & 5/5) are never swallowed by corner hitboxes!
        if (state.alignPointMode === "multipt") {
          const edgeNames = ["Trên", "Phải", "Dưới", "Trái"];
          let bestEdge = -1, bestSub = -1, bestSubDist = hitRadius;
          for (let edgeIdx = 0; edgeIdx < 4; edgeIdx++) {
            for (let subIdx = 0; subIdx < NUM_EDGE_SUBPOINTS; subIdx++) {
              const mp = getEdgeSubHandlePos(page, edgeIdx, subIdx);
              const d = Math.hypot(pt.x - mp.x, pt.y - mp.y);
              if (d <= bestSubDist) {
                bestSubDist = d;
                bestEdge = edgeIdx;
                bestSub = subIdx;
              }
            }
          }
          if (bestEdge !== -1 && (bestCorner === -1 || bestSubDist < bestCornerDist - 4)) {
            if (!page.edgeOffsets) page.edgeOffsets = createZeroEdgeOffsets();
            const eOff = page.edgeOffsets[bestEdge][bestSub] || { x: 0, y: 0 };
            return {
              type: "edge_sub",
              edgeIdx: bestEdge,
              subIdx: bestSub,
              startX: pt.x,
              startY: pt.y,
              origOffX: eOff.x,
              origOffY: eOff.y,
              origEdgeSnapshot: page.edgeOffsets[bestEdge].map((o) => ({ x: o.x, y: o.y })),
              label: `${edgeNames[bestEdge]} ${bestSub + 1}/5`
            };
          }
        }

        if (bestCorner !== -1) {
          return {
            type: "corner",
            index: bestCorner,
            startX: pt.x,
            startY: pt.y,
            origX: c[bestCorner].x,
            origY: c[bestCorner].y,
            label: ["Góc TL", "Góc TR", "Góc BR", "Góc BL"][bestCorner]
          };
        }
        return null;
      }

      // Starts a 150ms Hold-to-Pan timer when 1 finger presses on an empty area of the image (works at ANY zoom level, including 100%)
      function scheduleEmptyAreaHoldPan(targetMode, clientX, clientY) {
        hideHoldPanRing();
        const isFs = targetMode === "fs";
        const panType = isFs ? "fs_pan" : "stage_pan";
        const origPanX = isFs ? state.fsPanX : state.stagePanX;
        const origPanY = isFs ? state.fsPanY : state.stagePanY;

        state.holdPanPending = {
          targetMode,
          panType,
          startClientX: clientX,
          startClientY: clientY,
          lastClientX: clientX,
          lastClientY: clientY,
          origPanX,
          origPanY,
          activated: false
        };

        state.draggingHandle = {
          type: panType,
          startClientX: clientX,
          startClientY: clientY,
          origPanX,
          origPanY,
          isHoldPan: false
        };

        state.holdPanTimer = setTimeout(() => {
          state.holdPanTimer = null;
          if (!state.holdPanPending || state.pinchState || state.holdPanPending.activated) return;
          state.holdPanPending.activated = true;
          if (state.draggingHandle && state.draggingHandle.type === panType) {
            state.draggingHandle.isHoldPan = true;
          } else if (!state.draggingHandle) {
            state.draggingHandle = {
              type: panType,
              startClientX: state.holdPanPending.startClientX,
              startClientY: state.holdPanPending.startClientY,
              origPanX: state.holdPanPending.origPanX,
              origPanY: state.holdPanPending.origPanY,
              isHoldPan: true
            };
          }
          if (isFs && state.fsCropMode) {
            el.fsCropBar.classList.add("dragging-fade");
          }
          showHoldPanRing(state.holdPanPending.lastClientX, state.holdPanPending.lastClientY);
          if (navigator.vibrate) {
            try { navigator.vibrate(16); } catch (_) {}
          }
        }, 150);
      }

      function onFsTouchStart(evt) {
        const page = getCurrentPage();
        if (!page) return;
        if (isEventInsidePopupOrBar(evt)) {
          cancelActiveStageInteractions();
          return;
        }

        // If ☰ popup is open, tapping/touching outside ONLY closes the popup and NEVER pans/zooms the image!
        if (el.editDropdownMenu.classList.contains("open")) {
          toggleEditDropdown(false);
          state.pinchCooldownUntil = Date.now() + 220;
          if (evt.cancelable) evt.preventDefault();
          return;
        }
        if (isBlockingOverlayPopupOpen()) {
          cancelActiveStageInteractions();
          return;
        }

        if (evt.touches && evt.touches.length === 2) {
          hideHoldPanRing();
          if (state.draggingHandle && (state.draggingHandle.type === "corner" || state.draggingHandle.type === "edge_sub")) {
            if (state.preTouchCorners) page.corners = state.preTouchCorners.map((p) => ({ ...p }));
            if (state.preTouchMidOffsets) page.edgeOffsets = cloneEdgeOffsets(state.preTouchMidOffsets);
            renderFullScreenEditor();
          }
          state.draggingHandle = null;
          el.magnifierLoupe.style.display = "none";

          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const midX = (t0.clientX + t1.clientX) * 0.5;
          const midY = (t0.clientY + t1.clientY) * 0.5;
          const stRect = el.fsStageWrap.getBoundingClientRect();
          state.pinchState = {
            target: "fs",
            startDist: Math.max(12, dist),
            startZoom: state.fsZoom,
            startPanX: state.fsPanX,
            startPanY: state.fsPanY,
            startMidX: midX,
            startMidY: midY,
            centerX: stRect.left + stRect.width * 0.5,
            centerY: stRect.top + stRect.height * 0.5
          };
          evt.preventDefault();
          return;
        }

        if (evt.touches && evt.touches.length === 1) {
          if (Date.now() < state.pinchCooldownUntil) {
            evt.preventDefault();
            return;
          }
          const t0 = evt.touches[0];
          const pt = getFsCanvasCoords(t0.clientX, t0.clientY);
          state.preTouchCorners = page.corners.map((p) => ({ ...p }));
          state.preTouchMidOffsets = cloneEdgeOffsets(page.edgeOffsets);

          const hit = findHitHandle(page, pt);
          if (hit) {
            hideHoldPanRing();
            state.draggingHandle = hit;
            el.fsCropBar.classList.add("dragging-fade");
            if (hit.type === "corner") {
              updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label, false);
            } else if (hit.type === "edge_sub") {
              const mp = getEdgeSubHandlePos(page, hit.edgeIdx, hit.subIdx);
              updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label, false);
            }
            evt.preventDefault();
            return;
          }

          const now = Date.now();
          if (now - state.lastTapTime < 280 && Math.hypot(t0.clientX - state.lastTapX, t0.clientY - state.lastTapY) < 32) {
            hideHoldPanRing();
            state.draggingHandle = null;
            state.lastTapTime = 0;
            if (state.fsZoom > 1.15 || Math.hypot(state.fsPanX, state.fsPanY) > 12) {
              resetFsZoom();
            } else {
              state.fsZoom = 2.3;
              applyFsTransform();
            }
            evt.preventDefault();
            return;
          }
          state.lastTapTime = now;
          state.lastTapX = t0.clientX;
          state.lastTapY = t0.clientY;

          // Empty area of the image: press-and-hold 1 finger (or drag) to move/pan the image freely!
          scheduleEmptyAreaHoldPan("fs", t0.clientX, t0.clientY);
          evt.preventDefault();
        }
      }

      function onFsMouseDown(evt) {
        if (evt.button !== undefined && evt.button !== 0) return;
        const page = getCurrentPage();
        if (!page) return;
        if (isEventInsidePopupOrBar(evt)) {
          cancelActiveStageInteractions();
          return;
        }
        if (el.editDropdownMenu.classList.contains("open")) {
          toggleEditDropdown(false);
          state.pinchCooldownUntil = Date.now() + 220;
          if (evt.cancelable) evt.preventDefault();
          return;
        }
        if (isBlockingOverlayPopupOpen()) {
          cancelActiveStageInteractions();
          return;
        }
        const pt = getFsCanvasCoords(evt.clientX, evt.clientY);
        state.preTouchCorners = page.corners.map((p) => ({ ...p }));
        state.preTouchMidOffsets = cloneEdgeOffsets(page.edgeOffsets);
        const hit = findHitHandle(page, pt);
        if (hit) {
          hideHoldPanRing();
          state.draggingHandle = hit;
          el.fsCropBar.classList.add("dragging-fade");
          if (hit.type === "corner") {
            updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label, false);
          } else if (hit.type === "edge_sub") {
            const mp = getEdgeSubHandlePos(page, hit.edgeIdx, hit.subIdx);
            updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label, false);
          }
          evt.preventDefault();
          return;
        }
        scheduleEmptyAreaHoldPan("fs", evt.clientX, evt.clientY);
        evt.preventDefault();
      }

      function onGlobalPointerMove(evt) {
        if (isBlockingOverlayPopupOpen() || isEventInsidePopupOrBar(evt)) {
          if (state.draggingHandle && (state.draggingHandle.type === "fs_pan" || state.draggingHandle.type === "stage_pan")) {
            cancelActiveStageInteractions();
          }
          if (state.pinchState) {
            state.pinchState = null;
          }
          return;
        }
        if (state.pinchState && evt.touches && evt.touches.length === 2) {
          hideHoldPanRing();
          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const currDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const currMidX = (t0.clientX + t1.clientX) * 0.5;
          const currMidY = (t0.clientY + t1.clientY) * 0.5;
          const newZoom = Math.max(0.8, Math.min(5.0, state.pinchState.startZoom * (currDist / state.pinchState.startDist)));
          const zoomRatio = newZoom / state.pinchState.startZoom;
          const relX = state.pinchState.startMidX - state.pinchState.centerX;
          const relY = state.pinchState.startMidY - state.pinchState.centerY;

          if (state.pinchState.target === "fs") {
            state.fsZoom = newZoom;
            state.fsPanX = (currMidX - state.pinchState.startMidX) + relX - (relX - state.pinchState.startPanX) * zoomRatio;
            state.fsPanY = (currMidY - state.pinchState.startMidY) + relY - (relY - state.pinchState.startPanY) * zoomRatio;
            applyFsTransform();
          } else {
            state.stageZoom = newZoom;
            state.stagePanX = (currMidX - state.pinchState.startMidX) + relX - (relX - state.pinchState.startPanX) * zoomRatio;
            state.stagePanY = (currMidY - state.pinchState.startMidY) + relY - (relY - state.pinchState.startPanY) * zoomRatio;
            applyStageTransform();
          }
          evt.preventDefault();
          return;
        }

        if (!state.draggingHandle) return;
        const page = getCurrentPage();
        if (!page) return;

        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        if (state.holdPanPending) {
          state.holdPanPending.lastClientX = clientX;
          state.holdPanPending.lastClientY = clientY;
        }

        if (state.draggingHandle.type === "stage_pan") {
          const moveDist = Math.hypot(clientX - state.draggingHandle.startClientX, clientY - state.draggingHandle.startClientY);
          if (moveDist > 4 && state.holdPanPending && !state.holdPanPending.activated) {
            state.holdPanPending.activated = true;
            if (state.holdPanTimer) {
              clearTimeout(state.holdPanTimer);
              state.holdPanTimer = null;
            }
            showHoldPanRing(clientX, clientY);
          } else {
            moveHoldPanRing(clientX, clientY);
          }
          state.stagePanX = state.draggingHandle.origPanX + (clientX - state.draggingHandle.startClientX);
          state.stagePanY = state.draggingHandle.origPanY + (clientY - state.draggingHandle.startClientY);
          applyStageTransform();
          evt.preventDefault();
          return;
        }

        if (state.draggingHandle.type === "fs_pan") {
          const moveDist = Math.hypot(clientX - state.draggingHandle.startClientX, clientY - state.draggingHandle.startClientY);
          if (moveDist > 4 && state.holdPanPending && !state.holdPanPending.activated) {
            state.holdPanPending.activated = true;
            if (state.holdPanTimer) {
              clearTimeout(state.holdPanTimer);
              state.holdPanTimer = null;
            }
            if (state.fsCropMode) el.fsCropBar.classList.add("dragging-fade");
            showHoldPanRing(clientX, clientY);
          } else {
            moveHoldPanRing(clientX, clientY);
          }
          state.fsPanX = state.draggingHandle.origPanX + (clientX - state.draggingHandle.startClientX);
          state.fsPanY = state.draggingHandle.origPanY + (clientY - state.draggingHandle.startClientY);
          applyFsTransform();
          evt.preventDefault();
          return;
        }

        if (state.draggingHandle.type === "note_move") {
          const isMain = state.draggingHandle.targetCanvas === "main";
          const ptNote = isMain ? getMainCanvasCoords(clientX, clientY) : getFsCanvasCoords(clientX, clientY);
          const cw = isMain ? el.mainCanvas.width : el.fsCanvas.width;
          const ch = isMain ? el.mainCanvas.height : el.fsCanvas.height;
          const dxNorm = (ptNote.x - state.draggingHandle.startX) / Math.max(1, cw);
          const dyNorm = (ptNote.y - state.draggingHandle.startY) / Math.max(1, ch);
          page.noteX = Math.max(0.05, Math.min(0.95, state.draggingHandle.origNoteX + dxNorm));
          page.noteY = Math.max(0.04, Math.min(0.96, state.draggingHandle.origNoteY + dyNorm));
          if (!state.pointerRafId) {
            state.pointerRafId = requestAnimationFrame(() => {
              state.pointerRafId = null;
              renderStage();
              if (el.fullScreenEditorModal.classList.contains("open")) {
                renderFullScreenEditor();
              }
            });
          }
          evt.preventDefault();
          return;
        }

        if (state.draggingHandle.type === "note_resize") {
          const isMain = state.draggingHandle.targetCanvas === "main";
          const ptNote = isMain ? getMainCanvasCoords(clientX, clientY) : getFsCanvasCoords(clientX, clientY);
          const currDist = Math.max(12, Math.hypot(ptNote.x - state.draggingHandle.cx, ptNote.y - state.draggingHandle.cy));
          const ratio = currDist / state.draggingHandle.startDist;
          const newSize = Math.max(14, Math.min(64, Math.round(state.draggingHandle.origSize * ratio)));
          page.noteSize = newSize;
          if (el.ddNoteSizeSlider) el.ddNoteSizeSlider.value = newSize;
          if (el.ddNoteSizeVal) el.ddNoteSizeVal.textContent = `${newSize}px`;
          if (!state.pointerRafId) {
            state.pointerRafId = requestAnimationFrame(() => {
              state.pointerRafId = null;
              renderStage();
              if (el.fullScreenEditorModal.classList.contains("open")) {
                renderFullScreenEditor();
              }
            });
          }
          evt.preventDefault();
          return;
        }

        const pt = getFsCanvasCoords(clientX, clientY);
        const w = el.fsCanvas.width;
        const h = el.fsCanvas.height;

        if (state.draggingHandle.type === "corner") {
          const idx = state.draggingHandle.index;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          // Direct 1:1 smooth finger placement with zero jerky magnetic snapping!
          const newX = Math.max(0, Math.min(w, state.draggingHandle.origX + dx));
          const newY = Math.max(0, Math.min(h, state.draggingHandle.origY + dy));
          page.corners[idx].x = newX;
          page.corners[idx].y = newY;
          state.latestDragClientX = pt.clientX;
          state.latestDragClientY = pt.clientY;
          if (!state.pointerRafId) {
            state.pointerRafId = requestAnimationFrame(() => {
              state.pointerRafId = null;
              if (!state.draggingHandle) return;
              const cur = page.corners[idx];
              updateMagnifierLoupe(cur.x, cur.y, state.latestDragClientX, state.latestDragClientY, state.draggingHandle.label || "Góc", false);
              renderFullScreenEditor();
            });
          }
        } else if (state.draggingHandle.type === "edge_sub") {
          const eIdx = state.draggingHandle.edgeIdx;
          const sIdx = state.draggingHandle.subIdx;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          if (!page.edgeOffsets) page.edgeOffsets = createZeroEdgeOffsets();

          // Direct 1:1 smooth sub-anchor tracking (no jerky edge-snap jumps while dragging!)
          page.edgeOffsets[eIdx][sIdx].x = state.draggingHandle.origOffX + dx;
          page.edgeOffsets[eIdx][sIdx].y = state.draggingHandle.origOffY + dy;

          // Gentle neighbor smoothing so curved edges stay continuous without fighting your finger
          const snapOrig = state.draggingHandle.origEdgeSnapshot;
          if (snapOrig && snapOrig.length === NUM_EDGE_SUBPOINTS) {
            const weights = [1.0, 0.24, 0.0, 0.0, 0.0];
            for (let j = 0; j < NUM_EDGE_SUBPOINTS; j++) {
              if (j === sIdx) continue;
              const distIdx = Math.abs(j - sIdx);
              const wCouple = weights[distIdx] || 0;
              if (wCouple > 0) {
                page.edgeOffsets[eIdx][j].x = snapOrig[j].x + dx * wCouple;
                page.edgeOffsets[eIdx][j].y = snapOrig[j].y + dy * wCouple;
              }
            }
          }

          state.latestDragClientX = pt.clientX;
          state.latestDragClientY = pt.clientY;
          if (!state.pointerRafId) {
            state.pointerRafId = requestAnimationFrame(() => {
              state.pointerRafId = null;
              if (!state.draggingHandle) return;
              const mp = getEdgeSubHandlePos(page, eIdx, sIdx);
              updateMagnifierLoupe(mp.x, mp.y, state.latestDragClientX, state.latestDragClientY, state.draggingHandle.label || "Cạnh", false);
              renderFullScreenEditor();
            });
          }
        }
        evt.preventDefault();
      }

      function onGlobalPointerUp(evt) {
        hideHoldPanRing();
        if (state.pinchState && (!evt.touches || evt.touches.length < 2)) {
          state.pinchState = null;
          state.pinchCooldownUntil = Date.now() + 180;
          state.draggingHandle = null;
          return;
        }
        if (!state.draggingHandle) return;
        const dragType = state.draggingHandle.type;
        state.draggingHandle = null;
        el.fsCropBar.classList.remove("dragging-fade");
        el.magnifierLoupe.style.display = "none";
        if (dragType === "corner" || dragType === "edge_sub") {
          const page = getCurrentPage();
          if (page) {
            if (state.fsCropMode) {
              page.processedCanvas = null;
              page.cachedAutoModes = undefined;
              renderFullScreenEditor();
            } else {
              updateGeometryAndProcess(page);
              renderPageList();
              renderStage();
              if (el.fullScreenEditorModal.classList.contains("open")) {
                renderFullScreenEditor();
              }
            }
          }
        }
      }

      // =========================================================================
      // 8. CLEAN "THƯ VIỆN" (LIBRARY): "TRANG X / Y" BADGE + "XEM" & "XÓA" + MULTI-SELECT
      // =========================================================================
      function addNewPageFromCanvas(srcCanvas, name, customCorners, customMidOffsets, initialBookCurve, initialNote) {
        const detectedCorners = customCorners ? customCorners.map((p) => ({ ...p })) : detectDocumentCorners(srcCanvas);
        const edgeOffsets = customMidOffsets
          ? cloneEdgeOffsets(customMidOffsets)
          : (srcCanvas._detectedEdgeOffsets ? cloneEdgeOffsets(srcCanvas._detectedEdgeOffsets) : createZeroEdgeOffsets());
        state.alignPointMode = srcCanvas._hasCurvedRim ? "multipt" : "4pt";

        const settings = cloneSettings(state.defaultSettings);
        if (typeof initialBookCurve === "number") {
          settings.bookCurve = initialBookCurve;
        }

        const pageObj = {
          id: "page_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
          name: name || `ScanhoahocABC_${state.pages.length + 1}`,
          createdAt: formatTimeStr(new Date()),
          note: initialNote || "",
          noteX: 0.50,
          noteY: 0.88,
          noteSize: 28,
          noteColor: "#dc2626",
          noteHasBg: true,
          noteBgColor: "#ffffff",
          noteHasBorder: true,
          noteBorderColor: "#dc2626",
          includeNoteOnExport: true,
          srcCanvas,
          corners: detectedCorners,
          edgeOffsets,
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,
          settings
        };
        updateGeometryAndProcess(pageObj);
        state.pages.push(pageObj);
        state.currentPageIndex = state.pages.length - 1;
        resetStageZoom();
        syncControlsFromPage(pageObj);
        renderPageList();
        renderStage();
        scheduleSavePage(pageObj, true);
        idbSaveMeta("currentPageIndex", state.currentPageIndex);
        idbSaveMeta("hasUserClearedAll", false);
      }

      function deletePageAtIndex(idx) {
        if (idx < 0 || idx >= state.pages.length) return;
        const removedPage = state.pages[idx];
        const removedName = removedPage.name;
        state.selectedPageIds.delete(removedPage.id);
        state.pages.splice(idx, 1);
        idbDeletePageIds([removedPage.id]);
        persistAllPageOrders();

        if (state.pages.length === 0) {
          state.currentPageIndex = -1;
          state.libMultiSelect = false;
          state.selectedPageIds.clear();
          state.fsCropMode = false;
          el.fullScreenEditorModal.classList.remove("open");
          resetStageZoom();
          syncControlsFromPage(null);
          renderPageList();
          renderStage();
          showToast(`Đã xóa "${removedName}" (Thư viện trống)!`);
          return;
        }

        if (state.currentPageIndex >= state.pages.length) {
          state.currentPageIndex = state.pages.length - 1;
        } else if (idx < state.currentPageIndex) {
          state.currentPageIndex--;
        }
        resetStageZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        if (el.fullScreenEditorModal.classList.contains("open")) {
          renderFullScreenEditor();
        }
        showToast(`Đã xóa "${removedName}"!`);
      }

      function enterMultiSelectMode(initialPageId) {
        state.libMultiSelect = true;
        if (initialPageId) {
          state.selectedPageIds.add(initialPageId);
        }
        if (navigator.vibrate) {
          try { navigator.vibrate(30); } catch (_) {}
        }
        renderPageList();
      }

      function exitMultiSelectMode() {
        state.libMultiSelect = false;
        state.selectedPageIds.clear();
        renderPageList();
      }

      function toggleSelectPageId(pageId) {
        if (state.selectedPageIds.has(pageId)) {
          state.selectedPageIds.delete(pageId);
        } else {
          state.selectedPageIds.add(pageId);
        }
        renderPageList();
      }

      function getSelectedPagesList() {
        return state.pages.filter((p) => state.selectedPageIds.has(p.id));
      }

      function deleteSelectedPagesInLibrary() {
        const count = state.selectedPageIds.size;
        if (!count) return;
        const removedIds = Array.from(state.selectedPageIds);
        state.pages = state.pages.filter((p) => !state.selectedPageIds.has(p.id));
        state.selectedPageIds.clear();
        idbDeletePageIds(removedIds);
        persistAllPageOrders();
        state.libMultiSelect = false;

        if (state.pages.length === 0) {
          state.currentPageIndex = -1;
          el.fullScreenEditorModal.classList.remove("open");
        } else if (state.currentPageIndex >= state.pages.length) {
          state.currentPageIndex = state.pages.length - 1;
        }
        resetStageZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        showToast(`Đã xóa ${count} ảnh đã chọn!`);
      }

      function goToAdjacentPage(delta) {
        const nextIdx = state.currentPageIndex + delta;
        if (nextIdx < 0 || nextIdx >= state.pages.length) return;
        state.currentPageIndex = nextIdx;
        idbSaveMeta("currentPageIndex", nextIdx);

      function bindLongPressAndClick(itemEl, pageObj, idx) {
        let pressTimer = null;
        let startX = 0, startY = 0;
        let longPressTriggered = false;

        function clearTimer() {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        }

        itemEl.addEventListener("touchstart", (e) => {
          if (e.target.closest("button")) return;
          if (!e.touches || e.touches.length !== 1) return;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          longPressTriggered = false;
          clearTimer();
          pressTimer = setTimeout(() => {
            longPressTriggered = true;
            if (!state.libMultiSelect) {
              enterMultiSelectMode(pageObj.id);
            } else {
              toggleSelectPageId(pageObj.id);
            }
          }, 380);
        }, { passive: true });

        itemEl.addEventListener("touchmove", (e) => {
          if (!pressTimer || !e.touches || !e.touches.length) return;
          if (Math.hypot(e.touches[0].clientX - startX, e.touches[0].clientY - startY) > 12) {
            clearTimer();
          }
        }, { passive: true });

        itemEl.addEventListener("touchend", clearTimer);
        itemEl.addEventListener("touchcancel", clearTimer);

        itemEl.addEventListener("mousedown", (e) => {
          if (e.button !== 0 || e.target.closest("button")) return;
          startX = e.clientX;
          startY = e.clientY;
          longPressTriggered = false;
          clearTimer();
          pressTimer = setTimeout(() => {
            longPressTriggered = true;
            if (!state.libMultiSelect) {
              enterMultiSelectMode(pageObj.id);
            } else {
              toggleSelectPageId(pageObj.id);
            }
          }, 380);
        });

        itemEl.addEventListener("mousemove", (e) => {
          if (!pressTimer) return;
          if (Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
            clearTimer();
          }
        });

        itemEl.addEventListener("mouseup", clearTimer);
        itemEl.addEventListener("mouseleave", clearTimer);

        itemEl.addEventListener("contextmenu", (e) => {
          if (e.target.closest("button")) return;
          e.preventDefault();
          if (!state.libMultiSelect) {
            enterMultiSelectMode(pageObj.id);
          }
        });

        itemEl.addEventListener("click", (e) => {
          if (e.target.closest("button")) return;
          if (longPressTriggered) {
            longPressTriggered = false;
            return;
          }
          if (state.libMultiSelect) {
            toggleSelectPageId(pageObj.id);
            return;
          }
          state.currentPageIndex = idx;
          idbSaveMeta("currentPageIndex", idx);
          resetStageZoom();
          syncControlsFromPage(getCurrentPage());
          renderPageList();
          renderStage();
        });
      }

      function openExportPopup(mode) {

      function getScaledExportCanvas(page) {
        if (!page.processedCanvas) updateGeometryAndProcess(page);
        const src = page.processedCanvas;
        const scale = parseFloat(el.exportScale.value) || 1;
        const outW = Math.round(src.width * scale);
        const outH = Math.round(src.height * scale);
        const hasNote = page.note && page.note.trim().length > 0;

        if (Math.abs(scale - 1) < 0.01 && !hasNote) return src;

        const out = document.createElement("canvas");
        out.width = outW;
        out.height = outH;
        const ctx = out.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(src, 0, 0, outW, outH);

        if (hasNote) {
          drawNoteOverlayOnCanvas(ctx, outW, outH, page, false);
        }
        return out;
      }

      function generatePdfBlobFromPages(pagesToExport, quality) {
        const enc = new TextEncoder();
        const chunks = [];
        let offset = 0;
        const xref = [0];

        function pushStr(str) {
          const bytes = enc.encode(str);
          chunks.push(bytes);
          offset += bytes.length;
        }
        function pushBytes(bytes) {
          chunks.push(bytes);
          offset += bytes.length;
        }
        function startObj(id) {
          xref[id] = offset;
          pushStr(`${id} 0 obj\n`);
        }
        function endObj() {
          pushStr(`\nendobj\n`);
        }

        pushStr("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");

        const numPages = pagesToExport.length;
        startObj(1);
        pushStr(`<< /Type /Catalog /Pages 2 0 R >>`);
        endObj();

        const kidsRefs = pagesToExport.map((_, i) => `${3 + i * 3} 0 R`).join(" ");
        startObj(2);
        pushStr(`<< /Type /Pages /Kids [ ${kidsRefs} ] /Count ${numPages} >>`);
        endObj();

        for (let i = 0; i < numPages; i++) {
          const p = pagesToExport[i];
          const expCanvas = getScaledExportCanvas(p);
          const flat = document.createElement("canvas");
          flat.width = expCanvas.width;
          flat.height = expCanvas.height;
          const fctx = flat.getContext("2d");
          fctx.fillStyle = "#ffffff";
          fctx.fillRect(0, 0, flat.width, flat.height);
          fctx.drawImage(expCanvas, 0, 0);

          const dataUrl = flat.toDataURL("image/jpeg", quality);
          const b64 = dataUrl.split(",")[1];
          const binStr = atob(b64);
          const jpgBytes = new Uint8Array(binStr.length);
          for (let k = 0; k < binStr.length; k++) jpgBytes[k] = binStr.charCodeAt(k);

          const ptW = 595.28;
          const ptH = Math.round((flat.height / flat.width) * 595.28 * 100) / 100;

          const pageObjId = 3 + i * 3;
          const contentObjId = 4 + i * 3;
          const imgObjId = 5 + i * 3;

          const contentCmd = `q\n${ptW} 0 0 ${ptH} 0 0 cm\n/Im${i} Do\nQ\n`;

          startObj(pageObjId);
          pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im${i} ${imgObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>`);
          endObj();

          startObj(contentObjId);
          pushStr(`<< /Length ${contentCmd.length} >>\nstream\n${contentCmd}endstream`);
          endObj();

          startObj(imgObjId);
          pushStr(`<< /Type /XObject /Subtype /Image /Width ${flat.width} /Height ${flat.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgBytes.length} >>\nstream\n`);
          pushBytes(jpgBytes);
          pushStr(`\nendstream`);
          endObj();
        }

        const totalObjs = 3 + numPages * 3;
        const startXrefOffset = offset;
        pushStr(`xref\n0 ${totalObjs}\n0000000000 65535 f \n`);
        for (let id = 1; id < totalObjs; id++) {
          const offStr = String(xref[id]).padStart(10, "0");
          pushStr(`${offStr} 00000 n \n`);
        }
        pushStr(`trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${startXrefOffset}\n%%EOF`);

        return new Blob(chunks, { type: "application/pdf" });
      }

      function generateTiffBlob(canvas, dpi) {
        const w = canvas.width;
        const h = canvas.height;
        const ctx = canvas.getContext("2d");
        const rgba = ctx.getImageData(0, 0, w, h).data;
        const rgbLen = w * h * 3;
        const headerAndIfdSize = 8 + 2 + 12 * 12 + 4 + 16 + 6;
        const buf = new ArrayBuffer(headerAndIfdSize + rgbLen);
        const view = new DataView(buf);
        const bytes = new Uint8Array(buf);

        view.setUint16(0, 0x4949, true);
        view.setUint16(2, 42, true);
        view.setUint32(4, 8, true);

        const numEntries = 12;
        view.setUint16(8, numEntries, true);
        let pos = 10;
        function writeTag(tag, type, count, valOrOffset) {
          view.setUint16(pos, tag, true);
          view.setUint16(pos + 2, type, true);
          view.setUint32(pos + 4, count, true);
          view.setUint32(pos + 8, valOrOffset, true);
          pos += 12;
        }

        const extraOffset = 10 + numEntries * 12 + 4;
        const stripOffset = headerAndIfdSize;

        view.setUint16(extraOffset + 16, 8, true);
        view.setUint16(extraOffset + 18, 8, true);
        view.setUint16(extraOffset + 20, 8, true);

        view.setUint32(extraOffset, dpi, true);
        view.setUint32(extraOffset + 4, 1, true);
        view.setUint32(extraOffset + 8, dpi, true);
        view.setUint32(extraOffset + 12, 1, true);

        writeTag(256, 4, 1, w);
        writeTag(257, 4, 1, h);
        writeTag(258, 3, 3, extraOffset + 16);
        writeTag(259, 3, 1, 1);
        writeTag(262, 3, 1, 2);
        writeTag(273, 4, 1, stripOffset);
        writeTag(277, 3, 1, 3);
        writeTag(278, 4, 1, h);
        writeTag(279, 4, 1, rgbLen);
        writeTag(282, 5, 1, extraOffset);
        writeTag(283, 5, 1, extraOffset + 8);
        writeTag(296, 3, 1, 2);

        view.setUint32(pos, 0, true);

        let dst = stripOffset;
        for (let i = 0; i < w * h; i++) {
          const si = i * 4;
          const a = rgba[si + 3] / 255;
          bytes[dst++] = Math.round(rgba[si] * a + 255 * (1 - a));
          bytes[dst++] = Math.round(rgba[si + 1] * a + 255 * (1 - a));
          bytes[dst++] = Math.round(rgba[si + 2] * a + 255 * (1 - a));
        }

        return new Blob([buf], { type: "image/tiff" });
      }

      function generateSvgBlob(canvas) {
        const pngUrl = canvas.toDataURL("image/png");
        const svgContent = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${canvas.width} ${canvas.height}" width="${canvas.width}" height="${canvas.height}">\n  <image href="${pngUrl}" width="${canvas.width}" height="${canvas.height}" />\n</svg>`;
        return new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
      }

      function formatByteSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
      }

      function triggerBlobDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 500);
      }

      function downloadSinglePageObj(page, overrideFmt, customBaseName) {
        if (!page) return;
        const fmt = overrideFmt || el.exportFormat.value;
        const q = Math.max(0.5, Math.min(1.0, (parseInt(el.exportQualitySlider.value, 10) || 94) / 100));
        const baseName = (customBaseName || page.name || "ScanhoahocABC").trim();
        const expCanvas = getScaledExportCanvas(page);

        if (fmt === "pdf") {
          const blob = generatePdfBlobFromPages([page], q);
          triggerBlobDownload(blob, `${baseName}.pdf`);
          showToast(`Đã lưu PDF (${formatByteSize(blob.size)})!`);
          return;
        }
        if (fmt === "tiff") {
          const scale = parseFloat(el.exportScale.value) || 1;
          const dpi = scale >= 2 ? 600 : scale >= 1.5 ? 300 : 200;
          const blob = generateTiffBlob(expCanvas, dpi);
          triggerBlobDownload(blob, `${baseName}.tif`);
          showToast(`Đã lưu TIFF ${dpi} DPI!`);
          return;
        }
        if (fmt === "svg") {
          const blob = generateSvgBlob(expCanvas);
          triggerBlobDownload(blob, `${baseName}.svg`);
          showToast(`Đã lưu SVG!`);
          return;
        }

        let targetCanvas = expCanvas;
        if (fmt === "jpeg") {
          const flat = document.createElement("canvas");
          flat.width = expCanvas.width;
          flat.height = expCanvas.height;
          const fctx = flat.getContext("2d");
          fctx.fillStyle = "#ffffff";
          fctx.fillRect(0, 0, flat.width, flat.height);
          fctx.drawImage(expCanvas, 0, 0);
          targetCanvas = flat;
        }

        const mime = fmt === "png" ? "image/png" : fmt === "webp" ? "image/webp" : "image/jpeg";
        const ext = fmt === "png" ? "png" : fmt === "webp" ? "webp" : "jpg";
        targetCanvas.toBlob((blob) => {
          if (!blob) return;
          triggerBlobDownload(blob, `${baseName}.${ext}`);
          showToast(`Đã lưu ${baseName}.${ext}!`);
        }, mime, q);
      }

      function handleFilesSelected(fileList) {
        if (!fileList || !fileList.length) return;
        const files = Array.from(fileList);
        files.forEach((file) => {
          if (file.type && !file.type.startsWith("image/")) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement("canvas");
              const maxSide = 1800;
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              if (Math.max(w, h) > maxSide) {
                const sc = maxSide / Math.max(w, h);
                w = Math.round(w * sc);
                h = Math.round(h * sc);
              }
              c.width = w;
              c.height = h;
              c.getContext("2d").drawImage(img, 0, 0, w, h);
              const cleanName = (file.name || `ScanhoahocABC_${state.pages.length + 1}`).replace(/\.[^.]+$/, "");
              addNewPageFromCanvas(c, cleanName, null, null, 0, "");
              showToast(`Đã bắt đối tượng & làm phẳng "${cleanName}"!`);
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function applyCameraZoomValue(zVal) {
        if (!state.cameraStream) return;
        const track = state.cameraStream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== "function") return;
        try {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            const minZ = caps.zoom.min || 1;
            const maxZ = caps.zoom.max || 1;
            const clamped = Math.max(minZ, Math.min(maxZ, zVal));
            await track.applyConstraints({ advanced: [{ zoom: clamped }] });
          }
        } catch (_) {}
      }

      async function applyCameraZoom(targetZoomMode) {
        if (!state.cameraStream) return;
        const track = state.cameraStream.getVideoTracks()[0];
        if (!track || typeof track.getCapabilities !== "function") return;
        try {
          const caps = track.getCapabilities();
          if (caps && caps.zoom) {
            const minZ = caps.zoom.min || 1;
            const maxZ = caps.zoom.max || 1;
            let zVal = minZ;
            if (targetZoomMode === "1") zVal = Math.max(minZ, Math.min(maxZ, 1.0));
            else if (targetZoomMode === "1.5") zVal = Math.max(minZ, Math.min(maxZ, 1.5));
            await track.applyConstraints({ advanced: [{ zoom: zVal }] });
          }
        } catch (_) {}
      }
