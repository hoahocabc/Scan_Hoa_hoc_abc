      async function toggleCameraFlash() {
        if (!state.cameraStream) {
          showToast("Hãy mở máy ảnh trước khi bật đèn.");
          return;
        }
        const nextState = !state.cameraTorchOn;
        const track = state.cameraStream.getVideoTracks()[0];
        let hardwareTorchApplied = false;

        if (track && typeof track.applyConstraints === "function") {
          try {
            const caps = typeof track.getCapabilities === "function" ? track.getCapabilities() : {};
            if (caps && caps.torch) {
              await track.applyConstraints({ advanced: [{ torch: nextState }] });
              hardwareTorchApplied = true;
            } else {
              // Attempt direct torch constraint for mobile browsers that omit torch from getCapabilities
              await track.applyConstraints({ advanced: [{ torch: nextState }] });
              hardwareTorchApplied = true;
            }
          } catch (_) {
            hardwareTorchApplied = false;
          }
        }

        state.cameraTorchOn = nextState;
        state.cameraScreenFlashAssist = nextState && !hardwareTorchApplied;
        syncCameraFlashUI();

        if (nextState) {
          showToast(hardwareTorchApplied ? "⚡ Đã bật đèn Flash máy ảnh!" : "⚡ Đã bật đèn trợ sáng màn hình khi chụp!");
        } else {
          showToast("🔦 Đã tắt đèn chụp ảnh.");
        }
      }

      async function startCamera() {
        stopCamera();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast("Trình duyệt hiện tại không cấp quyền Camera trực tiếp.");
          return;
        }
        try {
          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
              },
              audio: false
            });
          } catch (_) {
            stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });
          }
          state.cameraStream = stream;
          state.cameraTorchOn = false;
          state.cameraScreenFlashAssist = false;
          state.cameraAntiGlareMode = 0;
          syncCameraFlashUI();
          if (el.btnCamAntiGlare) {
            el.btnCamAntiGlare.textContent = "☀ Chống lóa: Tự động";
            el.btnCamAntiGlare.classList.remove("flash-on");
          }
          el.cameraModal.classList.add("open");
          el.cameraVideo.srcObject = stream;
          await el.cameraVideo.play();
          try {
            const vTrack = stream.getVideoTracks()[0];
            if (vTrack && typeof vTrack.getCapabilities === "function" && typeof vTrack.applyConstraints === "function") {
              const caps = vTrack.getCapabilities() || {};
              const adv = {};
              if (Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous")) adv.focusMode = "continuous";
              if (Array.isArray(caps.exposureMode) && caps.exposureMode.includes("continuous")) adv.exposureMode = "continuous";
              if (Array.isArray(caps.whiteBalanceMode) && caps.whiteBalanceMode.includes("continuous")) adv.whiteBalanceMode = "continuous";
              if (Object.keys(adv).length > 0) {
                await vTrack.applyConstraints({ advanced: [adv] }).catch(() => {});
              }
            }
          } catch (_) {}
          runCameraLiveOverlay();
        } catch (err) {
          el.cameraModal.classList.remove("open");
          stopCamera();
          showToast("Không thể mở Camera. Vui lòng cấp quyền Camera cho trình duyệt.");
        }
      }

      function stopCamera() {
        if (state.cameraAnimId) {
          cancelAnimationFrame(state.cameraAnimId);
          state.cameraAnimId = null;
        }
        if (state.cameraStream) {
          state.cameraStream.getTracks().forEach((t) => {
            try {
              if (state.cameraTorchOn && typeof t.applyConstraints === "function") {
                t.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
              }
            } catch (_) {}
            t.stop();
          });
          state.cameraStream = null;
        }
        state.cameraTorchOn = false;
        state.cameraScreenFlashAssist = false;
        syncCameraFlashUI();
      }

      async function triggerCameraTapFocus(clientX, clientY) {
        if (!state.cameraStream || !el.cameraVideoWrap) return;
        const rect = el.cameraVideoWrap.getBoundingClientRect();
        const nx = Math.max(0.05, Math.min(0.95, (clientX - rect.left) / Math.max(1, rect.width)));
        const ny = Math.max(0.05, Math.min(0.95, (clientY - rect.top) / Math.max(1, rect.height)));
        if (el.camFocusRing) {
          el.camFocusRing.style.left = `${(nx * 100).toFixed(1)}%`;
          el.camFocusRing.style.top = `${(ny * 100).toFixed(1)}%`;
          el.camFocusRing.classList.add("show");
          clearTimeout(el.camFocusRing._t);
          el.camFocusRing._t = setTimeout(() => el.camFocusRing.classList.remove("show"), 900);
        }
        const vTrack = state.cameraStream.getVideoTracks()[0];
        if (!vTrack || typeof vTrack.applyConstraints !== "function") return;
        try {
          const caps = typeof vTrack.getCapabilities === "function" ? (vTrack.getCapabilities() || {}) : {};
          const adv = {};
          if (caps.pointsOfInterest) adv.pointsOfInterest = [{ x: nx, y: ny }];
          if (Array.isArray(caps.focusMode) && caps.focusMode.includes("single-shot")) {
            adv.focusMode = "single-shot";
          } else if (Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous")) {
            adv.focusMode = "continuous";
          }
          if (Object.keys(adv).length > 0) {
            await vTrack.applyConstraints({ advanced: [adv] }).catch(() => {});
          }
          if (adv.focusMode === "single-shot" && Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous")) {
            setTimeout(() => {
              if (state.cameraStream && vTrack.readyState === "live") {
                vTrack.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
              }
            }, 1200);
          }
        } catch (_) {}
      }

      function runCameraLiveOverlay() {
        const video = el.cameraVideo;
        const overlay = el.cameraOverlay;
        const octx = overlay.getContext("2d");
        const off = document.createElement("canvas");
        const offCtx = off.getContext("2d", { willReadFrequently: true });
        let frameCount = 0;
        let lastDetectTs = 0;
        state.lastCameraCorners = null;
        state.cameraCaptureLocked = false;
        // 2-slot full-resolution rolling buffer so the exact video frame that produced the visible
        // alignment overlay is always ready at 0ms when the user's finger touches the capture button!
        state.cameraSyncSlots = [
          { canvas: document.createElement("canvas"), corners: null, relJump: 0, ts: 0 },
          { canvas: document.createElement("canvas"), corners: null, relJump: 0, ts: 0 }
        ];
        state.cameraSyncActiveIdx = 0;

        function loop() {
          if (!state.cameraStream || state.cameraCaptureLocked) return;
          if (video.readyState >= 2 && video.videoWidth > 0) {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (overlay.width !== vw) overlay.width = vw;
            if (overlay.height !== vh) overlay.height = vh;
            frameCount++;
            const now = Date.now();
            if (now - lastDetectTs >= 50) {
              lastDetectTs = now;
              const maxSide = 240;
              const sc = Math.min(1, maxSide / Math.max(vw, vh));
              const targetW = Math.max(72, Math.round(vw * sc));
              const targetH = Math.max(72, Math.round(vh * sc));
              if (off.width !== targetW) off.width = targetW;
              if (off.height !== targetH) off.height = targetH;
              offCtx.drawImage(video, 0, 0, targetW, targetH);
              off._cachedImgData = null;

              const corners = detectDocumentCorners(off, true);
              const sx = vw / targetW;
              const sy = vh / targetH;
              const nextCorners = corners.map((p) => ({
                x: Math.round(p.x * sx),
                y: Math.round(p.y * sy)
              }));
              const diag = Math.hypot(vw, vh) || 1000;
              let relJump = 0;
              if (!state.lastCameraCorners) {
                state.lastCameraCorners = nextCorners;
                state._camPendingJump = null;
                state._camPendingCount = 0;
              } else {
                let maxJump = 0;
                for (let idx = 0; idx < 4; idx++) {
                  const dj = Math.hypot(nextCorners[idx].x - state.lastCameraCorners[idx].x, nextCorners[idx].y - state.lastCameraCorners[idx].y);
                  if (dj > maxJump) maxJump = dj;
                }
                relJump = maxJump / diag;
                if (relJump >= 0.065) {
                  // v55.0 3-Frame Outlier Rejection: ignore 1-2 frame noisy glitches; only move after 3 consistent frames!
                  let sameAsPending = false;
                  if (state._camPendingJump) {
                    let pDiff = 0;
                    for (let idx = 0; idx < 4; idx++) {
                      const d = Math.hypot(nextCorners[idx].x - state._camPendingJump[idx].x, nextCorners[idx].y - state._camPendingJump[idx].y);
                      if (d > pDiff) pDiff = d;
                    }
                    sameAsPending = (pDiff / diag) < 0.045;
                  }
                  if (sameAsPending) {
                    state._camPendingCount = (state._camPendingCount || 0) + 1;
                    state._camPendingJump = nextCorners;
                    if (state._camPendingCount >= 2) {
                      state.lastCameraCorners = nextCorners;
                      state._camPendingJump = null;
                      state._camPendingCount = 0;
                    }
                  } else {
                    state._camPendingJump = nextCorners;
                    state._camPendingCount = 1;
                  }
                } else {
                  state._camPendingJump = null;
                  state._camPendingCount = 0;
                  // Deadband lock: rock-steady when holding still (alpha=0.14), smooth tracking when moving (alpha=0.30)
                  if (relJump >= 0.004) {
                    const alpha = relJump < 0.012 ? 0.12 : 0.42;
                    state.lastCameraCorners = state.lastCameraCorners.map((prev, idx) => ({
                      x: Math.round(prev.x * (1.0 - alpha) + nextCorners[idx].x * alpha),
                      y: Math.round(prev.y * (1.0 - alpha) + nextCorners[idx].y * alpha)
                    }));
                  }
                }
              }
              // Only snapshot full-res frame when quad is steady or initializing (eliminates redundant 1080p copies during fast camera panning)
              const nextSlotIdx = 1 - state.cameraSyncActiveIdx;
              const slot = state.cameraSyncSlots[nextSlotIdx];
              if ((relJump < 0.035 && (now - (slot.ts || 0) >= 180)) || !slot.corners) {
                if (slot.canvas.width !== vw) slot.canvas.width = vw;
                if (slot.canvas.height !== vh) slot.canvas.height = vh;
                slot.canvas.getContext("2d").drawImage(video, 0, 0, vw, vh);
                slot.canvas._cachedImgData = null;
                slot.corners = state.lastCameraCorners.map((p) => ({ x: p.x, y: p.y }));
                slot.relJump = relJump;
                slot.ts = Date.now();
                state.cameraSyncActiveIdx = nextSlotIdx;
              }
            }
            octx.clearRect(0, 0, overlay.width, overlay.height);
            if (state.lastCameraCorners) {
              const c = state.lastCameraCorners;
              octx.save();
              octx.fillStyle = "rgba(15, 23, 42, 0.44)";
              octx.beginPath();
              octx.rect(0, 0, overlay.width, overlay.height);
              octx.moveTo(c[0].x, c[0].y);
              octx.lineTo(c[1].x, c[1].y);
              octx.lineTo(c[2].x, c[2].y);
              octx.lineTo(c[3].x, c[3].y);
              octx.closePath();
              octx.fill("evenodd");
              octx.restore();

              octx.strokeStyle = "#ffffff";
              octx.lineWidth = Math.max(4, overlay.width / 200);
              octx.beginPath();
              octx.moveTo(c[0].x, c[0].y);
              octx.lineTo(c[1].x, c[1].y);
              octx.lineTo(c[2].x, c[2].y);
              octx.lineTo(c[3].x, c[3].y);
              octx.closePath();
              octx.stroke();
            }
          }
          state.cameraAnimId = requestAnimationFrame(loop);
        }
        loop();
      }

      function rotateCurrentPage(dir) {
        const page = getCurrentPage();
        if (!page) return;
        const sC = page.srcCanvas;
        const rot = document.createElement("canvas");
        rot.width = sC.height;
        rot.height = sC.width;
        const rctx = rot.getContext("2d");
        rctx.save();
        if (dir > 0) {
          rctx.translate(rot.width, 0);
          rctx.rotate(Math.PI / 2);
        } else {
          rctx.translate(0, rot.height);
          rctx.rotate(-Math.PI / 2);
        }
        rctx.drawImage(sC, 0, 0);
        rctx.restore();

        page.srcCanvas = rot;
        page.corners = detectDocumentCorners(rot);
        page.edgeOffsets = rot._detectedEdgeOffsets ? cloneEdgeOffsets(rot._detectedEdgeOffsets) : createZeroEdgeOffsets();
        updateGeometryAndProcess(page);
        resetStageZoom();
        resetFsZoom();
        renderPageList();
        renderStage();
        if (el.fullScreenEditorModal.classList.contains("open")) {
          renderFullScreenEditor();
        }
      }

          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);

          applyStageTransform();

          if (!page) return;
          if (evt.touches && evt.touches.length === 2) {
            hideHoldPanRing();
            state.draggingHandle = null;
            const t0 = evt.touches[0], t1 = evt.touches[1];
            const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
            const stRect = el.stageContainer.getBoundingClientRect();
            state.pinchState = {
              target: "stage",
              startDist: Math.max(12, dist),
              startZoom: state.stageZoom,
              startPanX: state.stagePanX,
              startPanY: state.stagePanY,
              startMidX: (t0.clientX + t1.clientX) * 0.5,
              startMidY: (t0.clientY + t1.clientY) * 0.5,
              centerX: stRect.left + stRect.width * 0.5,
              centerY: stRect.top + stRect.height * 0.5
            };
            evt.preventDefault();
          } else if (evt.touches && evt.touches.length === 1) {
            if (Date.now() < state.pinchCooldownUntil) {
              evt.preventDefault();

            const t0 = evt.touches[0];

            const now = Date.now();

              evt.preventDefault();

            state.lastTapTime = now;
            state.lastTapX = t0.clientX;

            const spine = page.spineDivider || page.srcCanvas._detectedSpine || detectBookSpineDivider(page.srcCanvas, page.corners) || {

              t: 0.5
            };
            const c = page.corners;
            const eOff = page.edgeOffsets || createZeroEdgeOffsets();
            const st = spine.t;
            let p1Corners, p2Corners;
            if (spine.orientation === "vertical") {
              const tTop = evalEdge3PointOffset(eOff[0], st);
              const tBot = evalEdge3PointOffset(eOff[2], 1.0 - st);
              const mTop = { x: Math.round(c[0].x * (1 - st) + c[1].x * st + tTop.x), y: Math.round(c[0].y * (1 - st) + c[1].y * st + tTop.y) };

              p1Corners = [{ ...c[0] }, mTop, mBot, { ...c[3] }];
              p2Corners = [{ ...mTop }, { ...c[1] }, { ...c[2] }, { ...mBot }];

              const tLeft = evalEdge3PointOffset(eOff[3], 1.0 - st);

              const mLeft = { x: Math.round(c[0].x * (1 - st) + c[3].x * st + tLeft.x), y: Math.round(c[0].y * (1 - st) + c[3].y * st + tLeft.y) };

              p1Corners = [{ ...c[0] }, { ...c[1] }, mRight, mLeft];
              p2Corners = [{ ...mLeft }, { ...mRight }, { ...c[2] }, { ...c[3] }];

          }
          syncAlignModeButtons();
          renderFullScreenEditor();
          showToast("Chế độ Căn 4 góc (4 điểm ở 4 góc)!");
        });

        el.btnAlignModeMultiPt.addEventListener("click", () => {
          state.alignPointMode = "multipt";
          syncAlignModeButtons();

          showToast("Chế độ Căn đa điểm (5 điểm uốn mỗi cạnh)!");

        el.btnCloseExportPopup.addEventListener("click", () => el.exportPopupModal.classList.remove("open"));

        });
        el.btnConfirmExportNow.addEventListener("click", executeConfirmedExportFromPopup);


        // =====================================================================
        // SMARTPHONE UX GUARD 1: COMPLETE POPUP TOUCH & SCROLL ISOLATION
        // Prevents any touch, swipe, scroll, or wheel inside popups/toolbars
        // from ever panning, zooming, or affecting the document image below.
        // =====================================================================
        function initPopupTouchIsolation() {
          const isolatedContainers = [
            el.editDropdownMenu,
            el.fsCropBar,
            el.libraryModal,
            el.exportPopupModal,
            el.cameraModal,
            el.fsBottomArea,
            (typeof document.querySelector === "function" ? document.querySelector(".fs-top-bar") : null)
          ].filter(Boolean);

          isolatedContainers.forEach((container) => {
            ["touchstart", "mousedown", "pointerdown", "wheel"].forEach((evtName) => {
              container.addEventListener(evtName, (evt) => {
                cancelActiveStageInteractions();
                evt.stopPropagation();
              }, { passive: true });
            });

            ["touchmove", "touchend", "touchcancel"].forEach((evtName) => {
              container.addEventListener(evtName, (evt) => {
                if (state.draggingHandle && (state.draggingHandle.type === "fs_pan" || state.draggingHandle.type === "stage_pan")) {
                  cancelActiveStageInteractions();
                }
                if (state.pinchState) {
                  state.pinchState = null;
                }
                evt.stopPropagation();
              }, { passive: true });
            });
          });
        }

        // =====================================================================
        // SMARTPHONE UX GUARD 2: THUMB-ONLY SLIDER INTERACTION
        // Sliders (<input type="range">) ONLY change value when the user touches
        // directly on the circular thumb (điểm tròn, within ±18px of thumb center).
        // Touching or swiping across the slider track while scrolling a popup
        // keeps the slider value 100% locked and smoothly scrolls the popup!
        // =====================================================================
        function getSliderThumbCenterX(slider) {
          const rect = slider.getBoundingClientRect();
          const min = parseFloat(slider.min);
          const max = parseFloat(slider.max);
          const minVal = Number.isFinite(min) ? min : 0;
          const maxVal = Number.isFinite(max) ? max : 100;
          const rawVal = parseFloat(slider._lockedValue !== undefined ? slider._lockedValue : slider.value);
          const curVal = Number.isFinite(rawVal) ? rawVal : minVal;
          const span = (maxVal - minVal) || 1;
          const ratio = Math.max(0, Math.min(1, (curVal - minVal) / span));
          const thumbRadius = 11; // 22px circular thumb diameter -> 11px radius
          const usableW = Math.max(1, (rect.width || 180) - thumbRadius * 2);
          return (rect.left || 0) + thumbRadius + ratio * usableW;
        }

        function computeSliderValueFromClientX(slider, clientX) {
          const rect = slider.getBoundingClientRect();
          const min = parseFloat(slider.min);
          const max = parseFloat(slider.max);
          const step = parseFloat(slider.step);
          const minVal = Number.isFinite(min) ? min : 0;
          const maxVal = Number.isFinite(max) ? max : 100;
          const stepVal = (Number.isFinite(step) && step > 0) ? step : 1;
          const thumbRadius = 11;
          const usableW = Math.max(1, (rect.width || 180) - thumbRadius * 2);
          const ratio = Math.max(0, Math.min(1, (clientX - ((rect.left || 0) + thumbRadius)) / usableW));
          let val = minVal + ratio * (maxVal - minVal);
          val = Math.round((val - minVal) / stepVal) * stepVal + minVal;
          return Math.max(minVal, Math.min(maxVal, val));
        }

        function initThumbOnlySliders() {
          const sliders = [
            el.ddBookCurveSlider,
            el.ddBrightnessSlider,
            el.ddSharpnessSlider,
            el.ddCleanSlider,
            el.ddNoteSizeSlider,
            el.exportQualitySlider
          ].filter(Boolean);

          const protoDesc = typeof HTMLInputElement !== "undefined"
            ? Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value")
            : null;

          sliders.forEach((slider) => {
            const getRawVal = () => (protoDesc && protoDesc.get) ? protoDesc.get.call(slider) : slider.getAttribute("value") || "0";
            const setRawVal = (v) => {
              const s = String(v);
              if (protoDesc && protoDesc.set) {
                protoDesc.set.call(slider, s);
              } else {
                slider.setAttribute("value", s);
              }
            };

            slider._lockedValue = String(slider.value ?? "0");
            slider._thumbActive = false;
            slider._allowProgrammaticInput = false;
            const THUMB_HIT_RADIUS_PX = 18;

            // Wrap slider.value property so programmatic writes (e.g. slider.value = 0)
            // automatically update _lockedValue, while accidental native track taps are blocked!
            if (protoDesc && protoDesc.get && protoDesc.set) {
              Object.defineProperty(slider, "value", {
                configurable: true,
                enumerable: true,
                get() {
                  return getRawVal();
                },
                set(v) {
                  const s = String(v);
                  slider._lockedValue = s;
                  setRawVal(s);
                }
              });
            }

            // Capture-phase guard on input & change: block ANY value change when thumb was not grabbed!
            ["input", "change"].forEach((evtType) => {
              slider.addEventListener(evtType, (evt) => {
                if (!slider._thumbActive && !slider._allowProgrammaticInput) {
                  setRawVal(slider._lockedValue);
                  evt.stopImmediatePropagation();
                  if (evt.cancelable) evt.preventDefault();
                } else {
                  slider._lockedValue = String(getRawVal());
                }
              }, true);
            });

            // Touch Start on Slider: check if finger landed directly on the circular thumb!
            slider.addEventListener("touchstart", (evt) => {
              cancelActiveStageInteractions();
              evt.stopPropagation();
              if (!evt.touches || evt.touches.length !== 1) {
                slider._thumbActive = false;
                slider.classList.remove("thumb-dragging");
                setRawVal(slider._lockedValue);
                return;
              }
              const t0 = evt.touches[0];
              const thumbX = getSliderThumbCenterX(slider);
              const distToThumb = Math.abs(t0.clientX - thumbX);

              if (distToThumb <= THUMB_HIT_RADIUS_PX) {
                // Finger touched directly on the circular thumb!
                slider._thumbActive = true;
                slider._trackScrollParent = null;
                slider.classList.add("thumb-dragging");
              } else {
                // Finger touched the track away from the thumb (e.g., while swiping popup!)
                slider._thumbActive = false;
                slider.classList.remove("thumb-dragging");
                setRawVal(slider._lockedValue);
                const scrollParent = slider.closest(".edit-vertical-popup, .modal-body");
                slider._trackScrollParent = scrollParent || null;
                slider._trackStartY = t0.clientY;
                slider._trackStartScrollTop = scrollParent ? scrollParent.scrollTop : 0;
              }
            }, { passive: true });

            slider.addEventListener("touchmove", (evt) => {
              evt.stopPropagation();
              if (!evt.touches || evt.touches.length !== 1) return;
              const t0 = evt.touches[0];

              if (slider._thumbActive) {
                // Actively dragging the circular thumb: lock vertical popup scroll and update value smoothly!
                if (evt.cancelable) evt.preventDefault();
                const newVal = computeSliderValueFromClientX(slider, t0.clientX);
                const newStr = String(newVal);
                if (getRawVal() !== newStr || slider._lockedValue !== newStr) {
                  slider._lockedValue = newStr;
                  setRawVal(newStr);
                  slider._allowProgrammaticInput = true;
                  slider.dispatchEvent(new Event("input", { bubbles: true }));
                  slider._allowProgrammaticInput = false;
                }
              } else {
                // Not on thumb: keep slider value 100% locked and scroll parent popup vertically!
                setRawVal(slider._lockedValue);
                if (slider._trackScrollParent) {
                  const dy = t0.clientY - slider._trackStartY;
                  slider._trackScrollParent.scrollTop = slider._trackStartScrollTop - dy;
                }
              }
            }, { passive: false });

            const onTouchEndOrCancel = (evt) => {
              evt.stopPropagation();
              if (slider._thumbActive) {
                slider._thumbActive = false;
                slider.classList.remove("thumb-dragging");
                slider._lockedValue = String(getRawVal());
                slider._allowProgrammaticInput = true;
                slider.dispatchEvent(new Event("change", { bubbles: true }));
                slider._allowProgrammaticInput = false;
              } else {
                setRawVal(slider._lockedValue);
              }
              slider._trackScrollParent = null;
            };
            slider.addEventListener("touchend", onTouchEndOrCancel, { passive: true });
            slider.addEventListener("touchcancel", onTouchEndOrCancel, { passive: true });

            // Mouse / Pointer Support: also enforce thumb-only dragging on mouse/pen
            slider.addEventListener("mousedown", (evt) => {
              cancelActiveStageInteractions();
              evt.stopPropagation();
              const thumbX = getSliderThumbCenterX(slider);
              const distToThumb = Math.abs(evt.clientX - thumbX);
              if (distToThumb <= THUMB_HIT_RADIUS_PX) {
                slider._thumbActive = true;
                slider.classList.add("thumb-dragging");
              } else {
                slider._thumbActive = false;
                slider.classList.remove("thumb-dragging");
                setRawVal(slider._lockedValue);
                if (evt.cancelable) evt.preventDefault();
              }
            });

            window.addEventListener("mousemove", (evt) => {
              if (!slider._thumbActive) return;
              const newVal = computeSliderValueFromClientX(slider, evt.clientX);
              const newStr = String(newVal);
              if (getRawVal() !== newStr || slider._lockedValue !== newStr) {
                slider._lockedValue = newStr;
                setRawVal(newStr);
                slider._allowProgrammaticInput = true;
                slider.dispatchEvent(new Event("input", { bubbles: true }));
                slider._allowProgrammaticInput = false;
              }
            });

            window.addEventListener("mouseup", () => {
              if (!slider._thumbActive) return;
              slider._thumbActive = false;
              slider.classList.remove("thumb-dragging");
              slider._lockedValue = String(getRawVal());
              slider._allowProgrammaticInput = true;
              slider.dispatchEvent(new Event("change", { bubbles: true }));
              slider._allowProgrammaticInput = false;
            });
          });
        }

        initPopupTouchIsolation();
        initThumbOnlySliders();

        // Tap outside modal-card on backdrop to close popups naturally on touchscreen
        [el.libraryModal, el.exportPopupModal].forEach((modalEl) => {
          modalEl.addEventListener("click", (e) => {
            if (e.target === modalEl) {
              if (modalEl === el.libraryModal) exitMultiSelectMode();
              modalEl.classList.remove("open");
            }
          });
        });

        // Camera Button ("📷 Chụp ảnh" — Opens Full-Screen Live Camera Viewfinder)
        el.btnOpenCamera.addEventListener("click", () => {
          startCamera();
        });
        if (el.btnCancelCameraBottom) {
          el.btnCancelCameraBottom.addEventListener("click", () => {
            el.cameraModal.classList.remove("open");
            stopCamera();
          });
        }
        if (el.btnToggleFlash) {
          el.btnToggleFlash.addEventListener("click", () => {
            toggleCameraFlash();
          });
        }
        if (el.btnCamTorchFloating) {
          el.btnCamTorchFloating.addEventListener("click", () => {
            toggleCameraFlash();
          });
        }
        if (el.btnCamAntiGlare) {
          el.btnCamAntiGlare.addEventListener("click", () => {
            toggleCameraAntiGlare();
          });
        }
        el.cameraVideoWrap.addEventListener("click", (e) => {
          if (e.target && e.target.closest("button")) return;
          triggerCameraTapFocus(e.clientX, e.clientY);
        });

        [el.btnZoomMin, el.btnZoom1x, el.btnZoom15x].forEach((zBtn) => {
          zBtn.addEventListener("click", () => {
            [el.btnZoomMin, el.btnZoom1x, el.btnZoom15x].forEach((b) => b.classList.remove("active"));
            zBtn.classList.add("active");
            applyCameraZoom(zBtn.getAttribute("data-zoom"));
          });
        });

        let camPinchStartDist = 0;
        let camCurrentZoom = 1.0;
        el.cameraVideoWrap.addEventListener("touchstart", (e) => {
          if (e.touches && e.touches.length === 2) {
            camPinchStartDist = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            e.preventDefault();
          }
        }, { passive: false });
        el.cameraVideoWrap.addEventListener("touchmove", (e) => {
          if (e.touches && e.touches.length === 2 && camPinchStartDist > 10) {
            const dist = Math.hypot(
              e.touches[1].clientX - e.touches[0].clientX,
              e.touches[1].clientY - e.touches[0].clientY
            );
            camCurrentZoom = Math.max(0.5, Math.min(3.0, camCurrentZoom * (dist / camPinchStartDist)));
            camPinchStartDist = dist;
            applyCameraZoomValue(camCurrentZoom);
            e.preventDefault();
          }
        }, { passive: false });

        async function triggerInstantCameraCapture(evt) {
          if (state.cameraCaptureLocked) {
            if (evt && evt.cancelable) evt.preventDefault();
            return;
          }
          const video = el.cameraVideo;
          if (!video || !video.videoWidth) return;

          // Lock immediately at t=0ms on touchstart/pointerdown so thumb press/release shake never shifts the photo!
          state.cameraCaptureLocked = true;
          if (state.cameraAnimId) {
            cancelAnimationFrame(state.cameraAnimId);
            state.cameraAnimId = null;
          }
          if (evt && evt.type === "touchstart" && evt.cancelable) {
            evt.preventDefault();
          }

          const vw = video.videoWidth;
          const vh = video.videoHeight;
          const fallbackCanvas = document.createElement("canvas");
          fallbackCanvas.width = vw;
          fallbackCanvas.height = vh;

          let chosenSlot = null;
          if (state.cameraSyncSlots && state.cameraSyncSlots.length === 2) {
            const latest = state.cameraSyncSlots[state.cameraSyncActiveIdx];
            const prev = state.cameraSyncSlots[1 - state.cameraSyncActiveIdx];
            const now = Date.now();
            if (latest && latest.corners && (now - latest.ts < 350)) {
              if (prev && prev.corners && (now - prev.ts < 350) && latest.relJump > 0.022 && prev.relJump < 0.012) {
                chosenSlot = prev;
              } else {
                chosenSlot = latest;
              }
            }
          }

          let seedCorners = null;
          if (chosenSlot && chosenSlot.canvas.width === vw && chosenSlot.canvas.height === vh) {
            fallbackCanvas.getContext("2d").drawImage(chosenSlot.canvas, 0, 0);
            seedCorners = chosenSlot.corners.map((p) => ({ x: p.x, y: p.y }));
          } else {
            fallbackCanvas.getContext("2d").drawImage(video, 0, 0);
            if (state.lastCameraCorners) {
              seedCorners = state.lastCameraCorners.map((p) => ({ x: p.x, y: p.y }));
            }
          }

          // v43.0 HD Still Capture: Prefer native ImageCapture.takePhoto() (full sensor ISP, HDR, sharp optics)
          // raced with a 900ms guard so it never hangs, falling back seamlessly to the 4K/full-res video frame.
          let finalCanvas = fallbackCanvas;
          const vTrack = state.cameraStream ? state.cameraStream.getVideoTracks()[0] : null;
          if (vTrack && vTrack.readyState === "live" && typeof window.ImageCapture === "function") {
            showToast("📸 Đang chụp ảnh độ nét cao...");
            try {
              const ic = new window.ImageCapture(vTrack);
              const photoBlob = await Promise.race([
                ic.takePhoto(),
                new Promise((_, rej) => setTimeout(() => rej(new Error("takePhoto_timeout")), 550))
              ]);
              if (photoBlob && photoBlob.size > 0) {
                let bmp = null;
                if (typeof createImageBitmap === "function") {
                  bmp = await createImageBitmap(photoBlob);
                }
                const srcW = bmp ? bmp.width : 0;
                const srcH = bmp ? bmp.height : 0;
                if (bmp && srcW >= Math.min(vw, vh)) {
                  const maxCapSide = 2200;
                  let tw = srcW, th = srcH;
                  if (Math.max(tw, th) > maxCapSide) {
                    const sc = maxCapSide / Math.max(tw, th);
                    tw = Math.round(tw * sc);
                    th = Math.round(th * sc);
                  }
                  const hdCanvas = document.createElement("canvas");
                  hdCanvas.width = tw;
                  hdCanvas.height = th;
                  hdCanvas.getContext("2d").drawImage(bmp, 0, 0, tw, th);
                  if (typeof bmp.close === "function") bmp.close();
                  // v44.0: Always run full Stage 1 + Stage 2 on takePhoto() HD still because camera still-photo FOV/EIS crop differs from live video preview!
                  seedCorners = null;
                  finalCanvas = hdCanvas;
                } else if (bmp && typeof bmp.close === "function") {
                  bmp.close();
                }
              }
            } catch (_) {
              finalCanvas = fallbackCanvas;
            }
          }

          el.cameraModal.classList.remove("open");
          stopCamera();
          showToast("⚡ Đang dàn phẳng & làm nét tài liệu HD...");
          const nextScanName = `Scan_${state.pages.length + 1}`;
          setTimeout(() => {
            const capturedCorners = detectDocumentCorners(finalCanvas, false, null);
            addNewPageFromCanvas(finalCanvas, nextScanName, capturedCorners, null, 0, "");
            showToast("Đã chụp ảnh HD, làm nét và lưu vào Thư viện!");
          }, 16);
        }

        el.btnCapturePhoto.addEventListener("touchstart", triggerInstantCameraCapture, { passive: false });
        el.btnCapturePhoto.addEventListener("pointerdown", (evt) => {
          if (evt.pointerType === "mouse" && evt.button !== 0) return;
          triggerInstantCameraCapture(evt);
        });
        el.btnCapturePhoto.addEventListener("click", triggerInstantCameraCapture);
      }

      // =========================================================================
      // 11. INITIALIZATION
      // =========================================================================
      async function initApp() {
        initEvents();
        const saved = await idbLoadAll();
        if (saved && saved.pages && saved.pages.length > 0) {
          state.pages = saved.pages.map((rec) => ({
            id: rec.id,
            name: rec.name || "ScanhoahocABC",
            createdAt: rec.createdAt || formatTimeStr(new Date()),
            note: rec.note || "",
            noteX: typeof rec.noteX === "number" ? rec.noteX : 0.50,
            noteY: typeof rec.noteY === "number" ? rec.noteY : 0.88,
            noteSize: rec.noteSize || 28,
            noteColor: rec.noteColor || "#dc2626",
            noteHasBg: rec.noteHasBg !== false,
            noteBgColor: rec.noteBgColor || "#ffffff",
            noteHasBorder: rec.noteHasBorder !== false,
            noteBorderColor: rec.noteBorderColor || rec.noteColor || "#dc2626",
            includeNoteOnExport: rec.includeNoteOnExport !== false,
            srcCanvas: null,
            _storedSrcBlob: rec.srcBlob,
            _thumbDataUrl: rec.thumbDataUrl || "",
            corners: rec.corners ? rec.corners.map((p) => ({ x: p.x, y: p.y })) : null,
            edgeOffsets: rec.edgeOffsets ? cloneEdgeOffsets(rec.edgeOffsets) : createZeroEdgeOffsets(),
            dewarpedCanvas: null,
            filterCache: null,
            processedCanvas: null,
            settings: cloneSettings(rec.settings || state.defaultSettings)
          }));
          const savedIdx = typeof saved.meta.currentPageIndex === "number" ? saved.meta.currentPageIndex : (state.pages.length - 1);
          state.currentPageIndex = Math.max(0, Math.min(state.pages.length - 1, savedIdx));
          const activePage = getCurrentPage();
          await ensurePageHydrated(activePage);
          resetStageZoom();
          syncControlsFromPage(activePage);
          renderPageList();
          renderStage(true);
          showToast(`Đã khôi phục ${state.pages.length} ảnh từ lần làm việc trước!`);
          return;
        }
        if (saved && saved.meta && saved.meta.hasUserClearedAll) {
          state.pages = [];
          state.currentPageIndex = -1;
          syncControlsFromPage(null);
          renderPageList();
          renderStage(true);
          return;
        }
        const c = createInitialSampleCanvas();
        addNewPageFromCanvas(c, "ScanhoahocABC_1", null, null, 0, "");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
