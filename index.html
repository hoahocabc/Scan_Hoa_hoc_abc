<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover" />
  <title>ScanhoahocABC</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="ScanhoahocABC (v27.0) — Ứng dụng quét tài liệu chuyên nghiệp trên smartphone: Bắt rìa sub-pixel, dàn phẳng trang sách & nắn thẳng song song các dòng chữ cong, thanh công cụ ba gạch (☰) gọn nhẹ không che khuất ảnh." />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
      --primary-soft: rgba(37, 99, 235, 0.18);
      --primary-border: rgba(96, 165, 250, 0.38);
      --accent-cyan: #38bdf8;
      --danger-soft: rgba(239, 68, 68, 0.18);
      --danger-text: #fca5a5;
      --danger-border: rgba(248, 113, 113, 0.40);
      --bg: #090d16;
      --glass-bg: rgba(15, 23, 42, 0.72);
      --glass-bg-strong: rgba(15, 23, 42, 0.82);
      --glass-border: rgba(148, 163, 184, 0.30);
      --text: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* 1. MODERN TWO-TIER HEADER: Sleek Indigo-Slate Glass Gradient */
    .app-header {
      flex-shrink: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #1d4ed8 100%);
      color: #ffffff;
      padding: 7px 10px 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      border-bottom: 1px solid rgba(147, 197, 253, 0.24);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.38);
      z-index: 40;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
      color: #f8fafc;
    }

    .header-btn-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    /* TOUCH-OPTIMIZED ZERO-OVERFLOW BUTTON SYSTEM */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 40px;
      padding: 0 6px;
      border-radius: 11px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
      white-space: nowrap;
      min-width: 0;
      line-height: 1.1;
      border: 1px solid transparent;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.38;
      pointer-events: none;
    }

    .btn-main {
      background: var(--primary-gradient);
      color: #ffffff;
      border-color: rgba(125, 211, 252, 0.40);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.34);
    }

    .btn-sec {
      background: rgba(30, 41, 59, 0.78);
      color: #e0f2fe;
      border-color: rgba(148, 163, 184, 0.34);
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }

    .btn-sec.active {
      background: var(--primary-gradient);
      color: #ffffff;
      border-color: rgba(125, 211, 252, 0.50);
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.32);
    }

    .btn-hdr-primary {
      background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
      color: #1d4ed8;
      border-color: #ffffff;
      height: 37px;
      font-size: 0.76rem;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.20);
    }

    .btn-hdr-outline {
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f8fafc;
      border-color: rgba(186, 230, 253, 0.38);
      height: 37px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    /* 2. DOCUMENT STAGE VIEWPORT & SUB-IMAGE METADATA BAR */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .stage-panel {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 40%, #162238 0%, #090d16 100%);
      overflow: hidden;
    }

    .stage-container {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
      touch-action: none;
    }

    .canvas-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      transform-origin: center center;
      will-change: transform;
    }

    #mainCanvas {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - 230px);
      width: auto;
      height: auto;
      touch-action: none;
      border-radius: 4px;
    }

    /* Secondary Metadata Bar Directly Below Image */
    .under-image-bar {
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.90);
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 25;
    }

    .under-image-inner {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .under-meta-text {
      font-size: 0.72rem;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
      text-align: center;
    }

    .stage-mini-btn {
      height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.40);
      background: rgba(37, 99, 235, 0.28);
      color: #f8fafc;
      font-size: 0.70rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 3. MODERN GLASS BOTTOM DOCK: ONLY 3 BUTTONS ("✨ Sửa", "⬇ Tải ảnh", "📄 Lưu PDF") */
    .bottom-dock {
      flex-shrink: 0;
      width: 100%;
      max-width: 100vw;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(148, 163, 184, 0.20);
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 35;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
    }

    .dock-inner {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      width: 100%;
    }

    /* ========================================================================= */
    /* 4. FULL-SCREEN EDITOR & UNIFIED SEMI-TRANSPARENT VERTICAL POPUPS          */
    /*    - Both #editDropdownMenu (☰) and #fsCropBar (Căn chỉnh) use the exact  */
    /*      same 1/3-screen vertical frosted-glass popup architecture!           */
    /* ========================================================================= */
    .fs-editor-backdrop {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #162238 0%, #090d16 100%);
      display: none;
      flex-direction: column;
      z-index: 130;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    .fs-editor-backdrop.open {
      display: flex;
    }

    /* Top Bar in Full-Screen Editor */
    .fs-top-bar {
      flex-shrink: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.20);
      padding: 6px 10px;
      z-index: 168;
    }

    .fs-top-bar-inner {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    /* Iconic Corner Hamburger Button (☰) at Top-Left — No redundant text label */
    .fs-corner-hamburger {
      width: 40px;
      height: 36px;
      padding: 0;
      border-radius: 10px;
      background: var(--primary-gradient);
      color: #ffffff;
      border: 1px solid rgba(186, 230, 253, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(37, 99, 235, 0.35);
      transition: all 0.14s ease;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .fs-top-center-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Paired Action Row inside Vertical Popups (e.g. "✕ Hủy" beside "✓ Áp dụng") */
    .vpop-pair-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
    }

    .vpop-pair-row .vpop-action-btn,
    .vpop-pair-row .dd-mode-btn {
      justify-content: center;
      padding: 0 6px;
    }

    .fs-corner-hamburger:active {
      transform: scale(0.95);
    }

    .fs-corner-hamburger.open {
      background: rgba(56, 189, 248, 0.22);
      color: #38bdf8;
      border-color: #38bdf8;
    }

    /* Compact Right Nav & Close Group at Top-Right (Never overflows even on 320px!) */
    .fs-corner-right-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .fs-corner-btn {
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.10);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.28);
      font-size: 0.76rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .fs-corner-btn:disabled {
      opacity: 0.32;
      pointer-events: none;
    }

    /* UNIFIED SEMI-TRANSPARENT VERTICAL POPUP (~1/3 OF SMARTPHONE SCREEN) */
    .edit-vertical-popup {
      position: absolute;
      top: 52px;
      left: 10px;
      width: clamp(204px, 50vw, 244px);
      max-height: calc(100dvh - 154px);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(165%);
      -webkit-backdrop-filter: blur(14px) saturate(165%);
      color: #f8fafc;
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.52);
      padding: 9px;
      display: none;
      flex-direction: column;
      gap: 5px;
      z-index: 166;
      transition: opacity 0.14s ease;
    }

    .edit-vertical-popup.open,
    .edit-vertical-popup.visible {
      display: flex;
      animation: popSlideIn 0.15s ease-out;
    }

    /* Automatically fades when finger is dragging a corner handle on touchscreen! */
    .edit-vertical-popup.dragging-fade {
      opacity: 0.14;
      pointer-events: none;
    }

    @keyframes popSlideIn {
      from { opacity: 0; transform: translateY(-5px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .vpop-section-lbl {
      font-size: 0.66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.45px;
      color: #7dd3fc;
      padding: 3px 4px 1px 4px;
      white-space: nowrap;
    }

    .vpop-divider {
      height: 1px;
      background: rgba(148, 163, 184, 0.22);
      margin: 2px 0;
      flex-shrink: 0;
    }

    /* Vertical List Item Button (1 per row from top to bottom, zero overflow) */
    .dd-mode-btn, .vpop-action-btn {
      width: 100%;
      height: 35px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.09);
      color: #f8fafc;
      font-size: 0.77rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.12s ease, background 0.14s ease;
      touch-action: manipulation;
    }

    .dd-mode-btn:active, .vpop-action-btn:active {
      transform: scale(0.97);
    }

    .dd-mode-btn.active, .vpop-action-btn.primary-item {
      background: var(--primary-gradient);
      color: #ffffff;
      border-color: rgba(125, 211, 252, 0.55);
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
    }

    .vpop-action-btn.danger-item {
      background: var(--danger-soft);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }

    /* Touch-Optimized Vertical Slider Item inside Semi-Transparent Popup */
    .vpop-slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      padding: 6px 8px 7px 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .vpop-slider-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .vpop-slider-lbl {
      font-size: 0.73rem;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
    }

    .vpop-slider-val {
      font-size: 0.73rem;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Large tactile thumb & pan-x touch action for effortless mobile slider dragging */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 22px;
      background: transparent;
      cursor: pointer;
      touch-action: pan-x;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.40);
      margin-top: -7px;
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.40);
    }

    .vpop-mini-reset {
      background: rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Compact Vertical Inputs inside Semi-Transparent Popup */
    .vpop-input {
      width: 100%;
      height: 33px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(15, 23, 42, 0.60);
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 600;
      font-family: inherit;
      flex-shrink: 0;
    }

    .vpop-input::placeholder {
      color: #94a3b8;
    }

    .vpop-note-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
    }

    .vpop-note-input-wrap .vpop-input {
      padding-right: 28px;
    }

    .vpop-note-clear {
      position: absolute;
      right: 5px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #cbd5e1;
      font-size: 0.70rem;
      font-weight: 800;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .vpop-note-clear.visible {
      display: inline-flex;
    }

    .vpop-color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 3px 2px;
      width: 100%;
      flex-shrink: 0;
    }

    .note-color-swatch {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      padding: 0;
      transition: transform 0.12s ease, border-color 0.12s ease;
      flex-shrink: 0;
    }

    .note-color-swatch.active {
      border-color: #ffffff;
      transform: scale(1.16);
      box-shadow: 0 0 0 2px #38bdf8;
    }

    .vpop-check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.73rem;
      font-weight: 700;
      color: #e2e8f0;
      padding: 3px 4px;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .vpop-check-row input {
      width: 15px;
      height: 15px;
      accent-color: #38bdf8;
      flex-shrink: 0;
    }

    /* Full-Screen Image Viewport */
    .fs-stage-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
      touch-action: none;
      background: transparent;
    }

    .fs-canvas-holder {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      transform-origin: center center;
      will-change: transform;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 6px;
    }

    #fsCanvas {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - 146px);
      width: auto;
      height: auto;
      touch-action: none;
      border-radius: 4px;
    }

    /* Smart Magnifier Loupe */
    .magnifier-loupe {
      position: absolute;
      width: 114px;
      height: 114px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      overflow: hidden;
      display: none;
      z-index: 170;
      background: #000;
    }

    .magnifier-loupe canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .magnifier-label {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      color: #38bdf8;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 99px;
      white-space: nowrap;
    }

    /* Secondary Info & Bottom Bar directly below the Full-Screen Image */
    .fs-bottom-area {
      flex-shrink: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(148, 163, 184, 0.20);
      padding: 6px 10px calc(7px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 140;
    }

    .fs-meta-strip {

      function cloneSettings(s) {
        return JSON.parse(JSON.stringify(s || state.defaultSettings));
      }

      function getCurrentPage() {
        if (state.currentPageIndex < 0 || state.currentPageIndex >= state.pages.length) return null;
        return state.pages[state.currentPageIndex] || null;
      }

      function formatTimeStr(dateObj) {
        const d = dateObj || new Date();
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const mo = String(d.getMonth() + 1).padStart(2, "0");
        return `${hh}:${mm} • ${dd}/${mo}/${d.getFullYear()}`;
      }

      function describeAspectRatio(w, h) {
        if (!w || !h) return "Chuẩn";
        const r = h / w;
        if (Math.abs(r - 1.414) < 0.08) return "1:1.41 (A4)";
        if (Math.abs(r - 0.707) < 0.08) return "1.41:1 (A4 Ngang)";
        return `1:${r.toFixed(2)}`;
      }

      function getModeLabel(mode) {
        if (mode === "magic_color") return "Tài liệu màu";
        if (mode === "bw_sauvola") return "Đen trắng";
        if (mode === "faint_boost") return "Làm rõ chữ";
        return "Ảnh gốc";
      }

      // =========================================================================
      // 2. ZOOM & PAN FOR MAIN STAGE AND FULL-SCREEN EDITOR
      // =========================================================================
      function applyStageTransform() {
        if (Math.abs(state.stageZoom - 1.0) < 0.02) {
          state.stageZoom = 1.0;
          state.stagePanX = 0;
          state.stagePanY = 0;
        }
        el.canvasWrapper.style.transform = `translate3d(${state.stagePanX.toFixed(1)}px, ${state.stagePanY.toFixed(1)}px, 0) scale(${state.stageZoom.toFixed(3)})`;
        const pct = Math.round(state.stageZoom * 100);
        el.btnZoomReset.textContent = `${pct}%`;
        el.btnZoomReset.style.display = pct === 100 ? "none" : "inline-flex";
      }

      function resetStageZoom() {
        state.stageZoom = 1.0;
        state.stagePanX = 0;
        state.stagePanY = 0;
        applyStageTransform();
      }

      function applyFsTransform() {
        if (Math.abs(state.fsZoom - 1.0) < 0.02) {
          state.fsZoom = 1.0;
          state.fsPanX = 0;
          state.fsPanY = 0;
        }
        el.fsCanvasHolder.style.transform = `translate3d(${state.fsPanX.toFixed(1)}px, ${state.fsPanY.toFixed(1)}px, 0) scale(${state.fsZoom.toFixed(3)})`;
      }

      function resetFsZoom() {
        state.fsZoom = 1.0;
        state.fsPanX = 0;
        state.fsPanY = 0;
        applyFsTransform();
      }

      function toggleEditDropdown(forceState) {
        if (state.fsCropMode) {
          const cropOpen = typeof forceState === "boolean" ? forceState : !el.fsCropBar.classList.contains("visible");
          el.fsCropBar.classList.toggle("visible", cropOpen);
          el.btnToggleEditDropdown.classList.toggle("open", cropOpen);
          return;
        }
        const shouldOpen = typeof forceState === "boolean" ? forceState : !el.editDropdownMenu.classList.contains("open");
        el.editDropdownMenu.classList.toggle("open", shouldOpen);
        el.btnToggleEditDropdown.classList.toggle("open", shouldOpen);
      }

      function setFsCropMode(enable) {
        state.fsCropMode = !!enable;
        resetFsZoom();
        if (state.fsCropMode) {
          el.editDropdownMenu.classList.remove("open");
          el.fsCropBar.classList.add("visible");
          el.btnToggleEditDropdown.classList.add("open");
        } else {
          el.fsCropBar.classList.remove("visible");
          el.fsCropBar.classList.remove("dragging-fade");
          el.btnToggleEditDropdown.classList.remove("open");
        }
        renderFullScreenEditor();
      }

      // =========================================================================
      // 3. INITIAL DEFAULT DOCUMENT SHEET
      // =========================================================================
      function drawDeskTexture(ctx, w, h, c1, c2) {
        const img = ctx.createImageData(w, h);
        const d = img.data;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const grain = 0.5 + 0.5 * Math.sin(y * 0.13 + 3.2 * Math.sin(x * 0.014 + y * 0.007));
            const t = 0.34 * grain;
            const idx = (y * w + x) * 4;
            d[idx]     = Math.round(c1[0] * (1 - t) + c2[0] * t);
            d[idx + 1] = Math.round(c1[1] * (1 - t) + c2[1] * t);
            d[idx + 2] = Math.round(c1[2] * (1 - t) + c2[2] * t);
            d[idx + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      function createInitialSampleCanvas() {
        const docW = 720;
        const docH = 1018;
        const docCanvas = document.createElement("canvas");
        docCanvas.width = docW;
        docCanvas.height = docH;
        const dctx = docCanvas.getContext("2d");

        dctx.fillStyle = "#f8f8f5";
        dctx.fillRect(0, 0, docW, docH);

        dctx.fillStyle = "#2563eb";
        dctx.font = "bold 17px Arial";
        dctx.fillText("TRƯỜNG THPT ABC - TỔ HÓA - SINH - CNNN", 48, 58);
        dctx.fillStyle = "#0f172a";
        dctx.font = "bold 21px Arial";
        dctx.fillText("ĐỀ KIỂM TRA CHUYÊN ĐỀ ESTE – LIPIT (MÃ ĐỀ 104)", 48, 94);
        dctx.strokeStyle = "#2563eb";
        dctx.lineWidth = 2.2;
        dctx.beginPath();
        dctx.moveTo(48, 110);
        dctx.lineTo(672, 110);
        dctx.stroke();

        dctx.fillStyle = "#1e293b";
        dctx.font = "15px Arial";
        const examLines = [
          "Câu 1: Thủy phân este X có công thức phân tử C4H8O2 trong dung dịch NaOH",
          "thu được muối Y và ancol Z (bậc hai). Công thức cấu tạo thu gọn của X là:",
          "   A. HCOOCH(CH3)2       B. CH3COOC2H5       C. C2H5COOCH3       D. HCOOCH2CH2CH3",
          "",
          "Câu 2: Đốt cháy hoàn toàn 0,15 mol hỗn hợp hai este no, đơn chức, mạch hở",
          "cần vừa đủ 10,08 lít O2 (đktc), thu được 17,6 gam CO2. Khối lượng este là:",
          "   A. 11,4 gam           B. 10,2 gam         C. 12,6 gam         D. 9,8 gam",
          "",
          "Câu 3: Cho 8,8 gam CH3COOC2H5 phản ứng hết với dung dịch NaOH (dư), đun nóng.",
          "Khối lượng muối CH3COONa thu được sau khi cô cạn dung dịch phản ứng là:",
          "   A. 8,2 gam            B. 4,1 gam          C. 12,3 gam         D. 16,4 gam"
        ];
        examLines.forEach((line, idx) => {
          dctx.fillText(line, 48, 148 + idx * 31);
        });

        dctx.strokeStyle = "#2563eb";
        dctx.lineWidth = 2.0;
        dctx.strokeRect(48, 540, 624, 158);
        dctx.fillStyle = "#1d4ed8";
        dctx.font = "bold 15px Arial";
        dctx.fillText("Phần II — Bảng thông số & Ghi chú chuyên đề:", 66, 570);
        dctx.fillStyle = "#1e293b";
        dctx.font = "14.5px Arial";
        dctx.fillText("• Câu 1: Ancol bậc hai là CH3-CH(OH)-CH3 => Chọn đáp án A.", 66, 602);
        dctx.fillText("• Ghi chú: Bảo toàn khối lượng m(este) = m(CO2) + m(H2O) - m(O2) = 10,2g.", 66, 634);
        dctx.fillText("• Câu 3: n(este) = 0,1 mol => n(CH3COONa) = 0,1 mol => m(muối) = 8,2 gam.", 66, 666);

        dctx.save();
        dctx.translate(515, 835);
        dctx.rotate(-0.08);
        dctx.strokeStyle = "#dc2626";
        dctx.lineWidth = 3.0;
        dctx.strokeRect(-110, -40, 220, 80);
        dctx.fillStyle = "#dc2626";
        dctx.font = "bold 16px Arial";
        dctx.fillText("NHÓM HÓA HỌC ABC", -88, -8);
        dctx.font = "bold 13.5px Arial";
        dctx.fillText("ĐỀ CHUẨN KIỂM TRA 45 PHÚT", -98, 18);
        dctx.restore();

        const c = document.createElement("canvas");
        c.width = 800;
        c.height = 960;
        const ctx = c.getContext("2d");
        drawDeskTexture(ctx, c.width, c.height, [182, 134, 86], [148, 102, 60]);

        const dstCorners = [
          { x: 128, y: 88 },
          { x: 680, y: 120 },
          { x: 638, y: 862 },
          { x: 82,  y: 820 }
        ];
        const sData = dctx.getImageData(0, 0, docW, docH).data;
        const dImg = ctx.getImageData(0, 0, c.width, c.height);
        const dData = dImg.data;
        const srcPts = [{ x: 0, y: 0 }, { x: docW, y: 0 }, { x: docW, y: docH }, { x: 0, y: docH }];
        const Hinv = computeHomography(dstCorners, srcPts);

        for (let y = 0; y < c.height; y++) {
          for (let x = 0; x < c.width; x++) {
            const denom = Hinv[6] * x + Hinv[7] * y + 1;
            if (Math.abs(denom) > 1e-8) {
              const sx = (Hinv[0] * x + Hinv[1] * y + Hinv[2]) / denom;
              const sy = (Hinv[3] * x + Hinv[4] * y + Hinv[5]) / denom;
              if (sx >= 0 && sx < docW - 1 && sy >= 0 && sy < docH - 1) {
                const x0 = sx | 0, y0 = sy | 0;
                const dx = sx - x0, dy = sy - y0;
                const i00 = (y0 * docW + x0) * 4;
                const i10 = i00 + 4, i01 = i00 + docW * 4, i11 = i01 + 4;
                const w00 = (1 - dx) * (1 - dy), w10 = dx * (1 - dy), w01 = (1 - dx) * dy, w11 = dx * dy;
                const sig = 1.0 / (1.0 + Math.exp(-((x - c.width * 0.44) * 0.009 + (y - c.height * 0.48) * 0.009)));
                const sh = Math.max(0.55, 1.0 - 0.22 * sig);
                const di = (y * c.width + x) * 4;
                dData[di]     = Math.round((sData[i00]*w00 + sData[i10]*w10 + sData[i01]*w01 + sData[i11]*w11) * sh);
                dData[di + 1] = Math.round((sData[i00+1]*w00 + sData[i10+1]*w10 + sData[i01+1]*w01 + sData[i11+1]*w11) * sh);
                dData[di + 2] = Math.round((sData[i00+2]*w00 + sData[i10+2]*w10 + sData[i01+2]*w01 + sData[i11+2]*w11) * sh);
                dData[di + 3] = 255;
              }
            }
          }
        }
        ctx.putImageData(dImg, 0, 0);
        return c;
      }

      // =========================================================================
      // 4. v16.0 TWO-STAGE SUBPIXEL FULL-RESOLUTION NORMAL-PROFILE RIM DETECTOR
      // =========================================================================
      function sepMaxFilter(arr, w, h, rad) {
        const tmp = new Float32Array(w * h);
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let m = -Infinity;
            for (let nx = x0; nx <= x1; nx++) {
              const v = arr[rOff + nx];
              if (v > m) m = v;
            }
            tmp[rOff + x] = m;
          }
        }
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          for (let x = 0; x < w; x++) {
            let m = -Infinity;
            for (let ny = y0; ny <= y1; ny++) {
              const v = tmp[ny * w + x];
              if (v > m) m = v;
            }
            out[y * w + x] = m;
          }
        }
        return out;
      }

      function sepMinFilter(arr, w, h, rad) {
        const tmp = new Float32Array(w * h);
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let m = Infinity;
            for (let nx = x0; nx <= x1; nx++) {
              const v = arr[rOff + nx];
              if (v < m) m = v;
            }
            tmp[rOff + x] = m;
          }
        }
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          for (let x = 0; x < w; x++) {
            let m = Infinity;
            for (let ny = y0; ny <= y1; ny++) {
              const v = tmp[ny * w + x];
              if (v < m) m = v;
            }
            out[y * w + x] = m;
          }
        }
        return out;
      }

      function sepBoxBlur(arr, w, h, rad) {
        const tmp = new Float32Array(w * h);
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let s = 0;
            for (let nx = x0; nx <= x1; nx++) s += arr[rOff + nx];
            tmp[rOff + x] = s / (x1 - x0 + 1);
          }
        }
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          const cnt = y1 - y0 + 1;
          for (let x = 0; x < w; x++) {
            let s = 0;
            for (let ny = y0; ny <= y1; ny++) s += tmp[ny * w + x];
            out[y * w + x] = s / cnt;
          }
        }
        return out;
      }

      function fitSingleIrlsLine(ptsK) {
        const nK = ptsK.length;
        if (nK < 2) return { a: 0, b: 1, c: 0 };
        const weights = new Float64Array(nK);
        weights.fill(1.0);
        let a = 0, b = 1, c = 0;
        for (let it = 0; it < 5; it++) {
          let wSum = 0, mx = 0, my = 0;
          for (let i = 0; i < nK; i++) {
            wSum += weights[i];
            mx += weights[i] * ptsK[i].x;
            my += weights[i] * ptsK[i].y;
          }
          mx /= (wSum || 1);
          my /= (wSum || 1);
          let sxx = 0, syy = 0, sxy = 0;
          for (let i = 0; i < nK; i++) {
            const dx = ptsK[i].x - mx;
            const dy = ptsK[i].y - my;
            sxx += weights[i] * dx * dx;
            syy += weights[i] * dy * dy;
            sxy += weights[i] * dx * dy;
          }
          const theta = 0.5 * Math.atan2(2 * sxy, sxx - syy);
          a = -Math.sin(theta);
          b = Math.cos(theta);
          c = -(a * mx + b * my);
          for (let i = 0; i < nK; i++) {
            const res = Math.abs(a * ptsK[i].x + b * ptsK[i].y + c);
            weights[i] = 1.0 / Math.max(0.4, res);
          }
        }
        return { a, b, c };
      }

      const NUM_EDGE_SUBPOINTS = 5;
      const DST5_MAT = Array.from({ length: 5 }, (_, j) =>
        Array.from({ length: 5 }, (__, k) => Math.sin(((j + 1) * (k + 1) * Math.PI) / 6.0))
      );

      function fitChordLineWithArchGuard(ptsK, p1Ref, p2Ref, archThresh) {
        const lineStraight = fitSingleIrlsLine(ptsK);
        const nK = ptsK.length;
        if (nK < 10) return lineStraight;

        const vx = p2Ref.x - p1Ref.x, vy = p2Ref.y - p1Ref.y;
        const len = Math.hypot(vx, vy) || 1.0;
        const nx = -vy / len, ny = vx / len;

        // Check if points have a significant arch relative to straight line
        let midResSum = 0, midCnt = 0;
        for (let i = Math.floor(nK * 0.25); i <= Math.floor(nK * 0.75); i++) {
          midResSum += Math.abs(lineStraight.a * ptsK[i].x + lineStraight.b * ptsK[i].y + lineStraight.c);
          midCnt++;
        }
        const meanMidRes = midResSum / (midCnt || 1);
        if (meanMidRes < archThresh) {
          return lineStraight;
        }

        // Fit s(t) = c0*(1-t) + c1*t + a1*sin(pi*t) + a2*sin(2*pi*t) + a3*sin(3*pi*t) using IRLS
        const pi = Math.PI;
        const sArr = new Float64Array(nK);
        const tArr = new Float64Array(nK);
        for (let i = 0; i < nK; i++) {
          const t = ptsK[i].t !== undefined ? ptsK[i].t : (0.05 + (i / (nK - 1)) * 0.90);
          tArr[i] = t;
          const bx = p1Ref.x * (1 - t) + p2Ref.x * t;
          const by = p1Ref.y * (1 - t) + p2Ref.y * t;
          sArr[i] = (ptsK[i].x - bx) * nx + (ptsK[i].y - by) * ny;
        }

        const wts = new Float64Array(nK);
        wts.fill(1.0);
        let sol = [0, 0, 0, 0, 0];
        for (let it = 0; it < 4; it++) {
          const A = Array.from({ length: 5 }, () => new Float64Array(5));
          const b = new Float64Array(5);
          A[2][2] = 0.08;
          A[3][3] = 0.18;
          A[4][4] = 0.25;
          for (let i = 0; i < nK; i++) {
            const t = tArr[i];
            const basis = [1.0 - t, t, Math.sin(pi * t), Math.sin(2.0 * pi * t), Math.sin(3.0 * pi * t)];
            const w = wts[i];
            for (let r = 0; r < 5; r++) {
              const wb = w * basis[r];
              b[r] += wb * sArr[i];
              for (let c = 0; c < 5; c++) A[r][c] += wb * basis[c];
            }
          }
          sol = solveLinearSystem(A, b);
          for (let i = 0; i < nK; i++) {
            const t = tArr[i];
            const pred = sol[0] * (1 - t) + sol[1] * t + sol[2] * Math.sin(pi * t) + sol[3] * Math.sin(2.0 * pi * t) + sol[4] * Math.sin(3.0 * pi * t);
            wts[i] = 1.0 / Math.max(0.5, Math.abs(sArr[i] - pred));
          }
        }

        let errArch = 0;
        for (let i = 0; i < nK; i++) {
          const t = tArr[i];
          const pred = sol[0] * (1 - t) + sol[1] * t + sol[2] * Math.sin(pi * t) + sol[3] * Math.sin(2.0 * pi * t) + sol[4] * Math.sin(3.0 * pi * t);
          errArch += Math.abs(sArr[i] - pred);
        }
        errArch /= nK;

        if (Math.hypot(sol[2], sol[3], sol[4]) > archThresh && errArch < meanMidRes * 0.68) {
          const q1 = { x: p1Ref.x + sol[0] * nx, y: p1Ref.y + sol[0] * ny };
          const q2 = { x: p2Ref.x + sol[1] * nx, y: p2Ref.y + sol[1] * ny };
          let a = q1.y - q2.y, b = q2.x - q1.x;
          const n = Math.hypot(a, b) || 1.0;
          a /= n; b /= n;
          return { a, b, c: -(a * q1.x + b * q1.y) };
        }
        return lineStraight;
      }

      function intersectAbc(L1, L2) {
        const det = L1.a * L2.b - L2.a * L1.b;
        if (Math.abs(det) < 1e-6) return null;
        return {
          x: (L1.b * L2.c - L2.b * L1.c) / det,
          y: (L1.c * L2.a - L2.c * L1.a) / det

      }

      function close1DProfile(src, len, rad, dst) {
        const tmp = new Float32Array(len);
        for (let i = 0; i < len; i++) {
          const a = Math.max(0, i - rad), b = Math.min(len - 1, i + rad);
          let m = -Infinity;
          for (let j = a; j <= b; j++) if (src[j] > m) m = src[j];
          tmp[i] = m;
        }
        for (let i = 0; i < len; i++) {
          const a = Math.max(0, i - rad), b = Math.min(len - 1, i + rad);
          let m = Infinity;
          for (let j = a; j <= b; j++) if (tmp[j] < m) m = tmp[j];
          dst[i] = m;
        }
      }

      function detectDocumentCorners(srcCanvas, skipFullResRefine) {
        const origW = srcCanvas.width;
        const origH = srcCanvas.height;

        const maxDim = 360;
        const scale = Math.min(1, maxDim / Math.max(origW, origH));
        const w = Math.max(72, Math.round(origW * scale));
        const h = Math.max(72, Math.round(origH * scale));

        tmp.height = h;

        const G = new Float32Array(nPix);
        const B = new Float32Array(nPix);
        const L = new Float32Array(nPix);

        for (let i = 0; i < nPix; i++) {
          const idx = i * 4;
          const r = imgData[idx];
          const g = imgData[idx + 1];

          B[i] = b;

        const R_surf = sepMinFilter(sepMaxFilter(R, w, h, 3), w, h, 3);
        const G_surf = sepMinFilter(sepMaxFilter(G, w, h, 3), w, h, 3);
        const B_surf = sepMinFilter(sepMaxFilter(B, w, h, 3), w, h, 3);

        const rawLeft = new Float32Array(nPix);
        const rawRight = new Float32Array(nPix);
        const rawTop = new Float32Array(nPix);
        const rawBot = new Float32Array(nPix);
        const eLeft = new Float32Array(nPix);
        const eRight = new Float32Array(nPix);
        const eTop = new Float32Array(nPix);
        const eBot = new Float32Array(nPix);

        for (let y = 6; y < h - 6; y++) {
          const rOff = y * w;
          for (let x = 6; x < w - 6; x++) {
            const i = rOff + x;

            // Macro step across ±4px AND ±6px so thin 3-4px dark outlines don't fake an inward bright step
            const L_in_L = 0.5 * (L_surf[i + 3] + L_surf[i + 6]);
            const L_out_L = 0.5 * (L_surf[i - 3] + L_surf[i - 6]);
            const N_in_L = 0.5 * (N_surf[i + 3] + N_surf[i + 6]);
            const N_out_L = 0.5 * (N_surf[i - 3] + N_surf[i - 6]);
            const macDL_x = Math.max(L_in_L - L_out_L, (N_in_L - N_out_L) * 0.85);
            const macDL_x_R = Math.max(L_out_L - L_in_L, (N_out_L - N_in_L) * 0.85);

            const macDC_x = Math.hypot(
              R_surf[i + 4] - R_surf[i - 4],
              G_surf[i + 4] - G_surf[i - 4],
              B_surf[i + 4] - B_surf[i - 4]
            );

            let wwCreaseX = 0.0;
            if (Math.min(L_in_L, L_out_L) > 170.0 && Math.abs(L_in_L - L_out_L) < 20.0) {
              const dip = Math.min(L_surf[i + 3], L_surf[i - 3]) - L[i];
              if (dip > 2.8 && dip < 45.0) wwCreaseX = dip;
            }

            const surfDL1_x = L_surf[i + 1] - L_surf[i - 1];
            const rawDL1_x = L[i + 1] - L[i - 1];
            const rawDL2_x = L[i + 2] - L[i - 2];
            const rawDC1_x = Math.hypot(R[i + 1] - R[i - 1], G[i + 1] - G[i - 1], B[i + 1] - B[i - 1]);
            const surfDC2_x = Math.hypot(R_surf[i + 2] - R_surf[i - 2], G_surf[i + 2] - G_surf[i - 2], B_surf[i + 2] - B_surf[i - 2]);
            const surfDC1_x = 0.55 * rawDC1_x + 0.45 * surfDC2_x;

                const vL = peakL * Math.min(1.6, gateL / 12.0);

                const peakR = 0.45 * Math.max(0.0, -surfDL1_x) + 0.35 * Math.max(0.0, -rawDL1_x) + 0.20 * Math.max(0.0, -rawDL2_x) + 0.45 * surfDC1_x + 2.0 * wwCreaseX;
                const vR = peakR * Math.min(1.6, gateR / 12.0);
                rawRight[i] = vR;
                eRight[i] = Math.tanh(vR / 8.0);
              }
            }

            const L_in_T = 0.5 * (L_surf[i + 3 * w] + L_surf[i + 6 * w]);
            const L_out_T = 0.5 * (L_surf[i - 3 * w] + L_surf[i - 6 * w]);
            const N_in_T = 0.5 * (N_surf[i + 3 * w] + N_surf[i + 6 * w]);
            const N_out_T = 0.5 * (N_surf[i - 3 * w] + N_surf[i - 6 * w]);
            const macDL_y = Math.max(L_in_T - L_out_T, (N_in_T - N_out_T) * 0.85);
            const macDL_y_B = Math.max(L_out_T - L_in_T, (N_out_T - N_in_T) * 0.85);

            const macDC_y = Math.hypot(
              R_surf[i + 4 * w] - R_surf[i - 4 * w],
              G_surf[i + 4 * w] - G_surf[i - 4 * w],
              B_surf[i + 4 * w] - B_surf[i - 4 * w]
            );

            let wwCreaseY = 0.0;
            if (Math.min(L_in_T, L_out_T) > 170.0 && Math.abs(L_in_T - L_out_T) < 20.0) {
              const dip = Math.min(L_surf[i + 3 * w], L_surf[i - 3 * w]) - L[i];
              if (dip > 2.8 && dip < 45.0) wwCreaseY = dip;
            }

            const surfDL1_y = L_surf[i + w] - L_surf[i - w];
            const rawDL1_y = L[i + w] - L[i - w];
            const rawDL2_y = L[i + 2 * w] - L[i - 2 * w];
            const rawDC1_y = Math.hypot(R[i + w] - R[i - w], G[i + w] - G[i - w], B[i + w] - B[i - w]);
            const surfDC2_y = Math.hypot(R_surf[i + 2 * w] - R_surf[i - 2 * w], G_surf[i + 2 * w] - G_surf[i - 2 * w], B_surf[i + 2 * w] - B_surf[i - 2 * w]);
            const surfDC1_y = 0.55 * rawDC1_y + 0.45 * surfDC2_y;

            if (L_in_T > 42.0 || N_in_T > 95.0) {
              const gateT = Math.max(0.0, macDL_y) + 0.55 * macDC_y + 2.0 * wwCreaseY;
              if (gateT > 4.0) {
                const peakT = 0.45 * Math.max(0.0, surfDL1_y) + 0.35 * Math.max(0.0, rawDL1_y) + 0.20 * Math.max(0.0, rawDL2_y) + 0.45 * surfDC1_y + 2.0 * wwCreaseY;
                const vT = peakT * Math.min(1.6, gateT / 12.0);
                rawTop[i] = vT;
                eTop[i] = Math.tanh(vT / 8.0);
              }
            }

            if (L_out_T > 42.0 || N_out_T > 95.0) {
              const gateB = Math.max(0.0, macDL_y_B) + 0.55 * macDC_y + 2.0 * wwCreaseY;
              if (gateB > 4.0) {
                const peakB = 0.45 * Math.max(0.0, -surfDL1_y) + 0.35 * Math.max(0.0, -rawDL1_y) + 0.20 * Math.max(0.0, -rawDL2_y) + 0.45 * surfDC1_y + 2.0 * wwCreaseY;
                const vB = peakB * Math.min(1.6, gateB / 12.0);
                rawBot[i] = vB;
                eBot[i] = Math.tanh(vB / 8.0);
              }
            }
          }
        }

        const bLeft = new Float32Array(nPix);
        const bRight = new Float32Array(nPix);
        const bTop = new Float32Array(nPix);
        const bBot = new Float32Array(nPix);
        const bandRad = 4;
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - bandRad), x1 = Math.min(w - 1, x + bandRad);
            let ml = 0, mr = 0;
            for (let nx = x0; nx <= x1; nx++) {
              if (eLeft[rOff + nx] > ml) ml = eLeft[rOff + nx];
              if (eRight[rOff + nx] > mr) mr = eRight[rOff + nx];
            }
            bLeft[rOff + x] = ml;
            bRight[rOff + x] = mr;

            const y0 = Math.max(0, y - bandRad), y1 = Math.min(h - 1, y + bandRad);
            let mt = 0, mb = 0;
            for (let ny = y0; ny <= y1; ny++) {
              if (eTop[ny * w + x] > mt) mt = eTop[ny * w + x];

            bTop[rOff + x] = mt;
            bBot[rOff + x] = mb;

        function findBestVLines(bmap, xMinR, xMaxR, isLeft) {

              for (let k = 0; k < N; k++) {
                const t = k / (N - 1);
                const y = (yStart + t * ySpan + 0.5) | 0;
                const x = (xt * (1 - t) + xb * t + 0.5) | 0;
                const v = bmap[y * w + x];
                vArr[k] = v;
                sumV += v;
                if (v > 0.28) hits++;
                winSum += v;
                if (k >= winLen) winSum -= vArr[k - winLen];
                if (k >= winLen - 1 && winSum > maxWinSum) maxWinSum = winSum;
              }
              const meanSc = sumV / N;
              const cont = hits / N;
              const outerPref = isLeft ? 1.0 - (xt + xb) / (2.0 * w) : (xt + xb) / (2.0 * w);
              const totalSc = meanSc * 0.58 + cont * 0.42 + outerPref * 0.05;
              if (hits > N * 0.36) {
                fullCands.push({ sc: totalSc, xt, xb });
              } else if (hits >= 9 && maxWinSum / winLen > 0.72) {
                winCands.push({ sc: (maxWinSum / winLen) * 0.85 + outerPref * 0.03, xt, xb });
              }
            }
          }
          fullCands.sort((a, b) => b.sc - a.sc);
          winCands.sort((a, b) => b.sc - a.sc);
          const kept = [];
          for (let i = 0; i < fullCands.length; i++) {
            const c = fullCands[i];
            const cMid = 0.5 * (c.xt + c.xb);
            if (kept.every((k) => Math.abs(cMid - 0.5 * (k.xt + k.xb)) > 7 && Math.abs(c.xt - k.xt) + Math.abs(c.xb - k.xb) > 10)) {
              kept.push(c);
              if (kept.length >= 7) break;
            }
          }
          for (let i = 0; i < winCands.length; i++) {
            const c = winCands[i];
            const cMid = 0.5 * (c.xt + c.xb);
            if (kept.every((k) => Math.abs(cMid - 0.5 * (k.xt + k.xb)) > 7 && Math.abs(c.xt - k.xt) + Math.abs(c.xb - k.xb) > 10)) {
              kept.push(c);
              if (kept.length >= 11) break;
            }
          }
          return kept;
        }

        function findBestHLines(bmap, yMinR, yMaxR, isTop) {
          const y0Min = Math.floor(h * yMinR), y0Max = Math.floor(h * yMaxR);
          const fullCands = [];
          const winCands = [];
          const N = 40;
          const xStart = Math.floor(w * 0.16), xSpan = Math.floor(w * 0.68);
          const maxTiltY = Math.floor(h * 0.28);
          const winLen = 13;

          for (let yl = y0Min; yl < y0Max; yl += 2) {
            const yrMin = Math.max(y0Min, yl - maxTiltY);
            const yrMax = Math.min(y0Max, yl + maxTiltY);
            for (let yr = yrMin; yr < yrMax; yr += 2) {
              let sumV = 0, hits = 0;
              let winSum = 0, maxWinSum = 0;
              const vArr = new Float32Array(N);
              for (let k = 0; k < N; k++) {
                const t = k / (N - 1);
                const x = (xStart + t * xSpan + 0.5) | 0;
                const y = (yl * (1 - t) + yr * t + 0.5) | 0;
                const v = bmap[y * w + x];
                vArr[k] = v;
                sumV += v;
                if (v > 0.28) hits++;
                winSum += v;
                if (k >= winLen) winSum -= vArr[k - winLen];
                if (k >= winLen - 1 && winSum > maxWinSum) maxWinSum = winSum;
              }
              const meanSc = sumV / N;
              const cont = hits / N;
              const outerPref = isTop ? 1.0 - (yl + yr) / (2.0 * h) : (yl + yr) / (2.0 * h);
              const totalSc = meanSc * 0.58 + cont * 0.42 + outerPref * 0.05;
              if (hits > N * 0.36) {
                fullCands.push({ sc: totalSc, yl, yr });
              } else if (hits >= 9 && maxWinSum / winLen > 0.72) {
                winCands.push({ sc: (maxWinSum / winLen) * 0.85 + outerPref * 0.03, yl, yr });
              }
            }
          }
          fullCands.sort((a, b) => b.sc - a.sc);
          winCands.sort((a, b) => b.sc - a.sc);
          const kept = [];
          for (let i = 0; i < fullCands.length; i++) {
            const c = fullCands[i];
            const cMid = 0.5 * (c.yl + c.yr);
            if (kept.every((k) => Math.abs(cMid - 0.5 * (k.yl + k.yr)) > 7 && Math.abs(c.yl - k.yl) + Math.abs(c.yr - k.yr) > 10)) {
              kept.push(c);
              if (kept.length >= 7) break;
            }
          }
          for (let i = 0; i < winCands.length; i++) {
            const c = winCands[i];
            const cMid = 0.5 * (c.yl + c.yr);
            if (kept.every((k) => Math.abs(cMid - 0.5 * (k.yl + k.yr)) > 7 && Math.abs(c.yl - k.yl) + Math.abs(c.yr - k.yr) > 10)) {
              kept.push(c);
              if (kept.length >= 11) break;
            }
          }
          return kept;
        }

        const leftCands = findBestVLines(bLeft, 0.015, 0.56, true);
        const rightCands = findBestVLines(bRight, 0.44, 0.985, false);
        const topCands = findBestHLines(bTop, 0.015, 0.56, true);
        const botCands = findBestHLines(bBot, 0.44, 0.985, false);

        function vlineToAbc(xt, xb) {
          const p1x = xt, p1y = h * 0.16, p2x = xb, p2y = h * 0.84;
          let a = p1y - p2y, b = p2x - p1x;
          const n = Math.hypot(a, b) || 1.0;
          a /= n; b /= n;
          return { a, b, c: -(a * p1x + b * p1y) };
        }

        function hlineToAbc(yl, yr) {
          const p1x = w * 0.16, p1y = yl, p2x = w * 0.84, p2y = yr;
          let a = p1y - p2y, b = p2x - p1x;
          const n = Math.hypot(a, b) || 1.0;
          a /= n; b /= n;
          return { a, b, c: -(a * p1x + b * p1y) };
        }

        function evalEdgeAndMargin(p1, p2, bmap, oppSpan) {
          const N = 36;
          const vx = p2.x - p1.x, vy = p2.y - p1.y;
          const len = Math.hypot(vx, vy) || 1.0;
          const nx = -vy / len, ny = vx / len; // inward normal
          const deepDist = Math.min(48, Math.max(18, Math.round(oppSpan * 0.25)));
          let sumV = 0, hits = 0, marginDeficitSum = 0, maxEdgeL = 0, maxEdgeN = 0;
          for (let k = 0; k < N; k++) {
            const t = 0.06 + (k / (N - 1)) * 0.88;
            const bx = p1.x * (1 - t) + p2.x * t;
            const by = p1.y * (1 - t) + p2.y * t;
            const x = Math.min(w - 2, Math.max(1, (bx + 0.5) | 0));
            const y = Math.min(h - 2, Math.max(1, (by + 0.5) | 0));
            const v = bmap[y * w + x];
            sumV += v;
            if (v > 0.28) hits++;

            const ix1 = Math.min(w - 2, Math.max(1, Math.round(bx + 6 * nx)));
            const iy1 = Math.min(h - 2, Math.max(1, Math.round(by + 6 * ny)));
            const ix2 = Math.min(w - 2, Math.max(1, Math.round(bx + deepDist * nx)));
            const iy2 = Math.min(h - 2, Math.max(1, Math.round(by + deepDist * ny)));

            const i1 = iy1 * w + ix1;
            const i2 = iy2 * w + ix2;
            if (L_surf[i1] > maxEdgeL) maxEdgeL = L_surf[i1];
            if (N_surf[i1] > maxEdgeN) maxEdgeN = N_surf[i1];
            const jump = Math.min(N_surf[i2] - N_surf[i1], L_surf[i2] - L_surf[i1]);
            const def = Math.max(0.0, jump - 18.0);
            marginDeficitSum += def;
          }
          const edgeSup = (sumV / N) * 0.52 + (hits / N) * 0.48;
          const marginPenalty = (marginDeficitSum / N) / 40.0;
          return { edgeSup, marginPenalty, maxEdgeL, maxEdgeN };
        }

        let bestQuad = null;
        let bestQScore = -1e9;

        for (let iL = 0; iL < leftCands.length; iL++) {
          const LL = vlineToAbc(leftCands[iL].xt, leftCands[iL].xb);
          for (let iR = 0; iR < rightCands.length; iR++) {
            if (rightCands[iR].xt <= leftCands[iL].xt + w * 0.16 && rightCands[iR].xb <= leftCands[iL].xb + w * 0.16) continue;
            const LR = vlineToAbc(rightCands[iR].xt, rightCands[iR].xb);
            for (let iT = 0; iT < topCands.length; iT++) {
              const LT = hlineToAbc(topCands[iT].yl, topCands[iT].yr);
              for (let iB = 0; iB < botCands.length; iB++) {
                if (botCands[iB].yl <= topCands[iT].yl + h * 0.16 && botCands[iB].yr <= topCands[iT].yr + h * 0.16) continue;
                const LB = hlineToAbc(botCands[iB].yl, botCands[iB].yr);
                const tl = intersectAbc(LT, LL);
                const tr = intersectAbc(LT, LR);
                const br = intersectAbc(LB, LR);
                const bl = intersectAbc(LB, LL);
                if (!tl || !tr || !br || !bl) continue;
                if (
                  tl.x < 1 || tl.x > w - 2 || tl.y < 1 || tl.y > h - 2 ||
                  tr.x < 1 || tr.x > w - 2 || tr.y < 1 || tr.y > h - 2 ||
                  br.x < 1 || br.x > w - 2 || br.y < 1 || br.y > h - 2 ||
                  bl.x < 1 || bl.x > w - 2 || bl.y < 1 || bl.y > h - 2
                ) continue;

                const vTx = tr.x - tl.x, vTy = tr.y - tl.y;
                const vBx = br.x - bl.x, vBy = br.y - bl.y;
                const vLx = bl.x - tl.x, vLy = bl.y - tl.y;
                const vRx = br.x - tr.x, vRy = br.y - tr.y;
                const lenT = Math.hypot(vTx, vTy), lenB = Math.hypot(vBx, vBy);
                const lenL = Math.hypot(vLx, vLy), lenR = Math.hypot(vRx, vRy);
                if (Math.min(lenT, lenB, lenL, lenR) < Math.min(w, h) * 0.20) continue;

                const cosTL = Math.abs(vTx * vLx + vTy * vLy) / (lenT * lenL + 1e-5);
                const cosBR = Math.abs(vBx * vRx + vBy * vRy) / (lenB * lenR + 1e-5);
                if (cosTL > 0.42 || cosBR > 0.42) continue;

                const cosTB = (vTx * vBx + vTy * vBy) / (lenT * lenB + 1e-5);
                const cosLR = (vLx * vRx + vLy * vRy) / (lenL * lenR + 1e-5);
                if (cosTB < 0.78 || cosLR < 0.78) continue;

                const spanH = 0.5 * (lenL + lenR);
                const spanW = 0.5 * (lenT + lenB);

                const eT = evalEdgeAndMargin(tl, tr, bTop, spanH);
                const eR = evalEdgeAndMargin(tr, br, bRight, spanW);
                const eB = evalEdgeAndMargin(br, bl, bBot, spanH);
                const eL = evalEdgeAndMargin(bl, tl, bLeft, spanW);

                // Check if the quad wraps around a much brighter interior object while ALL 4 of its margins are dark desk!
                let peakInL = 0, peakInN = 0;
                for (let iv = 1; iv <= 5; iv++) {
                  const v = iv / 6.0;
                  for (let iu = 1; iu <= 5; iu++) {
                    const u = iu / 6.0;
                    const qx = Math.min(w - 2, Math.max(1, Math.round((tl.x * (1 - u) + tr.x * u) * (1 - v) + (bl.x * (1 - u) + br.x * u) * v)));
                    const qy = Math.min(h - 2, Math.max(1, Math.round((tl.y * (1 - u) + tr.y * u) * (1 - v) + (bl.y * (1 - u) + br.y * u) * v)));
                    const idxQ = qy * w + qx;
                    if (L_surf[idxQ] > peakInL) peakInL = L_surf[idxQ];
                    if (N_surf[idxQ] > peakInN) peakInN = N_surf[idxQ];
                  }
                }
                const maxMarginL = Math.max(eT.maxEdgeL, eR.maxEdgeL, eB.maxEdgeL, eL.maxEdgeL);
                const wrapGap = Math.max(0.0, peakInL - maxMarginL - 24.0);

                // Check if side edges continue past top/bottom or top/bottom continue past left/right (internal line penalty!)
                let ovShoot = 0;
                const uLx = vLx / lenL, uLy = vLy / lenL;
                const uRx = vRx / lenR, uRy = vRy / lenR;
                for (let s = 10; s <= 26; s += 8) {
                  // Check below BL and BR (if bot edge is actually an internal horizontal line like Scene 4's y=0.5h!)
                  const bxL = Math.min(w - 2, Math.max(1, Math.round(bl.x + uLx * s)));
                  const byL = Math.min(h - 2, Math.max(1, Math.round(bl.y + uLy * s)));
                  const bxR = Math.min(w - 2, Math.max(1, Math.round(br.x + uRx * s)));
                  const byR = Math.min(h - 2, Math.max(1, Math.round(br.y + uRy * s)));
                  if (bLeft[byL * w + bxL] > 0.55 && bRight[byR * w + bxR] > 0.55) ovShoot += 0.45;

                  // Check above TL and TR
                  const txL = Math.min(w - 2, Math.max(1, Math.round(tl.x - uLx * s)));
                  const tyL = Math.min(h - 2, Math.max(1, Math.round(tl.y - uLy * s)));
                  const txR = Math.min(w - 2, Math.max(1, Math.round(tr.x - uRx * s)));
                  const tyR = Math.min(h - 2, Math.max(1, Math.round(tr.y - uRy * s)));
                  if (bLeft[tyL * w + txL] > 0.55 && bRight[tyR * w + txR] > 0.55) ovShoot += 0.45;
                }

                const supT = eT.edgeSup, supR = eR.edgeSup, supB = eB.edgeSup, supL = eL.edgeSup;
                const minSup = Math.min(supT, supB, supL, supR);
                const totalMarginPen = eT.marginPenalty + eR.marginPenalty + eB.marginPenalty + eL.marginPenalty + (wrapGap / 14.0) + ovShoot;
                const orthoBonus = (1.0 - cosTL) * 0.35 + (1.0 - cosBR) * 0.35;
                const qScore = (supT + supB + supL + supR) + minSup * 1.4 + orthoBonus - totalMarginPen * 1.45;
                if (qScore > bestQScore) {
                  bestQScore = qScore;
                  bestQuad = [tl, tr, br, bl];
                }
              }
            }
          }
        }
        if (!bestQuad) {
          srcCanvas._detectedEdgeOffsets = createZeroEdgeOffsets();
          srcCanvas._hasCurvedRim = false;
          return [
            { x: Math.round(origW * 0.06), y: Math.round(origH * 0.06) },
            { x: Math.round(origW * 0.94), y: Math.round(origH * 0.06) },
            { x: Math.round(origW * 0.94), y: Math.round(origH * 0.94) },
            { x: Math.round(origW * 0.06), y: Math.round(origH * 0.94) }
          ];
        }

        const pairsPts = [
          { p1: bestQuad[0], p2: bestQuad[1], rmap: rawTop, isH: true },
          { p1: bestQuad[1], p2: bestQuad[2], rmap: rawRight, isH: false },
          { p1: bestQuad[2], p2: bestQuad[3], rmap: rawBot, isH: true },
          { p1: bestQuad[3], p2: bestQuad[0], rmap: rawLeft, isH: false }
        ];
        const refinedLines = pairsPts.map((item) => {
          const ptsAll = [];
          const rmap = item.rmap;
          for (let k = 0; k < 44; k++) {
            const t = 0.05 + (k / 43.0) * 0.90;
            const px = item.p1.x * (1.0 - t) + item.p2.x * t;
            const py = item.p1.y * (1.0 - t) + item.p2.y * t;
            const ix = Math.round(px), iy = Math.round(py);
            let bestOff = 0, bestVal = -1.0;
            for (let d = -9; d <= 9; d++) {
              const nx = item.isH ? ix : Math.min(w - 2, Math.max(1, ix + d));
              const ny = item.isH ? Math.min(h - 2, Math.max(1, iy + d)) : iy;
              const val = rmap[ny * w + nx];
              if (val > bestVal) { bestVal = val; bestOff = d; }
            }
            const pt = item.isH
              ? { x: px, y: Math.min(h - 2, Math.max(1, iy + bestOff)), t }
              : { x: Math.min(w - 2, Math.max(1, ix + bestOff)), y: py, t };
            ptsAll.push(pt);
          }
          return fitChordLineWithArchGuard(ptsAll, item.p1, item.p2, 1.4);
        });

        const idxPairs = [[3, 0], [0, 1], [1, 2], [2, 3]];
        const stage1Corners = idxPairs.map((pair, k) => {
          const pt = intersectAbc(refinedLines[pair[0]], refinedLines[pair[1]]);
          if (pt && Math.hypot(pt.x - bestQuad[k].x, pt.y - bestQuad[k].y) < 24) {
            return { x: pt.x / scale, y: pt.y / scale };
          }
          return { x: bestQuad[k].x / scale, y: bestQuad[k].y / scale };
        });

        if (skipFullResRefine) {
          srcCanvas._detectedEdgeOffsets = createZeroEdgeOffsets();
          srcCanvas._hasCurvedRim = false;
          return stage1Corners.map((p) => ({
            x: Math.max(0, Math.min(origW, Math.round(p.x))),
            y: Math.max(0, Math.min(origH, Math.round(p.y)))
          }));
        }

        // STAGE 2: FULL-RESOLUTION 1D-CLOSED NORMAL PROFILE VITERBI + 5-SINE CURVED RIM
        const fullData = srcCanvas.getContext("2d").getImageData(0, 0, origW, origH).data;
        const nProf = 65;
        const searchRad = Math.min(40, Math.max(20, Math.round(Math.min(origW, origH) * 0.042)));
        const M = searchRad + 8;
        const profLen = 2 * M + 1;
        const profL = new Float32Array(profLen);
        const profR = new Float32Array(profLen);
        const profG = new Float32Array(profLen);
        const profB = new Float32Array(profLen);
        const surfL = new Float32Array(profLen);
        const surfR = new Float32Array(profLen);
        const surfG = new Float32Array(profLen);
        const surfB = new Float32Array(profLen);
        const nStates = 2 * searchRad + 1;
        const scoreMat = new Float32Array(nProf * nStates);
        const dpMat = new Float64Array(nProf * nStates);
        const prevMat = new Int32Array(nProf * nStates);

        const chordLines = [];
        const allSeamPts = [];
        const allSeamWeights = [];

        for (let k = 0; k < 4; k++) {
          const p1 = stage1Corners[k];
          const p2 = stage1Corners[(k + 1) % 4];
          const vx = p2.x - p1.x;
          const vy = p2.y - p1.y;
          const segLen = Math.hypot(vx, vy) || 1.0;
          const nx = -vy / segLen;
          const ny = vx / segLen;

          for (let i = 0; i < nProf; i++) {
            const t = 0.02 + (i / (nProf - 1)) * 0.96;
            const bx = p1.x * (1.0 - t) + p2.x * t;
            const by = p1.y * (1.0 - t) + p2.y * t;

            for (let m = -M; m <= M; m++) {
              const px = Math.min(origW - 1, Math.max(0, Math.round(bx + m * nx)));
              const py = Math.min(origH - 1, Math.max(0, Math.round(by + m * ny)));
              const idx4 = (py * origW + px) * 4;
              const r = fullData[idx4];
              const g = fullData[idx4 + 1];
              const b = fullData[idx4 + 2];
              const pIdx = m + M;
              profR[pIdx] = r;
              profG[pIdx] = g;
              profB[pIdx] = b;
              profL[pIdx] = 0.299 * r + 0.587 * g + 0.114 * b;
            }

            close1DProfile(profL, profLen, 5, surfL);
            close1DProfile(profR, profLen, 5, surfR);
            close1DProfile(profG, profLen, 5, surfG);
            close1DProfile(profB, profLen, 5, surfB);

            const rowOff = i * nStates;
            for (let si = 0; si < nStates; si++) {
              const s = si - searchRad;
              const cIdx = s + M;

              let L_in = 0, L_out = 0, R_in = 0, R_out = 0, G_in = 0, G_out = 0, B_in = 0, B_out = 0;
              for (let j = 2; j <= 6; j++) {
                L_in += surfL[cIdx + j];
                R_in += surfR[cIdx + j];
                G_in += surfG[cIdx + j];
                B_in += surfB[cIdx + j];
                L_out += surfL[cIdx - j];
                R_out += surfR[cIdx - j];
                G_out += surfG[cIdx - j];
                B_out += surfB[cIdx - j];
              }
              L_in *= 0.2; L_out *= 0.2;
              R_in *= 0.2; R_out *= 0.2;
              G_in *= 0.2; G_out *= 0.2;
              B_in *= 0.2; B_out *= 0.2;

              const macDL = Math.max(0.0, L_in - L_out);
              const macDC = Math.hypot(R_in - R_out, G_in - G_out, B_in - B_out);
              let wwCrease = 0.0;
              if (Math.min(L_in, L_out) > 170.0 && Math.abs(L_in - L_out) < 20.0) {
                const minC = Math.min(profL[cIdx - 1], profL[cIdx], profL[cIdx + 1]);
                const dip = Math.min(L_in, L_out) - minC;
                if (dip > 2.8 && dip < 45.0) wwCrease = dip;
              }

              const gate = macDL + 0.58 * macDC + 2.0 * wwCrease;
              let sc = 0.0;
              if ((L_in > 42.0) && gate > 3.5) {
                const dL1 = 0.55 * Math.max(0.0, surfL[cIdx + 1] - surfL[cIdx - 1]) + 0.45 * Math.max(0.0, profL[cIdx + 1] - profL[cIdx - 1]);
                const dL2 = 0.55 * Math.max(0.0, surfL[cIdx + 2] - surfL[cIdx - 2]) + 0.45 * Math.max(0.0, profL[cIdx + 2] - profL[cIdx - 2]);
                const dC1 = 0.55 * Math.hypot(
                  profR[cIdx + 1] - profR[cIdx - 1],
                  profG[cIdx + 1] - profG[cIdx - 1],
                  profB[cIdx + 1] - profB[cIdx - 1]
                ) + 0.45 * Math.hypot(
                  surfR[cIdx + 2] - surfR[cIdx - 2],
                  surfG[cIdx + 2] - surfG[cIdx - 2],
                  surfB[cIdx + 2] - surfB[cIdx - 2]
                );
                const peak = 0.65 * dL1 + 0.35 * dL2 + 0.48 * dC1 + 2.2 * wwCrease;
                const endWeight = Math.pow(2.0 * Math.abs(t - 0.5), 2.0);
                const prior = 1.0 - (0.004 + 0.012 * endWeight) * ((s * s) / (searchRad * searchRad));
                sc = peak * Math.min(1.8, gate / 12.0) * Math.max(0.25, prior);
              }
              scoreMat[rowOff + si] = sc;
            }
          }

          for (let si = 0; si < nStates; si++) {
            const s = si - searchRad;
            dpMat[si] = scoreMat[si] - 0.12 * s * s;
            prevMat[si] = si;
          }

          for (let i = 1; i < nProf; i++) {
            const currOff = i * nStates;
            const prevOff = (i - 1) * nStates;
            for (let si = 0; si < nStates; si++) {
              const spMin = Math.max(0, si - 3);
              const spMax = Math.min(nStates - 1, si + 3);
              let bestPrev = si;
              let bestVal = -1e12;
              for (let sp = spMin; sp <= spMax; sp++) {
                const ds = si - sp;
                const cand = dpMat[prevOff + sp] - (1.0 * Math.abs(ds) + 0.5 * ds * ds);
                if (cand > bestVal) {
                  bestVal = cand;
                  bestPrev = sp;
                }
              }
              dpMat[currOff + si] = scoreMat[currOff + si] + bestVal;
              prevMat[currOff + si] = bestPrev;
            }
          }

          const lastOff = (nProf - 1) * nStates;
          let bestEndSi = searchRad;
          let bestEndScore = -1e12;
          for (let si = 0; si < nStates; si++) {
            const s = si - searchRad;
            const v = dpMat[lastOff + si] - 0.12 * s * s;
            if (v > bestEndScore) {
              bestEndScore = v;
              bestEndSi = si;
            }
          }

          const pathSi = new Int32Array(nProf);
          pathSi[nProf - 1] = bestEndSi;
          for (let i = nProf - 2; i >= 0; i--) {
            pathSi[i] = prevMat[(i + 1) * nStates + pathSi[i + 1]];
          }

          const seamPts = [];
          const wArr = new Float64Array(nProf);
          for (let i = 0; i < nProf; i++) {
            const t = 0.02 + (i / (nProf - 1)) * 0.96;
            const si = pathSi[i];
            const rowOff = i * nStates;
            let sVal = si - searchRad;
            if (si > 0 && si < nStates - 1) {
              const vm = scoreMat[rowOff + si - 1];
              const v0 = scoreMat[rowOff + si];
              const vp = scoreMat[rowOff + si + 1];
              const denom = 2.0 * (2.0 * v0 - vm - vp);
              if (Math.abs(denom) > 1e-4) {
                sVal += Math.max(-0.5, Math.min(0.5, (vm - vp) / denom));
              }
            }
            wArr[i] = Math.max(0.15, scoreMat[rowOff + si]);
            const bx = p1.x * (1.0 - t) + p2.x * t;
            const by = p1.y * (1.0 - t) + p2.y * t;
            const pt = { x: bx + sVal * nx, y: by + sVal * ny, t };
            seamPts.push(pt);
          }

          allSeamPts.push(seamPts);
          allSeamWeights.push(wArr);
          chordLines.push(fitChordLineWithArchGuard(seamPts, p1, p2, 3.2));
        }

        const refinedCorners = idxPairs.map((pair, k) => {
          const pt = intersectAbc(chordLines[pair[0]], chordLines[pair[1]]);
          if (pt && Math.hypot(pt.x - stage1Corners[k].x, pt.y - stage1Corners[k].y) < 42.0) {
            return {
              x: Math.max(0, Math.min(origW, Math.round(pt.x))),
              y: Math.max(0, Math.min(origH, Math.round(pt.y)))
            };
          }
          return {
            x: Math.max(0, Math.min(origW, Math.round(stage1Corners[k].x))),
            y: Math.max(0, Math.min(origH, Math.round(stage1Corners[k].y)))
          };
        });

        const detectedEdgeOffsets = createZeroEdgeOffsets();
        let anyEdgeCurved = false;
        const pi = Math.PI;

        for (let k = 0; k < 4; k++) {
          const p1 = refinedCorners[k];
          const p2 = refinedCorners[(k + 1) % 4];
          const vx = p2.x - p1.x;
          const vy = p2.y - p1.y;
          const segLen = Math.hypot(vx, vy) || 1.0;
          const nx = -vy / segLen;
          const ny = vx / segLen;
          const seamPts = allSeamPts[k];
          const wArr = allSeamWeights[k];

          const A5 = Array.from({ length: 5 }, (_, r) => {
            const row = new Float64Array(5);
            row[r] = [0.15, 0.25, 0.35, 0.60, 0.90][r];
            return row;
          });
          const b5 = new Float64Array(5);

          let absLinSum = 0, absCurveSum = 0, wSum = 0;
          const sTrueArr = new Float64Array(nProf);

          for (let i = 0; i < nProf; i++) {
            const pt = seamPts[i];
            const t = pt.t;
            const sTrue = (pt.x - p1.x) * nx + (pt.y - p1.y) * ny;
            sTrueArr[i] = sTrue;
            const wgt = wArr[i];
            const bVec = [
              Math.sin(pi * t),
              Math.sin(2.0 * pi * t),
              Math.sin(3.0 * pi * t),
              Math.sin(4.0 * pi * t),
              Math.sin(5.0 * pi * t)
            ];
            for (let r = 0; r < 5; r++) {
              const wbr = wgt * bVec[r];
              b5[r] += wbr * sTrue;
              for (let c = 0; c < 5; c++) A5[r][c] += wbr * bVec[c];
            }
            absLinSum += wgt * Math.abs(sTrue);
            wSum += wgt;
          }

          const cHarm = solveLinearSystem(A5, b5);
          cHarm[3] *= 0.45;
          cHarm[4] *= 0.25;

          for (let i = 0; i < nProf; i++) {
            const t = seamPts[i].t;
            const sPred =
              cHarm[0] * Math.sin(pi * t) +
              cHarm[1] * Math.sin(2.0 * pi * t) +
              cHarm[2] * Math.sin(3.0 * pi * t) +
              cHarm[3] * Math.sin(4.0 * pi * t) +
              cHarm[4] * Math.sin(5.0 * pi * t);
            absCurveSum += wArr[i] * Math.abs(sTrueArr[i] - sPred);
          }

          const meanLinErr = absLinSum / (wSum || 1.0);
          const meanCurveErr = absCurveSum / (wSum || 1.0);

          const sVals = [1 / 6, 2 / 6, 3 / 6, 4 / 6, 5 / 6].map((tm) => (
            cHarm[0] * Math.sin(pi * tm) +
            cHarm[1] * Math.sin(2.0 * pi * tm) +
            cHarm[2] * Math.sin(3.0 * pi * tm) +
            cHarm[3] * Math.sin(4.0 * pi * tm) +
            cHarm[4] * Math.sin(5.0 * pi * tm)
          ));
          let edgeMax = 0;
          for (let m = 0; m < NUM_EDGE_SUBPOINTS; m++) {
            if (Math.abs(sVals[m]) > edgeMax) edgeMax = Math.abs(sVals[m]);
          }

          const minCurveThresh = Math.max(4.5, segLen * 0.0055);
          if (edgeMax >= minCurveThresh && meanLinErr > 2.0 && meanCurveErr < meanLinErr * 0.68) {
            anyEdgeCurved = true;
            for (let m = 0; m < NUM_EDGE_SUBPOINTS; m++) {
              detectedEdgeOffsets[k][m] = {
                x: Math.round(sVals[m] * nx),
                y: Math.round(sVals[m] * ny)
              };
            }
          }
        }

        srcCanvas._detectedEdgeOffsets = detectedEdgeOffsets;
        srcCanvas._hasCurvedRim = anyEdgeCurved;
        return refinedCorners;
      }

      // =========================================================================
      // 5. v16.0 3D PERSPECTIVE + 2-STAGE 1D PROFILE NCC HARMONIC TEXT-LINE &
      //    CYLINDRICAL PAGE DEWARPING (STRAIGHTENS BOTH CURVED PAGE & TEXT LINES!)
      // =========================================================================
      function solveLinearSystem(A_in, b_in) {
        const n = b_in.length;
        const A = A_in.map((row) => Float64Array.from(row));
        const b = Float64Array.from(b_in);
        for (let i = 0; i < n; i++) {
          let maxRow = i;
          let maxVal = Math.abs(A[i][i]);
          for (let k = i + 1; k < n; k++) {
            if (Math.abs(A[k][i]) > maxVal) {
              maxVal = Math.abs(A[k][i]);
              maxRow = k;
            }
          }
          const tmpR = A[i]; A[i] = A[maxRow]; A[maxRow] = tmpR;
          const tmpB = b[i]; b[i] = b[maxRow]; b[maxRow] = tmpB;
          const piv = A[i][i] || 1e-12;
          for (let j = i; j < n; j++) A[i][j] /= piv;
          b[i] /= piv;
          for (let k = 0; k < n; k++) {
            if (k !== i) {
              const f = A[k][i];
              for (let j = i; j < n; j++) A[k][j] -= f * A[i][j];
              b[k] -= f * b[i];
            }
          }
        }
        return b;
      }

      function computeHomography(srcPts, dstPts) {
        const A = [];
        const b = [];
        for (let i = 0; i < 4; i++) {
          const x = srcPts[i].x, y = srcPts[i].y;
          const u = dstPts[i].x, v = dstPts[i].y;
          A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]);
          b.push(u);
          A.push([0, 0, 0, x, y, 1, -x * v, -y * v]);
          b.push(v);
        }
        const h = solveLinearSystem(A, b);
        return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
      }

      // Pure Dirichlet Sine Basis on x in [0, 1]: vanishes strictly at both left (x=0) and right (x=1) page borders!
      // - sin(pi*x): single-page cylindrical arch
      // - sin(2*pi*x): asymmetric 2-page book arch
      // - sin(3*pi*x): symmetric 2-page open book M-arch (arches on left/right pages, dips at central spine x=0.5)
      // Eliminates cosine boundary steps & high-frequency 4*pi ripples that caused wavy lines on flat paper!
      function evalDirichletSineBasis3(xn) {
        const pi = Math.PI;
        return [
          Math.sin(pi * xn),
          Math.sin(2.0 * pi * xn),
          Math.sin(3.0 * pi * xn)
        ];
      }

      function evalVertBasis2(ty) {
        return [1.0, ty - 0.5];
      }

      // =========================================================================
      // v24.0 FLAT-PAPER-SAFE 2D TOP/BOTTOM BOOK SURFACE & TEXT-LINE DEWARPING
      // - Uses Dirichlet Sine Basis [sin(pi*x), sin(2*pi*x), sin(3*pi*x)] x [1, ty-0.5]
      //   so endpoints x=0 and x=1 are strictly pinned (zero edge shear) and
      //   high-frequency ripples are physically impossible.
      // - Enforces a strict Flat-Paper Immunity Gate (requires coherent multi-column
      //   curvature >= 4.8 px and soft deadzone shrinkage) so flat sheets stay
      //   100% razor-straight (0.00 px wave) while curved open books are flattened!
      // =========================================================================
      function estimate2DBookSurfaceModes(rgbaData, dstW, dstH) {
        const M = 32;
        const subW = M * 6; // 192
        const Hs = 320;
        const scaleY = dstH / Hs;

        // 1. Downsample luminance to (subW x Hs)
        const L0 = new Float32Array(subW * Hs);
        for (let sy = 0; sy < Hs; sy++) {
          const y = Math.min(dstH - 1, Math.round((sy / (Hs - 1)) * (dstH - 1)));
          const rOff = y * dstW;
          const sOff = sy * subW;
          for (let sx = 0; sx < subW; sx++) {
            const x = Math.min(dstW - 1, Math.round((sx / (subW - 1)) * (dstW - 1)));
            const idx4 = (rOff + x) * 4;
            L0[sOff + sx] = 0.299 * rgbaData[idx4] + 0.587 * rgbaData[idx4 + 1] + 0.114 * rgbaData[idx4 + 2];
          }
        }

        // 2. Vertical high-pass ink stroke energy E0(sy, sx)
        const E0 = new Float32Array(subW * Hs);
        const my = Math.floor(Hs * 0.04);
        for (let sy = Math.max(3, my); sy < Hs - Math.max(3, my); sy++) {
          const sOff = sy * subW;
          const upOff = (sy - 3) * subW;
          const dnOff = (sy + 3) * subW;
          for (let sx = 0; sx < subW; sx++) {
            const diff = 0.5 * (L0[upOff + sx] + L0[dnOff + sx]) - L0[sOff + sx];
            if (diff > 0) E0[sOff + sx] = diff;
          }
        }

        // 3. Build M = 32 overlapping 1D vertical projection profiles P[k * Hs + sy]
        const P = new Float64Array(M * Hs);
        const rawP = new Float64Array(Hs);
        for (let k = 0; k < M; k++) {
          const x0 = Math.max(0, k * 6 - 4);
          const x1 = Math.min(subW - 1, (k + 1) * 6 + 3);
          const span = x1 - x0 + 1;
          for (let sy = 0; sy < Hs; sy++) {
            let s = 0;
            const sOff = sy * subW;
            for (let sx = x0; sx <= x1; sx++) s += E0[sOff + sx];
            rawP[sy] = s / span;
          }
          const kOff = k * Hs;
          for (let sy = 0; sy < Hs; sy++) {
            const y0 = Math.max(0, sy - 7), y1 = Math.min(Hs - 1, sy + 7);
            let m = 0;
            for (let ny = y0; ny <= y1; ny++) m += rawP[ny];
            m /= (y1 - y0 + 1);
            P[kOff + sy] = Math.max(0.0, rawP[sy] - m);
          }
        }

        const K = 3; // 3 smooth Dirichlet Sine modes: sin(pi*x), sin(2*pi*x), sin(3*pi*x)
        const B_cols = [];
        for (let k = 0; k < M; k++) {
          B_cols.push(evalDirichletSineBasis3(k / (M - 1)));
        }

        // 4 vertical zones covering Top-Half and Bottom-Half
        const zones = [
          [0.05, 0.48, 0.265],
          [0.15, 0.52, 0.335],
          [0.48, 0.85, 0.665],
          [0.52, 0.95, 0.735]
        ];

        const regH = [0.06, 0.12, 0.22];
        const regV = [1.0, 1.2];
        const nParams = 2 * K; // 6 ultra-clean parameters!
