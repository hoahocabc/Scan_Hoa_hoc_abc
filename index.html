            fastClose1DProfile(profB, profLen, closeRadS2, surfB);

            const rowOff = i * nStates;
            let hasNearPopRim = false;
            if (noiseSigma < 0.25) {
              for (let sCheck = -5; sCheck <= 5; sCheck++) {
                const cIdx = sCheck + M;
                const lIn = 0.5 * (surfL[cIdx + 3] + surfL[cIdx + 5]);
                const lOut = 0.5 * (surfL[cIdx - 3] + surfL[cIdx - 5]);
                const minS = lIn < lOut ? lIn : lOut;
                const cp0 = creaseProfL[cIdx - 1], cp1 = creaseProfL[cIdx], cp2 = creaseProfL[cIdx + 1];
                const minCp = cp0 < cp1 ? (cp0 < cp2 ? cp0 : cp2) : (cp1 < cp2 ? cp1 : cp2);
                const dip0 = minS - minCp;
                const dr0 = surfR[cIdx + 3] - surfR[cIdx - 3], dg0 = surfG[cIdx + 3] - surfG[cIdx - 3], db0 = surfB[cIdx + 3] - surfB[cIdx - 3];
                const dc0 = Math.sqrt(dr0 * dr0 + dg0 * dg0 + db0 * db0);
                const step0 = Math.abs(lIn - lOut);
                if (minS > 110.0 && step0 < 28.0 && ((dip0 > 0.95 && dip0 < 28.0) || (dc0 > 3.5 && dc0 < 36.0) || (step0 >= 1.25 && step0 < 28.0))) {
                  hasNearPopRim = true;
                  break;
                }
              }
            }

            const dHalf = 2.0 * Math.abs(t - 0.5);
            const endWeight = dHalf * dHalf;
            const priorWeight = 0.002 + 0.018 * endWeight;

            for (let si = 0; si < nStates; si++) {
              const s = (si - halfStates) * strideS;
              const cx = bx + s * nx;
              const cy = by + s * ny;
              if (cx < 1 || cx > origW - 2 || cy < 1 || cy > origH - 2) {
                scoreMat[rowOff + si] = 0.0;
                continue;
              }
              const cIdx = s + M;

              const L_in = (surfL[cIdx + 2] + surfL[cIdx + 3] + surfL[cIdx + 4] + surfL[cIdx + 5] + surfL[cIdx + 6]) * 0.2;
              const L_out = (surfL[cIdx - 2] + surfL[cIdx - 3] + surfL[cIdx - 4] + surfL[cIdx - 5] + surfL[cIdx - 6]) * 0.2;
              const R_in = (surfR[cIdx + 2] + surfR[cIdx + 3] + surfR[cIdx + 4] + surfR[cIdx + 5] + surfR[cIdx + 6]) * 0.2;
              const R_out = (surfR[cIdx - 2] + surfR[cIdx - 3] + surfR[cIdx - 4] + surfR[cIdx - 5] + surfR[cIdx - 6]) * 0.2;
              const G_in = (surfG[cIdx + 2] + surfG[cIdx + 3] + surfG[cIdx + 4] + surfG[cIdx + 5] + surfG[cIdx + 6]) * 0.2;
              const G_out = (surfG[cIdx - 2] + surfG[cIdx - 3] + surfG[cIdx - 4] + surfG[cIdx - 5] + surfG[cIdx - 6]) * 0.2;
              const B_in = (surfB[cIdx + 2] + surfB[cIdx + 3] + surfB[cIdx + 4] + surfB[cIdx + 5] + surfB[cIdx + 6]) * 0.2;
              const B_out = (surfB[cIdx - 2] + surfB[cIdx - 3] + surfB[cIdx - 4] + surfB[cIdx - 5] + surfB[cIdx - 6]) * 0.2;

              const flatVar = Math.abs(surfL[cIdx + 6] - surfL[cIdx + 2]) + Math.abs(surfL[cIdx - 2] - surfL[cIdx - 6]);
              const absStep = Math.abs(L_in - L_out);
              const minSideL = L_in < L_out ? L_in : L_out;
              const maxSideL = L_in > L_out ? L_in : L_out;
              const dR = R_in - R_out, dG = G_in - G_out, dB = B_in - B_out;
              const macDC = fastNorm3(dR, dG, dB);

              const cp0 = creaseProfL[cIdx - 1], cp1 = creaseProfL[cIdx], cp2 = creaseProfL[cIdx + 1];
              const minC = cp0 < cp1 ? (cp0 < cp2 ? cp0 : cp2) : (cp1 < cp2 ? cp1 : cp2);
              const dip = minSideL - minC;
              // Exact center-pixel dip creates a sharp 1px peak on the true white-on-white crease (no 3px flat plateau!)
              const exactDip = minSideL - cp1;
              const sharpCreaseDip = exactDip > 0.0 ? (0.82 * exactDip + 0.18 * dip) : 0.0;
              const sameSurfS2 = absStep < 9.0 && macDC < 9.0 && flatVar < 8.5;
              const isDarkInPaperS2 = !allowDarkObjectPolarity && L_out > 170.0 && (L_out - L_in > 22.0);
              const isInkS2 = isDarkInPaperS2 || (sameSurfS2 && minSideL > 100.0 && dip > 24.0);

              let flatRimStepS2 = 0.0;
              const rawRimS2 = absStep > macDC * 0.78 ? absStep : macDC * 0.78;
              if (!isInkS2 && rawRimS2 >= s2MinFlatStep && flatVar < rawRimS2 * 0.55 + 2.0) {
                flatRimStepS2 = rawRimS2 - flatVar * 0.65;
              }

              let wwCrease = 0.0;
              if (!isInkS2 && minSideL > 75.0 && absStep < 32.0 && flatVar < 12.0) {
                if (sharpCreaseDip > s2MinCreaseDip && dip < 32.0) {
                  wwCrease = sharpCreaseDip * (flatVar <= 6.0 ? 1.0 : (1.0 - (flatVar - 6.0) * 0.10));
                }
              }

              const dimEqS2 = (maxSideL < 165.0 && (noiseSigma >= 0.20 || minSideL < 120.0)) ? Math.min(1.95, 165.0 / (maxSideL > 48.0 ? maxSideL : 48.0)) : 1.0;
              const glareEqS2 = (maxSideL >= 230.0 && minSideL >= 216.0 && absStep <= 26.0) ? (1.0 + Math.min(1.25, ((maxSideL - 228.0) / 26.0) * 1.25)) : 1.0;
              const illumEqS2 = dimEqS2 > glareEqS2 ? dimEqS2 : glareEqS2;

              const darkObjS2 = (allowDarkObjectPolarity && L_out - L_in > 35.0 && Math.abs(surfL[cIdx + 6] - surfL[cIdx + 2]) < 8.0) ? (L_out - L_in) * 0.85 : 0.0;
              const macDL = Math.max(0.0, (L_in - L_out) * illumEqS2, flatRimStepS2 * 0.90 * illumEqS2, darkObjS2);
              let wJumpGuard = 1.0;
              if (hasNearPopRim && Math.abs(s) > 7 && (macDC > 28.0 || Math.abs(s) > 18)) {
                wJumpGuard = 0.01;
              }

              const gate = (macDL + 0.62 * macDC * illumEqS2 + 2.8 * wwCrease) * (isInkS2 ? 0.0 : wJumpGuard);
              let sc = 0.0;
              if (gate > 1.5) {
                const step1 = Math.abs(surfL[cIdx + 1] - surfL[cIdx - 1]);
                const step2 = Math.abs(surfL[cIdx + 2] - surfL[cIdx - 2]);
                const maxRawS2 = Math.max(step2 * 1.35 + 6.0, absStep * 1.35 + 6.0, wwCrease * 3.0);
                const raw1 = sameSurfS2 ? step1 : Math.min(maxRawS2, Math.abs(creaseProfL[cIdx + 1] - creaseProfL[cIdx - 1]));
                const raw2 = sameSurfS2 ? step2 : Math.min(maxRawS2, Math.abs(creaseProfL[cIdx + 2] - creaseProfL[cIdx - 2]));
                const dL1 = (0.55 * step1 + 0.45 * raw1) * illumEqS2;
                const dL2 = (0.55 * step2 + 0.45 * raw2) * illumEqS2;
                let dc1Part = 0.0;
                if (!sameSurfS2) {
                  const pr1 = profR[cIdx + 1] - profR[cIdx - 1], pg1 = profG[cIdx + 1] - profG[cIdx - 1], pb1 = profB[cIdx + 1] - profB[cIdx - 1];
                  dc1Part = 0.55 * Math.min(macDC * 1.4 + 8.0, fastNorm3(pr1, pg1, pb1));
                }
                const sr2 = surfR[cIdx + 2] - surfR[cIdx - 2], sg2 = surfG[cIdx + 2] - surfG[cIdx - 2], sb2 = surfB[cIdx + 2] - surfB[cIdx - 2];
                const dC1 = (dc1Part + 0.45 * fastNorm3(sr2, sg2, sb2)) * illumEqS2;
                const peak = (0.60 * dL1 + 0.40 * dL2 + 0.50 * dC1 + 2.6 * wwCrease) * wJumpGuard;
                const prior = 1.0 - priorWeight * (s * s * invSearchRadSq);
                sc = peak * Math.min(1.85, gate / 9.0) * Math.max(0.25, prior);
              }
              scoreMat[rowOff + si] = sc;
            }
          }

          for (let si = 0; si < nStates; si++) {
            const s0 = (si - halfStates) * strideS;
            dpMat[si] = scoreMat[si] - 0.05 * s0 * s0;
            prevMat[si] = si;
          }

          for (let i = 1; i < nProf; i++) {
            const currOff = i * nStates;
            const prevOff = (i - 1) * nStates;
            const maxStepS = isOpenBookSpread ? 8 : 5;
            const cLinS = isOpenBookSpread ? 0.30 : 0.45;
            const cQuadS = isOpenBookSpread ? 0.08 : 0.18;
            for (let si = 0; si < nStates; si++) {
              const spMin = si - maxStepS < 0 ? 0 : si - maxStepS;
              const spMax = si + maxStepS >= nStates ? nStates - 1 : si + maxStepS;
              let bestPrev = si;
              let bestVal = -1e12;
              for (let sp = spMin; sp <= spMax; sp++) {
                const ds = si - sp;
                const absDs = ds < 0 ? -ds : ds;
                const cand = dpMat[prevOff + sp] - (cLinS * absDs + cQuadS * ds * ds);
                if (cand > bestVal) {
                  bestVal = cand;
                  bestPrev = sp;
                }
              }
              dpMat[currOff + si] = scoreMat[currOff + si] + bestVal;
              prevMat[currOff + si] = bestPrev;
            }
          }

          const lastOff = (nProf - 1) * nStates;
          let bestEndSi = halfStates;
          let bestEndScore = -1e12;
          for (let si = 0; si < nStates; si++) {
            const sEnd = (si - halfStates) * strideS;
            const v = dpMat[lastOff + si] - 0.05 * sEnd * sEnd;
            if (v > bestEndScore) {
              bestEndScore = v;
              bestEndSi = si;
            }
          }

          const pathSi = new Int32Array(nProf);
          pathSi[nProf - 1] = bestEndSi;
          for (let i = nProf - 2; i >= 0; i--) {
            pathSi[i] = prevMat[(i + 1) * nStates + pathSi[i + 1]];
          }

          const seamPts = [];
          const wArr = new Float64Array(nProf);
          for (let i = 0; i < nProf; i++) {
            const t = 0.02 + (i / (nProf - 1)) * 0.96;
            const si = pathSi[i];
            const rowOff = i * nStates;
            let sVal = (si - halfStates) * strideS;
            if (si > 0 && si < nStates - 1) {
              const vm = scoreMat[rowOff + si - 1];
              const v0 = scoreMat[rowOff + si];
              const vp = scoreMat[rowOff + si + 1];
              const denom = 2.0 * (2.0 * v0 - vm - vp);
              if (Math.abs(denom) > 1e-4) {
                sVal += Math.max(-0.5, Math.min(0.5, (vm - vp) / denom)) * strideS;
              }
            }
            wArr[i] = Math.max(0.15, scoreMat[rowOff + si]);
            const bx = p1.x * (1.0 - t) + p2.x * t;
            const by = p1.y * (1.0 - t) + p2.y * t;
            const pt = { x: bx + sVal * nx, y: by + sVal * ny, t };
            seamPts.push(pt);
          }

          allSeamPts.push(seamPts);
          allSeamWeights.push(wArr);
          chordLines.push(fitChordLineWithArchGuard(seamPts, p1, p2, 3.2));
        }

        let refinedCorners = idxPairs.map((pair, k) => {
          const pt = intersectAbc(chordLines[pair[0]], chordLines[pair[1]]);
          if (pt) {
            const dx = pt.x - stage1Corners[k].x, dy = pt.y - stage1Corners[k].y;
            if (dx * dx + dy * dy < 4096.0) {
              return {
                x: Math.max(0, Math.min(origW, Math.round(pt.x))),
                y: Math.max(0, Math.min(origH, Math.round(pt.y)))
              };
            }
          }
          return {
            x: Math.max(0, Math.min(origW, Math.round(stage1Corners[k].x))),
            y: Math.max(0, Math.min(origH, Math.round(stage1Corners[k].y)))
          };
        });

        // v59.0 Stage 2B Tight Subpixel Lock (±10px) for single sheets:
        // Re-aligns along the accurate Stage 2A normals to eliminate any residual 1-4px offset on white-on-white & tilted sheets!
        if (!isOpenBookSpread) {
          const fineLines = [];
          const radB = 10;
          const nProfB = 36;
          for (let k = 0; k < 4; k++) {
            const p1 = refinedCorners[k], p2 = refinedCorners[(k + 1) % 4];
            const isFlushB = (k === 2 && p1.y >= origH - 12 && p2.y >= origH - 12) || (k === 3 && p1.x <= 12 && p2.x <= 12);
            if (isFlushB) { fineLines.push(chordLines[k]); continue; }
            const vx = p2.x - p1.x, vy = p2.y - p1.y;
            const segLen = Math.hypot(vx, vy) || 1.0;
            const nx = -vy / segLen, ny = vx / segLen;
            const ptsB = [];
            for (let i = 0; i < nProfB; i++) {
              const t = 0.06 + (i / (nProfB - 1)) * 0.88;
              const bx = p1.x * (1.0 - t) + p2.x * t;
              const by = p1.y * (1.0 - t) + p2.y * t;
              let bestS = 0, bestSc = 0;
              const scArr = new Float32Array(2 * radB + 1);
              for (let s = -radB; s <= radB; s++) {
                const cx = bx + s * nx, cy = by + s * ny;
                const xC = Math.min(origW - 1, Math.max(0, Math.round(cx)));
                const yC = Math.min(origH - 1, Math.max(0, Math.round(cy)));
                const xIn = Math.min(origW - 1, Math.max(0, Math.round(cx + 3 * nx)));
                const yIn = Math.min(origH - 1, Math.max(0, Math.round(cy + 3 * ny)));
                const xOut = Math.min(origW - 1, Math.max(0, Math.round(cx - 3 * nx)));
                const yOut = Math.min(origH - 1, Math.max(0, Math.round(cy - 3 * ny)));
                const iC = (yC * origW + xC) << 2, iIn = (yIn * origW + xIn) << 2, iOut = (yOut * origW + xOut) << 2;
                const lC = 0.299 * fullData[iC] + 0.587 * fullData[iC + 1] + 0.114 * fullData[iC + 2];
                const lIn = 0.299 * fullData[iIn] + 0.587 * fullData[iIn + 1] + 0.114 * fullData[iIn + 2];
                const lOut = 0.299 * fullData[iOut] + 0.587 * fullData[iOut + 1] + 0.114 * fullData[iOut + 2];
                const dR = fullData[iIn] - fullData[iOut], dG = fullData[iIn + 1] - fullData[iOut + 1], dB = fullData[iIn + 2] - fullData[iOut + 2];
                const dC = fastNorm3(dR, dG, dB);
                const step = allowDarkObjectPolarity ? Math.abs(lIn - lOut) : Math.max(0, lIn - lOut);
                const minSide = lIn < lOut ? lIn : lOut;
                const dip = (minSide > 95.0 && Math.abs(lIn - lOut) < 28.0) ? Math.max(0, minSide - lC) : 0.0;
                const isInnerInk = (!allowDarkObjectPolarity && Math.abs(lIn - lOut) < 10.0 && dip > 26.0);
                const sc = isInnerInk ? 0.0 : (step + 0.55 * dC + 2.6 * dip) * (1.0 - 0.015 * Math.abs(s));
                scArr[s + radB] = sc;
                if (sc > bestSc) { bestSc = sc; bestS = s; }
              }
              if (bestSc > 5.0) {
                let subS = bestS;
                const bi = bestS + radB;
                if (bi > 0 && bi < 2 * radB) {
                  const vM = scArr[bi - 1], v0 = scArr[bi], vP = scArr[bi + 1];
                  const den = 2.0 * (2.0 * v0 - vM - vP);
                  if (Math.abs(den) > 1e-4) subS += Math.max(-0.5, Math.min(0.5, (vM - vP) / den));
                }
                ptsB.push({ x: bx + subS * nx, y: by + subS * ny, t });
              }
            }
            fineLines.push(ptsB.length >= 12 ? fitSingleIrlsLine(ptsB) : chordLines[k]);
          }
          refinedCorners = idxPairs.map((pair, k) => {
            const pt = intersectAbc(fineLines[pair[0]], fineLines[pair[1]]);
            if (pt) {
              const dx = pt.x - refinedCorners[k].x, dy = pt.y - refinedCorners[k].y;
              if (dx * dx + dy * dy <= 144.0) {
                return {
                  x: Math.max(0, Math.min(origW, Math.round(pt.x))),
                  y: Math.max(0, Math.min(origH, Math.round(pt.y)))
                };
              }
            }
            return refinedCorners[k];
          });
        }

        const detectedEdgeOffsets = createZeroEdgeOffsets();
        let anyEdgeCurved = false;
        const pi = Math.PI;

        for (let k = 0; k < 4; k++) {
          const p1 = refinedCorners[k];
          const p2 = refinedCorners[(k + 1) % 4];
          const vx = p2.x - p1.x;
          const vy = p2.y - p1.y;
          const segLen = Math.sqrt(vx * vx + vy * vy) || 1.0;
          const nx = -vy / segLen;
          const ny = vx / segLen;
          const seamPts = allSeamPts[k];
          const wArr = allSeamWeights[k];

          const A5 = Array.from({ length: 5 }, (_, r) => {
            const row = new Float64Array(5);
            row[r] = [0.04, 0.09, 0.18, 2.8, 6.5][r];
            return row;
          });
          const b5 = new Float64Array(5);

          let absLinSum = 0, absCurveSum = 0, wSum = 0;
          const sTrueArr = new Float64Array(nProf);

          for (let i = 0; i < nProf; i++) {
            const pt = seamPts[i];
            const t = pt.t;
            const sTrue = (pt.x - p1.x) * nx + (pt.y - p1.y) * ny;
            sTrueArr[i] = sTrue;
            const wgt = wArr[i];
            absLinSum += Math.abs(sTrue) * wgt;
            wSum += wgt;
            const phi = [
              Math.sin(pi * t),
              Math.sin(2.0 * pi * t),
              Math.sin(3.0 * pi * t),
              Math.sin(4.0 * pi * t),
              Math.sin(5.0 * pi * t)
            ];
            for (let r = 0; r < 5; r++) {
              b5[r] += wgt * phi[r] * sTrue;
              for (let c = 0; c < 5; c++) {
                A5[r][c] += wgt * phi[r] * phi[c];
              }
            }
          }

          const coeffs = solveLinearSystem(A5, b5);
          let maxArch = 0;
          for (let i = 0; i < nProf; i++) {
            const t = seamPts[i].t;
            const pred =
              coeffs[0] * Math.sin(pi * t) +
              coeffs[1] * Math.sin(2.0 * pi * t) +
              coeffs[2] * Math.sin(3.0 * pi * t) +
              coeffs[3] * Math.sin(4.0 * pi * t) +
              coeffs[4] * Math.sin(5.0 * pi * t);
            if (Math.abs(pred) > maxArch) maxArch = Math.abs(pred);
            absCurveSum += Math.abs(sTrueArr[i] - pred) * wArr[i];
          }

          const maeLin = absLinSum / (wSum || 1.0);
          const maeCurve = absCurveSum / (wSum || 1.0);

          // v53.0: Compute local-median seam displacement around each of the 5 control points (t = 1/6..5/6)
          // so sharp V-notches right at the center of an open book (t = 0.5) are tracked to the exact tip!
          const nSub = NUM_EDGE_SUBPOINTS || 5;
          const localMedOffs = new Float64Array(nSub);
          let maxLocalArch = 0;
          for (let m = 0; m < nSub; m++) {
            const tTarget = (m + 1) / (nSub + 1);
            // Sample exact Viterbi seam point closest to tTarget (Viterbi path is already DP-smoothed; avoids chopping sharp V-notch tips!)
            let bestIdx = 0, bestDt = 1e9;
            for (let i = 0; i < nProf; i++) {
              const dt = Math.abs(seamPts[i].t - tTarget);
              if (dt < bestDt) { bestDt = dt; bestIdx = i; }
            }
            const exactVal = sTrueArr[bestIdx];
            localMedOffs[m] = exactVal;
            if (Math.abs(exactVal) > maxLocalArch) maxLocalArch = Math.abs(exactVal);
          }

          // v54.0: Only activate automatic curved-rim offsets on genuine open-book spreads (with a real center spine)
          // so a single flat sheet (especially white-on-white!) NEVER gets a fake middle pinch/wave!
          // v55.0: Only curve borders automatically on unmistakable deeply arched open books (>=12px arch + strong center spine)
          if (isOpenBookSpread && (maxArch >= 12.0 || maxLocalArch >= 12.0) && maeCurve < maeLin * 0.62) {
            anyEdgeCurved = true;
            for (let m = 0; m < nSub; m++) {
              const t = (m + 1) / (nSub + 1);
              const sineVal =
                coeffs[0] * Math.sin(pi * t) +
                coeffs[1] * Math.sin(2.0 * pi * t) +
                coeffs[2] * Math.sin(3.0 * pi * t) +
                coeffs[3] * Math.sin(4.0 * pi * t) +
                coeffs[4] * Math.sin(5.0 * pi * t);
              // Blend 75% exact local Viterbi median + 25% smooth harmonic -> hugs sharp center V-notch accurately!
              const off = localMedOffs[m];
              detectedEdgeOffsets[k][m] = {
                x: Math.round(off * nx * 10.0) / 10.0,
                y: Math.round(off * ny * 10.0) / 10.0
              };
            }
          }
        }

        srcCanvas._detectedEdgeOffsets = detectedEdgeOffsets;
        srcCanvas._hasCurvedRim = anyEdgeCurved;
        srcCanvas._detectedSpine = detectBookSpineDivider(srcCanvas, refinedCorners);
        return refinedCorners;
      }

      // v51.0 Center Spine / Gutter Divider Detector for Open 2-Page Books:
      // Scans vertical (for wide spreads) or horizontal (for rotated spreads) profiles across the middle 34%..66%
      // of the document quad to find the dark center crease/valley separating left & right book pages!
      function detectBookSpineDivider(srcCanvas, corners) {
        if (!srcCanvas || !corners || corners.length !== 4) return null;
        const w = srcCanvas.width, h = srcCanvas.height;
        const data = getCachedSrcImageData(srcCanvas);
        if (!data) return null;

        const topW = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
        const botW = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
        const leftH = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
        const rightH = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);
        const avgW = 0.5 * (topW + botW);
        const avgH = 0.5 * (leftH + rightH);
        if (avgW < 120 || avgH < 120) return null;

        // v54.0: Only landscape 2-page open-book spreads (avgW >= avgH * 1.05) have an automatic vertical center spine!
        // Prevents portrait single sheets (with horizontal text lines) from ever triggering false spine detection!
        if (avgW < avgH * 1.05) return null;
        const isVerticalSpine = true;
        const N_SCAN = 64;
        const N_ALONG = 28;
        const prof = new Float32Array(N_SCAN);
        const c0 = corners[0], c1 = corners[1], c2 = corners[2], c3 = corners[3];

        for (let i = 0; i < N_SCAN; i++) {
          const u = 0.15 + (i / (N_SCAN - 1)) * 0.70; // scan 15%..85%
          let sumL = 0;
          for (let j = 0; j < N_ALONG; j++) {
            const v = 0.08 + (j / (N_ALONG - 1)) * 0.84;
            const tu = isVerticalSpine ? u : v;
            const tv = isVerticalSpine ? v : u;
            const px = (c0.x * (1 - tu) + c1.x * tu) * (1 - tv) + (c3.x * (1 - tu) + c2.x * tu) * tv;
            const py = (c0.y * (1 - tu) + c1.y * tu) * (1 - tv) + (c3.y * (1 - tu) + c2.y * tu) * tv;
            const ix = Math.min(w - 1, Math.max(0, px | 0));
            const iy = Math.min(h - 1, Math.max(0, py | 0));
            const idx4 = (iy * w + ix) << 2;
            sumL += 0.299 * data[idx4] + 0.587 * data[idx4 + 1] + 0.114 * data[idx4 + 2];
          }
          prof[i] = sumL / N_ALONG;
        }

        // Smooth profile lightly & find strongest valley in middle 35%..65% (indices ~18..46)
        let bestIdx = -1, bestDip = 0, bestValleyL = 255;
        const iStart = Math.floor(N_SCAN * 0.28);
        const iEnd = Math.floor(N_SCAN * 0.72);
        for (let i = iStart; i <= iEnd; i++) {
          const leftRef = 0.5 * (prof[Math.max(0, i - 6)] + prof[Math.max(0, i - 10)]);
          const rightRef = 0.5 * (prof[Math.min(N_SCAN - 1, i + 6)] + prof[Math.min(N_SCAN - 1, i + 10)]);
          const sideMin = leftRef < rightRef ? leftRef : rightRef;
          const dip = sideMin - prof[i];
          if (dip > bestDip) {
            bestDip = dip;
            bestIdx = i;
            bestValleyL = prof[i];
          }
        }

        // Require a genuine wide dark book-spine valley (>= 28 luminance dip below BOTH left & right page paper!)
        if (bestIdx < 0 || bestDip < 28.0) return null;

        // Verify valley continuity along the spine (at least 60% of vertical slices must be darker than sides)
        const uSpine = 0.15 + (bestIdx / (N_SCAN - 1)) * 0.70;
        let contHits = 0;
        for (let j = 0; j < N_ALONG; j++) {
          const v = 0.08 + (j / (N_ALONG - 1)) * 0.84;
          const sampleL = (uVal) => {
            const tu = isVerticalSpine ? uVal : v;
            const tv = isVerticalSpine ? v : uVal;
            const px = (c0.x * (1 - tu) + c1.x * tu) * (1 - tv) + (c3.x * (1 - tu) + c2.x * tu) * tv;
            const py = (c0.y * (1 - tu) + c1.y * tu) * (1 - tv) + (c3.y * (1 - tu) + c2.y * tu) * tv;
            const ix = Math.min(w - 1, Math.max(0, px | 0));
            const iy = Math.min(h - 1, Math.max(0, py | 0));
            const idx4 = (iy * w + ix) << 2;
            return 0.299 * data[idx4] + 0.587 * data[idx4 + 1] + 0.114 * data[idx4 + 2];
          };
          const cL = sampleL(uSpine);
          const sL = sampleL(Math.max(0.05, uSpine - 0.09));
          const sR = sampleL(Math.min(0.95, uSpine + 0.09));
          if (Math.min(sL, sR) - cL >= 9.0) contHits++;
        }
        if (contHits < N_ALONG * 0.58) return null;

        return {
          orientation: isVerticalSpine ? "vertical" : "horizontal",
          t: uSpine,
          dip: Math.round(bestDip),
          valleyL: Math.round(bestValleyL)
        };
      }

      // =========================================================================
      // 5. v16.0 3D PERSPECTIVE + 2-STAGE 1D PROFILE NCC HARMONIC TEXT-LINE &
      //    CYLINDRICAL PAGE DEWARPING (STRAIGHTENS BOTH CURVED PAGE & TEXT LINES!)
      // =========================================================================
      function solveLinearSystem(A_in, b_in) {
        const n = b_in.length;
        const A = A_in.map((row) => Float64Array.from(row));
        const b = Float64Array.from(b_in);
        for (let i = 0; i < n; i++) {
          let maxRow = i;
          let maxVal = Math.abs(A[i][i]);
          for (let k = i + 1; k < n; k++) {
            if (Math.abs(A[k][i]) > maxVal) {
              maxVal = Math.abs(A[k][i]);
              maxRow = k;
            }
          }
          const tmpR = A[i]; A[i] = A[maxRow]; A[maxRow] = tmpR;
          const tmpB = b[i]; b[i] = b[maxRow]; b[maxRow] = tmpB;
          const piv = A[i][i] || 1e-12;
          for (let j = i; j < n; j++) A[i][j] /= piv;
          b[i] /= piv;
          for (let k = 0; k < n; k++) {
            if (k !== i) {
              const f = A[k][i];
              for (let j = i; j < n; j++) A[k][j] -= f * A[i][j];
              b[k] -= f * b[i];
            }
          }
        }
        return b;
      }

      function computeHomography(srcPts, dstPts) {
        const A = [];
        const b = [];
        for (let i = 0; i < 4; i++) {
          const x = srcPts[i].x, y = srcPts[i].y;
          const u = dstPts[i].x, v = dstPts[i].y;
          A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]);
          b.push(u);
          A.push([0, 0, 0, x, y, 1, -x * v, -y * v]);
          b.push(v);
        }
        const h = solveLinearSystem(A, b);
        return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
      }

      // Pure Dirichlet Sine Basis on x in [0, 1]: vanishes strictly at both left (x=0) and right (x=1) page borders!
      // - sin(pi*x): single-page cylindrical arch
      // - sin(2*pi*x): asymmetric 2-page book arch
      // - sin(3*pi*x): symmetric 2-page open book M-arch (arches on left/right pages, dips at central spine x=0.5)
      // Eliminates cosine boundary steps & high-frequency 4*pi ripples that caused wavy lines on flat paper!
      function evalCoupledHorizBasis5(u) {
        const pi = Math.PI;
        return [
          u - 0.5,
          Math.sin(pi * u),
          Math.sin(2.0 * pi * u),
          Math.sin(3.0 * pi * u),
          Math.sin(4.0 * pi * u)
        ];
      }

      function evalVertBasis3(v) {
        const u = v - 0.5;
        return [1.0, u, u * u - (1.0 / 12.0)];
      }

      function estimate2DBookSurfaceModes(rgbaData, dstW, dstH) {
        const M = 32;
        const subW = M * 6; // 192
        const Hs = 320;
        const scaleY = dstH / Hs;

        // 1. Dark-preserving vertical min downsampling to (subW x Hs) so thin 1-2px ruled lines & fine text are NEVER aliased away!
        const L0 = new Float32Array(subW * Hs);
        const yStepHalf = Math.max(1, Math.floor(scaleY * 0.5));
        for (let sy = 0; sy < Hs; sy++) {
          const yc = Math.min(dstH - 1, Math.round((sy / (Hs - 1)) * (dstH - 1)));
          const yLo = yc - yStepHalf > 0 ? yc - yStepHalf : 0;
          const yHi = yc + yStepHalf < dstH - 1 ? yc + yStepHalf : dstH - 1;
          const rLo = yLo * dstW, rMid = yc * dstW, rHi = yHi * dstW;
          const sOff = sy * subW;
          for (let sx = 0; sx < subW; sx++) {
            const x = Math.min(dstW - 1, Math.round((sx / (subW - 1)) * (dstW - 1)));
            const i0 = (rMid + x) << 2;
            let minL = 0.299 * rgbaData[i0] + 0.587 * rgbaData[i0 + 1] + 0.114 * rgbaData[i0 + 2];
            if (yLo !== yc) {
              const i1 = (rLo + x) << 2;
              const l1 = 0.299 * rgbaData[i1] + 0.587 * rgbaData[i1 + 1] + 0.114 * rgbaData[i1 + 2];
              if (l1 < minL) minL = l1;
            }
            if (yHi !== yc) {
              const i2 = (rHi + x) << 2;
              const l2 = 0.299 * rgbaData[i2] + 0.587 * rgbaData[i2 + 1] + 0.114 * rgbaData[i2 + 2];
              if (l2 < minL) minL = l2;
            }
            L0[sOff + sx] = minL;
          }
        }

        // 2. Local Illumination-Normalized Dual-Channel Feature Extraction (so shadowed bottom halves have 100% equal contrast!)
        const L_bg = new Float32Array(subW * Hs);
        const L_hClose = new Float32Array(subW * Hs);
        const tmpH = new Float32Array(subW * Hs);
        for (let sy = 0; sy < Hs; sy++) {
          const sOff = sy * subW;
          for (let sx = 0; sx < subW; sx++) {
            const x0 = sx - 2 > 0 ? sx - 2 : 0;
            const x1 = sx + 2 < subW - 1 ? sx + 2 : subW - 1;
            let mv = 1e9;
            for (let nx = x0; nx <= x1; nx++) {
              if (L0[sOff + nx] < mv) mv = L0[sOff + nx];
            }
            tmpH[sOff + sx] = mv;

            const bx0 = sx - 10 > 0 ? sx - 10 : 0;
            const bx1 = sx + 10 < subW - 1 ? sx + 10 : subW - 1;
            let bgM = 70.0;
            for (let nx = bx0; nx <= bx1; nx += 2) {
              if (L0[sOff + nx] > bgM) bgM = L0[sOff + nx];
            }
            L_bg[sOff + sx] = bgM;
          }
          for (let sx = 0; sx < subW; sx++) {
            const x0 = sx - 2 > 0 ? sx - 2 : 0;
            const x1 = sx + 2 < subW - 1 ? sx + 2 : subW - 1;
            let mv = -1e9;
            for (let nx = x0; nx <= x1; nx++) {
              if (tmpH[sOff + nx] > mv) mv = tmpH[sOff + nx];
            }
            L_hClose[sOff + sx] = mv;
          }
        }

        const E_raw = new Float32Array(subW * Hs);
        const E0 = new Float32Array(subW * Hs);
        const my = Math.floor(Hs * 0.025);
        const mx = Math.floor(subW * 0.035);
        for (let sy = Math.max(3, my); sy < Hs - Math.max(3, my); sy++) {
          const sOff = sy * subW;
          const up2 = (sy - 2) * subW, dn2 = (sy + 2) * subW;
          const up3 = (sy - 3) * subW, dn3 = (sy + 3) * subW;
          for (let sx = mx; sx < subW - mx; sx++) {
            const normGain = 225.0 / L_bg[sOff + sx];
            const diffText = Math.max(0.0, 0.5 * (L0[up3 + sx] + L0[dn3 + sx]) - L0[sOff + sx]);
            const diffRule = Math.max(0.0, 0.5 * (L_hClose[up2 + sx] + L_hClose[dn2 + sx]) - L_hClose[sOff + sx]);
            E_raw[sOff + sx] = (0.55 * diffText + 0.45 * diffRule) * normGain;
          }
        }
        for (let sy = Math.max(4, my); sy < Hs - Math.max(4, my); sy++) {
          const sOff = sy * subW;
          const dn2 = (sy + 2) * subW;
          for (let sx = mx; sx < subW - mx; sx++) {
            const baseDrop = Math.max(0.0, E_raw[sOff + sx] - E_raw[dn2 + sx]);
            E0[sOff + sx] = E_raw[sOff + sx] + 0.55 * baseDrop;
          }
        }

        // 3. Build M = 32 overlapping 1D vertical projection profiles P[k * Hs + sy]
        const P = new Float64Array(M * Hs);
        const rawP = new Float64Array(Hs);
        for (let k = 0; k < M; k++) {
          const x0 = Math.max(mx, k * 6 - 4);
          const x1 = Math.min(subW - 1 - mx, (k + 1) * 6 + 3);
          if (x1 < x0) continue;
          const span = x1 - x0 + 1;
          for (let sy = 0; sy < Hs; sy++) {
            let s = 0;
            const sOff = sy * subW;
            for (let sx = x0; sx <= x1; sx++) s += E0[sOff + sx];
            rawP[sy] = s / span;
          }
          const kOff = k * Hs;
          for (let sy = 0; sy < Hs; sy++) {
            const y0 = Math.max(0, sy - 7), y1 = Math.min(Hs - 1, sy + 7);
            let m = 0;
            for (let ny = y0; ny <= y1; ny++) m += rawP[ny];
            m /= (y1 - y0 + 1);
            P[kOff + sy] = Math.max(0.0, rawP[sy] - m);
          }
        }

        // 4. v62.0 8-Strip Coupled 2D Vertical Mesh (each strip independently tracks its own local curve, smoothly coupled in y!)
        // Solves piecewise bottom-only bends, opposite top/bottom conical curls, and shadowed bottom halves!
        const K = 4; // [u-0.5, sin(pi*u), sin(2*pi*u), sin(3*pi*u)] — strictly zero 4-cycle wave artifacts!
        const B_cols = [];
        for (let k = 0; k < M; k++) {
          const b5 = evalCoupledHorizBasis5(k / (M - 1));
          B_cols.push([b5[0], b5[1], b5[2], b5[3]]);
        }

        const strips = [
          [0.02, 0.22, 0.11],
          [0.12, 0.32, 0.22],
          [0.24, 0.44, 0.34],
          [0.36, 0.56, 0.46],
          [0.48, 0.68, 0.58],
          [0.60, 0.80, 0.70],
          [0.72, 0.92, 0.82],
          [0.80, 0.98, 0.90]
        ];
        const NZ = strips.length; // 8
        const nParams = NZ * K;   // 32

        const regH = [0.0012, 0.0055, 0.015, 0.040];
        const lambdaV = [0.02, 0.05, 0.10, 0.20];
        const A_sys = Array.from({ length: nParams }, (_, r) => {
          const row = new Float64Array(nParams);
          const hm = r % K;
          row[r] = regH[hm];
          return row;
        });
        const b_sys = new Float64Array(nParams);

        // Smooth vertical coupling between adjacent strips z and z-1
        for (let z = 1; z < NZ; z++) {
          for (let hm = 0; hm < K; hm++) {
            const r0 = (z - 1) * K + hm;
            const r1 = z * K + hm;
            const lv = lambdaV[hm];
            A_sys[r0][r0] += lv;
            A_sys[r1][r1] += lv;
            A_sys[r0][r1] -= lv;
            A_sys[r1][r0] -= lv;
          }
        }

        const maxD1 = 5; // strictly cycle-safe against 7-9px book line spacing!
        const corrs = new Float64Array(2 * maxD1 + 1);
        const corrsSorted = new Float64Array(2 * maxD1 + 1);
        const norms = new Float64Array(M);
        const step1Shift = new Float64Array(M);
        const step1Valid = new Uint8Array(M);
        const dB = new Float64Array(K);
        const Az = Array.from({ length: K }, () => new Float64Array(K));
        const bz = new Float64Array(K);
        let totalMatchedPairs = 0;

        for (let z = 0; z < NZ; z++) {
          const ya = Math.max(6, Math.floor(Hs * strips[z][0]));
          const yb = Math.min(Hs - 6, Math.floor(Hs * strips[z][1]));
          if (yb - ya < 16) continue;

          let maxNorm = 0;
          for (let k = 0; k < M; k++) {
            const kOff = k * Hs;
            let sq = 0;
            for (let y = ya; y < yb; y++) {
              const v = P[kOff + y];
              sq += v * v;
            }
            norms[k] = Math.sqrt(sq);
            if (norms[k] > maxNorm) maxNorm = norms[k];
            step1Shift[k] = 0;
            step1Valid[k] = 0;
          }
          if (maxNorm < 1e-3) continue;

          for (let r = 0; r < K; r++) { bz[r] = 0; Az[r].fill(0); }
          let stripPairs = 0;
          let stripWeightSum = 0;

          // Pass 1: step = 1 (adjacent columns)
          for (let k = 1; k < M; k++) {
            const kp = k - 1;
            if (norms[k] < 0.14 * maxNorm || norms[kp] < 0.14 * maxNorm) continue;
            const prevOff = kp * Hs, currOff = k * Hs, normPrev = norms[kp];
            let bestI = maxD1, bestC = -1.0, bestScore = -1.0;
            for (let di = 0; di <= 2 * maxD1; di++) {
              const d = di - maxD1;
              let dot = 0, normSegSq = 0;
              for (let y = ya; y < yb; y++) {
                const y2 = y + d;
                if (y2 < 0 || y2 >= Hs) continue;
                const vp = P[prevOff + y];
                const vc = P[currOff + y2];
                dot += vp * vc;
                normSegSq += vc * vc;
              }
              const cVal = dot / (normPrev * (Math.sqrt(normSegSq) + 1e-6));
              corrs[di] = cVal;
              corrsSorted[di] = cVal;
              const sc = cVal * (1.0 - 0.015 * Math.abs(d));
              if (sc > bestScore) { bestScore = sc; bestC = cVal; bestI = di; }
            }
            corrsSorted.sort();
            const medC = corrsSorted[maxD1];
            if (bestC > 0.36 && (bestC - medC) > 0.085) {
              let bestD = bestI - maxD1;
              if (bestI > 0 && bestI < 2 * maxD1) {
                const vm = corrs[bestI - 1], v0 = corrs[bestI], vp = corrs[bestI + 1];
                const denom = 2.0 * (2.0 * v0 - vm - vp);
                if (Math.abs(denom) > 1e-9) bestD += Math.max(-0.5, Math.min(0.5, (vm - vp) / denom));
              }
              step1Shift[k] = bestD;
              step1Valid[k] = 1;
              const deltaPx = bestD * scaleY;
              const w = (bestC - medC) * bestC * bestC;
              stripPairs++;
              stripWeightSum += w;
              const Bk = B_cols[k], Bkp = B_cols[kp];
              for (let hm = 0; hm < K; hm++) dB[hm] = Bk[hm] - Bkp[hm];
              for (let r = 0; r < K; r++) {
                const wdBr = w * dB[r];
                bz[r] += wdBr * deltaPx;
                for (let c = 0; c < K; c++) Az[r][c] += wdBr * dB[c];
              }
            }
          }

          // Pass 2: multi-span steps = 2, 4, 6 guided by step1Shift
          const winR = 4;
          const winLen = 2 * winR + 1;
          const winCorrs = new Float64Array(winLen);
          const winSorted = new Float64Array(winLen);
          const multiSteps = [2, 4, 6];
          for (let si = 0; si < multiSteps.length; si++) {
            const step = multiSteps[si];
            for (let k = step; k < M; k++) {
              const kp = k - step;
              if (norms[k] < 0.14 * maxNorm || norms[kp] < 0.14 * maxNorm) continue;
              let sumPred = 0, cntPred = 0;
              for (let j = kp + 1; j <= k; j++) {
                if (step1Valid[j]) { sumPred += step1Shift[j]; cntPred++; }
              }
              const dCenter = cntPred > 0 ? Math.max(-24, Math.min(24, Math.round((sumPred / cntPred) * step))) : 0;
              const prevOff = kp * Hs, currOff = k * Hs, normPrev = norms[kp];
              let bestWi = winR, bestC = -1.0;
              for (let wi = 0; wi < winLen; wi++) {
                const d = dCenter + (wi - winR);
                let dot = 0, normSegSq = 0;
                for (let y = ya; y < yb; y++) {
                  const y2 = y + d;
                  if (y2 < 0 || y2 >= Hs) continue;
                  const vp = P[prevOff + y];
                  const vc = P[currOff + y2];
                  dot += vp * vc;
                  normSegSq += vc * vc;
                }
                const cVal = dot / (normPrev * (Math.sqrt(normSegSq) + 1e-6));
                winCorrs[wi] = cVal;
                winSorted[wi] = cVal;
                if (cVal > bestC) { bestC = cVal; bestWi = wi; }
              }
              winSorted.sort();
              const medC = winSorted[winR];
              if (bestC > 0.38 && (bestC - medC) > 0.08) {
                let bestD = dCenter + (bestWi - winR);
                if (bestWi > 0 && bestWi < winLen - 1) {
                  const vm = winCorrs[bestWi - 1], v0 = winCorrs[bestWi], vp = winCorrs[bestWi + 1];
                  const denom = 2.0 * (2.0 * v0 - vm - vp);
                  if (Math.abs(denom) > 1e-9) bestD += Math.max(-0.5, Math.min(0.5, (vm - vp) / denom));
                }
                const deltaPx = bestD * scaleY;
                const w = ((bestC - medC) * bestC * bestC) / Math.pow(step, 0.55);
                stripPairs++;
                stripWeightSum += w;
                const Bk = B_cols[k], Bkp = B_cols[kp];
                for (let hm = 0; hm < K; hm++) dB[hm] = Bk[hm] - Bkp[hm];
                for (let r = 0; r < K; r++) {
                  const wdBr = w * dB[r];
                  bz[r] += wdBr * deltaPx;
                  for (let c = 0; c < K; c++) Az[r][c] += wdBr * dB[c];
                }
              }
            }
          }

          if (stripPairs >= 3 && stripWeightSum > 1e-6) {
            // Normalize every strip's total weight so sparse bottom strips have EQUAL authority to dense top strips!
            const zScale = Math.min(4.0, Math.max(0.75, 10.0 / stripWeightSum));
            totalMatchedPairs += stripPairs;
            const baseR = z * K;
            for (let r = 0; r < K; r++) {
              b_sys[baseR + r] += bz[r] * zScale;
              const rowA = A_sys[baseR + r];
              for (let c = 0; c < K; c++) rowA[baseR + c] += Az[r][c] * zScale;
            }
          }
        }

        if (totalMatchedPairs < 10) {
          return null;
        }

        const coeffs = solveLinearSystem(A_sys, b_sys);
        const stripCenters = strips.map((s) => s[2]);
        const stripCurves = Array.from({ length: NZ }, () => new Float32Array(dstW));
        const mode0 = new Float32Array(dstW);
        const mode1 = new Float32Array(dstW);
        let maxSurfaceDisp = 0;

        for (let x = 0; x < dstW; x++) {
          const u = x / Math.max(1, dstW - 1);
          const b5 = evalCoupledHorizBasis5(u);
          let sumAll = 0;
          for (let z = 0; z < NZ; z++) {
            const baseR = z * K;
            const val = b5[0] * coeffs[baseR] + b5[1] * coeffs[baseR + 1] + b5[2] * coeffs[baseR + 2] + b5[3] * coeffs[baseR + 3];
            stripCurves[z][x] = val;
            sumAll += val;
            const av = val < 0 ? -val : val;
            if (av > maxSurfaceDisp) maxSurfaceDisp = av;
          }
          mode0[x] = sumAll / NZ;
          mode1[x] = stripCurves[NZ - 1][x] - stripCurves[0][x];
        }

        if (maxSurfaceDisp < 1.2) return null;

        const shrinkGain = Math.min(1.0, (maxSurfaceDisp - 0.8) / 1.5);
        for (let x = 0; x < dstW; x++) {
          mode0[x] *= shrinkGain;
          mode1[x] *= shrinkGain;
          for (let z = 0; z < NZ; z++) stripCurves[z][x] *= shrinkGain;
        }

        return { stripCurves, stripCenters, mode0, mode1, horizShiftY: new Float32Array(dstH), maxSurfaceDisp, coeffs };
      }

      function createZeroEdgeOffsets() {
        return [0, 1, 2, 3].map(() =>
          Array.from({ length: NUM_EDGE_SUBPOINTS }, () => ({ x: 0, y: 0 }))
        );
      }

      function cloneEdgeOffsets(edgeOffsets) {
        if (!edgeOffsets || edgeOffsets.length !== 4) return createZeroEdgeOffsets();
        return edgeOffsets.map((edge) =>
          Array.from({ length: NUM_EDGE_SUBPOINTS }, (_, m) => ({
            x: (edge && edge[m] && edge[m].x) || 0,
            y: (edge && edge[m] && edge[m].y) || 0
          }))
        );
      }

      // Exact 5-Sine Harmonic (DST-I) Interpolation through the 5 intermediate points
      // (t = 1/6, 2/6, 3/6, 4/6, 5/6) on an edge.
      // Guarantees Delta(0)=0, Delta((m+1)/6)=edge5Pts[m] for m=0..4, and Delta(1)=0!
      function evalEdge3PointOffset(edge5Pts, t) {
        if (!edge5Pts || edge5Pts.length < NUM_EDGE_SUBPOINTS) return { x: 0, y: 0 };
        if (t <= 0.0 || t >= 1.0) return { x: 0, y: 0 };
        // 7 knots at u = 0, 1/6, 2/6, 3/6, 4/6, 5/6, 1 with zero-overshoot monotone Hermite tangents (ZERO Gibbs ringing!)
        const u = t * 6.0;
        const seg = u >= 5.9999 ? 5 : (u | 0);
        const s = u - seg;
        const getX = (idx) => (idx <= 0 || idx >= 6) ? 0.0 : edge5Pts[idx - 1].x;
        const getY = (idx) => (idx <= 0 || idx >= 6) ? 0.0 : edge5Pts[idx - 1].y;
        const pchipSlope = (vm, v0, vp) => {
          const d0 = v0 - vm, d1 = vp - v0;
          if (d0 * d1 <= 0.0) return 0.0; // local extremum (e.g. sharp V-notch tip!) -> zero overshoot!
          return (2.0 * d0 * d1) / (d0 + d1);
        };
        const x0 = getX(seg), x1 = getX(seg + 1);
        const y0 = getY(seg), y1 = getY(seg + 1);
        const mx0 = seg === 0 ? (x1 - x0) : pchipSlope(getX(seg - 1), x0, x1);
        const mx1 = seg === 5 ? (x1 - x0) : pchipSlope(x0, x1, getX(seg + 2));
        const my0 = seg === 0 ? (y1 - y0) : pchipSlope(getY(seg - 1), y0, y1);
        const my1 = seg === 5 ? (y1 - y0) : pchipSlope(y0, y1, getY(seg + 2));
        const s2 = s * s, s3 = s2 * s;
        const h00 = 2.0 * s3 - 3.0 * s2 + 1.0;
        const h10 = s3 - 2.0 * s2 + s;
        const h01 = -2.0 * s3 + 3.0 * s2;
        const h11 = s3 - s2;
        return {
          x: h00 * x0 + h10 * mx0 + h01 * x1 + h11 * mx1,
          y: h00 * y0 + h10 * my0 + h01 * y1 + h11 * my1
        };
      }

      let _dewarpTempPool = null;
      function dewarpQuad(srcCanvas, quadCorners, paperSizeMode, edgeOffsets, bookCurvePct, autoLineDewarp, cachedModesHost, previewMaxSide) {
        const topW = Math.hypot(quadCorners[1].x - quadCorners[0].x, quadCorners[1].y - quadCorners[0].y);
        const botW = Math.hypot(quadCorners[2].x - quadCorners[3].x, quadCorners[2].y - quadCorners[3].y);
        const leftH = Math.hypot(quadCorners[3].x - quadCorners[0].x, quadCorners[3].y - quadCorners[0].y);
        const rightH = Math.hypot(quadCorners[2].x - quadCorners[1].x, quadCorners[2].y - quadCorners[1].y);

        const kw = Math.max(topW, botW) / Math.max(1.0, Math.min(topW, botW));
        const kh = Math.max(leftH, rightH) / Math.max(1.0, Math.min(leftH, rightH));
        const tiltBoostH = Math.sqrt(1.0 + 2.6 * Math.pow(kw - 1.0, 1.15));
        const tiltBoostW = Math.sqrt(1.0 + 2.6 * Math.pow(kh - 1.0, 1.15));

        const corrW = Math.max(topW, botW) * tiltBoostW;
        const corrH = Math.max(leftH, rightH) * tiltBoostH;
        let ratioHW = corrH / Math.max(1.0, corrW);

        if (paperSizeMode === "a4_portrait" || paperSizeMode === "a5") {
          ratioHW = 1.4142;
        } else if (paperSizeMode === "a4_landscape") {
          ratioHW = 1.0 / 1.4142;
        } else if (paperSizeMode === "letter") {
          ratioHW = 11.0 / 8.5;
        } else {
          if (ratioHW >= 0.90 && ratioHW <= 1.88) {
            ratioHW = 1.4142;
          } else if (ratioHW >= 0.58 && ratioHW < 0.90) {
            ratioHW = 1.0 / 1.4142;
          }
        }

        let dstW = Math.round(Math.max(topW, botW, 760));
        let dstH = Math.round(dstW * ratioHW);

        const maxSide = previewMaxSide || 1500;
        if (Math.max(dstW, dstH) > maxSide) {
          const sc = maxSide / Math.max(dstW, dstH);
          dstW = Math.round(dstW * sc);
          dstH = Math.round(dstH * sc);
        }
        dstW = Math.max(160, dstW);
        dstH = Math.max(160, dstH);

        const dstPts = [
          { x: 0, y: 0 },
          { x: dstW - 1, y: 0 },
          { x: dstW - 1, y: dstH - 1 },
          { x: 0, y: dstH - 1 }
        ];

        const H = computeHomography(dstPts, quadCorners);
        const sW = srcCanvas.width;
        const sH = srcCanvas.height;
        const sData = getCachedSrcImageData(srcCanvas);

        const eOff = edgeOffsets && edgeOffsets.length === 4 ? edgeOffsets : createZeroEdgeOffsets();
        let maxEdgeOff = 0;
        for (let ei = 0; ei < 4; ei++) {
          for (let si = 0; si < NUM_EDGE_SUBPOINTS; si++) {
            const pt = eOff[ei][si];
            if (pt) {
              const m = Math.abs(pt.x) + Math.abs(pt.y);
              if (m > maxEdgeOff) maxEdgeOff = m;
            }
          }
        }
        const hasEdgeOffsets = maxEdgeOff > 0.3;

        // Precompute 1D Homography & Coons Patch edge displacement tables for O(1) inner loop
        const H0u = new Float32Array(dstW);
        const H3u = new Float32Array(dstW);
        const H6u = new Float32Array(dstW);
        const txArr = new Float32Array(dstW);
        const topOffX = new Float32Array(dstW);
        const topOffY = new Float32Array(dstW);
        const botOffX = new Float32Array(dstW);
        const botOffY = new Float32Array(dstW);
        const leftOffX = new Float32Array(dstH);
        const leftOffY = new Float32Array(dstH);
        const rightOffX = new Float32Array(dstH);
        const rightOffY = new Float32Array(dstH);

        const invDstW1 = 1.0 / Math.max(1, dstW - 1);
        const invDstH1 = 1.0 / Math.max(1, dstH - 1);

        for (let u = 0; u < dstW; u++) {
          H0u[u] = H[0] * u + H[2];
          H3u[u] = H[3] * u + H[5];
          H6u[u] = H[6] * u + 1.0;
          const tx = u * invDstW1;
          txArr[u] = tx;
          if (hasEdgeOffsets) {
            const tTop = evalEdge3PointOffset(eOff[0], tx);
            const tBot = evalEdge3PointOffset(eOff[2], 1.0 - tx);
            topOffX[u] = tTop.x; topOffY[u] = tTop.y;
            botOffX[u] = tBot.x; botOffY[u] = tBot.y;
          }
        }
        if (hasEdgeOffsets) {
          for (let v = 0; v < dstH; v++) {
            const ty = v * invDstH1;
            const tRight = evalEdge3PointOffset(eOff[1], ty);
            const tLeft  = evalEdge3PointOffset(eOff[3], 1.0 - ty);
            rightOffX[v] = tRight.x; rightOffY[v] = tRight.y;
            leftOffX[v]  = tLeft.x;  leftOffY[v]  = tLeft.y;
          }
        }

        const bookGain = (bookCurvePct || 0) / 100.0;
        const hasBookGain = Math.abs(bookGain) > 0.01;
        const manualArchX = new Float32Array(dstW);
        if (hasBookGain) {
          const scaleY = dstH / 680.0;
          for (let u = 0; u < dstW; u++) {
            const xn = txArr[u];
            manualArchX[u] = bookGain * scaleY * (20.0 * Math.sin(Math.PI * xn) - 14.0 * Math.cos(2.0 * Math.PI * xn) - 8.0 * Math.cos(4.0 * Math.PI * xn));
          }
        }

        const needBytes = dstW * dstH * 4;
        if (!_dewarpTempPool || _dewarpTempPool.length < needBytes) {
          _dewarpTempPool = new Uint8ClampedArray(needBytes);
        }
        const tempData = _dewarpTempPool.subarray(0, needBytes);

        for (let v = 0; v < dstH; v++) {
          const ty = v * invDstH1;
          const oneMinusTy = 1.0 - ty;
          const lOx = leftOffX[v], lOy = leftOffY[v];
          const rOx = rightOffX[v], rOy = rightOffY[v];
          const vertPinch = 1.0 - 1.35 * (ty - 0.5);
          const H1v = H[1] * v;
          const H4v = H[4] * v;
          const H7v = H[7] * v;
          for (let u = 0; u < dstW; u++) {
            const invDenom = 1.0 / (H6u[u] + H7v);
            let sx = (H0u[u] + H1v) * invDenom;
            let sy = (H3u[u] + H4v) * invDenom;

            if (hasEdgeOffsets) {
              const tx = txArr[u];
              sx += oneMinusTy * topOffX[u] + ty * botOffX[u] + (1.0 - tx) * lOx + tx * rOx;
              sy += oneMinusTy * topOffY[u] + ty * botOffY[u] + (1.0 - tx) * lOy + tx * rOy;
            }

            if (hasBookGain) {
              sy -= vertPinch * manualArchX[u];
            }

            const di = (v * dstW + u) * 4;
            if (sx >= 0 && sx < sW - 1 && sy >= 0 && sy < sH - 1) {
              const x0 = sx | 0;
              const y0 = sy | 0;
              const dx = sx - x0;
              const dy = sy - y0;

              const i00 = (y0 * sW + x0) * 4;
              const i10 = i00 + 4;
              const i01 = i00 + sW * 4;
              const i11 = i01 + 4;

              const w00 = (1 - dx) * (1 - dy);
              const w10 = dx * (1 - dy);
              const w01 = (1 - dx) * dy;
              const w11 = dx * dy;

              tempData[di]     = sData[i00] * w00 + sData[i10] * w10 + sData[i01] * w01 + sData[i11] * w11;
              tempData[di + 1] = sData[i00 + 1] * w00 + sData[i10 + 1] * w10 + sData[i01 + 1] * w01 + sData[i11 + 1] * w11;
              tempData[di + 2] = sData[i00 + 2] * w00 + sData[i10 + 2] * w10 + sData[i01 + 2] * w01 + sData[i11 + 2] * w11;
              tempData[di + 3] = 255;
            } else {
              tempData[di] = 255;
              tempData[di + 1] = 255;
              tempData[di + 2] = 255;
              tempData[di + 3] = 255;
            }
          }
        }

        let outCanvas = (cachedModesHost && cachedModesHost.dewarpedCanvas) ? cachedModesHost.dewarpedCanvas : document.createElement("canvas");
        if (outCanvas.width !== dstW) outCanvas.width = dstW;
        if (outCanvas.height !== dstH) outCanvas.height = dstH;
        const outCtx = outCanvas.getContext("2d");
        if (!outCanvas._reusableOutImg || outCanvas._reusableOutImg.width !== dstW || outCanvas._reusableOutImg.height !== dstH) {
          outCanvas._reusableOutImg = outCtx.createImageData(dstW, dstH);
        }
        const outImg = outCanvas._reusableOutImg;
        const dData = outImg.data;

        // Stage 2: v62.0 8-Strip Coupled 2D Vertical Mesh & 2-Pass Composed Text-Line Flattening
        if (autoLineDewarp !== false) {
          function getStripInterpParams(ty, centers) {
            const nz = centers.length;
            if (ty <= centers[0]) return [0, 0, 0.0];
            if (ty >= centers[nz - 1]) return [nz - 1, nz - 1, 0.0];
            let z0 = 0;
            while (z0 < nz - 2 && centers[z0 + 1] < ty) z0++;
            const span = (centers[z0 + 1] - centers[z0]) || 1e-6;
            const alpha = (ty - centers[z0]) / span;
            return [z0, z0 + 1, alpha];
          }
          let surfModes = (cachedModesHost && cachedModesHost.cachedAutoModes && cachedModesHost.cachedAutoW === dstW && cachedModesHost.cachedAutoH === dstH)
            ? cachedModesHost.cachedAutoModes
            : undefined;
          if (surfModes === undefined) {
            surfModes = estimate2DBookSurfaceModes(tempData, dstW, dstH);
            // v62.0 2-Pass Coarse-to-Fine Residual Refinement on 8-Strip Mesh (ONE single-resample warp!):
            if (surfModes && surfModes.maxSurfaceDisp >= 1.5 && surfModes.stripCurves) {
              const p1Strips = surfModes.stripCurves;
              const p1Centers = surfModes.stripCenters;
              const nz = p1Strips.length;
              const rw = Math.max(192, dstW >> 1);
              const rh = Math.max(256, dstH >> 1);
              const pass1Small = new Uint8ClampedArray(rw * rh * 4);
              const invRw1 = 1.0 / Math.max(1, rw - 1);
              const invRh1 = 1.0 / Math.max(1, rh - 1);
              for (let ry = 0; ry < rh; ry++) {
                const ty = ry * invRh1;
                const yFull = ty * (dstH - 1);
                const [z0, z1, za] = getStripInterpParams(ty, p1Centers);
                const s0Arr = p1Strips[z0], s1Arr = p1Strips[z1];
                const omZa = 1.0 - za;
                const vTap = Math.min(1.0, ty / 0.015, (1.0 - ty) / 0.015);
                for (let rx = 0; rx < rw; rx++) {
                  const tx = rx * invRw1;
                  const xFull = Math.min(dstW - 1, Math.round(tx * (dstW - 1)));
                  const wVal = (s0Arr[xFull] * omZa + s1Arr[xFull] * za) * vTap;
                  const syFull = Math.min(dstH - 1, Math.max(0, Math.round(yFull + wVal)));
                  const si = (syFull * dstW + xFull) << 2;
                  const di = (ry * rw + rx) << 2;
                  pass1Small[di]     = tempData[si];
                  pass1Small[di + 1] = tempData[si + 1];
                  pass1Small[di + 2] = tempData[si + 2];
                  pass1Small[di + 3] = 255;
                }
              }
              const resModes = estimate2DBookSurfaceModes(pass1Small, rw, rh);
              if (resModes && resModes.maxSurfaceDisp >= 0.45 && resModes.stripCurves) {
                const scaleBackY = (dstH - 1) / Math.max(1, rh - 1);
                const rStrips = resModes.stripCurves;
                for (let x = 0; x < dstW; x++) {
                  const rxf = (x / Math.max(1, dstW - 1)) * (rw - 1);
                  const rx0 = Math.min(rw - 2, rxf | 0);
                  const rdx = rxf - rx0;
                  let sumAll = 0;
                  for (let z = 0; z < nz; z++) {
                    const rArr = rStrips[z];
                    p1Strips[z][x] += (rArr[rx0] * (1.0 - rdx) + rArr[rx0 + 1] * rdx) * scaleBackY;
                    sumAll += p1Strips[z][x];
                  }
                  surfModes.mode0[x] = sumAll / nz;
                  surfModes.mode1[x] = p1Strips[nz - 1][x] - p1Strips[0][x];
                }
              }
            }
            if (cachedModesHost) {
              cachedModesHost.cachedAutoModes = surfModes;
              cachedModesHost.cachedAutoW = dstW;
              cachedModesHost.cachedAutoH = dstH;
            }
          }
          if (surfModes && surfModes.stripCurves && (surfModes.maxDisp === undefined || surfModes.maxDisp >= 0.35)) {
            const { stripCurves, stripCenters, mode0, mode1, horizShiftY } = surfModes;
            const arcCum = new Float32Array(dstW);
            const avgSlope0 = (mode0[dstW - 1] - mode0[0]) / Math.max(1, dstW - 1);
            for (let u = 1; u < dstW; u++) {
              const dw0 = (mode0[u] - mode0[u - 1]) - avgSlope0;
              const dw1 = mode1[u] - mode1[u - 1];
              const slopeSq = dw0 * dw0 + 0.0833 * dw1 * dw1;
              arcCum[u] = arcCum[u - 1] + Math.sqrt(1.0 + 0.55 * slopeSq);
            }
            const totalArc = arcCum[dstW - 1] || 1.0;
            const xMap = new Float32Array(dstW);
            const uTaperArr = new Float32Array(dstW);
            let pIdx = 0;
            for (let u = 0; u < dstW; u++) {
              const tx = u * invDstW1;
              uTaperArr[u] = Math.min(1.0, tx / 0.035, (1.0 - tx) / 0.035);
              const targetArc = tx * totalArc;
              while (pIdx < dstW - 2 && arcCum[pIdx + 1] < targetArc) pIdx++;
              const span = (arcCum[pIdx + 1] - arcCum[pIdx]) || 1e-6;
              xMap[u] = pIdx + Math.max(0.0, Math.min(1.0, (targetArc - arcCum[pIdx]) / span));
            }

            const maxSx = dstW - 1.001;
            for (let y = 0; y < dstH; y++) {
              const ty = y * invDstH1;
              const [z0, z1, za] = getStripInterpParams(ty, stripCenters);
              const s0Arr = stripCurves[z0], s1Arr = stripCurves[z1];
              const omZa = 1.0 - za;
              const vTaper = Math.min(1.0, ty / 0.015, (1.0 - ty) / 0.015);
              const hShift = horizShiftY ? horizShiftY[y] : 0.0;

              for (let x = 0; x < dstW; x++) {
                const sxRaw = xMap[x] + uTaperArr[x] * hShift;
                const sx = sxRaw < 0.0 ? 0.0 : (sxRaw > maxSx ? maxSx : sxRaw);
                const x0 = sx | 0;
                const dx = sx - x0;

                const wA = s0Arr[x0] * (1.0 - dx) + s0Arr[x0 + 1] * dx;
                const wB = s1Arr[x0] * (1.0 - dx) + s1Arr[x0 + 1] * dx;
                const wVal = (wA * omZa + wB * za) * vTaper;

                const sy = Math.min(dstH - 1.001, Math.max(0.0, y + wVal));
                const y0 = sy | 0;
                const dy = sy - y0;

                const i00 = (y0 * dstW + x0) * 4;
                const i10 = i00 + 4;
                const i01 = i00 + dstW * 4;
                const i11 = i01 + 4;
                const di = (y * dstW + x) * 4;

                const wt00 = (1.0 - dx) * (1.0 - dy);
                const wt10 = dx * (1.0 - dy);
                const wt01 = (1.0 - dx) * dy;
                const wt11 = dx * dy;

                dData[di]     = tempData[i00] * wt00 + tempData[i10] * wt10 + tempData[i01] * wt01 + tempData[i11] * wt11;
                dData[di + 1] = tempData[i00 + 1] * wt00 + tempData[i10 + 1] * wt10 + tempData[i01 + 1] * wt01 + tempData[i11 + 1] * wt11;
                dData[di + 2] = tempData[i00 + 2] * wt00 + tempData[i10 + 2] * wt10 + tempData[i01 + 2] * wt01 + tempData[i11 + 2] * wt11;
                dData[di + 3] = 255;
              }
            }
            outCtx.putImageData(outImg, 0, 0);
            return outCanvas;
          }
        }

        dData.set(tempData);
        outCtx.putImageData(outImg, 0, 0);
        return outCanvas;
      }

      // =========================================================================
      // 6. LAZY HALO-FREE PAPER WHITENING, BRIGHTNESS & SAUVOLA B&W ENGINE
      // =========================================================================
      // Row-major unrolled 7x7 Max Filter (rad=3) for uint8 dMaxLocal (~5x faster than sepMaxFilter)
      function fastMaxRad3ToU8(src, w, h, tmp, dstU8) {
        const wm1 = w - 1, hm1 = h - 1;
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < 3; x++) {
            let m = 0;
            const k1 = x + 3 > wm1 ? wm1 : x + 3;
            for (let k = 0; k <= k1; k++) { const v = src[rOff + k]; if (v > m) m = v; }
            tmp[rOff + x] = m;
          }
          for (let x = 3; x < w - 3; x++) {
            const i = rOff + x;
            let m = src[i - 3];
            const v1 = src[i - 2]; if (v1 > m) m = v1;
            const v2 = src[i - 1]; if (v2 > m) m = v2;
            const v3 = src[i];     if (v3 > m) m = v3;
            const v4 = src[i + 1]; if (v4 > m) m = v4;
            const v5 = src[i + 2]; if (v5 > m) m = v5;
            const v6 = src[i + 3]; if (v6 > m) m = v6;
            tmp[i] = m;
          }
          for (let x = w - 3; x < w; x++) {
            let m = 0;
            const k0 = x - 3 < 0 ? 0 : x - 3;
            for (let k = k0; k <= wm1; k++) { const v = src[rOff + k]; if (v > m) m = v; }
            tmp[rOff + x] = m;
          }
        }
        for (let y = 0; y < h; y++) {
          const r0 = (y - 3 < 0 ? 0 : y - 3) * w;
          const r1 = (y - 2 < 0 ? 0 : y - 2) * w;
          const r2 = (y - 1 < 0 ? 0 : y - 1) * w;
          const r3 = y * w;
          const r4 = (y + 1 > hm1 ? hm1 : y + 1) * w;
          const r5 = (y + 2 > hm1 ? hm1 : y + 2) * w;
          const r6 = (y + 3 > hm1 ? hm1 : y + 3) * w;
          for (let x = 0; x < w; x++) {
            let m = tmp[r0 + x];
            const v1 = tmp[r1 + x]; if (v1 > m) m = v1;
            const v2 = tmp[r2 + x]; if (v2 > m) m = v2;
            const v3 = tmp[r3 + x]; if (v3 > m) m = v3;
            const v4 = tmp[r4 + x]; if (v4 > m) m = v4;
            const v5 = tmp[r5 + x]; if (v5 > m) m = v5;
            const v6 = tmp[r6 + x]; if (v6 > m) m = v6;
            const iv = (m + 0.5) | 0;
            dstU8[r3 + x] = iv > 255 ? 255 : (iv < 0 ? 0 : iv);
          }
        }
      }

      function computeFinePaperSurfaceGridFromSub(sub, sw, sh, tmp1, tmp2, dst, colSum) {
        // Balanced morphological closing (dilate rad=3 + erode rad=3) bridges bold text up to 24px wide
        // WITHOUT inflating the paper envelope above true mean paper brightness!
        const dil = sepMaxFilter(sub, sw, sh, 3);
        const clo = sepMinFilter(dil, sw, sh, 3);
        fastBoxBlurInPlace(clo, sw, sh, 3, tmp1, dst, colSum);
      }

      // v51.0 Fast Inter-Line Spot Eraser + Accurate Spine-Shadow Paper Surface Cache
      function buildPageFilterCache(dewarpedCanvas) {
        const w = dewarpedCanvas.width;
        const h = dewarpedCanvas.height;
        const nPixels = w * h;
        const rawData = dewarpedCanvas.getContext("2d").getImageData(0, 0, w, h).data;

        // Tight scale=4 background surface (follows uneven book spine shadows closely without overshooting eL between text lines!)
        const scale = 4;
        const sw = Math.max(8, Math.floor(w / scale));
        const sh = Math.max(8, Math.floor(h / scale));
        const nSub = sw * sh;
        const subL = new Float32Array(nSub);
        const subR = new Float32Array(nSub);
        const subG = new Float32Array(nSub);
        const subB = new Float32Array(nSub);

        let brightClipCells = 0;
        for (let sy = 0; sy < sh; sy++) {
          const yA = sy * scale + 1 < h ? sy * scale + 1 : h - 1;
          const yB = sy * scale + 3 < h ? sy * scale + 3 : h - 1;
          const rA = yA * w, rB = yB * w;
          const sOff = sy * sw;
          for (let sx = 0; sx < sw; sx++) {
            const xA = sx * scale + 1 < w ? sx * scale + 1 : w - 1;
            const xB = sx * scale + 3 < w ? sx * scale + 3 : w - 1;

            const i0 = (rA + xA) << 2, i1 = (rA + xB) << 2, i2 = (rB + xA) << 2, i3 = (rB + xB) << 2;
            const l0 = 0.299 * rawData[i0] + 0.587 * rawData[i0 + 1] + 0.114 * rawData[i0 + 2];
            const l1 = 0.299 * rawData[i1] + 0.587 * rawData[i1 + 1] + 0.114 * rawData[i1 + 2];
            const l2 = 0.299 * rawData[i2] + 0.587 * rawData[i2 + 1] + 0.114 * rawData[i2 + 2];
            const l3 = 0.299 * rawData[i3] + 0.587 * rawData[i3 + 1] + 0.114 * rawData[i3 + 2];

            // Pick 2nd brightest of the 4 pixels (rejects dark ink strokes AND bright noise spikes)
            let m1 = l0, m2 = -1.0, k1 = 0, k2 = 0;
            if (l1 > m1) { m2 = m1; k2 = k1; m1 = l1; k1 = 1; } else { m2 = l1; k2 = 1; }
            if (l2 > m1) { m2 = m1; k2 = k1; m1 = l2; k1 = 2; } else if (l2 > m2) { m2 = l2; k2 = 2; }
            if (l3 > m1) { m2 = m1; k2 = k1; m1 = l3; k1 = 3; } else if (l3 > m2) { m2 = l3; k2 = 3; }

            const ci = k2 === 0 ? i0 : (k2 === 1 ? i1 : (k2 === 2 ? i2 : i3));
            const cL = k2 === 0 ? l0 : (k2 === 1 ? l1 : (k2 === 2 ? l2 : l3));
            subR[sOff + sx] = rawData[ci];
            subG[sOff + sx] = rawData[ci + 1];
            subB[sOff + sx] = rawData[ci + 2];
            subL[sOff + sx] = cL;
            if (cL >= 232.0) brightClipCells++;
          }
        }

        const subTmp = new Float32Array(nSub);
        const subCol = new Float32Array(sw);
        const gL = new Float32Array(nSub);
        const gR = new Float32Array(nSub);
        const gG = new Float32Array(nSub);
        const gB = new Float32Array(nSub);

        // rad=2 closing at scale=4 covers 20px window -> bridges bold letters cleanly while hugging local shadows closely!
        function smoothSubGrid(src, dst) {
          const dil = sepMaxFilter(src, sw, sh, 2);
          const clo = sepMinFilter(dil, sw, sh, 2);
          fastBoxBlurInPlace(clo, sw, sh, 2, subTmp, dst, subCol);
        }
        smoothSubGrid(subL, gL);
        smoothSubGrid(subR, gR);
        smoothSubGrid(subG, gG);
        smoothSubGrid(subB, gB);

        let sumEnvL = 0.0;
        for (let i = 0; i < nSub; i++) sumEnvL += gL[i];
        const avgPaperEnvL = sumEnvL / (nSub || 1);
        const brightClipFrac = brightClipCells / (nSub || 1);
        const isBrightOutdoor = avgPaperEnvL > 205.0 || brightClipFrac > 0.22;

        const uR = new Uint8Array(nPixels);
        const uG = new Uint8Array(nPixels);
        const uB = new Uint8Array(nPixels);
        const uL = new Float32Array(nPixels);

        const invScale = 1.0 / scale;
        const maxGx = sw - 1.001;
        const maxGy = sh - 1.001;
        const x0Arr = new Int32Array(w);
        const dxArr = new Float32Array(w);
        for (let x = 0; x < w; x++) {
          const gx = x * invScale;
          const cgx = gx > maxGx ? maxGx : gx;
          const x0 = cgx | 0;
          x0Arr[x] = x0;
          dxArr[x] = cgx - x0;
        }

        const normTarget = isBrightOutdoor ? 248.0 : 255.0;
        for (let y = 0; y < h; y++) {
          const gy = y * invScale;
          const cgy = gy > maxGy ? maxGy : gy;
          const y0 = cgy | 0;
          const dy = cgy - y0;
          const omdy = 1.0 - dy;
          const r0Base = y0 * sw;
          const r1Base = (y0 + 1) * sw;
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = x0Arr[x];
            const dx = dxArr[x];
            const omdx = 1.0 - dx;
            const w00 = omdx * omdy, w10 = dx * omdy, w01 = omdx * dy, w11 = dx * dy;
            const p00 = r0Base + x0, p10 = p00 + 1, p01 = r1Base + x0, p11 = p01 + 1;

            let eL = gL[p00] * w00 + gL[p10] * w10 + gL[p01] * w01 + gL[p11] * w11;
            let eR = gR[p00] * w00 + gR[p10] * w10 + gR[p01] * w01 + gR[p11] * w11;
            let eG = gG[p00] * w00 + gG[p10] * w10 + gG[p01] * w01 + gG[p11] * w11;
            let eB = gB[p00] * w00 + gB[p10] * w10 + gB[p01] * w01 + gB[p11] * w11;
            if (eL < 22.0) eL = 22.0;
            if (eR < 22.0) eR = 22.0;
            if (eG < 22.0) eG = 22.0;
            if (eB < 22.0) eB = 22.0;

            const i = rOff + x;
            const idx4 = i << 2;
            const r = rawData[idx4], g = rawData[idx4 + 1], b = rawData[idx4 + 2];
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;

            const nr = (normTarget * r / eR + 0.5) | 0;
            const ng = (normTarget * g / eG + 0.5) | 0;
            const nb = (normTarget * b / eB + 0.5) | 0;
            let nl = (normTarget * lum) / eL;
            if (nl > 255.0) nl = 255.0; else if (nl < 0.0) nl = 0.0;

            uR[i] = nr > 255 ? 255 : (nr < 0 ? 0 : nr);
            uG[i] = ng > 255 ? 255 : (ng < 0 ? 0 : ng);
            uB[i] = nb > 255 ? 255 : (nb < 0 ? 0 : nb);
            uL[i] = nl;
          }
        }

        // Fast ISO noise estimation on paper pixels
        const nHist = new Int32Array(64);
        let nSamples = 0;
        const stepY = Math.max(2, (h / 120) | 0);
        const stepX = Math.max(2, (w / 120) | 0);
        for (let y = 2; y < h - 2; y += stepY) {
          const rOff = y * w;
          for (let x = 2; x < w - 2; x += stepX) {
            const i = rOff + x;
            if (uL[i] > 170.0) {
              const lap = Math.abs(uL[i] - 0.25 * (uL[i - 1] + uL[i + 1] + uL[i - w] + uL[i + w]));
              nHist[Math.min(63, (lap * 2.0) | 0)]++;
              nSamples++;
            }
          }
        }
        let isoNoiseEst = 1.2;
        if (nSamples > 20) {
          let cum = 0;
          const target = nSamples * 0.45;
          for (let b = 0; b < 64; b++) {
            cum += nHist[b];
            if (cum >= target) { isoNoiseEst = b * 0.5; break; }
          }
        }
        const isLowLightDoc = !isBrightOutdoor && (avgPaperEnvL < 158.0 || isoNoiseEst > 3.2);

        const tmpBuf = new Float32Array(nPixels);
        const blur1 = new Float32Array(nPixels);
        fastBlurRad1(uL, w, h, tmpBuf, blur1);

        if (isLowLightDoc) {
          for (let i = 0; i < nPixels; i++) {
            const cur = uL[i];
            const b1 = blur1[i];
            const diff = cur - b1;
            const ad = diff < 0.0 ? -diff : diff;
            if (cur > 175.0 && ad < 18.0) {
              const sm = cur * 0.30 + b1 * 0.70;
              uL[i] = sm;
              const r = uR[i], g = uG[i], b = uB[i];
              const maxC = r > g ? (r > b ? r : b) : (g > b ? g : b);
              const minC = r < g ? (r < b ? r : b) : (g < b ? g : b);
              if (maxC - minC < 44) {
                const smInt = (sm + 0.5) | 0;
                uR[i] = (r + smInt * 3) >> 2;
                uG[i] = (g + smInt * 3) >> 2;
                uB[i] = (b + smInt * 3) >> 2;
              }
            }
          }
        }

        // Half-Resolution Inter-Line & Halo-Guard Map (dMaxHalf):
        // Two fast passes at half-res (w/2 x h/2) -> covers ±10px full-res (bridges entire inter-line gap!) in ~8ms!
        // Erases BOTH letter halos AND dark bleed-through/shadow spots sitting between lines of text!
        const hw = Math.max(4, (w + 1) >> 1);
        const hh = Math.max(4, (h + 1) >> 1);
        const dHalfRaw = new Float32Array(hw * hh);
        for (let hy = 0; hy < hh; hy++) {
          const y0 = hy << 1;
          const y1 = y0 + 1 < h ? y0 + 1 : h - 1;
          const r0 = y0 * w, r1 = y1 * w;
          const hOff = hy * hw;
          for (let hx = 0; hx < hw; hx++) {
            const x0 = hx << 1;
            const x1 = x0 + 1 < w ? x0 + 1 : w - 1;
            let minL = uL[r0 + x0];
            const l1 = uL[r0 + x1]; if (l1 < minL) minL = l1;
            const l2 = uL[r1 + x0]; if (l2 < minL) minL = l2;
            const l3 = uL[r1 + x1]; if (l3 < minL) minL = l3;
            dHalfRaw[hOff + hx] = 255.0 - minL;
          }
        }
        const dMaxHalf = new Uint8Array(hw * hh);
        fastMaxRad3ToU8(dHalfRaw, hw, hh, tmpBuf, dMaxHalf);
        for (let i = 0; i < hw * hh; i++) dHalfRaw[i] = dMaxHalf[i];
        fastMaxRad3ToU8(dHalfRaw, hw, hh, tmpBuf, dMaxHalf);

        const detailFine = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          detailFine[i] = uL[i] - blur1[i];
        }

        return {
          w,
          h,
          hw,
          hh,
          rawData,
          uR,
          uG,
          uB,
          uL,
          detailFine,
          dMaxHalf,
          avgPaperEnvL,
          isoNoiseEst,
          isLowLightDoc,
          isBrightOutdoor,
          meanL: null,
          stdL: null
        };
      }

      function ensureSauvolaStats(fc) {
        if (fc.meanL && fc.stdL) return;
        const w = fc.w, h = fc.h, nPixels = w * h;
        const uL = fc.uL;
        const uLSq = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) uLSq[i] = uL[i] * uL[i];
        const tmp = new Float32Array(nPixels);
        const colSum = new Float32Array(w);
        const meanL = new Float32Array(nPixels);
        const meanSqL = new Float32Array(nPixels);
        fastBoxBlurInPlace(uL, w, h, 14, tmp, meanL, colSum);
        fastBoxBlurInPlace(uLSq, w, h, 14, tmp, meanSqL, colSum);
        const stdL = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          const v = meanSqL[i] - meanL[i] * meanL[i];
          stdL[i] = v > 0.0 ? Math.sqrt(v) : 0.0;
        }
        fc.meanL = meanL;
        fc.stdL = stdL;
      }

      function applyCachedFiltersToPage(page) {
        if (!page || !page.dewarpedCanvas) return;
        const w = page.dewarpedCanvas.width;
        const h = page.dewarpedCanvas.height;
        const settings = page.settings;
        const mode = (settings.colorMode === "ultra_sharp" || !settings.colorMode) ? "original" : settings.colorMode;
        const brightVal = settings.brightness || 0;
        const bShift = Math.round(brightVal * 2.1);
        const sharpPct = settings.sharpness !== undefined ? settings.sharpness : 65;
        const sharpAmt = sharpPct < 0 ? 0.0 : (sharpPct > 100 ? 1.0 : sharpPct * 0.01);
        const transparentBg = !!settings.transparentBg;

        if (!page.processedCanvas || page.processedCanvas.width !== w || page.processedCanvas.height !== h) {
          page.processedCanvas = document.createElement("canvas");
          page.processedCanvas.width = w;
          page.processedCanvas.height = h;
        }
        const outCtx = page.processedCanvas.getContext("2d");

        if (mode === "original" && !transparentBg && bShift === 0 && sharpAmt <= 0.01) {
          outCtx.clearRect(0, 0, w, h);
          outCtx.drawImage(page.dewarpedCanvas, 0, 0);
          return;
        }

        if (!page.filterCache) {
          page.filterCache = buildPageFilterCache(page.dewarpedCanvas);
        }

        const fc = page.filterCache;
        const nPixels = w * h;
        const hw = fc.hw;
        const dMaxHalf = fc.dMaxHalf;
        const cleanAmt = (settings.bgSuppress ?? 68) * 0.01;
        const contrastAmt = (settings.contrast ?? 58) * 0.01;

        if (!fc.outImg || fc.outImg.width !== w || fc.outImg.height !== h) {
          fc.outImg = outCtx.createImageData(w, h);
        }
        const outImg = fc.outImg;
        const data = outImg.data;

        const rawData = fc.rawData;
        const uR = fc.uR;
        const uG = fc.uG;
        const uB = fc.uB;
        const uL = fc.uL;
        const detailFine = fc.detailFine;
        const isLowLight = !!fc.isLowLightDoc;
        const isBrightOutdoor = !!fc.isBrightOutdoor;
        const noiseDeadzone = isLowLight ? (2.5 + Math.min(5.0, (fc.isoNoiseEst || 1.5) * 0.65)) : 1.5;

        if (mode === "original") {
          // v56.0 High-Sharpness Natural Original + Bleed-Through-Free Transparent Background ("🪄 Tách nền")
          const darkGain = sharpAmt * 1.65;
          const brightGain = isBrightOutdoor ? 0.0 : (sharpAmt * 0.40);
          const origDeadzone = Math.max(noiseDeadzone, 2.6);
          const alphaBaseFloor = 30.0 + cleanAmt * 42.0;
          const alphaHaloRatio = 0.34 + cleanAmt * 0.16;
          const paperChromaLim = isLowLight ? 36.0 : 22.0;

          for (let y = 0; y < h; y++) {
            const rOff = y * w;
            const hOff = (y >> 1) * hw;
            for (let x = 0; x < w; x++) {
              const i = rOff + x;
              const idx = i << 2;
              const df = detailFine[i];
              let boost = 0.0;
              if (sharpAmt > 0.01) {
                if (df < -origDeadzone) {
                  boost = (df + origDeadzone) * darkGain;
                  if (boost < -48.0) boost = -48.0;
                } else if (df > origDeadzone && brightGain > 0.0) {
                  boost = (df - origDeadzone) * brightGain;
                  if (boost > 22.0) boost = 22.0;
                }
              }
              let r = (rawData[idx] + boost + bShift + 0.5) | 0;
              let g = (rawData[idx + 1] + boost + bShift + 0.5) | 0;
              let b = (rawData[idx + 2] + boost + bShift + 0.5) | 0;
              data[idx]     = r < 0 ? 0 : (r > 255 ? 255 : r);
              data[idx + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
              data[idx + 2] = b < 0 ? 0 : (b > 255 ? 255 : b);

              if (transparentBg) {
                const d = 255.0 - uL[i];
                const ur = uR[i], ug = uG[i], ub = uB[i];
                const maxC = ur > ug ? (ur > ub ? ur : ub) : (ug > ub ? ug : ub);
                const minC = ur < ug ? (ur < ub ? ur : ub) : (ug < ub ? ug : ub);
                const chroma = maxC - minC;
                const absDf = df < 0.0 ? -df : df;

                // Adaptive Bleed-Through-Free Alpha Cut:
                // Erases thin-paper back-side ghost text (shallow d & soft diffused edges) -> alpha = 0!
                // Keeps crisp front-side dark ink & vivid colored pens/stamps -> alpha = 255!
                const hCut = dMaxHalf[hOff + (x >> 1)] * alphaHaloRatio;
                let cut = alphaBaseFloor > hCut ? alphaBaseFloor : hCut;
                if (absDf < 6.0 && d < 120.0) {
                  cut += 20.0 * (1.0 - absDf / 6.0);
                }
                const colorSignal = chroma > paperChromaLim ? (chroma - paperChromaLim) * 1.35 : 0.0;
                const effInk = (d > colorSignal ? d : colorSignal);
                const effCut = chroma > paperChromaLim ? Math.max(12.0, cut - colorSignal * 0.65) : cut;

                if (effInk <= effCut) {
                  data[idx + 3] = 0;
                } else {
                  const span = 26.0;
                  const aVal = (((effInk - effCut) / span) * 255.0) | 0;
                  data[idx + 3] = aVal > 255 ? 255 : aVal;
                }
              } else {
                data[idx + 3] = 255;
              }
            }
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        if (mode === "bw_sauvola") {
          ensureSauvolaStats(fc);
          const meanL = fc.meanL;
          const stdL = fc.stdL;
          const k = 0.16 + (1.0 - contrastAmt) * 0.10;
          const minDip = (isBrightOutdoor ? 9.0 : 16.0) + cleanAmt * (isBrightOutdoor ? 10.0 : 20.0) - contrastAmt * 6.0 - brightVal * 0.25;
          const haloRatio = 0.34 + cleanAmt * 0.18;
          const darkGain = sharpAmt * 1.4;

          for (let y = 0; y < h; y++) {
            const rOff = y * w;
            const hOff = (y >> 1) * hw;
            for (let x = 0; x < w; x++) {
              const i = rOff + x;
              const df = detailFine[i];
              let sh = 0.0;
              if (sharpAmt > 0.01 && df < -noiseDeadzone) {
                sh = (df + noiseDeadzone) * darkGain;
                if (sh < -42.0) sh = -42.0;
              }
