      function renderWarpedQuadToCanvas(srcCanvas, dstCanvas, corners, shadowStrength, addPaperDropShadow, curlAmp) {
        const sW = srcCanvas.width;
        const sH = srcCanvas.height;
        const dW = dstCanvas.width;
        const dH = dstCanvas.height;
        const dCtx = dstCanvas.getContext("2d");

        if (addPaperDropShadow) {
          dCtx.save();
          for (let off = 4; off >= 1; off--) {
            dCtx.strokeStyle = `rgba(15, 23, 42, ${0.06 * (5 - off)})`;
            dCtx.lineWidth = off * 1.5;
            dCtx.beginPath();
            dCtx.moveTo(corners[0].x, corners[0].y);
            dCtx.lineTo(corners[1].x, corners[1].y);
            dCtx.lineTo(corners[2].x, corners[2].y);
            dCtx.lineTo(corners[3].x, corners[3].y);
            dCtx.closePath();
            dCtx.stroke();
          }
          dCtx.restore();
        }

        const sData = srcCanvas.getContext("2d").getImageData(0, 0, sW, sH).data;
        const dImg = dCtx.getImageData(0, 0, dW, dH);
        const dData = dImg.data;

        const srcPts = [
          { x: 0, y: 0 },
          { x: sW, y: 0 },
          { x: sW, y: sH },
          { x: 0, y: sH }
        ];
        const Hinv = computeHomography(corners, srcPts);
        const cAmp = curlAmp || 0;

        for (let y = 0; y < dH; y++) {
          for (let x = 0; x < dW; x++) {
            const denom = Hinv[6] * x + Hinv[7] * y + 1;
            const di = (y * dW + x) * 4;
            if (Math.abs(denom) > 1e-8) {
              const sx = (Hinv[0] * x + Hinv[1] * y + Hinv[2]) / denom;
              let sy = (Hinv[3] * x + Hinv[4] * y + Hinv[5]) / denom;

              if (cAmp !== 0) {
                const xn = sx / sW;
                sy += cAmp * (4.0 * (xn - 0.5) * (xn - 0.5));
              }

              if (sx >= 0 && sx < sW - 1 && sy >= 0 && sy < sH - 1) {
                const x0 = sx | 0;
                const y0 = sy | 0;
                const dx = sx - x0;
                const dy = sy - y0;
                const i00 = (y0 * sW + x0) * 4;
                const i10 = i00 + 4;
                const i01 = i00 + sW * 4;
                const i11 = i01 + 4;

                const w00 = (1 - dx) * (1 - dy);
                const w10 = dx * (1 - dy);
                const w01 = (1 - dx) * dy;
                const w11 = dx * dy;

                dData[di]     = sData[i00] * w00 + sData[i10] * w10 + sData[i01] * w01 + sData[i11] * w11;
                dData[di + 1] = sData[i00 + 1] * w00 + sData[i10 + 1] * w10 + sData[i01 + 1] * w01 + sData[i11 + 1] * w11;
                dData[di + 2] = sData[i00 + 2] * w00 + sData[i10 + 2] * w10 + sData[i01 + 2] * w01 + sData[i11 + 2] * w11;
                dData[di + 3] = 255;
              }
            }

            if (shadowStrength > 0) {
              const sig = 1.0 / (1.0 + Math.exp(-((x - dW * 0.44) * 0.009 + (y - dH * 0.48) * 0.009)));
              const shFactor = Math.max(0.45, 1.0 - shadowStrength * sig);
              dData[di]     = Math.round(dData[di] * shFactor);
              dData[di + 1] = Math.round(dData[di + 1] * shFactor);
              dData[di + 2] = Math.round(dData[di + 2] * shFactor);
            }
          }
        }
        dCtx.putImageData(dImg, 0, 0);
      }

      // =========================================================================
      // 4. v10.0 INTELLIGENT MULTI-ZONE & OUTER-BORDER HYBRID CORNER DETECTOR
      //    (Accurately detects Half-White/Half-Color, White-on-White & Wood Desk!)
      // =========================================================================
      function getPercentile(arr, p) {
        if (!arr.length) return 0;
        const copy = Float32Array.from(arr);
        copy.sort();
        const idx = Math.min(copy.length - 1, Math.max(0, Math.floor(copy.length * p)));
        return copy[idx];
      }

      function morphDilateFloat(arr, w, h, rad) {
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let mv = -Infinity;
            for (let ny = y0; ny <= y1; ny++) {
              const rOff = ny * w;
              for (let nx = x0; nx <= x1; nx++) {
                const v = arr[rOff + nx];
                if (v > mv) mv = v;
              }
            }
            out[y * w + x] = mv;
          }
        }
        return out;
      }

      function morphErodeFloat(arr, w, h, rad) {
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let mv = Infinity;
            for (let ny = y0; ny <= y1; ny++) {
              const rOff = ny * w;
              for (let nx = x0; nx <= x1; nx++) {
                const v = arr[rOff + nx];
                if (v < mv) mv = v;
              }
            }
            out[y * w + x] = mv;
          }
        }
        return out;
      }

      function fitSingleIrlsLine(ptsK) {
        const nK = ptsK.length;
        if (nK < 2) return { a: 0, b: 1, c: 0 };
        const weights = new Float64Array(nK);
        weights.fill(1.0);
        let a = 0, b = 1, c = 0;
        for (let it = 0; it < 4; it++) {
          let wSum = 0, mx = 0, my = 0;
          for (let i = 0; i < nK; i++) {
            wSum += weights[i];
            mx += weights[i] * ptsK[i].x;
            my += weights[i] * ptsK[i].y;
          }
          mx /= (wSum || 1);
          my /= (wSum || 1);
          let sxx = 0, syy = 0, sxy = 0;
          for (let i = 0; i < nK; i++) {
            const dx = ptsK[i].x - mx;
            const dy = ptsK[i].y - my;
            sxx += weights[i] * dx * dx;
            syy += weights[i] * dy * dy;
            sxy += weights[i] * dx * dy;
          }
          const theta = 0.5 * Math.atan2(2 * sxy, sxx - syy);
          a = -Math.sin(theta);
          b = Math.cos(theta);
          c = -(a * mx + b * my);
          for (let i = 0; i < nK; i++) {
            const res = Math.abs(a * ptsK[i].x + b * ptsK[i].y + c);
            weights[i] = 1.0 / Math.max(0.5, res);
          }
        }
        return { a, b, c };
      }

      function intersectAbc(L1, L2) {
        const det = L1.a * L2.b - L2.a * L1.b;
        if (Math.abs(det) < 1e-6) return null;
        return {
          x: (L1.b * L2.c - L2.b * L1.c) / det,
          y: (L1.c * L2.a - L2.c * L1.a) / det
        };
      }

      function detectDocumentCorners(srcCanvas) {
        const origW = srcCanvas.width;
        const origH = srcCanvas.height;

        const maxDim = 380;
        const scale = Math.min(1, maxDim / Math.max(origW, origH));
        const w = Math.max(72, Math.round(origW * scale));
        const h = Math.max(72, Math.round(origH * scale));

        const tmp = document.createElement("canvas");
        tmp.width = w;
        tmp.height = h;
        const tctx = tmp.getContext("2d");
        tctx.drawImage(srcCanvas, 0, 0, w, h);
        const imgData = tctx.getImageData(0, 0, w, h).data;

        const nPix = w * h;
        const L = new Float32Array(nPix);
        const rn = new Float32Array(nPix);
        const gn = new Float32Array(nPix);
        const bn = new Float32Array(nPix);
        const sat = new Float32Array(nPix);
        const warmth = new Float32Array(nPix);

        for (let i = 0; i < nPix; i++) {
          const idx = i * 4;
          const R = imgData[idx];
          const G = imgData[idx + 1];
          const B = imgData[idx + 2];
          L[i] = 0.299 * R + 0.587 * G + 0.114 * B;
          const maxC = Math.max(R, G, B);
          const minC = Math.min(R, G, B);
          sat[i] = (maxC - minC) / (maxC + 20.0);
          warmth[i] = (R - B) / (maxC + 20.0);
          const sumRGB = R + G + B + 30.0;
          rn[i] = R / sumRGB;
          gn[i] = G / sumRGB;
          bn[i] = B / sumRGB;
        }

        // 1. Text-erased surface via morphological closing radius 2
        const L_surf = morphErodeFloat(morphDilateFloat(L, w, h, 2), w, h, 2);
        const rn_surf = morphErodeFloat(morphDilateFloat(rn, w, h, 2), w, h, 2);
        const gn_surf = morphErodeFloat(morphDilateFloat(gn, w, h, 2), w, h, 2);
        const bn_surf = morphErodeFloat(morphDilateFloat(bn, w, h, 2), w, h, 2);

        // 2. Sample OUTER BORDER RING (outer 4% frame) to model the Background / Desk Surface!
        const bd = Math.max(2, Math.floor(Math.min(w, h) * 0.04));
        const bRn = [], bGn = [], bBn = [], bSat = [], bWarm = [], bL = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (x < bd || x >= w - bd || y < bd || y >= h - bd) {
              const i = y * w + x;
              bRn.push(rn_surf[i]);
              bGn.push(gn_surf[i]);
              bBn.push(bn_surf[i]);
              bSat.push(sat[i]);
              bWarm.push(warmth[i]);
              bL.push(L_surf[i]);
            }
          }
        }
        const bgRn = getPercentile(bRn, 0.5);
        const bgGn = getPercentile(bGn, 0.5);
        const bgBn = getPercentile(bBn, 0.5);
        const bgSat = getPercentile(bSat, 0.5);
        const bgWarm = getPercentile(bWarm, 0.5);
        const bgL = getPercentile(bL, 0.5);

        const distFromBg = new Float32Array(nPix);
        for (let i = 0; i < nPix; i++) {
          const dr = rn_surf[i] - bgRn;
          const dg = gn_surf[i] - bgGn;
          const db = bn_surf[i] - bgBn;
          const ds = sat[i] - bgSat;
          const dw = warmth[i] - bgWarm;
          const dL = (L_surf[i] - bgL) / 255.0;
          distFromBg[i] = Math.sqrt(dr * dr + dg * dg + db * db + 0.5 * ds * ds + 0.5 * dw * dw + 0.08 * dL * dL);
        }

        // 3. Sample 3 Interior Document Zones (Top: 18..42%, Mid: 38..62%, Bot: 58..82%, x: 28..72%)
        // This ensures a document with a White Top Half and a Colored Bottom Half has BOTH halves in its foreground palette!
        const zoneRanges = [
          [0.18, 0.42],
          [0.38, 0.62],
          [0.58, 0.82]
        ];
        const cx0 = Math.floor(w * 0.28), cx1 = Math.ceil(w * 0.72);
        const docClusters = [];
        let maxZoneBgDist = 0;
        let minZoneBgDist = Infinity;

        for (let z = 0; z < zoneRanges.length; z++) {
          const zy0 = Math.floor(h * zoneRanges[z][0]);
          const zy1 = Math.ceil(h * zoneRanges[z][1]);
          const zR = [], zG = [], zB = [], zS = [], zW = [], zLv = [];
          for (let y = zy0; y < zy1; y++) {
            for (let x = cx0; x < cx1; x++) {
              const i = y * w + x;
              zR.push(rn_surf[i]);
              zG.push(gn_surf[i]);
              zB.push(bn_surf[i]);
              zS.push(sat[i]);
              zW.push(warmth[i]);
              zLv.push(L_surf[i]);
            }
          }
          const cr = getPercentile(zR, 0.5);
          const cg = getPercentile(zG, 0.5);
          const cb = getPercentile(zB, 0.5);
          const cs = getPercentile(zS, 0.5);
          const cw = getPercentile(zW, 0.5);
          const cL = getPercentile(zLv, 0.5);

          const dr = cr - bgRn, dg = cg - bgGn, db = cb - bgBn;
          const ds = cs - bgSat, dw = cw - bgWarm, dL = (cL - bgL) / 255.0;
          const zBgDist = Math.sqrt(dr * dr + dg * dg + db * db + 0.5 * ds * ds + 0.5 * dw * dw + 0.08 * dL * dL);

          if (zBgDist > maxZoneBgDist) maxZoneBgDist = zBgDist;
          if (zBgDist < minZoneBgDist) minZoneBgDist = zBgDist;
          docClusters.push({ cr, cg, cb, cs, cw, cL, zBgDist });
        }

        // Check if image is already a full-bleed / full-frame document (e.g. screenshot with top half white, bottom half colored)
        // where top border matches top zone and bottom border matches bottom zone!
        let topBorderMatchesTopZone = 0, botBorderMatchesBotZone = 0;
        for (let x = Math.floor(w * 0.2); x < Math.floor(w * 0.8); x++) {
          const iTop = bd * w + x;
          const iBot = (h - 1 - bd) * w + x;
          const dTop = Math.hypot(rn_surf[iTop] - docClusters[0].cr, gn_surf[iTop] - docClusters[0].cg, bn_surf[iTop] - docClusters[0].cb);
          const dBot = Math.hypot(rn_surf[iBot] - docClusters[2].cr, gn_surf[iBot] - docClusters[2].cg, bn_surf[iBot] - docClusters[2].cb);
          if (dTop < 0.025) topBorderMatchesTopZone++;
          if (dBot < 0.025) botBorderMatchesBotZone++;
        }
        const spanW = Math.floor(w * 0.6);
        const isFullBleedTwoTone = (
          topBorderMatchesTopZone > spanW * 0.75 &&
          botBorderMatchesBotZone > spanW * 0.75 &&
          Math.hypot(docClusters[0].cr - docClusters[2].cr, docClusters[0].cg - docClusters[2].cg, docClusters[0].cb - docClusters[2].cb) > 0.03
        );
        if (isFullBleedTwoTone) {
          return [
            { x: 4, y: 4 },
            { x: origW - 4, y: 4 },
            { x: origW - 4, y: origH - 4 },
            { x: 4, y: origH - 4 }
          ];
        }

        // ENGINE 1: Multi-Zone Document Palette vs Outer Border Background (For Wooden & Colored Desks, including Multi-Color Documents!)
        if (minZoneBgDist > 0.038 && maxZoneBgDist > 0.045) {
          const maskF = new Float32Array(nPix);
          for (let i = 0; i < nPix; i++) {
            let minDistDoc = 1e9;
            for (let z = 0; z < docClusters.length; z++) {
              const c = docClusters[z];
              const dr = rn_surf[i] - c.cr;
              const dg = gn_surf[i] - c.cg;
              const db = bn_surf[i] - c.cb;
              const ds = sat[i] - c.cs;
              const dw = warmth[i] - c.cw;
              const dL = (L_surf[i] - c.cL) / 255.0;
              const d = Math.sqrt(dr * dr + dg * dg + db * db + 0.5 * ds * ds + 0.5 * dw * dw + 0.04 * dL * dL);
              if (d < minDistDoc) minDistDoc = d;
            }
            const affinity = distFromBg[i] / (distFromBg[i] + minDistDoc + 0.015);
            maskF[i] = affinity >= 0.50 ? 1.0 : 0.0;
          }

          const closed = morphErodeFloat(morphDilateFloat(maskF, w, h, 2), w, h, 2);
          const cleaned = morphDilateFloat(morphErodeFloat(closed, w, h, 1), w, h, 1);

          const visited = new Int32Array(nPix);
          const queue = new Int32Array(nPix);
          let bestLabel = -1, bestScore = -1, currLabel = 0;

          for (let y = 2; y < h - 2; y++) {
            for (let x = 2; x < w - 2; x++) {
              const startIdx = y * w + x;
              if (cleaned[startIdx] > 0.5 && !visited[startIdx]) {
                currLabel++;
                let head = 0, tail = 0;
                queue[tail++] = startIdx;
                visited[startIdx] = currLabel;
                let area = 0, cHits = 0;
                while (head < tail) {
                  const curr = queue[head++];
                  area++;
                  const cy = (curr / w) | 0;
                  const cx = curr - cy * w;
                  if (cx > w * 0.25 && cx < w * 0.75 && cy > h * 0.20 && cy < h * 0.80) cHits++;
                  const nbs = [curr - 1, curr + 1, curr - w, curr + w];
                  for (let k = 0; k < 4; k++) {
                    const nb = nbs[k];
                    if (nb >= 0 && nb < nPix && cleaned[nb] > 0.5 && !visited[nb]) {
                      visited[nb] = currLabel;
                      queue[tail++] = nb;
                    }
                  }
                }
                const sc = area + cHits * 3;
                if (cHits > 10 && sc > bestScore) { bestScore = sc; bestLabel = currLabel; }
              }
            }
          }

          const bPts = [];
          if (bestLabel !== -1) {
            for (let y = 1; y < h - 1; y++) {
              for (let x = 1; x < w - 1; x++) {
                const idx = y * w + x;
                if (visited[idx] === bestLabel) {
                  if (
                    visited[idx - 1] !== bestLabel || visited[idx + 1] !== bestLabel ||
                    visited[idx - w] !== bestLabel || visited[idx + w] !== bestLabel
                  ) {
                    bPts.push({ x, y });
                  }
                }
              }
            }
          }

          if (bPts.length >= 24 && bestScore < nPix * 3.85) {
            const sortedPts = bPts.slice().sort((a, b) => (a.x !== b.x ? a.x - b.x : a.y - b.y));
            const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
            const lower = [], upper = [];
            for (let i = 0; i < sortedPts.length; i++) {
              const p = sortedPts[i];
              while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
              lower.push(p);
            }
            for (let i = sortedPts.length - 1; i >= 0; i--) {
              const p = sortedPts[i];
              while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
              upper.push(p);
            }
            lower.pop(); upper.pop();
            const hull = lower.concat(upper);

            if (hull.length >= 4) {
              const HLen = hull.length;
              let idx = [0, Math.floor(HLen / 4), Math.floor(HLen / 2), Math.floor((3 * HLen) / 4)];
              const quadArea = (i0, i1, i2, i3) => {
                const p0 = hull[i0], p1 = hull[i1], p2 = hull[i2], p3 = hull[i3];
                return 0.5 * Math.abs(
                  (p0.x * p1.y - p1.x * p0.y) + (p1.x * p2.y - p2.x * p1.y) +
                  (p2.x * p3.y - p3.x * p2.y) + (p3.x * p0.y - p0.x * p3.y)
                );
              };
              let improved = true, iter = 0;
              while (improved && iter < 15) {
                improved = false; iter++;
                let bestA = quadArea(idx[0], idx[1], idx[2], idx[3]);
                for (let ck = 0; ck < 4; ck++) {
                  for (let cand = 0; cand < HLen; cand++) {
                    if (cand === idx[0] || cand === idx[1] || cand === idx[2] || cand === idx[3]) continue;
                    const tIdx = [idx[0], idx[1], idx[2], idx[3]];
                    tIdx[ck] = cand;
                    tIdx.sort((a, b) => a - b);
                    const a = quadArea(tIdx[0], tIdx[1], tIdx[2], tIdx[3]);
                    if (a > bestA + 1e-2) { bestA = a; idx = tIdx; improved = true; }
                  }
                }
              }

              const hullCorners = [hull[idx[0]], hull[idx[1]], hull[idx[2]], hull[idx[3]]];
              const hCx = (hullCorners[0].x + hullCorners[1].x + hullCorners[2].x + hullCorners[3].x) * 0.25;
              const hCy = (hullCorners[0].y + hullCorners[1].y + hullCorners[2].y + hullCorners[3].y) * 0.25;
              hullCorners.sort((a, b) => Math.atan2(a.y - hCy, a.x - hCx) - Math.atan2(b.y - hCy, b.x - hCx));
              let tlIdx = 0, minDiag = Infinity;
              for (let i = 0; i < 4; i++) {
                const d = hullCorners[i].x / w + hullCorners[i].y / h;
                if (d < minDiag) { minDiag = d; tlIdx = i; }
              }
              const orderedHull = [
                hullCorners[tlIdx], hullCorners[(tlIdx + 1) % 4],
                hullCorners[(tlIdx + 2) % 4], hullCorners[(tlIdx + 3) % 4]
              ];

              const edgePts = [[], [], [], []];
              for (let i = 0; i < bPts.length; i++) {
                const bx = bPts[i].x, by = bPts[i].y;
                for (let k = 0; k < 4; k++) {
                  const p1 = orderedHull[k], p2 = orderedHull[(k + 1) % 4];
                  const vx = p2.x - p1.x, vy = p2.y - p1.y;
                  const segLen2 = vx * vx + vy * vy;
                  if (segLen2 < 16) continue;
                  const t = ((bx - p1.x) * vx + (by - p1.y) * vy) / segLen2;
                  if (t >= 0.15 && t <= 0.85) {
                    if (Math.hypot(bx - (p1.x + t * vx), by - (p1.y + t * vy)) <= 4.5) {
                      edgePts[k].push({ x: bx, y: by });
                    }
                  }
                }
              }

              const lines = [];
              for (let k = 0; k < 4; k++) {
                if (edgePts[k].length >= 6) {
                  lines.push(fitSingleIrlsLine(edgePts[k]));
                } else {
                  const p1 = orderedHull[k], p2 = orderedHull[(k + 1) % 4];
                  let a = p1.y - p2.y, b = p2.x - p1.x;
                  const norm = Math.hypot(a, b) || 1.0;
                  a /= norm; b /= norm;
                  lines.push({ a, b, c: -(a * p1.x + b * p1.y) });
                }
              }

              const pairs = [[3, 0], [0, 1], [1, 2], [2, 3]];
              const finalCorners = [];
              for (let k = 0; k < 4; k++) {
                const pt = intersectAbc(lines[pairs[k][0]], lines[pairs[k][1]]);
                if (pt && Math.hypot(pt.x - orderedHull[k].x, pt.y - orderedHull[k].y) < 28) {
                  finalCorners.push({
                    x: Math.max(0, Math.min(origW, Math.round(pt.x / scale))),
                    y: Math.max(0, Math.min(origH, Math.round(pt.y / scale)))
                  });
                } else {
                  finalCorners.push({
                    x: Math.max(0, Math.min(origW, Math.round(orderedHull[k].x / scale))),
                    y: Math.max(0, Math.min(origH, Math.round(orderedHull[k].y / scale)))
                  });
                }
              }
              return finalCorners;
            }
          }
        }

        // ENGINE 2: Universal Crease + Multi-Color Outer-Background Step Radon Detector
        const rawLeft = new Float32Array(nPix);
        const rawRight = new Float32Array(nPix);
        const rawTop = new Float32Array(nPix);
        const rawBot = new Float32Array(nPix);
        const eLeft = new Float32Array(nPix);
        const eRight = new Float32Array(nPix);
        const eTop = new Float32Array(nPix);
        const eBot = new Float32Array(nPix);

        for (let y = 4; y < h - 4; y++) {
          for (let x = 4; x < w - 4; x++) {
            const i = y * w + x;
            const cVal = L[i];
            const minXCrease = Math.min(cVal, L[i - 1], L[i + 1]);
            const minYCrease = Math.min(cVal, L[i - w], L[i + w]);

            if (distFromBg[i - 3] < 0.055) {
              const stepL = Math.max(0, L[i + 3] - Math.min(minXCrease, L[i - 2], L[i - 4]));
              const stepC = Math.hypot(rn[i + 3] - rn[i - 3], gn[i + 3] - gn[i - 3], bn[i + 3] - bn[i - 3]) * 320 + Math.abs(L_surf[i + 3] - L_surf[i - 3]) * 0.45;
              const v = Math.max(stepL, stepC);
              rawLeft[i] = v;
              eLeft[i] = Math.tanh(v / 4.5);
            }
            if (distFromBg[i + 3] < 0.055) {
              const stepL = Math.max(0, L[i - 3] - Math.min(minXCrease, L[i + 2], L[i + 4]));
              const stepC = Math.hypot(rn[i - 3] - rn[i + 3], gn[i - 3] - gn[i + 3], bn[i - 3] - bn[i + 3]) * 320 + Math.abs(L_surf[i - 3] - L_surf[i + 3]) * 0.45;
              const v = Math.max(stepL, stepC);
              rawRight[i] = v;
              eRight[i] = Math.tanh(v / 4.5);
            }
            if (distFromBg[i - 3 * w] < 0.055) {
              const stepL = Math.max(0, L[i + 3 * w] - Math.min(minYCrease, L[i - 2 * w], L[i - 4 * w]));
              const stepC = Math.hypot(rn[i + 3 * w] - rn[i - 3 * w], gn[i + 3 * w] - gn[i - 3 * w], bn[i + 3 * w] - bn[i - 3 * w]) * 320 + Math.abs(L_surf[i + 3 * w] - L_surf[i - 3 * w]) * 0.45;
              const v = Math.max(stepL, stepC);
              rawTop[i] = v;
              eTop[i] = Math.tanh(v / 4.5);
            }
            if (distFromBg[i + 3 * w] < 0.055) {
              const stepL = Math.max(0, L[i - 3 * w] - Math.min(minYCrease, L[i + 2 * w], L[i + 4 * w]));
              const stepC = Math.hypot(rn[i - 3 * w] - rn[i + 3 * w], gn[i - 3 * w] - gn[i + 3 * w], bn[i - 3 * w] - bn[i + 3 * w]) * 320 + Math.abs(L_surf[i - 3 * w] - L_surf[i + 3 * w]) * 0.45;
              const v = Math.max(stepL, stepC);
              rawBot[i] = v;
              eBot[i] = Math.tanh(v / 4.5);
            }
          }
        }

        function findBestVLines(emap, xMinR, xMaxR, isLeft) {
          const x0Min = Math.floor(w * xMinR), x0Max = Math.floor(w * xMaxR);
          const candidates = [];
          const N = 60;
          const yStart = Math.floor(h * 0.16), ySpan = Math.floor(h * 0.68);
          for (let xt = x0Min; xt < x0Max; xt += 2) {
            const xbMin = Math.max(x0Min, xt - Math.floor(w * 0.25));
            const xbMax = Math.min(x0Max, xt + Math.floor(w * 0.25));
            for (let xb = xbMin; xb < xbMax; xb += 2) {
              let sumV = 0, hits = 0;
              for (let k = 0; k < N; k++) {
                const t = k / (N - 1);
                const y = Math.round(yStart + t * ySpan);
                const x = Math.round(xt * (1 - t) + xb * t);
                const idx = y * w + x;
                const v = Math.max(emap[idx], emap[idx - 1], emap[idx + 1]);
                sumV += v;
                if (v > 0.35) hits++;
              }
              const meanSc = sumV / N;
              const cont = hits / N;
              if (cont > 0.55) {
                const innerPos = isLeft ? (xt + xb) / (2 * w) : 1.0 - (xt + xb) / (2 * w);
                const totalSc = meanSc * 0.55 + cont * 0.45 + innerPos * 0.30;
                candidates.push({ sc: totalSc, xt, xb });
              }
            }
          }
          candidates.sort((a, b) => b.sc - a.sc);
          const kept = [];
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            if (kept.every((k) => Math.abs(c.xt - k.xt) + Math.abs(c.xb - k.xb) > 8)) {
              kept.push(c);
              if (kept.length >= 6) break;
            }
          }
          return kept;
        }

        function findBestHLines(emap, yMinR, yMaxR, isTop) {
          const y0Min = Math.floor(h * yMinR), y0Max = Math.floor(h * yMaxR);
          const candidates = [];
          const N = 60;
          const xStart = Math.floor(w * 0.16), xSpan = Math.floor(w * 0.68);
          for (let yl = y0Min; yl < y0Max; yl += 2) {
            const yrMin = Math.max(y0Min, yl - Math.floor(h * 0.25));
            const yrMax = Math.min(y0Max, yl + Math.floor(h * 0.25));
            for (let yr = yrMin; yr < yrMax; yr += 2) {
              let sumV = 0, hits = 0;
              for (let k = 0; k < N; k++) {
                const t = k / (N - 1);
                const x = Math.round(xStart + t * xSpan);
                const y = Math.round(yl * (1 - t) + yr * t);
                const idx = y * w + x;
                const v = Math.max(emap[idx], emap[idx - w], emap[idx + w]);
                sumV += v;
                if (v > 0.35) hits++;
              }
              const meanSc = sumV / N;
              const cont = hits / N;
              if (cont > 0.55) {
                const innerPos = isTop ? (yl + yr) / (2 * h) : 1.0 - (yl + yr) / (2 * h);
                const totalSc = meanSc * 0.55 + cont * 0.45 + innerPos * 0.30;
                candidates.push({ sc: totalSc, yl, yr });
              }
            }
          }
          candidates.sort((a, b) => b.sc - a.sc);
          const kept = [];
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            if (kept.every((k) => Math.abs(c.yl - k.yl) + Math.abs(c.yr - k.yr) > 8)) {
              kept.push(c);
              if (kept.length >= 6) break;
            }
          }
          return kept;
        }

        const leftCands = findBestVLines(eLeft, 0.02, 0.42, true);
        const rightCands = findBestVLines(eRight, 0.58, 0.98, false);
        const topCands = findBestHLines(eTop, 0.02, 0.42, true);
        const botCands = findBestHLines(eBot, 0.58, 0.98, false);

        function vlineToAbc(xt, xb) {
          const p1x = xt, p1y = h * 0.16, p2x = xb, p2y = h * 0.84;
          let a = p1y - p2y, b = p2x - p1x;
          const n = Math.hypot(a, b) || 1.0;
          a /= n; b /= n;
          return { a, b, c: -(a * p1x + b * p1y) };
        }

        function hlineToAbc(yl, yr) {
          const p1x = w * 0.16, p1y = yl, p2x = w * 0.84, p2y = yr;
          let a = p1y - p2y, b = p2x - p1x;
          const n = Math.hypot(a, b) || 1.0;
          a /= n; b /= n;
          return { a, b, c: -(a * p1x + b * p1y) };
        }

        function segmentSupport(p1, p2, emap) {
          const N = 50;
          let sumV = 0, hits = 0;
          for (let k = 0; k < N; k++) {
            const t = 0.06 + (k / (N - 1)) * 0.88;
            const x = Math.min(w - 2, Math.max(1, Math.round(p1.x * (1 - t) + p2.x * t)));
            const y = Math.min(h - 2, Math.max(1, Math.round(p1.y * (1 - t) + p2.y * t)));
            const idx = y * w + x;
            const v = Math.max(emap[idx], emap[idx - 1], emap[idx + 1], emap[idx - w], emap[idx + w]);
            sumV += v;
            if (v > 0.35) hits++;
          }
          return (sumV / N) * 0.5 + (hits / N) * 0.5;
        }

        let bestQuad = null;
        let bestQScore = -1.0;

        for (let iL = 0; iL < leftCands.length; iL++) {
          const LL = vlineToAbc(leftCands[iL].xt, leftCands[iL].xb);
          for (let iR = 0; iR < rightCands.length; iR++) {
            const LR = vlineToAbc(rightCands[iR].xt, rightCands[iR].xb);
            for (let iT = 0; iT < topCands.length; iT++) {
              const LT = hlineToAbc(topCands[iT].yl, topCands[iT].yr);
              for (let iB = 0; iB < botCands.length; iB++) {
                const LB = hlineToAbc(botCands[iB].yl, botCands[iB].yr);
                const tl = intersectAbc(LT, LL);
                const tr = intersectAbc(LT, LR);
                const br = intersectAbc(LB, LR);
                const bl = intersectAbc(LB, LL);
                if (!tl || !tr || !br || !bl) continue;
                if (
                  tl.x < 2 || tl.x > w - 3 || tl.y < 2 || tl.y > h - 3 ||
                  tr.x < 2 || tr.x > w - 3 || tr.y < 2 || tr.y > h - 3 ||
                  br.x < 2 || br.x > w - 3 || br.y < 2 || br.y > h - 3 ||
                  bl.x < 2 || bl.x > w - 3 || bl.y < 2 || bl.y > h - 3
                ) continue;

                const vTx = tr.x - tl.x, vTy = tr.y - tl.y;
                const vBx = br.x - bl.x, vBy = br.y - bl.y;
                const vLx = bl.x - tl.x, vLy = bl.y - tl.y;
                const vRx = br.x - tr.x, vRy = br.y - tr.y;
                const lenT = Math.hypot(vTx, vTy), lenB = Math.hypot(vBx, vBy);
                const lenL = Math.hypot(vLx, vLy), lenR = Math.hypot(vRx, vRy);
                if (Math.min(lenT, lenB, lenL, lenR) < Math.min(w, h) * 0.35) continue;

                const cosTL = Math.abs(vTx * vLx + vTy * vLy) / (lenT * lenL + 1e-5);
                const cosBR = Math.abs(vBx * vRx + vBy * vRy) / (lenB * lenR + 1e-5);
                if (cosTL > 0.36 || cosBR > 0.36) continue;

                const supT = segmentSupport(tl, tr, eTop);
                const supB = segmentSupport(bl, br, eBot);
                const supL = segmentSupport(tl, bl, eLeft);
                const supR = segmentSupport(tr, br, eRight);

                const minSup = Math.min(supT, supB, supL, supR);
                const orthoBonus = (1.0 - cosTL) * 0.4 + (1.0 - cosBR) * 0.4;
                const areaRatio = (lenT + lenB) * (lenL + lenR) * 0.25 / (w * h);
                const innerPref = (1.0 - areaRatio) * 0.30;

                const qScore = (supT + supB + supL + supR) + minSup * 1.2 + orthoBonus + innerPref;
                if (qScore > bestQScore) {
                  bestQScore = qScore;
                  bestQuad = [tl, tr, br, bl];
                }
              }
            }
          }
        }

        if (bestQuad) {
          const pairsPts = [
            { p1: bestQuad[0], p2: bestQuad[1], emap: rawTop, isH: true },
            { p1: bestQuad[1], p2: bestQuad[2], emap: rawRight, isH: false },
            { p1: bestQuad[2], p2: bestQuad[3], emap: rawBot, isH: true },
            { p1: bestQuad[3], p2: bestQuad[0], emap: rawLeft, isH: false }
          ];
          const refinedLines = pairsPts.map((item) => {
            const ptsK = [];
            for (let k = 0; k < 44; k++) {
              const t = 0.12 + (k / 43) * 0.76;
              const px = item.p1.x * (1 - t) + item.p2.x * t;
              const py = item.p1.y * (1 - t) + item.p2.y * t;
              const ix = Math.round(px), iy = Math.round(py);
              let bestOff = 0, bestVal = -1;
              for (let d = -3; d <= 3; d++) {
                const nx = item.isH ? ix : Math.min(w - 1, Math.max(0, ix + d));
                const ny = item.isH ? Math.min(h - 1, Math.max(0, iy + d)) : iy;
                const val = item.emap[ny * w + nx];
                if (val > bestVal) { bestVal = val; bestOff = d; }
              }
              ptsK.push(item.isH ? { x: px, y: iy + bestOff } : { x: ix + bestOff, y: py });
            }
            return fitSingleIrlsLine(ptsK);
          });

          const idxPairs = [[3, 0], [0, 1], [1, 2], [2, 3]];
          return idxPairs.map((pair, k) => {
            const pt = intersectAbc(refinedLines[pair[0]], refinedLines[pair[1]]);
            if (pt && Math.hypot(pt.x - bestQuad[k].x, pt.y - bestQuad[k].y) < 16) {
              return {
                x: Math.max(0, Math.min(origW, Math.round(pt.x / scale))),
                y: Math.max(0, Math.min(origH, Math.round(pt.y / scale)))
              };
            }
            return {
              x: Math.max(0, Math.min(origW, Math.round(bestQuad[k].x / scale))),
              y: Math.max(0, Math.min(origH, Math.round(bestQuad[k].y / scale)))
            };
          });
        }

        return [
          { x: Math.round(origW * 0.06), y: Math.round(origH * 0.06) },
          { x: Math.round(origW * 0.94), y: Math.round(origH * 0.06) },
          { x: Math.round(origW * 0.94), y: Math.round(origH * 0.94) },
          { x: Math.round(origW * 0.06), y: Math.round(origH * 0.94) }
        ];
      }

      // =========================================================================
      // 5. TRUE-3D ASPECT RECOVERY + COONS PATCH + PARABOLIC TEXT-LINE RECTIFIER
      // =========================================================================
      function computeHomography(srcPts, dstPts) {
        const A = [];
        const b = [];
        for (let i = 0; i < 4; i++) {
          const x = srcPts[i].x;
          const y = srcPts[i].y;
          const u = dstPts[i].x;
          const v = dstPts[i].y;
          A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]);
          b.push(u);
          A.push([0, 0, 0, x, y, 1, -x * v, -y * v]);
          b.push(v);
        }

        const n = 8;
        for (let i = 0; i < n; i++) {
          let maxRow = i;
          let maxVal = Math.abs(A[i][i]);
          for (let k = i + 1; k < n; k++) {
            if (Math.abs(A[k][i]) > maxVal) {
              maxVal = Math.abs(A[k][i]);
              maxRow = k;
            }
          }
          const tmpRow = A[i]; A[i] = A[maxRow]; A[maxRow] = tmpRow;
          const tmpB = b[i]; b[i] = b[maxRow]; b[maxRow] = tmpB;

          const pivot = A[i][i] || 1e-12;
          for (let j = i; j < n; j++) A[i][j] /= pivot;
          b[i] /= pivot;

          for (let k = 0; k < n; k++) {
            if (k !== i) {
              const factor = A[k][i];
              for (let j = i; j < n; j++) A[k][j] -= factor * A[i][j];
              b[k] -= factor * b[i];
            }
          }
        }
        return [b[0], b[1], b[2], b[3], b[4], b[5], b[6], b[7], 1];
      }

      function fitParabola3(xs, ys) {
        const n = xs.length;
        if (n < 3) return [0, 0, 0];
        let s4 = 0, s3 = 0, s2 = 0, s1 = 0, s0 = n;
        let syx2 = 0, syx1 = 0, sy0 = 0;
        for (let i = 0; i < n; i++) {
          const x = xs[i], y = ys[i];
          const x2 = x * x;
          s1 += x;
          s2 += x2;
          s3 += x2 * x;
          s4 += x2 * x2;
          sy0 += y;
          syx1 += y * x;
          syx2 += y * x2;
        }
        const M = [
          [s4, s3, s2, syx2],
          [s3, s2, s1, syx1],
          [s2, s1, s0, sy0]
        ];
        for (let i = 0; i < 3; i++) {
          let piv = i;
          for (let k = i + 1; k < 3; k++) {
            if (Math.abs(M[k][i]) > Math.abs(M[piv][i])) piv = k;
          }
          const tmp = M[i]; M[i] = M[piv]; M[piv] = tmp;
          const div = M[i][i] || 1e-9;
          for (let j = i; j < 4; j++) M[i][j] /= div;
          for (let k = 0; k < 3; k++) {
            if (k !== i) {
              const f = M[k][i];
              for (let j = i; j < 4; j++) M[k][j] -= f * M[i][j];
            }
          }
        }
        return [M[0][3], M[1][3], M[2][3]];
      }

      function dewarpQuad(srcCanvas, quadCorners, paperSizeMode, midOffsets) {
        const topW = Math.hypot(quadCorners[1].x - quadCorners[0].x, quadCorners[1].y - quadCorners[0].y);
        const botW = Math.hypot(quadCorners[2].x - quadCorners[3].x, quadCorners[2].y - quadCorners[3].y);
        const leftH = Math.hypot(quadCorners[3].x - quadCorners[0].x, quadCorners[3].y - quadCorners[0].y);
        const rightH = Math.hypot(quadCorners[2].x - quadCorners[1].x, quadCorners[2].y - quadCorners[1].y);

        const kw = Math.max(topW, botW) / Math.max(1.0, Math.min(topW, botW));
        const kh = Math.max(leftH, rightH) / Math.max(1.0, Math.min(leftH, rightH));
        const tiltBoostH = Math.sqrt(1.0 + 2.6 * Math.pow(kw - 1.0, 1.15));
        const tiltBoostW = Math.sqrt(1.0 + 2.6 * Math.pow(kh - 1.0, 1.15));

        const corrW = Math.max(topW, botW) * tiltBoostW;
        const corrH = Math.max(leftH, rightH) * tiltBoostH;
        let ratioHW = corrH / Math.max(1.0, corrW);

        if (paperSizeMode === "a4_portrait" || paperSizeMode === "a5") {
          ratioHW = 1.4142;
        } else if (paperSizeMode === "a4_landscape") {
          ratioHW = 1.0 / 1.4142;
        } else if (paperSizeMode === "letter") {
          ratioHW = 11.0 / 8.5;
        } else {
          if (ratioHW >= 0.90 && ratioHW <= 1.88) {
            ratioHW = 1.4142;
          } else if (ratioHW >= 0.52 && ratioHW < 0.90) {
            ratioHW = 1.0 / 1.4142;
          }
        }

        let dstW = Math.round(Math.max(topW, botW, 800));
        let dstH = Math.round(dstW * ratioHW);

        const maxSide = 1350;
        if (Math.max(dstW, dstH) > maxSide) {
          const sc = maxSide / Math.max(dstW, dstH);
          dstW = Math.round(dstW * sc);
          dstH = Math.round(dstH * sc);
        }
        dstW = Math.max(160, dstW);
        dstH = Math.max(160, dstH);

        const dstPts = [
          { x: 0, y: 0 },
          { x: dstW - 1, y: 0 },
          { x: dstW - 1, y: dstH - 1 },
          { x: 0, y: dstH - 1 }
        ];

        const H = computeHomography(dstPts, quadCorners);
        const sW = srcCanvas.width;
        const sH = srcCanvas.height;
        const sData = srcCanvas.getContext("2d").getImageData(0, 0, sW, sH).data;

        const mOff = midOffsets || [
          { x: 0, y: 0 },
          { x: 0, y: 0 },
          { x: 0, y: 0 },
          { x: 0, y: 0 }
        ];

        const tempData = new Uint8ClampedArray(dstW * dstH * 4);
        for (let v = 0; v < dstH; v++) {
          const ty = v / (dstH - 1);
          const parabY = 4.0 * ty * (1.0 - ty);
          for (let u = 0; u < dstW; u++) {
            const tx = u / (dstW - 1);
            const parabX = 4.0 * tx * (1.0 - tx);

            const denom = H[6] * u + H[7] * v + 1;
            const offX = (1.0 - ty) * parabX * mOff[0].x + ty * parabX * mOff[2].x +
                         (1.0 - tx) * parabY * mOff[3].x + tx * parabY * mOff[1].x;
            const offY = (1.0 - ty) * parabX * mOff[0].y + ty * parabX * mOff[2].y +
                         (1.0 - tx) * parabY * mOff[3].y + tx * parabY * mOff[1].y;

            const sx = (H[0] * u + H[1] * v + H[2]) / denom + offX;
            const sy = (H[3] * u + H[4] * v + H[5]) / denom + offY;

            const di = (v * dstW + u) * 4;
            if (sx >= 0 && sx < sW - 1 && sy >= 0 && sy < sH - 1) {
              const x0 = sx | 0;
              const y0 = sy | 0;
              const dx = sx - x0;
              const dy = sy - y0;

              const i00 = (y0 * sW + x0) * 4;
              const i10 = i00 + 4;
              const i01 = i00 + sW * 4;
              const i11 = i01 + 4;

              const w00 = (1 - dx) * (1 - dy);
              const w10 = dx * (1 - dy);
              const w01 = (1 - dx) * dy;
              const w11 = dx * dy;

              tempData[di]     = sData[i00] * w00 + sData[i10] * w10 + sData[i01] * w01 + sData[i11] * w11;
              tempData[di + 1] = sData[i00 + 1] * w00 + sData[i10 + 1] * w10 + sData[i01 + 1] * w01 + sData[i11 + 1] * w11;
              tempData[di + 2] = sData[i00 + 2] * w00 + sData[i10 + 2] * w10 + sData[i01 + 2] * w01 + sData[i11 + 2] * w11;
              tempData[di + 3] = 255;
            } else {
              tempData[di] = 255;
              tempData[di + 1] = 255;
              tempData[di + 2] = 255;
              tempData[di + 3] = 255;
            }
          }
        }

        // Stage 3: Automatic 16-Strip Parabolic Text-Line Curl Straightening
        const nStrips = 16;
        const stripW = Math.floor(dstW / nStrips);
        const y0 = Math.floor(dstH * 0.06);
        const y1 = Math.floor(dstH * 0.94);
        const yLen = y1 - y0;

        const profiles = [];
        const pNorms = new Float32Array(nStrips);

        for (let k = 0; k < nStrips; k++) {
          const xs0 = k * stripW + Math.floor(stripW * 0.1);
          const xs1 = (k + 1) * stripW - Math.floor(stripW * 0.1);
          const prof = new Float32Array(yLen);
          for (let y = y0; y < y1; y++) {
            let sumGy = 0;
            const rPrev = (y - 1) * dstW * 4;
            const rNext = (y + 1) * dstW * 4;
            for (let x = xs0; x < xs1; x += 2) {
              const cOff = x * 4;
              const lPrev = 0.299 * tempData[rPrev + cOff] + 0.587 * tempData[rPrev + cOff + 1] + 0.114 * tempData[rPrev + cOff + 2];
              const lNext = 0.299 * tempData[rNext + cOff] + 0.587 * tempData[rNext + cOff + 1] + 0.114 * tempData[rNext + cOff + 2];
              sumGy += Math.abs(lNext - lPrev);
            }
            prof[y - y0] = sumGy / Math.max(1, Math.ceil((xs1 - xs0) / 2));
          }
          const hp = new Float32Array(yLen);
          let normSq = 0;
          for (let i = 0; i < yLen; i++) {
            const a0 = Math.max(0, i - 16), a1 = Math.min(yLen - 1, i + 16);
            let s = 0;
            for (let j = a0; j <= a1; j++) s += prof[j];
            const v = prof[i] - s / (a1 - a0 + 1);
            hp[i] = v;
            normSq += v * v;
          }
          profiles.push(hp);
          pNorms[k] = Math.sqrt(normSq);
        }

        const refProf = new Float32Array(yLen);
        let refNormSq = 0;
        for (let i = 0; i < yLen; i++) {
          const v = (profiles[6][i] + profiles[7][i] + profiles[8][i] + profiles[9][i]) * 0.25;
          refProf[i] = v;
          refNormSq += v * v;
        }
        const refNorm = Math.sqrt(refNormSq) + 1e-5;

        const validXs = [];
        const validShifts = [];
        const maxShift = Math.min(38, Math.floor(dstH * 0.04));

        for (let k = 0; k < nStrips; k++) {
          const xNorm = (k + 0.5) / nStrips - 0.5;
          if (k >= 6 && k <= 9) {
            validXs.push(xNorm);
            validShifts.push(0);
            continue;
          }
          if (pNorms[k] < refNorm * 0.35) continue;

          const p = profiles[k];
          const denomNorm = refNorm * pNorms[k] + 1e-5;
          let bestS = 0;
          let bestScore = -1e9;

          for (let s = -maxShift; s <= maxShift; s++) {
            let dot = 0;
            const iStart = Math.max(0, s);
            const iEnd = Math.min(yLen, yLen + s);
            for (let i = iStart; i < iEnd; i++) {
              dot += refProf[i] * p[i - s];
            }
            const score = (dot / denomNorm) - 0.0012 * (s * s);
            if (score > bestScore) {
              bestScore = score;
              bestS = s;
            }
          }
          if (bestScore > 0.20) {
            validXs.push(xNorm);
            validShifts.push(bestS);
          }
        }

        const outCanvas = document.createElement("canvas");
        outCanvas.width = dstW;
        outCanvas.height = dstH;
        const outCtx = outCanvas.getContext("2d");
        const outImg = outCtx.createImageData(dstW, dstH);
        const dData = outImg.data;

        if (validXs.length >= 6) {
          const [a, b] = fitParabola3(validXs, validShifts);
          const shiftCol = new Float32Array(dstW);
          let maxAbsShift = 0;
          for (let x = 0; x < dstW; x++) {
            const xn = x / dstW - 0.5;
            const sh = a * xn * xn + b * xn;
            shiftCol[x] = sh;
            if (Math.abs(sh) > maxAbsShift) maxAbsShift = Math.abs(sh);
          }

          if (maxAbsShift >= 1.2) {
            for (let y = 0; y < dstH; y++) {
              const borderTaper = Math.min(1.0, Math.min(y, dstH - 1 - y) / (dstH * 0.03 + 1));
              for (let x = 0; x < dstW; x++) {
                const sy = Math.min(dstH - 1.001, Math.max(0, y - shiftCol[x] * borderTaper));
                const y0i = sy | 0;
                const dy = sy - y0i;
                const i0 = (y0i * dstW + x) * 4;
                const i1 = ((y0i + 1) * dstW + x) * 4;
                const di = (y * dstW + x) * 4;
                dData[di]     = tempData[i0] * (1 - dy) + tempData[i1] * dy;
                dData[di + 1] = tempData[i0 + 1] * (1 - dy) + tempData[i1 + 1] * dy;
                dData[di + 2] = tempData[i0 + 2] * (1 - dy) + tempData[i1 + 2] * dy;
                dData[di + 3] = 255;
              }
            }
            outCtx.putImageData(outImg, 0, 0);
            return outCanvas;
          }
        }

        dData.set(tempData);
        outCtx.putImageData(outImg, 0, 0);
        return outCanvas;
      }

      // =========================================================================
      // 6. HALO-FREE PAPER WHITENING & SAUVOLA B&W ENGINE
      // =========================================================================
      function sepMaxFilter(arr, w, h, rad) {
        const tmp = new Float32Array(w * h);
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let m = -Infinity;
            for (let nx = x0; nx <= x1; nx++) {
              const v = arr[rOff + nx];
              if (v > m) m = v;
            }
            tmp[rOff + x] = m;
          }
        }
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          for (let x = 0; x < w; x++) {
            let m = -Infinity;
            for (let ny = y0; ny <= y1; ny++) {
              const v = tmp[ny * w + x];
              if (v > m) m = v;
            }
            out[y * w + x] = m;
          }
        }
        return out;
      }

      function sepMinFilter(arr, w, h, rad) {
        const tmp = new Float32Array(w * h);
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let m = Infinity;
            for (let nx = x0; nx <= x1; nx++) {
              const v = arr[rOff + nx];
              if (v < m) m = v;
            }
            tmp[rOff + x] = m;
          }
        }
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          for (let x = 0; x < w; x++) {
            let m = Infinity;
            for (let ny = y0; ny <= y1; ny++) {
              const v = tmp[ny * w + x];
              if (v < m) m = v;
            }
            out[y * w + x] = m;
          }
        }
        return out;
      }

      function sepBoxBlur(arr, w, h, rad) {
        const tmp = new Float32Array(w * h);
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
            let s = 0;
            for (let nx = x0; nx <= x1; nx++) s += arr[rOff + nx];
            tmp[rOff + x] = s / (x1 - x0 + 1);
          }
        }
        for (let y = 0; y < h; y++) {
          const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
          const cnt = y1 - y0 + 1;
          for (let x = 0; x < w; x++) {
            let s = 0;
            for (let ny = y0; ny <= y1; ny++) s += tmp[ny * w + x];
            out[y * w + x] = s / cnt;
          }
        }
        return out;
      }

      function computeFinePaperSurfaceGrid(chArray, w, h) {
        const scale = 2;
        const sw = Math.max(8, Math.floor(w / scale));
        const sh = Math.max(8, Math.floor(h / scale));
        const sub = new Float32Array(sw * sh);

        for (let sy = 0; sy < sh; sy++) {
          const y0 = sy * scale;
          const rOff = y0 * w;
          for (let sx = 0; sx < sw; sx++) {
            sub[sy * sw + sx] = chArray[rOff + sx * scale];
          }
        }

        const dil = sepMaxFilter(sub, sw, sh, 3);
        const clo = sepMinFilter(dil, sw, sh, 2);
        const sm1 = sepBoxBlur(clo, sw, sh, 2);
        const sm2 = sepBoxBlur(sm1, sw, sh, 2);

        return { grid: sm2, sw, sh, scale };
      }

      function sampleEnvelopeGrid(envObj, x, y) {
        const gx = Math.min(envObj.sw - 1.001, Math.max(0, x / envObj.scale));
        const gy = Math.min(envObj.sh - 1.001, Math.max(0, y / envObj.scale));
        const x0 = gx | 0;
        const y0 = gy | 0;
        const dx = gx - x0;
        const dy = gy - y0;
        const g = envObj.grid;
        const sw = envObj.sw;
        const r0 = y0 * sw + x0;
        const r1 = (y0 + 1) * sw + x0;
        return (
          g[r0] * (1 - dx) * (1 - dy) +
          g[r0 + 1] * dx * (1 - dy) +
          g[r1] * (1 - dx) * dy +
          g[r1 + 1] * dx * dy
        );
      }

      function buildPageFilterCache(dewarpedCanvas) {
        const w = dewarpedCanvas.width;
        const h = dewarpedCanvas.height;
        const nPixels = w * h;
        const rawData = dewarpedCanvas.getContext("2d").getImageData(0, 0, w, h).data;

        const chR = new Float32Array(nPixels);
        const chG = new Float32Array(nPixels);
        const chB = new Float32Array(nPixels);
        const lum = new Float32Array(nPixels);

        for (let i = 0; i < nPixels; i++) {
          const idx = i * 4;
          const r = rawData[idx];
          const g = rawData[idx + 1];
          const b = rawData[idx + 2];
          chR[i] = r;
          chG[i] = g;
          chB[i] = b;
          lum[i] = 0.299 * r + 0.587 * g + 0.114 * b;
        }

        const gridL = computeFinePaperSurfaceGrid(lum, w, h);
        const gridR = computeFinePaperSurfaceGrid(chR, w, h);
        const gridG = computeFinePaperSurfaceGrid(chG, w, h);
        const gridB = computeFinePaperSurfaceGrid(chB, w, h);

        const uR = new Uint8Array(nPixels);
        const uG = new Uint8Array(nPixels);
        const uB = new Uint8Array(nPixels);
        const uL = new Float32Array(nPixels);
        const dL = new Float32Array(nPixels);

        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const i = rOff + x;
            const eL = Math.max(40.0, sampleEnvelopeGrid(gridL, x, y));
            const eR = Math.max(40.0, sampleEnvelopeGrid(gridR, x, y));
            const eG = Math.max(40.0, sampleEnvelopeGrid(gridG, x, y));
            const eB = Math.max(40.0, sampleEnvelopeGrid(gridB, x, y));

            const nr = Math.min(255, Math.max(0, Math.round((255.0 * chR[i]) / eR)));
            const ng = Math.min(255, Math.max(0, Math.round((255.0 * chG[i]) / eG)));
            const nb = Math.min(255, Math.max(0, Math.round((255.0 * chB[i]) / eB)));
            const nl = Math.min(255.0, Math.max(0.0, (255.0 * lum[i]) / eL));

            uR[i] = nr;
            uG[i] = ng;
            uB[i] = nb;
            uL[i] = nl;
            dL[i] = 255.0 - nl;
          }
        }

        const dMaxLocalF = sepMaxFilter(dL, w, h, 4);
        const dMaxLocal = new Uint8Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          dMaxLocal[i] = Math.min(255, Math.round(dMaxLocalF[i]));
        }

        const uLSq = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) uLSq[i] = uL[i] * uL[i];
        const meanL = sepBoxBlur(uL, w, h, 15);
        const meanSqL = sepBoxBlur(uLSq, w, h, 15);
        const stdL = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          stdL[i] = Math.sqrt(Math.max(0.0, meanSqL[i] - meanL[i] * meanL[i]));
        }

        return {
          w,
          h,
          rawData,
          uR,
          uG,
          uB,
          uL,
          dMaxLocal,
          meanL,
          stdL
        };
      }

      function applyCachedFiltersToPage(page) {
        if (!page || !page.filterCache) return;
        const fc = page.filterCache;
        const w = fc.w;
        const h = fc.h;
        const nPixels = w * h;
        const settings = page.settings;

        const mode = settings.colorMode || "original";
        const cleanAmt = (settings.bgSuppress ?? 68) / 100.0;
        const contrastAmt = (settings.contrast ?? 55) / 100.0;
        const transparentBg = !!settings.transparentBg;

        if (!page.processedCanvas || page.processedCanvas.width !== w || page.processedCanvas.height !== h) {
          page.processedCanvas = document.createElement("canvas");
          page.processedCanvas.width = w;
          page.processedCanvas.height = h;
        }
        const outCtx = page.processedCanvas.getContext("2d");
        const outImg = outCtx.createImageData(w, h);
        const data = outImg.data;

        const rawData = fc.rawData;
        const uR = fc.uR;
        const uG = fc.uG;
        const uB = fc.uB;
        const uL = fc.uL;
        const dMaxLocal = fc.dMaxLocal;
        const meanL = fc.meanL;
        const stdL = fc.stdL;

        if (mode === "original") {
          data.set(rawData);
          if (transparentBg) {
            for (let i = 0; i < nPixels; i++) {
              const idx = i * 4;
              const d = 255 - uL[i];
              data[idx + 3] = d < 18 ? 0 : d < 48 ? Math.round(((d - 18) / 30) * 255) : 255;
            }
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        if (mode === "bw_sauvola") {
          const k = 0.16 + (1.0 - contrastAmt) * 0.10;
          const minDip = 14.0 + cleanAmt * 20.0 - contrastAmt * 6.0;
          const haloRatio = 0.24 + cleanAmt * 0.16;

          for (let i = 0; i < nPixels; i++) {
            const nl = uL[i];
            const mL = meanL[i];
            const sL = stdL[i];
            const sauvolaT = mL * (1.0 - k * (1.0 - sL / 128.0));
            const haloGuard = Math.max(minDip, dMaxLocal[i] * haloRatio);
            const effT = Math.min(sauvolaT, 255.0 - haloGuard);

            const diff = nl - effT;
            let bw;
            if (diff >= 5.0) bw = 255;
            else if (diff <= -5.0) bw = 10;
            else bw = Math.round(10.0 + ((diff + 5.0) / 10.0) * 245.0);

            const idx = i * 4;
            data[idx] = bw;
            data[idx + 1] = bw;
            data[idx + 2] = bw;
            data[idx + 3] = transparentBg ? (255 - bw) : 255;
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        let baseFloor, haloRatio, gain;
        if (mode === "faint_boost") {
          baseFloor = 11.0 + cleanAmt * 16.0;
          haloRatio = 0.22 + cleanAmt * 0.14;
          gain = 1.65 + contrastAmt * 1.45;
        } else {
          baseFloor = 15.0 + cleanAmt * 26.0;
          haloRatio = 0.28 + cleanAmt * 0.16;
          gain = 1.40 + contrastAmt * 1.25;
        }

        for (let i = 0; i < nPixels; i++) {
          const nr = uR[i];
          const ng = uG[i];
          const nb = uB[i];
          const nl = uL[i];
          const dL = 255.0 - nl;

          const maxC = nr > ng ? (nr > nb ? nr : nb) : (ng > nb ? ng : nb);
          const minC = nr < ng ? (nr < nb ? nr : nb) : (ng < nb ? ng : nb);
          const chroma = maxC - minC;

          const adaptiveFloor = Math.max(baseFloor, dMaxLocal[i] * haloRatio);
          const effFloor = Math.max(3.0, adaptiveFloor - chroma * 0.35);

          let smoothGain = 0.0;
          const lowEdge = effFloor * 0.80;
          if (dL > lowEdge) {
            const bandW = Math.max(2.0, effFloor * 0.35);
            const t = Math.min(1.0, (dL - lowEdge) / bandW);
            smoothGain = t * t * (3.0 - 2.0 * t) * gain;
          }

          const r = Math.min(255, Math.max(0, Math.round(255.0 - (255 - nr) * smoothGain)));
          const g = Math.min(255, Math.max(0, Math.round(255.0 - (255 - ng) * smoothGain)));
          const b = Math.min(255, Math.max(0, Math.round(255.0 - (255 - nb) * smoothGain)));

          const idx = i * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;

          if (transparentBg) {
            const lumOut = 0.299 * r + 0.587 * g + 0.114 * b;
            const dark = (255 - lumOut) + chroma * 0.85;
            data[idx + 3] = dark < 12 ? 0 : dark < 46 ? Math.round(((dark - 12) / 34) * 255) : 255;
          } else {
            data[idx + 3] = 255;
          }
        }

        outCtx.putImageData(outImg, 0, 0);
      }

      function updateGeometryAndProcess(page) {
        if (!page) return;
        const dewarped = dewarpQuad(
          page.srcCanvas,
          page.corners,
          page.settings.paperSize,
          page.midOffsets
        );
        page.dewarpedCanvas = dewarped;
        page.filterCache = buildPageFilterCache(dewarped);
        applyCachedFiltersToPage(page);
      }

      // =========================================================================
      // 7. STAGE RENDERING & TOUCH HANDLERS
      // =========================================================================
      function getMidHandlePos(page, i) {
        const c = page.corners;
        const p1 = c[i];
        const p2 = c[(i + 1) % 4];
        const mOff = (page.midOffsets && page.midOffsets[i]) || { x: 0, y: 0 };
        return {
          x: (p1.x + p2.x) * 0.5 + mOff.x,
          y: (p1.y + p2.y) * 0.5 + mOff.y
        };
      }

      function drawCurvedQuadPath(ctx, page) {
        const c = page.corners;
        ctx.moveTo(c[0].x, c[0].y);
        for (let i = 0; i < 4; i++) {
          const p1 = c[i];
          const p2 = c[(i + 1) % 4];
          const mOff = (page.midOffsets && page.midOffsets[i]) || { x: 0, y: 0 };
          const cpX = (p1.x + p2.x) * 0.5 + mOff.x * 2.0;
          const cpY = (p1.y + p2.y) * 0.5 + mOff.y * 2.0;
          ctx.quadraticCurveTo(cpX, cpY, p2.x, p2.y);
        }
        ctx.closePath();
      }

      function renderStage() {
        const page = getCurrentPage();
        if (!page) return;

        const ctx = el.mainCanvas.getContext("2d");

        if (state.viewMode === "crop") {
          const sW = page.srcCanvas.width;
          const sH = page.srcCanvas.height;
          el.mainCanvas.width = sW;
          el.mainCanvas.height = sH;

          ctx.clearRect(0, 0, sW, sH);
          ctx.drawImage(page.srcCanvas, 0, 0);

          const c = page.corners;
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.48)";
          ctx.beginPath();
          ctx.rect(0, 0, sW, sH);
          drawCurvedQuadPath(ctx, page);
          ctx.fill("evenodd");
          ctx.restore();

          const strokeW = Math.max(4, sW / 210);
          ctx.save();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = strokeW + 2;
          ctx.beginPath();
          drawCurvedQuadPath(ctx, page);
          ctx.stroke();

          ctx.strokeStyle = "#0a467d";
          ctx.lineWidth = strokeW;
          ctx.stroke();
          ctx.restore();

          const midR = Math.max(11, sW / 72);
          for (let i = 0; i < 4; i++) {
            const mp = getMidHandlePos(page, i);
            ctx.save();
            ctx.fillStyle = "#eaf2fb";
            ctx.strokeStyle = "#0a467d";
            ctx.lineWidth = Math.max(2.5, sW / 280);
            ctx.beginPath();
            ctx.arc(mp.x, mp.y, midR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          const cornerR = Math.max(17, sW / 48);
          const labels = ["TL", "TR", "BR", "BL"];
          for (let i = 0; i < 4; i++) {
            drawHandle(ctx, c[i].x, c[i].y, cornerR, "#0a467d", labels[i]);
          }
        } else {
          if (!page.processedCanvas) updateGeometryAndProcess(page);
          const targetCanvas = page.processedCanvas;
          el.mainCanvas.width = targetCanvas.width;
          el.mainCanvas.height = targetCanvas.height;
          ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
          ctx.drawImage(targetCanvas, 0, 0);
        }
      }

      function drawHandle(ctx, x, y, r, color, label) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = Math.max(3, r * 0.22);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${Math.max(11, Math.round(r * 0.72))}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, x, y);
        ctx.restore();
      }

      function updateMagnifierLoupe(imgX, imgY, clientX, clientY, labelText) {
        const page = getCurrentPage();
        if (!page || state.viewMode !== "crop") {
          el.magnifierLoupe.style.display = "none";
          return;
        }
        el.magnifierLoupe.style.display = "block";
        el.loupeLabel.textContent = labelText;

        const stRect = el.stageContainer.getBoundingClientRect();
        const relX = clientX - stRect.left;
        const leftPx = relX < stRect.width * 0.5 ? Math.max(10, stRect.width - 128) : 10;
        const topPx = 46;

        el.magnifierLoupe.style.left = `${leftPx}px`;
        el.magnifierLoupe.style.top = `${topPx}px`;

        const lCtx = el.loupeCanvas.getContext("2d");
        const lw = el.loupeCanvas.width;
        const lh = el.loupeCanvas.height;
        lCtx.fillStyle = "#0f172a";
        lCtx.fillRect(0, 0, lw, lh);

        const zoom = 3.8;
        const srcRadius = (lw / 2) / zoom;
        lCtx.drawImage(
          page.srcCanvas,
          imgX - srcRadius,
          imgY - srcRadius,
          srcRadius * 2,
          srcRadius * 2,
          0,
          0,
          lw,
          lh
        );

        lCtx.strokeStyle = "#ffffff";
        lCtx.lineWidth = 1.8;
        lCtx.beginPath();
        lCtx.moveTo(lw / 2, 0);
        lCtx.lineTo(lw / 2, lh);
        lCtx.moveTo(0, lh / 2);
        lCtx.lineTo(lw, lh / 2);
        lCtx.stroke();
      }

      function getCanvasCoords(clientX, clientY) {
        const rect = el.mainCanvas.getBoundingClientRect();
        const scaleX = el.mainCanvas.width / Math.max(1, rect.width);
        const scaleY = el.mainCanvas.height / Math.max(1, rect.height);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
          clientX,
          clientY,
          scaleX
        };
      }

      function findHitHandle(page, pt) {
        if (state.viewMode !== "crop") return null;
        const hitRadius = Math.max(32, 44 * (pt.scaleX || 1));
        const c = page.corners;

        let bestCorner = -1;
        let bestDist = hitRadius;
        for (let i = 0; i < 4; i++) {
          const d = Math.hypot(pt.x - c[i].x, pt.y - c[i].y);
          if (d <= bestDist) {
            bestDist = d;
            bestCorner = i;
          }
        }
        if (bestCorner !== -1) {
          return {
            type: "corner",
            index: bestCorner,
            startX: pt.x,
            startY: pt.y,
            origX: c[bestCorner].x,
            origY: c[bestCorner].y,
            label: ["Góc TL", "Góc TR", "Góc BR", "Góc BL"][bestCorner]
          };
        }

        for (let i = 0; i < 4; i++) {
          const mp = getMidHandlePos(page, i);
          if (Math.hypot(pt.x - mp.x, pt.y - mp.y) <= hitRadius) {
            const mOff = (page.midOffsets && page.midOffsets[i]) || { x: 0, y: 0 };
            return {
              type: "curve_mid",
              index: i,
              startX: pt.x,
              startY: pt.y,
              origOffX: mOff.x,
              origOffY: mOff.y,
              label: ["Uốn Cạnh Trên", "Uốn Cạnh Phải", "Uốn Cạnh Dưới", "Uốn Cạnh Trái"][i]
            };
          }
        }
        return null;
      }

      function onStageTouchStart(evt) {
        const page = getCurrentPage();
        if (!page) return;

        if (evt.touches && evt.touches.length === 2) {
          if (state.draggingHandle) {
            if (state.preTouchCorners) page.corners = state.preTouchCorners.map((p) => ({ ...p }));
            if (state.preTouchMidOffsets) page.midOffsets = state.preTouchMidOffsets.map((p) => ({ ...p }));
            renderStage();
          }
          state.draggingHandle = null;
          el.magnifierLoupe.style.display = "none";

          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const midX = (t0.clientX + t1.clientX) * 0.5;
          const midY = (t0.clientY + t1.clientY) * 0.5;
          const stRect = el.stageContainer.getBoundingClientRect();
          state.pinchState = {
            startDist: Math.max(12, dist),
            startZoom: state.stageZoom,
            startPanX: state.stagePanX,
            startPanY: state.stagePanY,
            startMidX: midX,
            startMidY: midY,
            centerX: stRect.left + stRect.width * 0.5,
            centerY: stRect.top + stRect.height * 0.5
          };
          evt.preventDefault();
          return;
        }

        if (evt.touches && evt.touches.length === 1) {
          if (Date.now() < state.pinchCooldownUntil) {
            evt.preventDefault();
            return;
          }
          const t0 = evt.touches[0];
          const pt = getCanvasCoords(t0.clientX, t0.clientY);
          state.preTouchCorners = page.corners.map((p) => ({ ...p }));
          state.preTouchMidOffsets = page.midOffsets.map((p) => ({ ...p }));

          const hit = findHitHandle(page, pt);
          if (hit) {
            state.draggingHandle = hit;
            if (hit.type === "corner") {
              updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label);
            } else if (hit.type === "curve_mid") {
              const mp = getMidHandlePos(page, hit.index);
              updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label);
            }
            evt.preventDefault();
            return;
          }

          const now = Date.now();
          if (now - state.lastTapTime < 280 && Math.hypot(t0.clientX - state.lastTapX, t0.clientY - state.lastTapY) < 32) {
            state.lastTapTime = 0;
            if (state.stageZoom > 1.15) {
              resetStageZoom();
            } else {
              const stRect = el.stageContainer.getBoundingClientRect();
              const cx = stRect.left + stRect.width * 0.5;
              const cy = stRect.top + stRect.height * 0.5;
              state.stageZoom = 2.4;
              state.stagePanX = (cx - t0.clientX) * 1.1;
              state.stagePanY = (cy - t0.clientY) * 1.1;
              applyStageTransform();
            }
            evt.preventDefault();
            return;
          }
          state.lastTapTime = now;
          state.lastTapX = t0.clientX;
          state.lastTapY = t0.clientY;

          if (state.stageZoom > 1.02) {
            state.draggingHandle = {
              type: "pan",
              startClientX: t0.clientX,
              startClientY: t0.clientY,
              origPanX: state.stagePanX,
              origPanY: state.stagePanY
            };
            evt.preventDefault();
          }
        }
      }

      function onStageMouseDown(evt) {
        const page = getCurrentPage();
        if (!page) return;
        const pt = getCanvasCoords(evt.clientX, evt.clientY);
        state.preTouchCorners = page.corners.map((p) => ({ ...p }));
        state.preTouchMidOffsets = page.midOffsets.map((p) => ({ ...p }));
        const hit = findHitHandle(page, pt);
        if (hit) {
          state.draggingHandle = hit;
          if (hit.type === "corner") {
            updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label);
          } else if (hit.type === "curve_mid") {
            const mp = getMidHandlePos(page, hit.index);
            updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label);
          }
          evt.preventDefault();
          return;
        }
        if (state.stageZoom > 1.02) {
          state.draggingHandle = {
            type: "pan",
            startClientX: evt.clientX,
            startClientY: evt.clientY,
            origPanX: state.stagePanX,
            origPanY: state.stagePanY
          };
          evt.preventDefault();
        }
      }

      function onStagePointerMove(evt) {
        if (state.pinchState && evt.touches && evt.touches.length === 2) {
          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const currDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const currMidX = (t0.clientX + t1.clientX) * 0.5;
          const currMidY = (t0.clientY + t1.clientY) * 0.5;

          const newZoom = Math.max(0.8, Math.min(5.0, state.pinchState.startZoom * (currDist / state.pinchState.startDist)));
          const zoomRatio = newZoom / state.pinchState.startZoom;
          const relX = state.pinchState.startMidX - state.pinchState.centerX;
          const relY = state.pinchState.startMidY - state.pinchState.centerY;

          state.stageZoom = newZoom;
          state.stagePanX = (currMidX - state.pinchState.startMidX) + relX - (relX - state.pinchState.startPanX) * zoomRatio;
          state.stagePanY = (currMidY - state.pinchState.startMidY) + relY - (relY - state.pinchState.startPanY) * zoomRatio;
          applyStageTransform();
          evt.preventDefault();
          return;
        }

        if (!state.draggingHandle) return;
        const page = getCurrentPage();
        if (!page) return;

        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        if (state.draggingHandle.type === "pan") {
          state.stagePanX = state.draggingHandle.origPanX + (clientX - state.draggingHandle.startClientX);
          state.stagePanY = state.draggingHandle.origPanY + (clientY - state.draggingHandle.startClientY);
          applyStageTransform();
          evt.preventDefault();
          return;
        }

        const pt = getCanvasCoords(clientX, clientY);
        const w = el.mainCanvas.width;
        const h = el.mainCanvas.height;

        if (state.draggingHandle.type === "corner") {
          const idx = state.draggingHandle.index;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          const nx = Math.max(0, Math.min(w, Math.round(state.draggingHandle.origX + dx)));
          const ny = Math.max(0, Math.min(h, Math.round(state.draggingHandle.origY + dy)));
          page.corners[idx].x = nx;
          page.corners[idx].y = ny;
          updateMagnifierLoupe(nx, ny, pt.clientX, pt.clientY, state.draggingHandle.label);
          renderStage();
        } else if (state.draggingHandle.type === "curve_mid") {
          const idx = state.draggingHandle.index;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          page.midOffsets[idx].x = Math.round(state.draggingHandle.origOffX + dx);
          page.midOffsets[idx].y = Math.round(state.draggingHandle.origOffY + dy);
          const mp = getMidHandlePos(page, idx);
          updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, state.draggingHandle.label);
          renderStage();
        }
        evt.preventDefault();
      }

      function onStagePointerUp(evt) {
        if (state.pinchState && (!evt.touches || evt.touches.length < 2)) {
          state.pinchState = null;
          state.pinchCooldownUntil = Date.now() + 180;
          state.draggingHandle = null;
          return;
        }
        if (!state.draggingHandle) return;
        const dragType = state.draggingHandle.type;
        state.draggingHandle = null;
        el.magnifierLoupe.style.display = "none";
        if (dragType === "corner" || dragType === "curve_mid") {
          const page = getCurrentPage();
          if (page) {
            updateGeometryAndProcess(page);
            renderPageList();
          }
        }
      }

      // =========================================================================
      // 8. PAGE QUEUE & EXPORT
      // =========================================================================
      function addNewPageFromCanvas(srcCanvas, name, customCorners, customMidOffsets) {
        const detectedCorners = customCorners ? customCorners.map((p) => ({ ...p })) : detectDocumentCorners(srcCanvas);
        const midOffsets = customMidOffsets
          ? customMidOffsets.map((p) => ({ ...p }))
          : [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

        const pageObj = {
          id: "page_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
          name: name || `Trang_${state.pages.length + 1}`,
          srcCanvas,
          corners: detectedCorners,
          midOffsets,
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,
          settings: cloneSettings(state.defaultSettings) // Starts on "original" ("Ảnh gốc")!
        };
        updateGeometryAndProcess(pageObj);
        state.pages.push(pageObj);
        state.currentPageIndex = state.pages.length - 1;
        resetStageZoom();
        syncControlsFromPage(pageObj);
        renderPageList();
        renderStage();
      }

      function renderPageList() {
        el.pageListContainer.innerHTML = "";
        el.pageCountText.textContent = `${state.pages.length} trang`;

        state.pages.forEach((p, idx) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "btn btn-sec" + (idx === state.currentPageIndex ? " active" : "");
          item.style.height = "32px";
          item.textContent = `Trang ${idx + 1}`;
          item.addEventListener("click", () => {
            state.currentPageIndex = idx;
            resetStageZoom();
            syncControlsFromPage(getCurrentPage());
            renderPageList();
            renderStage();
          });
          el.pageListContainer.appendChild(item);
        });
      }

      function splitCurrentPageIntoTwoHalves() {
        const page = getCurrentPage();
        if (!page) return;
        const c = page.corners;
        const midTop = {
          x: Math.round((c[0].x + c[1].x) * 0.5),
          y: Math.round((c[0].y + c[1].y) * 0.5)
        };
        const midBot = {
          x: Math.round((c[3].x + c[2].x) * 0.5),
          y: Math.round((c[3].y + c[2].y) * 0.5)
        };

        const baseName = page.name.replace(/_Tr[12].*$/, "");
        const leftPage = {
          id: "page_" + Date.now() + "_L",
          name: `${baseName}_Tr1`,
          srcCanvas: page.srcCanvas,
          corners: [
            { x: c[0].x, y: c[0].y },
            { x: midTop.x, y: midTop.y },
            { x: midBot.x, y: midBot.y },
            { x: c[3].x, y: c[3].y }
          ],
          midOffsets: [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }],
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,
          settings: cloneSettings(page.settings)
        };
        const rightPage = {
          id: "page_" + Date.now() + "_R",
          name: `${baseName}_Tr2`,
          srcCanvas: page.srcCanvas,
          corners: [
            { x: midTop.x, y: midTop.y },
            { x: c[1].x, y: c[1].y },
            { x: c[2].x, y: c[2].y },
            { x: midBot.x, y: midBot.y }
          ],
          midOffsets: [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }],
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,
          settings: cloneSettings(page.settings)
        };

        updateGeometryAndProcess(leftPage);
        updateGeometryAndProcess(rightPage);

        state.pages.splice(state.currentPageIndex + 1, 0, leftPage, rightPage);
        state.currentPageIndex = state.currentPageIndex + 1;
        el.exportModal.classList.remove("open");
        setViewMode("result");
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        showToast("Đã tách thành 2 trang riêng biệt!");
