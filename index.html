        const A_sys = Array.from({ length: nParams }, (_, r) => {
          const row = new Float64Array(nParams);
          const vm = (r / K) | 0;
          const hm = r % K;
          row[r] = regV[vm] * regH[hm];
          return row;
        });
        const b_sys = new Float64Array(nParams);

        const maxD = 7;
        const corrs = new Float64Array(2 * maxD + 1);
        const corrsSorted = new Float64Array(2 * maxD + 1);
        const norms = new Float64Array(M);
        const dB_full = new Float64Array(nParams);
        let nonZeroShiftCount = 0;
        let totalMatchedSteps = 0;

        for (let z = 0; z < zones.length; z++) {
          const y0_f = zones[z][0], y1_f = zones[z][1], ty_c = zones[z][2];
          const ya = Math.max(maxD + 4, Math.floor(Hs * y0_f));
          const yb = Math.min(Hs - maxD - 4, Math.floor(Hs * y1_f));
          if (yb - ya < 18) continue;
          const vVec = evalVertBasis2(ty_c);

          let maxNorm = 0;
          for (let k = 0; k < M; k++) {
            const kOff = k * Hs;
            let sq = 0;
            for (let y = ya; y < yb; y++) {
              const v = P[kOff + y];
              sq += v * v;
            }
            norms[k] = Math.sqrt(sq);
            if (norms[k] > maxNorm) maxNorm = norms[k];
          }
          if (maxNorm < 1e-3) continue;

          for (let k = 1; k < M; k++) {
            if (norms[k] < 0.25 * maxNorm) continue;
            for (let step = 1; step <= 2; step++) {
              const kp = k - step;
              if (kp < 0 || norms[kp] < 0.25 * maxNorm) continue;

              const prevOff = kp * Hs;
              const currOff = k * Hs;
              const normPrev = norms[kp];
              let bestI = maxD;
              let bestC = -1.0;

              for (let di = 0; di <= 2 * maxD; di++) {
                const d = di - maxD;
                let dot = 0, normSegSq = 0;
                for (let y = ya; y < yb; y++) {
                  const vp = P[prevOff + y];
                  const vc = P[currOff + y + d];
                  dot += vp * vc;
                  normSegSq += vc * vc;
                }
                const cVal = dot / (normPrev * (Math.sqrt(normSegSq) + 1e-6));
                corrs[di] = cVal;
                corrsSorted[di] = cVal;
                if (cVal > bestC) {
                  bestC = cVal;
                  bestI = di;
                }
              }

              corrsSorted.sort();
              const medC = corrsSorted[maxD];
              if (bestC > 0.42 && (bestC - medC) > 0.11) {
                let bestD = bestI - maxD;
                if (bestI > 0 && bestI < 2 * maxD) {
                  const vm = corrs[bestI - 1], v0 = corrs[bestI], vp = corrs[bestI + 1];
                  const denom = 2.0 * (2.0 * v0 - vm - vp);
                  if (Math.abs(denom) > 1e-9) {
                    bestD += Math.max(-0.5, Math.min(0.5, (vm - vp) / denom));
                  }
                }
                // Deadband on tiny sub-pixel jitter from character ascenders/descenders on flat sheets!
                if (Math.abs(bestD) < 0.55) {
                  bestD = 0.0;
                } else if (step === 1) {
                  nonZeroShiftCount++;
                }
                if (step === 1) totalMatchedSteps++;

                const deltaPx = bestD * scaleY;
                const w = ((bestC - medC) * bestC * bestC) / step;

                const Bk = B_cols[k], Bkp = B_cols[kp];
                for (let vm = 0; vm < 2; vm++) {
                  const vv = vVec[vm];
                  const baseIdx = vm * K;
                  for (let hm = 0; hm < K; hm++) {
                    dB_full[baseIdx + hm] = vv * (Bk[hm] - Bkp[hm]);
                  }
                }

                for (let r = 0; r < nParams; r++) {
                  const wdBr = w * dB_full[r];
                  b_sys[r] += wdBr * deltaPx;
                  const rowA = A_sys[r];
                  for (let c = 0; c < nParams; c++) {
                    rowA[c] += wdBr * dB_full[c];
                  }
                }
              }
            }
          }
        }

        // Flat-Paper Immunity Gate 1: If fewer than 22% of column steps have a real shift >= 0.55 sub-pixels, paper is flat!
        if (totalMatchedSteps < 16 || nonZeroShiftCount < Math.max(8, totalMatchedSteps * 0.22)) {
          return null;
        }

        const coeffs = solveLinearSystem(A_sys, b_sys);

        const mode0 = new Float32Array(dstW);
        const mode1 = new Float32Array(dstW);
        const mode2 = new Float32Array(dstW); // Kept zero for API compatibility

        let maxSurfaceDisp = 0;
        for (let x = 0; x < dstW; x++) {
          const B = evalDirichletSineBasis3(x / (dstW - 1));
          let s0 = 0, s1 = 0;
          for (let j = 0; j < K; j++) {
            s0 += B[j] * coeffs[j];
            s1 += B[j] * coeffs[K + j];
          }
          mode0[x] = s0;
          mode1[x] = s1;
          const topDisp = Math.abs(s0 - 0.35 * s1);
          const botDisp = Math.abs(s0 + 0.35 * s1);
          const localMax = Math.max(topDisp, Math.abs(s0), botDisp);
          if (localMax > maxSurfaceDisp) maxSurfaceDisp = localMax;
        }

        // Flat-Paper Immunity Gate 2: Require max arch >= 5.0 px, with smooth deadzone ramp [5.0px .. 9.0px]
        if (maxSurfaceDisp < 5.0) return null;

        const shrinkGain = Math.min(1.0, (maxSurfaceDisp - 4.5) / 4.5);
        for (let x = 0; x < dstW; x++) {
          mode0[x] *= shrinkGain;
          mode1[x] *= shrinkGain;
        }

        return { mode0, mode1, mode2 };
      }

      function createZeroEdgeOffsets() {
        return [0, 1, 2, 3].map(() =>
          Array.from({ length: NUM_EDGE_SUBPOINTS }, () => ({ x: 0, y: 0 }))
        );
      }

      function cloneEdgeOffsets(edgeOffsets) {
        if (!edgeOffsets || edgeOffsets.length !== 4) return createZeroEdgeOffsets();
        return edgeOffsets.map((edge) =>
          Array.from({ length: NUM_EDGE_SUBPOINTS }, (_, m) => ({
            x: (edge && edge[m] && edge[m].x) || 0,
            y: (edge && edge[m] && edge[m].y) || 0
          }))
        );
      }

      // Exact 5-Sine Harmonic (DST-I) Interpolation through the 5 intermediate points
      // (t = 1/6, 2/6, 3/6, 4/6, 5/6) on an edge.
      // Guarantees Delta(0)=0, Delta((m+1)/6)=edge5Pts[m] for m=0..4, and Delta(1)=0!
      function evalEdge3PointOffset(edge5Pts, t) {
        if (!edge5Pts || edge5Pts.length < NUM_EDGE_SUBPOINTS) return { x: 0, y: 0 };
        const pi = Math.PI;
        let outX = 0;
        let outY = 0;
        for (let k = 0; k < 5; k++) {
          const S_k = DST5_MAT[k];
          let ckX = 0;
          let ckY = 0;
          for (let j = 0; j < 5; j++) {
            const sjk = S_k[j];
            ckX += edge5Pts[j].x * sjk;
            ckY += edge5Pts[j].y * sjk;
          }
          const sinKt = Math.sin((k + 1) * pi * t);
          outX += (ckX / 3.0) * sinKt;
          outY += (ckY / 3.0) * sinKt;
        }
        return { x: outX, y: outY };
      }

      function dewarpQuad(srcCanvas, quadCorners, paperSizeMode, edgeOffsets, bookCurvePct, autoLineDewarp, cachedModesHost) {
        const topW = Math.hypot(quadCorners[1].x - quadCorners[0].x, quadCorners[1].y - quadCorners[0].y);
        const botW = Math.hypot(quadCorners[2].x - quadCorners[3].x, quadCorners[2].y - quadCorners[3].y);
        const leftH = Math.hypot(quadCorners[3].x - quadCorners[0].x, quadCorners[3].y - quadCorners[0].y);
        const rightH = Math.hypot(quadCorners[2].x - quadCorners[1].x, quadCorners[2].y - quadCorners[1].y);

        const kw = Math.max(topW, botW) / Math.max(1.0, Math.min(topW, botW));
        const kh = Math.max(leftH, rightH) / Math.max(1.0, Math.min(leftH, rightH));
        const tiltBoostH = Math.sqrt(1.0 + 2.6 * Math.pow(kw - 1.0, 1.15));
        const tiltBoostW = Math.sqrt(1.0 + 2.6 * Math.pow(kh - 1.0, 1.15));

        const corrW = Math.max(topW, botW) * tiltBoostW;
        const corrH = Math.max(leftH, rightH) * tiltBoostH;
        let ratioHW = corrH / Math.max(1.0, corrW);

        if (paperSizeMode === "a4_portrait" || paperSizeMode === "a5") {
          ratioHW = 1.4142;
        } else if (paperSizeMode === "a4_landscape") {
          ratioHW = 1.0 / 1.4142;
        } else if (paperSizeMode === "letter") {
          ratioHW = 11.0 / 8.5;
        } else {
          if (ratioHW >= 0.90 && ratioHW <= 1.88) {
            ratioHW = 1.4142;
          } else if (ratioHW >= 0.58 && ratioHW < 0.90) {
            ratioHW = 1.0 / 1.4142;
          }
        }

        let dstW = Math.round(Math.max(topW, botW, 760));
        let dstH = Math.round(dstW * ratioHW);

        const maxSide = 1120;
        if (Math.max(dstW, dstH) > maxSide) {
          const sc = maxSide / Math.max(dstW, dstH);
          dstW = Math.round(dstW * sc);
          dstH = Math.round(dstH * sc);
        }
        dstW = Math.max(160, dstW);
        dstH = Math.max(160, dstH);

        const dstPts = [
          { x: 0, y: 0 },
          { x: dstW - 1, y: 0 },
          { x: dstW - 1, y: dstH - 1 },
          { x: 0, y: dstH - 1 }
        ];

        const H = computeHomography(dstPts, quadCorners);
        const sW = srcCanvas.width;
        const sH = srcCanvas.height;
        const sData = srcCanvas.getContext("2d").getImageData(0, 0, sW, sH).data;

        const eOff = edgeOffsets && edgeOffsets.length === 4 ? edgeOffsets : createZeroEdgeOffsets();
        let maxEdgeOff = 0;
        for (let ei = 0; ei < 4; ei++) {
          for (let si = 0; si < NUM_EDGE_SUBPOINTS; si++) {
            const pt = eOff[ei][si];
            if (pt) {
              const m = Math.abs(pt.x) + Math.abs(pt.y);
              if (m > maxEdgeOff) maxEdgeOff = m;
            }
          }
        }
        const hasEdgeOffsets = maxEdgeOff > 0.4;

        // Precompute 1D Coons Patch edge displacement tables for fast O(1) lookup per pixel
        const topOffX = new Float32Array(dstW);
        const topOffY = new Float32Array(dstW);
        const botOffX = new Float32Array(dstW);
        const botOffY = new Float32Array(dstW);
        const leftOffX = new Float32Array(dstH);
        const leftOffY = new Float32Array(dstH);
        const rightOffX = new Float32Array(dstH);
        const rightOffY = new Float32Array(dstH);

        if (hasEdgeOffsets) {
          for (let u = 0; u < dstW; u++) {
            const tx = u / (dstW - 1);
            const tTop = evalEdge3PointOffset(eOff[0], tx);       // Edge 0: TL -> TR (tx: 0 -> 1)
            const tBot = evalEdge3PointOffset(eOff[2], 1.0 - tx); // Edge 2: BR -> BL (1-tx: 1 -> 0)
            topOffX[u] = tTop.x; topOffY[u] = tTop.y;
            botOffX[u] = tBot.x; botOffY[u] = tBot.y;
          }
          for (let v = 0; v < dstH; v++) {
            const ty = v / (dstH - 1);
            const tRight = evalEdge3PointOffset(eOff[1], ty);       // Edge 1: TR -> BR (ty: 0 -> 1)
            const tLeft  = evalEdge3PointOffset(eOff[3], 1.0 - ty); // Edge 3: BL -> TL (1-ty: 1 -> 0)
            rightOffX[v] = tRight.x; rightOffY[v] = tRight.y;
            leftOffX[v]  = tLeft.x;  leftOffY[v]  = tLeft.y;
          }
        }

        // Manual Book Curve slider models BOTH top-half and bottom-half open-book perspective arch
        const bookGain = (bookCurvePct || 0) / 100.0;
        const manualArchX = new Float32Array(dstW);
        if (Math.abs(bookGain) > 0.01) {
          const scaleY = dstH / 680.0;
          for (let u = 0; u < dstW; u++) {
            const xn = u / (dstW - 1);
            manualArchX[u] = bookGain * scaleY * (20.0 * Math.sin(Math.PI * xn) - 14.0 * Math.cos(2.0 * Math.PI * xn) - 8.0 * Math.cos(4.0 * Math.PI * xn));
          }
        }

        const tempData = new Uint8ClampedArray(dstW * dstH * 4);

        for (let v = 0; v < dstH; v++) {
          const ty = v / (dstH - 1);
          const oneMinusTy = 1.0 - ty;
          const lOx = leftOffX[v], lOy = leftOffY[v];
          const rOx = rightOffX[v], rOy = rightOffY[v];
          const vertPinch = 1.0 - 1.35 * (ty - 0.5);
          for (let u = 0; u < dstW; u++) {
            const denom = H[6] * u + H[7] * v + 1;
            let sx = (H[0] * u + H[1] * v + H[2]) / denom;
            let sy = (H[3] * u + H[4] * v + H[5]) / denom;

            if (hasEdgeOffsets) {
              const tx = u / (dstW - 1);
              sx += oneMinusTy * topOffX[u] + ty * botOffX[u] + (1.0 - tx) * lOx + tx * rOx;
              sy += oneMinusTy * topOffY[u] + ty * botOffY[u] + (1.0 - tx) * lOy + tx * rOy;
            }

            if (Math.abs(bookGain) > 0.01) {
              sy -= vertPinch * manualArchX[u];
            }

            const di = (v * dstW + u) * 4;
            if (sx >= 0 && sx < sW - 1 && sy >= 0 && sy < sH - 1) {
              const x0 = sx | 0;
              const y0 = sy | 0;
              const dx = sx - x0;
              const dy = sy - y0;

              const i00 = (y0 * sW + x0) * 4;
              const i10 = i00 + 4;
              const i01 = i00 + sW * 4;
              const i11 = i01 + 4;

              const w00 = (1 - dx) * (1 - dy);
              const w10 = dx * (1 - dy);
              const w01 = (1 - dx) * dy;
              const w11 = dx * dy;

              tempData[di]     = sData[i00] * w00 + sData[i10] * w10 + sData[i01] * w01 + sData[i11] * w11;
              tempData[di + 1] = sData[i00 + 1] * w00 + sData[i10 + 1] * w10 + sData[i01 + 1] * w01 + sData[i11 + 1] * w11;
              tempData[di + 2] = sData[i00 + 2] * w00 + sData[i10 + 2] * w10 + sData[i01 + 2] * w01 + sData[i11 + 2] * w11;
              tempData[di + 3] = 255;
            } else {
              tempData[di] = 255;
              tempData[di + 1] = 255;
              tempData[di + 2] = 255;
              tempData[di + 3] = 255;
            }
          }
        }

        const outCanvas = document.createElement("canvas");
        outCanvas.width = dstW;
        outCanvas.height = dstH;
        const outCtx = outCanvas.getContext("2d");
        const outImg = outCtx.createImageData(dstW, dstH);
        const dData = outImg.data;

        // Stage 2: 2D Multi-Zone Top/Middle/Bottom Book Surface & Parallel Text-Line Flattening
        if (autoLineDewarp !== false) {
          let surfModes = (cachedModesHost && cachedModesHost.cachedAutoModes && cachedModesHost.cachedAutoW === dstW && cachedModesHost.cachedAutoH === dstH)
            ? cachedModesHost.cachedAutoModes
            : undefined;
          if (surfModes === undefined) {
            surfModes = estimate2DBookSurfaceModes(tempData, dstW, dstH);
            if (cachedModesHost) {
              cachedModesHost.cachedAutoModes = surfModes;
              cachedModesHost.cachedAutoW = dstW;
              cachedModesHost.cachedAutoH = dstH;
            }
          }
          if (surfModes) {
            const { mode0, mode1, mode2 } = surfModes;
            // Compute horizontal arc-length unrolling map xMap[u] from RMS slope across top & bottom halves
            const arcCum = new Float32Array(dstW);
            for (let u = 1; u < dstW; u++) {
              const dw0 = mode0[u] - mode0[u - 1];
              const dw1 = mode1[u] - mode1[u - 1];
              const slopeSq = dw0 * dw0 + 0.0833 * dw1 * dw1;
              arcCum[u] = arcCum[u - 1] + Math.sqrt(1.0 + 0.60 * slopeSq);
            }
            const totalArc = arcCum[dstW - 1] || 1.0;
            const xMap = new Float32Array(dstW);
            let pIdx = 0;
            for (let u = 0; u < dstW; u++) {
              const targetArc = (u / (dstW - 1)) * totalArc;
              while (pIdx < dstW - 2 && arcCum[pIdx + 1] < targetArc) pIdx++;
              const span = (arcCum[pIdx + 1] - arcCum[pIdx]) || 1e-6;
              xMap[u] = pIdx + Math.max(0.0, Math.min(1.0, (targetArc - arcCum[pIdx]) / span));
            }

            for (let y = 0; y < dstH; y++) {
              const ty = y / (dstH - 1);
              const uVert = ty - 0.5;
              const v1 = uVert;
              const v2 = uVert * uVert - (1.0 / 12.0);

              for (let x = 0; x < dstW; x++) {
                const sx = Math.min(dstW - 1.001, Math.max(0.0, xMap[x]));
                const x0 = sx | 0;
                const dx = sx - x0;

                const w0 = mode0[x0] * (1.0 - dx) + mode0[x0 + 1] * dx;
                const w1 = mode1[x0] * (1.0 - dx) + mode1[x0 + 1] * dx;
                const w2 = mode2[x0] * (1.0 - dx) + mode2[x0 + 1] * dx;
                const wVal = w0 + v1 * w1 + v2 * w2;

                const sy = Math.min(dstH - 1.001, Math.max(0.0, y + wVal));
                const y0 = sy | 0;
                const dy = sy - y0;

                const i00 = (y0 * dstW + x0) * 4;
                const i10 = i00 + 4;
                const i01 = i00 + dstW * 4;
                const i11 = i01 + 4;
                const di = (y * dstW + x) * 4;

                const wt00 = (1.0 - dx) * (1.0 - dy);
                const wt10 = dx * (1.0 - dy);
                const wt01 = (1.0 - dx) * dy;
                const wt11 = dx * dy;

                dData[di]     = tempData[i00] * wt00 + tempData[i10] * wt10 + tempData[i01] * wt01 + tempData[i11] * wt11;
                dData[di + 1] = tempData[i00 + 1] * wt00 + tempData[i10 + 1] * wt10 + tempData[i01 + 1] * wt01 + tempData[i11 + 1] * wt11;
                dData[di + 2] = tempData[i00 + 2] * wt00 + tempData[i10 + 2] * wt10 + tempData[i01 + 2] * wt01 + tempData[i11 + 2] * wt11;
                dData[di + 3] = 255;
              }
            }
            outCtx.putImageData(outImg, 0, 0);
            return outCanvas;
          }
        }

        dData.set(tempData);
        outCtx.putImageData(outImg, 0, 0);
        return outCanvas;
      }

      // =========================================================================
      // 6. LAZY HALO-FREE PAPER WHITENING, BRIGHTNESS & SAUVOLA B&W ENGINE
      // =========================================================================
      function computeFinePaperSurfaceGrid(chArray, w, h) {
        const scale = 4;
        const sw = Math.max(8, Math.floor(w / scale));
        const sh = Math.max(8, Math.floor(h / scale));
        const sub = new Float32Array(sw * sh);

        for (let sy = 0; sy < sh; sy++) {
          const y0 = sy * scale;
          const rOff = y0 * w;
          for (let sx = 0; sx < sw; sx++) {
            sub[sy * sw + sx] = chArray[rOff + sx * scale];
          }
        }

        const dil = sepMaxFilter(sub, sw, sh, 2);
        const clo = sepMinFilter(dil, sw, sh, 1);
        const sm1 = sepBoxBlur(clo, sw, sh, 2);

        return { grid: sm1, sw, sh, scale };
      }

      function sampleEnvelopeGrid(envObj, x, y) {
        const gx = Math.min(envObj.sw - 1.001, Math.max(0, x / envObj.scale));
        const gy = Math.min(envObj.sh - 1.001, Math.max(0, y / envObj.scale));
        const x0 = gx | 0;
        const y0 = gy | 0;
        const dx = gx - x0;
        const dy = gy - y0;
        const g = envObj.grid;
        const sw = envObj.sw;
        const r0 = y0 * sw + x0;
        const r1 = (y0 + 1) * sw + x0;
        return (
          g[r0] * (1 - dx) * (1 - dy) +
          g[r0 + 1] * dx * (1 - dy) +
          g[r1] * (1 - dx) * dy +
          g[r1 + 1] * dx * dy
        );
      }

      function buildPageFilterCache(dewarpedCanvas) {
        const w = dewarpedCanvas.width;
        const h = dewarpedCanvas.height;
        const nPixels = w * h;
        const rawData = dewarpedCanvas.getContext("2d").getImageData(0, 0, w, h).data;

        const chR = new Float32Array(nPixels);
        const chG = new Float32Array(nPixels);
        const chB = new Float32Array(nPixels);
        const lum = new Float32Array(nPixels);

        for (let i = 0; i < nPixels; i++) {
          const idx = i * 4;
          const r = rawData[idx];
          const g = rawData[idx + 1];
          const b = rawData[idx + 2];
          chR[i] = r;
          chG[i] = g;
          chB[i] = b;
          lum[i] = 0.299 * r + 0.587 * g + 0.114 * b;
        }

        const gridL = computeFinePaperSurfaceGrid(lum, w, h);
        const gridR = computeFinePaperSurfaceGrid(chR, w, h);
        const gridG = computeFinePaperSurfaceGrid(chG, w, h);
        const gridB = computeFinePaperSurfaceGrid(chB, w, h);

        const uR = new Uint8Array(nPixels);
        const uG = new Uint8Array(nPixels);
        const uB = new Uint8Array(nPixels);
        const uL = new Float32Array(nPixels);
        const dL = new Float32Array(nPixels);

        for (let y = 0; y < h; y++) {
          const rOff = y * w;
          for (let x = 0; x < w; x++) {
            const i = rOff + x;
            const eL = Math.max(22.0, sampleEnvelopeGrid(gridL, x, y));
            const eR = Math.max(22.0, sampleEnvelopeGrid(gridR, x, y));
            const eG = Math.max(22.0, sampleEnvelopeGrid(gridG, x, y));
            const eB = Math.max(22.0, sampleEnvelopeGrid(gridB, x, y));

            const nr = Math.min(255, Math.max(0, Math.round((255.0 * chR[i]) / eR)));
            const ng = Math.min(255, Math.max(0, Math.round((255.0 * chG[i]) / eG)));
            const nb = Math.min(255, Math.max(0, Math.round((255.0 * chB[i]) / eB)));
            const nl = Math.min(255.0, Math.max(0.0, (255.0 * lum[i]) / eL));

            uR[i] = nr;
            uG[i] = ng;
            uB[i] = nb;
            uL[i] = nl;
            dL[i] = 255.0 - nl;
          }
        }

        const dMaxLocalF = sepMaxFilter(dL, w, h, 3);
        const dMaxLocal = new Uint8Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          dMaxLocal[i] = Math.min(255, Math.round(dMaxLocalF[i]));
        }

        return {
          w,
          h,
          rawData,
          uR,
          uG,
          uB,
          uL,
          dMaxLocal,
          meanL: null,
          stdL: null
        };
      }

      function ensureSauvolaStats(fc) {
        if (fc.meanL && fc.stdL) return;
        const w = fc.w, h = fc.h, nPixels = w * h;
        const uL = fc.uL;
        const uLSq = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) uLSq[i] = uL[i] * uL[i];
        const meanL = sepBoxBlur(uL, w, h, 14);
        const meanSqL = sepBoxBlur(uLSq, w, h, 14);
        const stdL = new Float32Array(nPixels);
        for (let i = 0; i < nPixels; i++) {
          stdL[i] = Math.sqrt(Math.max(0.0, meanSqL[i] - meanL[i] * meanL[i]));
        }
        fc.meanL = meanL;
        fc.stdL = stdL;
      }

      function applyCachedFiltersToPage(page) {
        if (!page || !page.dewarpedCanvas) return;
        const w = page.dewarpedCanvas.width;
        const h = page.dewarpedCanvas.height;
        const settings = page.settings;
        const mode = settings.colorMode || "original";
        const brightVal = settings.brightness || 0;
        const bShift = Math.round(brightVal * 2.1);
        const transparentBg = !!settings.transparentBg;

        if (!page.processedCanvas || page.processedCanvas.width !== w || page.processedCanvas.height !== h) {
          page.processedCanvas = document.createElement("canvas");
          page.processedCanvas.width = w;
          page.processedCanvas.height = h;
        }
        const outCtx = page.processedCanvas.getContext("2d");

        if (mode === "original" && !transparentBg && bShift === 0) {
          outCtx.clearRect(0, 0, w, h);
          outCtx.drawImage(page.dewarpedCanvas, 0, 0);
          return;
        }

        if (!page.filterCache) {
          page.filterCache = buildPageFilterCache(page.dewarpedCanvas);
        }

        const fc = page.filterCache;
        const nPixels = w * h;
        const cleanAmt = (settings.bgSuppress ?? 68) / 100.0;
        const contrastAmt = (settings.contrast ?? 55) / 100.0;

        if (!fc.outImg || fc.outImg.width !== w || fc.outImg.height !== h) {
          fc.outImg = outCtx.createImageData(w, h);
        }
        const outImg = fc.outImg;
        const data = outImg.data;

        const rawData = fc.rawData;
        const uR = fc.uR;
        const uG = fc.uG;
        const uB = fc.uB;
        const uL = fc.uL;
        const dMaxLocal = fc.dMaxLocal;

        if (mode === "original") {
          for (let i = 0; i < nPixels; i++) {
            const idx = i * 4;
            data[idx]     = Math.min(255, Math.max(0, rawData[idx] + bShift));
            data[idx + 1] = Math.min(255, Math.max(0, rawData[idx + 1] + bShift));
            data[idx + 2] = Math.min(255, Math.max(0, rawData[idx + 2] + bShift));
            if (transparentBg) {
              const d = 255 - uL[i];
              data[idx + 3] = d < 18 ? 0 : d < 48 ? Math.round(((d - 18) / 30) * 255) : 255;
            } else {
              data[idx + 3] = 255;
            }
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        if (mode === "bw_sauvola") {
          ensureSauvolaStats(fc);
          const meanL = fc.meanL;
          const stdL = fc.stdL;
          const k = 0.16 + (1.0 - contrastAmt) * 0.10;
          const minDip = 14.0 + cleanAmt * 20.0 - contrastAmt * 6.0 - brightVal * 0.25;
          const haloRatio = 0.24 + cleanAmt * 0.16;

          for (let i = 0; i < nPixels; i++) {
            const nl = Math.min(255.0, Math.max(0.0, uL[i] + bShift * 0.5));
            const mL = meanL[i];
            const sL = stdL[i];
            const sauvolaT = mL * (1.0 - k * (1.0 - sL / 128.0));
            const haloGuard = Math.max(6.0, Math.max(minDip, dMaxLocal[i] * haloRatio));
            const effT = Math.min(sauvolaT, 255.0 - haloGuard);

            const diff = nl - effT;
            let bw;
            if (diff >= 5.0) bw = 255;
            else if (diff <= -5.0) bw = 10;
            else bw = Math.round(10.0 + ((diff + 5.0) / 10.0) * 245.0);

            const idx = i * 4;
            data[idx] = bw;
            data[idx + 1] = bw;
            data[idx + 2] = bw;
            data[idx + 3] = transparentBg ? (255 - bw) : 255;
          }
          outCtx.putImageData(outImg, 0, 0);
          return;
        }

        let baseFloor, haloRatio, gain;
        if (mode === "faint_boost") {
          baseFloor = 11.0 + cleanAmt * 16.0;
          haloRatio = 0.22 + cleanAmt * 0.14;
          gain = 1.65 + contrastAmt * 1.45;
        } else {
          baseFloor = 15.0 + cleanAmt * 26.0;
          haloRatio = 0.28 + cleanAmt * 0.16;
          gain = 1.40 + contrastAmt * 1.25;
        }

        for (let i = 0; i < nPixels; i++) {
          const nr = uR[i];
          const ng = uG[i];
          const nb = uB[i];
          const nl = uL[i];
          const dL = 255.0 - nl;

          const maxC = nr > ng ? (nr > nb ? nr : nb) : (ng > nb ? ng : nb);
          const minC = nr < ng ? (nr < nb ? nr : nb) : (ng < nb ? ng : nb);
          const chroma = maxC - minC;

          const adaptiveFloor = Math.max(baseFloor, dMaxLocal[i] * haloRatio);
          const effFloor = Math.max(3.0, adaptiveFloor - chroma * 0.35);

          let smoothGain = 0.0;
          const lowEdge = effFloor * 0.80;
          if (dL > lowEdge) {
            const bandW = Math.max(2.0, effFloor * 0.35);
            const t = Math.min(1.0, (dL - lowEdge) / bandW);
            smoothGain = t * t * (3.0 - 2.0 * t) * gain;
          }

          const r = Math.min(255, Math.max(0, Math.round(255.0 - (255 - nr) * smoothGain + bShift)));
          const g = Math.min(255, Math.max(0, Math.round(255.0 - (255 - ng) * smoothGain + bShift)));
          const b = Math.min(255, Math.max(0, Math.round(255.0 - (255 - nb) * smoothGain + bShift)));

          const idx = i * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;

          if (transparentBg) {
            const lumOut = 0.299 * r + 0.587 * g + 0.114 * b;
            const dark = (255 - lumOut) + chroma * 0.85;
            data[idx + 3] = dark < 12 ? 0 : dark < 46 ? Math.round(((dark - 12) / 34) * 255) : 255;
          } else {
            data[idx + 3] = 255;
          }
        }

        outCtx.putImageData(outImg, 0, 0);
      }

      function updateGeometryAndProcess(page, keepAutoModesCache) {
        if (!page) return;
        if (!keepAutoModesCache) {
          page.cachedAutoModes = undefined;
        }
        const dewarped = dewarpQuad(
          page.srcCanvas,
          page.corners,
          page.settings.paperSize,
          page.edgeOffsets,
          page.settings.bookCurve || 0,
          page.settings.autoLineDewarp !== false,
          page
        );
        page.dewarpedCanvas = dewarped;
        page.filterCache = null;
        applyCachedFiltersToPage(page);
      }

      // =========================================================================
      // 7. RENDERING MAIN STAGE & FULL-SCREEN EDITOR STAGE ("CĂN 4 GÓC" & "CĂN ĐA ĐIỂM")
      // =========================================================================
      function getEdgeSubHandlePos(page, edgeIdx, subIdx) {
        const c = page.corners;
        const p1 = c[edgeIdx];
        const p2 = c[(edgeIdx + 1) % 4];
        const t = (subIdx + 1) / (NUM_EDGE_SUBPOINTS + 1); // t = 1/6, 2/6, 3/6, 4/6, 5/6 (5 intermediate points per edge!)
        const eOff = (page.edgeOffsets && page.edgeOffsets[edgeIdx] && page.edgeOffsets[edgeIdx][subIdx]) || { x: 0, y: 0 };
        return {
          x: p1.x * (1.0 - t) + p2.x * t + eOff.x,
          y: p1.y * (1.0 - t) + p2.y * t + eOff.y
        };
      }

      function drawCurvedQuadPath(ctx, page) {
        const c = page.corners;
        const eOffAll = page.edgeOffsets || createZeroEdgeOffsets();
        ctx.moveTo(c[0].x, c[0].y);
        const steps = 24;
        for (let i = 0; i < 4; i++) {
          const p1 = c[i];
          const p2 = c[(i + 1) % 4];
          const e3 = eOffAll[i];
          for (let s = 1; s <= steps; s++) {
            const t = s / steps;
            const d = state.alignPointMode === "multipt" ? evalEdge3PointOffset(e3, t) : { x: 0, y: 0 };
            const px = p1.x * (1.0 - t) + p2.x * t + d.x;
            const py = p1.y * (1.0 - t) + p2.y * t + d.y;
            ctx.lineTo(px, py);
          }
        }
        ctx.closePath();
      }

      function drawHandle(ctx, x, y, r, color, label) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = Math.max(3, r * 0.22);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = `bold ${Math.max(11, Math.round(r * 0.72))}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, x, y);
        ctx.restore();
      }

      // =========================================================================
      // INTERACTIVE ON-DOCUMENT NOTE ENGINE (MOVABLE, RESIZABLE, COLORABLE)
      // - Renders the user's note directly onto the document canvas at (noteX, noteY)
      //   with customizable font size (noteSize) and ink color (noteColor).
      // - Computes bounding box & bottom-right resize handle (⤡) so the user can
      //   drag the note freely or resize it with their finger on the touchscreen!
      // =========================================================================
      function drawNoteOverlayOnCanvas(ctx, w, h, page, showInteractiveHandles) {
        if (!page || !page.note || !page.note.trim()) {
          page._noteBounds = null;
          return;
        }
        const text = page.note.trim();
        const nx = typeof page.noteX === "number" ? page.noteX : 0.50;
        const ny = typeof page.noteY === "number" ? page.noteY : 0.88;
        const baseSize = page.noteSize || 28;
        const color = page.noteColor || "#dc2626";

        const scaleFactor = Math.max(0.45, w / 760.0);
        const fontPx = Math.max(12, Math.round(baseSize * scaleFactor));
        const padX = Math.round(fontPx * 0.45);
        const padY = Math.round(fontPx * 0.30);

        ctx.save();
        ctx.font = `bold ${fontPx}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const lines = text.split(/\n/);
        let maxLineW = 0;
        for (let i = 0; i < lines.length; i++) {
          const m = ctx.measureText(lines[i]).width;
          if (m > maxLineW) maxLineW = m;
        }

        const lineHeight = Math.round(fontPx * 1.24);
        const boxW = Math.round(maxLineW + padX * 2);
        const boxH = Math.round(lines.length * lineHeight + padY * 2);

        // Clamp center (cx, cy) so note box stays inside document page
        const halfW = boxW * 0.5;
        const halfH = boxH * 0.5;
        const cx = Math.max(halfW + 6, Math.min(w - halfW - 6, nx * w));
        const cy = Math.max(halfH + 6, Math.min(h - halfH - 6, ny * h));
        const boxX = cx - halfW;
        const boxY = cy - halfH;

        // Subtle semi-transparent paper backing so note is 100% legible over any text
        ctx.fillStyle = "rgba(255, 255, 255, 0.86)";
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(boxX, boxY, boxW, boxH, Math.max(6, Math.round(fontPx * 0.25)));
        } else {
          ctx.rect(boxX, boxY, boxW, boxH);
        }
        ctx.fill();

        // Crisp colored border
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1.8, fontPx * 0.08);
        if (showInteractiveHandles) {
          ctx.setLineDash([Math.max(4, Math.round(fontPx * 0.22)), Math.max(3, Math.round(fontPx * 0.16))]);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw note text lines
        ctx.fillStyle = color;
        const startY = cy - ((lines.length - 1) * lineHeight) * 0.5;
        for (let i = 0; i < lines.length; i++) {
          ctx.fillText(lines[i], cx, startY + i * lineHeight);
        }

        const handleR = Math.max(12, Math.round(14 * scaleFactor));
        const resizeHx = boxX + boxW;
        const resizeHy = boxY + boxH;

        if (showInteractiveHandles) {
          // Draw bottom-right corner resize handle (⤡)
          ctx.fillStyle = color;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = Math.max(2, handleR * 0.2);
          ctx.beginPath();
          ctx.arc(resizeHx, resizeHy, handleR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${Math.max(10, Math.round(handleR * 0.95))}px Arial`;
          ctx.fillText("⤡", resizeHx, resizeHy);
        }

        ctx.restore();

        page._noteBounds = {
          cx,
          cy,
          boxX,
          boxY,
          boxW,
          boxH,
          resizeHx,
          resizeHy,
          handleR
        };
      }

      function renderStage() {
        const page = getCurrentPage();
        const ctx = el.mainCanvas.getContext("2d");

        if (!page) {
          el.mainCanvas.width = 640;
          el.mainCanvas.height = 820;
          ctx.fillStyle = "#1e293b";
          ctx.fillRect(0, 0, 640, 820);
          ctx.strokeStyle = "rgba(255,255,255,0.22)";
          ctx.lineWidth = 3;
          ctx.setLineDash([10, 8]);
          ctx.strokeRect(42, 42, 556, 736);
          ctx.setLineDash([]);

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 24px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Chưa có ảnh tài liệu", 320, 365);

          ctx.fillStyle = "#cbd5e1";
          ctx.font = "17px Arial";
          ctx.fillText("Bấm '📷 Chụp ảnh' hoặc '📂 Chọn ảnh' ở trên", 320, 410);
          ctx.fillText("để bắt đầu quét tài liệu.", 320, 440);
          el.mainUnderMetaText.textContent = "Chưa có ảnh nào • Hãy chụp hoặc chọn ảnh";
          return;
        }

        if (!page.processedCanvas) updateGeometryAndProcess(page);
        const targetCanvas = page.processedCanvas;
        el.mainCanvas.width = targetCanvas.width;
        el.mainCanvas.height = targetCanvas.height;
        ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
        ctx.drawImage(targetCanvas, 0, 0);
        drawNoteOverlayOnCanvas(ctx, targetCanvas.width, targetCanvas.height, page, true);

        const ratioStr = describeAspectRatio(targetCanvas.width, targetCanvas.height);
        const noteSuffix = page.note && page.note.trim() ? ` • 📝 ${page.note.trim()}` : "";
        el.mainUnderMetaText.textContent = `${ratioStr} • ${targetCanvas.width}×${targetCanvas.height} px • ${getModeLabel(page.settings.colorMode)} • ${page.createdAt || "Hôm nay"}${noteSuffix}`;
      }

      function syncAlignModeButtons() {
        const isMulti = state.alignPointMode === "multipt";
        if (el.btnAlignMode4Pt) el.btnAlignMode4Pt.classList.toggle("active", !isMulti);
        if (el.btnAlignModeMultiPt) el.btnAlignModeMultiPt.classList.toggle("active", isMulti);
      }

      function renderFullScreenEditor() {
        const page = getCurrentPage();
        if (!page) {
          el.fullScreenEditorModal.classList.remove("open");
          return;
        }

        const total = state.pages.length;
        el.btnFsPrev.disabled = state.currentPageIndex <= 0;
        el.btnFsNext.disabled = state.currentPageIndex >= total - 1;
        el.btnFsPrev.style.display = total > 1 ? "inline-flex" : "none";
        el.btnFsNext.style.display = total > 1 ? "inline-flex" : "none";
        syncAlignModeButtons();

        const ctx = el.fsCanvas.getContext("2d");

        if (state.fsCropMode) {
          const sW = page.srcCanvas.width;
          const sH = page.srcCanvas.height;
          el.fsCanvas.width = sW;
          el.fsCanvas.height = sH;

          ctx.clearRect(0, 0, sW, sH);
          ctx.drawImage(page.srcCanvas, 0, 0);

          const c = page.corners;
          ctx.save();
          ctx.fillStyle = "rgba(9, 13, 22, 0.50)";
          ctx.beginPath();
          ctx.rect(0, 0, sW, sH);
          drawCurvedQuadPath(ctx, page);
          ctx.fill("evenodd");
          ctx.restore();

          const strokeW = Math.max(4, sW / 210);
          ctx.save();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = strokeW + 2;
          ctx.beginPath();
          drawCurvedQuadPath(ctx, page);
          ctx.stroke();

          ctx.strokeStyle = "#2563eb";
          ctx.lineWidth = strokeW;
          ctx.stroke();
          ctx.restore();

          // In "❖ Căn đa điểm" mode, draw 5 intermediate points (t = 1/6, 2/6, 3/6, 4/6, 5/6) on each of the 4 edges!
          if (state.alignPointMode === "multipt") {
            const subR = Math.max(9.5, sW / 82);
            for (let edgeIdx = 0; edgeIdx < 4; edgeIdx++) {
              for (let subIdx = 0; subIdx < NUM_EDGE_SUBPOINTS; subIdx++) {
                const mp = getEdgeSubHandlePos(page, edgeIdx, subIdx);
                ctx.save();
                ctx.fillStyle = subIdx === 2 ? "#38bdf8" : "#eff6ff";
                ctx.strokeStyle = "#1d4ed8";
                ctx.lineWidth = Math.max(2.4, sW / 290);
                ctx.beginPath();
                ctx.arc(mp.x, mp.y, subR, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
              }
            }
          }

          // Always draw the 4 primary corner handles (TL, TR, BR, BL)
          const cornerR = Math.max(17, sW / 48);
          const labels = ["TL", "TR", "BR", "BL"];
          for (let i = 0; i < 4; i++) {
            drawHandle(ctx, c[i].x, c[i].y, cornerR, "#2563eb", labels[i]);
          }
        } else {
          if (!page.processedCanvas) updateGeometryAndProcess(page);
          const target = page.processedCanvas;
          el.fsCanvas.width = target.width;
          el.fsCanvas.height = target.height;
          ctx.clearRect(0, 0, target.width, target.height);
          ctx.drawImage(target, 0, 0);
          drawNoteOverlayOnCanvas(ctx, target.width, target.height, page, true);
        }

        const dispW = page.processedCanvas ? page.processedCanvas.width : page.srcCanvas.width;
        const dispH = page.processedCanvas ? page.processedCanvas.height : page.srcCanvas.height;
        el.fsMetaSingleLine.textContent = `${describeAspectRatio(dispW, dispH)} • ${dispW}×${dispH} px • ${getModeLabel(page.settings.colorMode)} • ${page.createdAt || "Hôm nay"}`;

        if (page.note && page.note.trim()) {
          el.fsNotePreview.textContent = `📝 ${page.note.trim()} (Chạm kéo trên ảnh để di chuyển / đổi cỡ)`;
          el.fsNotePreview.classList.add("visible");
        } else {
          el.fsNotePreview.textContent = "";
          el.fsNotePreview.classList.remove("visible");
        }
      }

      function openFullScreenEditorForIndex(idx) {
        if (idx < 0 || idx >= state.pages.length) return;
        state.currentPageIndex = idx;
        state.fsCropMode = false;
        el.fsCropBar.classList.remove("visible");
        toggleEditDropdown(false);
        resetFsZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        renderFullScreenEditor();
        el.fullScreenEditorModal.classList.add("open");
      }

      function updateMagnifierLoupe(imgX, imgY, clientX, clientY, labelText) {
        const page = getCurrentPage();
        if (!page || !state.fsCropMode) {
          el.magnifierLoupe.style.display = "none";
          return;
        }
        el.magnifierLoupe.style.display = "block";
        el.loupeLabel.textContent = labelText;

        const stRect = el.fsStageWrap.getBoundingClientRect();
        const relX = clientX - stRect.left;
        const leftPx = relX < stRect.width * 0.5 ? Math.max(10, stRect.width - 124) : 10;
        const topPx = 12;

        el.magnifierLoupe.style.left = `${leftPx}px`;
        el.magnifierLoupe.style.top = `${topPx}px`;

        const lCtx = el.loupeCanvas.getContext("2d");
        const lw = el.loupeCanvas.width;
        const lh = el.loupeCanvas.height;
        lCtx.fillStyle = "#0f172a";
        lCtx.fillRect(0, 0, lw, lh);

        const zoom = 3.8;
        const srcRadius = (lw / 2) / zoom;
        lCtx.drawImage(
          page.srcCanvas,
          imgX - srcRadius,
          imgY - srcRadius,
          srcRadius * 2,
          srcRadius * 2,
          0,
          0,
          lw,
          lh
        );

        lCtx.strokeStyle = "#38bdf8";
        lCtx.lineWidth = 1.8;
        lCtx.beginPath();
        lCtx.moveTo(lw / 2, 0);
        lCtx.lineTo(lw / 2, lh);
        lCtx.moveTo(0, lh / 2);
        lCtx.lineTo(lw, lh / 2);
        lCtx.stroke();
      }

      function getFsCanvasCoords(clientX, clientY) {
        const rect = el.fsCanvas.getBoundingClientRect();
        const scaleX = el.fsCanvas.width / Math.max(1, rect.width);
        const scaleY = el.fsCanvas.height / Math.max(1, rect.height);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
          clientX,
          clientY,
          scaleX
        };
      }

      function findNoteHitHandle(page, pt, targetCanvasName) {
        if (!page || !page.note || !page.note.trim() || !page._noteBounds) return null;
        const nb = page._noteBounds;
        const hitPad = Math.max(24, 30 * (pt.scaleX || 1));

        // 1. Check bottom-right resize handle (⤡) first
        if (Math.hypot(pt.x - nb.resizeHx, pt.y - nb.resizeHy) <= Math.max(nb.handleR * 2.2, hitPad)) {
          return {
            type: "note_resize",
            targetCanvas: targetCanvasName || "fs",
            startX: pt.x,
            startY: pt.y,
            origSize: page.noteSize || 28,
            cx: nb.cx,
            cy: nb.cy,
            startDist: Math.max(16, Math.hypot(pt.x - nb.cx, pt.y - nb.cy))
          };
        }

        // 2. Check inside note bounding box for free movement
        if (
          pt.x >= nb.boxX - 12 &&
          pt.x <= nb.boxX + nb.boxW + 12 &&
          pt.y >= nb.boxY - 12 &&
          pt.y <= nb.boxY + nb.boxH + 12
        ) {
          return {
            type: "note_move",
            targetCanvas: targetCanvasName || "fs",
            startX: pt.x,
            startY: pt.y,
            origNoteX: typeof page.noteX === "number" ? page.noteX : 0.50,
            origNoteY: typeof page.noteY === "number" ? page.noteY : 0.88
          };
        }
        return null;
      }

      function getMainCanvasCoords(clientX, clientY) {
        const rect = el.mainCanvas.getBoundingClientRect();
        const scaleX = el.mainCanvas.width / Math.max(1, rect.width);
        const scaleY = el.mainCanvas.height / Math.max(1, rect.height);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
          clientX,
          clientY,
          scaleX
        };
      }

      function findHitHandle(page, pt) {
        if (!state.fsCropMode) {
          return findNoteHitHandle(page, pt, "fs");
        }
        const hitRadius = Math.max(34, 46 * (pt.scaleX || 1));
        const c = page.corners;

        let bestCorner = -1;
        let bestDist = hitRadius;
        for (let i = 0; i < 4; i++) {
          const d = Math.hypot(pt.x - c[i].x, pt.y - c[i].y);
          if (d <= bestDist) {
            bestDist = d;
            bestCorner = i;
          }
        }
        if (bestCorner !== -1) {
          return {
            type: "corner",
            index: bestCorner,
            startX: pt.x,
            startY: pt.y,
            origX: c[bestCorner].x,
            origY: c[bestCorner].y,
            label: ["Góc TL", "Góc TR", "Góc BR", "Góc BL"][bestCorner]
          };
        }

        // Allow hitting all 20 intermediate edge points (5 points per edge) when in "❖ Căn đa điểm" mode!
        if (state.alignPointMode === "multipt") {
          const edgeNames = ["Trên", "Phải", "Dưới", "Trái"];
          let bestEdge = -1, bestSub = -1, bestSubDist = hitRadius;
          for (let edgeIdx = 0; edgeIdx < 4; edgeIdx++) {
            for (let subIdx = 0; subIdx < NUM_EDGE_SUBPOINTS; subIdx++) {
              const mp = getEdgeSubHandlePos(page, edgeIdx, subIdx);
              const d = Math.hypot(pt.x - mp.x, pt.y - mp.y);
              if (d <= bestSubDist) {
                bestSubDist = d;
                bestEdge = edgeIdx;
                bestSub = subIdx;
              }
            }
          }
          if (bestEdge !== -1) {
            if (!page.edgeOffsets) page.edgeOffsets = createZeroEdgeOffsets();
            const eOff = page.edgeOffsets[bestEdge][bestSub] || { x: 0, y: 0 };
            return {
              type: "edge_sub",
              edgeIdx: bestEdge,
              subIdx: bestSub,
              startX: pt.x,
              startY: pt.y,
              origOffX: eOff.x,
              origOffY: eOff.y,
              label: `${edgeNames[bestEdge]} ${bestSub + 1}/5`
            };
          }
        }
        return null;
      }

      function onFsTouchStart(evt) {
        const page = getCurrentPage();
        if (!page) return;
        if (
          evt.target.closest("#editDropdownMenu") ||
          evt.target.closest("#btnToggleEditDropdown") ||
          evt.target.closest(".fs-corner-right-group") ||
          evt.target.closest("#fsCropBar")
        ) {
          return;
        }

        // Tapping anywhere on the image viewport outside the menu closes the ☰ drawer!
        if (el.editDropdownMenu.classList.contains("open")) {
          toggleEditDropdown(false);
        }

        if (evt.touches && evt.touches.length === 2) {
          if (state.draggingHandle) {
            if (state.preTouchCorners) page.corners = state.preTouchCorners.map((p) => ({ ...p }));
            if (state.preTouchMidOffsets) page.edgeOffsets = cloneEdgeOffsets(state.preTouchMidOffsets);
            renderFullScreenEditor();
          }
          state.draggingHandle = null;
          el.magnifierLoupe.style.display = "none";

          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const midX = (t0.clientX + t1.clientX) * 0.5;
          const midY = (t0.clientY + t1.clientY) * 0.5;
          const stRect = el.fsStageWrap.getBoundingClientRect();
          state.pinchState = {
            target: "fs",
            startDist: Math.max(12, dist),
            startZoom: state.fsZoom,
            startPanX: state.fsPanX,
            startPanY: state.fsPanY,
            startMidX: midX,
            startMidY: midY,
            centerX: stRect.left + stRect.width * 0.5,
            centerY: stRect.top + stRect.height * 0.5
          };
          evt.preventDefault();
          return;
        }

        if (evt.touches && evt.touches.length === 1) {
          if (Date.now() < state.pinchCooldownUntil) {
            evt.preventDefault();
            return;
          }
          const t0 = evt.touches[0];
          const pt = getFsCanvasCoords(t0.clientX, t0.clientY);
          state.preTouchCorners = page.corners.map((p) => ({ ...p }));
          state.preTouchMidOffsets = cloneEdgeOffsets(page.edgeOffsets);

          const hit = findHitHandle(page, pt);
          if (hit) {
            state.draggingHandle = hit;
            el.fsCropBar.classList.add("dragging-fade");
            if (hit.type === "corner") {
              updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label);
            } else if (hit.type === "edge_sub") {
              const mp = getEdgeSubHandlePos(page, hit.edgeIdx, hit.subIdx);
              updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label);
            }
            evt.preventDefault();
            return;
          }

          const now = Date.now();
          if (now - state.lastTapTime < 280 && Math.hypot(t0.clientX - state.lastTapX, t0.clientY - state.lastTapY) < 32) {
            state.lastTapTime = 0;
            if (state.fsZoom > 1.15) {
              resetFsZoom();
            } else {
              state.fsZoom = 2.3;
              applyFsTransform();
            }
            evt.preventDefault();
            return;
          }
          state.lastTapTime = now;
          state.lastTapX = t0.clientX;
          state.lastTapY = t0.clientY;

          if (state.fsZoom > 1.02) {
            state.draggingHandle = {
              type: "fs_pan",
              startClientX: t0.clientX,
              startClientY: t0.clientY,
              origPanX: state.fsPanX,
              origPanY: state.fsPanY
            };
            evt.preventDefault();
          }
        }
      }

      function onFsMouseDown(evt) {
        const page = getCurrentPage();
        if (!page) return;
        if (
          evt.target.closest("#editDropdownMenu") ||
          evt.target.closest("#btnToggleEditDropdown") ||
          evt.target.closest(".fs-corner-right-group") ||
          evt.target.closest("#fsCropBar")
        ) {
          return;
        }
        if (el.editDropdownMenu.classList.contains("open")) {
          toggleEditDropdown(false);
        }
        const pt = getFsCanvasCoords(evt.clientX, evt.clientY);
        state.preTouchCorners = page.corners.map((p) => ({ ...p }));
        state.preTouchMidOffsets = cloneEdgeOffsets(page.edgeOffsets);
        const hit = findHitHandle(page, pt);
        if (hit) {
          state.draggingHandle = hit;
          el.fsCropBar.classList.add("dragging-fade");
          if (hit.type === "corner") {
            updateMagnifierLoupe(hit.origX, hit.origY, pt.clientX, pt.clientY, hit.label);
          } else if (hit.type === "edge_sub") {
            const mp = getEdgeSubHandlePos(page, hit.edgeIdx, hit.subIdx);
            updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, hit.label);
          }
          evt.preventDefault();
          return;
        }
        if (state.fsZoom > 1.02) {
          state.draggingHandle = {
            type: "fs_pan",
            startClientX: evt.clientX,
            startClientY: evt.clientY,
            origPanX: state.fsPanX,
            origPanY: state.fsPanY
          };
          evt.preventDefault();
        }
      }

      function onGlobalPointerMove(evt) {
        if (state.pinchState && evt.touches && evt.touches.length === 2) {
          const t0 = evt.touches[0];
          const t1 = evt.touches[1];
          const currDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const currMidX = (t0.clientX + t1.clientX) * 0.5;
          const currMidY = (t0.clientY + t1.clientY) * 0.5;
          const newZoom = Math.max(0.8, Math.min(5.0, state.pinchState.startZoom * (currDist / state.pinchState.startDist)));
          const zoomRatio = newZoom / state.pinchState.startZoom;
          const relX = state.pinchState.startMidX - state.pinchState.centerX;
          const relY = state.pinchState.startMidY - state.pinchState.centerY;

          if (state.pinchState.target === "fs") {
            state.fsZoom = newZoom;
            state.fsPanX = (currMidX - state.pinchState.startMidX) + relX - (relX - state.pinchState.startPanX) * zoomRatio;
            state.fsPanY = (currMidY - state.pinchState.startMidY) + relY - (relY - state.pinchState.startPanY) * zoomRatio;
            applyFsTransform();
          } else {
            state.stageZoom = newZoom;
            state.stagePanX = (currMidX - state.pinchState.startMidX) + relX - (relX - state.pinchState.startPanX) * zoomRatio;
            state.stagePanY = (currMidY - state.pinchState.startMidY) + relY - (relY - state.pinchState.startPanY) * zoomRatio;
            applyStageTransform();
          }
          evt.preventDefault();
          return;
        }

        if (!state.draggingHandle) return;
        const page = getCurrentPage();
        if (!page) return;

        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        if (state.draggingHandle.type === "stage_pan") {
          state.stagePanX = state.draggingHandle.origPanX + (clientX - state.draggingHandle.startClientX);
          state.stagePanY = state.draggingHandle.origPanY + (clientY - state.draggingHandle.startClientY);
          applyStageTransform();
          evt.preventDefault();
          return;
        }

        if (state.draggingHandle.type === "fs_pan") {
          state.fsPanX = state.draggingHandle.origPanX + (clientX - state.draggingHandle.startClientX);
          state.fsPanY = state.draggingHandle.origPanY + (clientY - state.draggingHandle.startClientY);
          applyFsTransform();
          evt.preventDefault();
          return;
        }

        if (state.draggingHandle.type === "note_move") {
          const isMain = state.draggingHandle.targetCanvas === "main";
          const ptNote = isMain ? getMainCanvasCoords(clientX, clientY) : getFsCanvasCoords(clientX, clientY);
          const cw = isMain ? el.mainCanvas.width : el.fsCanvas.width;
          const ch = isMain ? el.mainCanvas.height : el.fsCanvas.height;
          const dxNorm = (ptNote.x - state.draggingHandle.startX) / Math.max(1, cw);
          const dyNorm = (ptNote.y - state.draggingHandle.startY) / Math.max(1, ch);
          page.noteX = Math.max(0.05, Math.min(0.95, state.draggingHandle.origNoteX + dxNorm));
          page.noteY = Math.max(0.04, Math.min(0.96, state.draggingHandle.origNoteY + dyNorm));
          renderStage();
          if (el.fullScreenEditorModal.classList.contains("open")) {
            renderFullScreenEditor();
          }
          evt.preventDefault();
          return;
        }

        if (state.draggingHandle.type === "note_resize") {
          const isMain = state.draggingHandle.targetCanvas === "main";
          const ptNote = isMain ? getMainCanvasCoords(clientX, clientY) : getFsCanvasCoords(clientX, clientY);
          const currDist = Math.max(12, Math.hypot(ptNote.x - state.draggingHandle.cx, ptNote.y - state.draggingHandle.cy));
          const ratio = currDist / state.draggingHandle.startDist;
          const newSize = Math.max(14, Math.min(64, Math.round(state.draggingHandle.origSize * ratio)));
          page.noteSize = newSize;
          if (el.ddNoteSizeSlider) el.ddNoteSizeSlider.value = newSize;
          if (el.ddNoteSizeVal) el.ddNoteSizeVal.textContent = `${newSize}px`;
          renderStage();
          if (el.fullScreenEditorModal.classList.contains("open")) {
            renderFullScreenEditor();
          }
          evt.preventDefault();
          return;
        }

        const pt = getFsCanvasCoords(clientX, clientY);
        const w = el.fsCanvas.width;
        const h = el.fsCanvas.height;

        if (state.draggingHandle.type === "corner") {
          const idx = state.draggingHandle.index;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          const nx = Math.max(0, Math.min(w, Math.round(state.draggingHandle.origX + dx)));
          const ny = Math.max(0, Math.min(h, Math.round(state.draggingHandle.origY + dy)));
          page.corners[idx].x = nx;
          page.corners[idx].y = ny;
          updateMagnifierLoupe(nx, ny, pt.clientX, pt.clientY, state.draggingHandle.label);
          renderFullScreenEditor();
        } else if (state.draggingHandle.type === "edge_sub") {
          const eIdx = state.draggingHandle.edgeIdx;
          const sIdx = state.draggingHandle.subIdx;
          const dx = pt.x - state.draggingHandle.startX;
          const dy = pt.y - state.draggingHandle.startY;
          if (!page.edgeOffsets) page.edgeOffsets = createZeroEdgeOffsets();
          page.edgeOffsets[eIdx][sIdx].x = Math.round(state.draggingHandle.origOffX + dx);
          page.edgeOffsets[eIdx][sIdx].y = Math.round(state.draggingHandle.origOffY + dy);
          const mp = getEdgeSubHandlePos(page, eIdx, sIdx);
          updateMagnifierLoupe(mp.x, mp.y, pt.clientX, pt.clientY, state.draggingHandle.label);
          renderFullScreenEditor();
        }
        evt.preventDefault();
      }

      function onGlobalPointerUp(evt) {
        if (state.pinchState && (!evt.touches || evt.touches.length < 2)) {
          state.pinchState = null;
          state.pinchCooldownUntil = Date.now() + 180;
          state.draggingHandle = null;
          return;
        }
        if (!state.draggingHandle) return;
        const dragType = state.draggingHandle.type;
        state.draggingHandle = null;
        el.fsCropBar.classList.remove("dragging-fade");
        el.magnifierLoupe.style.display = "none";
        if (dragType === "corner" || dragType === "edge_sub") {
          const page = getCurrentPage();
          if (page) {
            updateGeometryAndProcess(page);
            renderPageList();
            renderStage();
          }
        }
      }

      // =========================================================================
      // 8. CLEAN "THƯ VIỆN" (LIBRARY): "TRANG X / Y" BADGE + "XEM" & "XÓA" + MULTI-SELECT
      // =========================================================================
      function addNewPageFromCanvas(srcCanvas, name, customCorners, customMidOffsets, initialBookCurve, initialNote) {
        const detectedCorners = customCorners ? customCorners.map((p) => ({ ...p })) : detectDocumentCorners(srcCanvas);
        const edgeOffsets = customMidOffsets
          ? cloneEdgeOffsets(customMidOffsets)
          : (srcCanvas._detectedEdgeOffsets ? cloneEdgeOffsets(srcCanvas._detectedEdgeOffsets) : createZeroEdgeOffsets());
        state.alignPointMode = srcCanvas._hasCurvedRim ? "multipt" : "4pt";

        const settings = cloneSettings(state.defaultSettings);
        if (typeof initialBookCurve === "number") {
          settings.bookCurve = initialBookCurve;
        }

        const pageObj = {
          id: "page_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
          name: name || `ScanhoahocABC_${state.pages.length + 1}`,
          createdAt: formatTimeStr(new Date()),
          note: initialNote || "",
          noteX: 0.50,
          noteY: 0.88,
          noteSize: 28,
          noteColor: "#dc2626",
          includeNoteOnExport: true,
          srcCanvas,
          corners: detectedCorners,
          edgeOffsets,
          dewarpedCanvas: null,
          filterCache: null,
          processedCanvas: null,
          settings
        };
        updateGeometryAndProcess(pageObj);
        state.pages.push(pageObj);
        state.currentPageIndex = state.pages.length - 1;
        resetStageZoom();
        syncControlsFromPage(pageObj);
        renderPageList();
        renderStage();
      }

      function deletePageAtIndex(idx) {
        if (idx < 0 || idx >= state.pages.length) return;
        const removedPage = state.pages[idx];
        const removedName = removedPage.name;
        state.selectedPageIds.delete(removedPage.id);
        state.pages.splice(idx, 1);

        if (state.pages.length === 0) {
          state.currentPageIndex = -1;
          state.libMultiSelect = false;
          state.selectedPageIds.clear();
          state.fsCropMode = false;
          el.fullScreenEditorModal.classList.remove("open");
          resetStageZoom();
          syncControlsFromPage(null);
          renderPageList();
          renderStage();
          showToast(`Đã xóa "${removedName}" (Thư viện trống)!`);
          return;
        }

        if (state.currentPageIndex >= state.pages.length) {
          state.currentPageIndex = state.pages.length - 1;
        } else if (idx < state.currentPageIndex) {
          state.currentPageIndex--;
        }
        resetStageZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        if (el.fullScreenEditorModal.classList.contains("open")) {
          renderFullScreenEditor();
        }
        showToast(`Đã xóa "${removedName}"!`);
      }

      function enterMultiSelectMode(initialPageId) {
        state.libMultiSelect = true;
        if (initialPageId) {
          state.selectedPageIds.add(initialPageId);
        }
        if (navigator.vibrate) {
          try { navigator.vibrate(30); } catch (_) {}
        }
        renderPageList();
      }

      function exitMultiSelectMode() {
        state.libMultiSelect = false;
        state.selectedPageIds.clear();
        renderPageList();
      }

      function toggleSelectPageId(pageId) {
        if (state.selectedPageIds.has(pageId)) {
          state.selectedPageIds.delete(pageId);
        } else {
          state.selectedPageIds.add(pageId);
        }
        renderPageList();
      }

      function getSelectedPagesList() {
        return state.pages.filter((p) => state.selectedPageIds.has(p.id));
      }

      function deleteSelectedPagesInLibrary() {
        const count = state.selectedPageIds.size;
        if (!count) return;
        state.pages = state.pages.filter((p) => !state.selectedPageIds.has(p.id));
        state.selectedPageIds.clear();
        state.libMultiSelect = false;

        if (state.pages.length === 0) {
          state.currentPageIndex = -1;
          el.fullScreenEditorModal.classList.remove("open");
        } else if (state.currentPageIndex >= state.pages.length) {
          state.currentPageIndex = state.pages.length - 1;
        }
        resetStageZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        showToast(`Đã xóa ${count} ảnh đã chọn!`);
      }

      function goToAdjacentPage(delta) {
        const nextIdx = state.currentPageIndex + delta;
        if (nextIdx < 0 || nextIdx >= state.pages.length) return;
        state.currentPageIndex = nextIdx;
        resetStageZoom();
        resetFsZoom();
        syncControlsFromPage(getCurrentPage());
        renderPageList();
        renderStage();
        if (el.fullScreenEditorModal.classList.contains("open")) {
          renderFullScreenEditor();
        }
      }

      function bindLongPressAndClick(itemEl, pageObj, idx) {
        let pressTimer = null;
        let startX = 0, startY = 0;
        let longPressTriggered = false;

        function clearTimer() {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        }

        itemEl.addEventListener("touchstart", (e) => {
          if (e.target.closest("button")) return;
          if (!e.touches || e.touches.length !== 1) return;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          longPressTriggered = false;
          clearTimer();
          pressTimer = setTimeout(() => {
            longPressTriggered = true;
            if (!state.libMultiSelect) {
              enterMultiSelectMode(pageObj.id);
            } else {
              toggleSelectPageId(pageObj.id);
            }
          }, 380);
        }, { passive: true });

        itemEl.addEventListener("touchmove", (e) => {
          if (!pressTimer || !e.touches || !e.touches.length) return;
          if (Math.hypot(e.touches[0].clientX - startX, e.touches[0].clientY - startY) > 12) {
            clearTimer();
          }
        }, { passive: true });

        itemEl.addEventListener("touchend", clearTimer);
        itemEl.addEventListener("touchcancel", clearTimer);

        itemEl.addEventListener("mousedown", (e) => {
          if (e.button !== 0 || e.target.closest("button")) return;
          startX = e.clientX;
          startY = e.clientY;
          longPressTriggered = false;
          clearTimer();
          pressTimer = setTimeout(() => {
            longPressTriggered = true;
            if (!state.libMultiSelect) {
              enterMultiSelectMode(pageObj.id);
            } else {
              toggleSelectPageId(pageObj.id);
            }
          }, 380);
        });

        itemEl.addEventListener("mousemove", (e) => {
          if (!pressTimer) return;
          if (Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
            clearTimer();
          }
        });

        itemEl.addEventListener("mouseup", clearTimer);
        itemEl.addEventListener("mouseleave", clearTimer);

        itemEl.addEventListener("contextmenu", (e) => {
          if (e.target.closest("button")) return;
          e.preventDefault();
          if (!state.libMultiSelect) {
            enterMultiSelectMode(pageObj.id);
          }
        });

        itemEl.addEventListener("click", (e) => {
          if (e.target.closest("button")) return;
          if (longPressTriggered) {
            longPressTriggered = false;
            return;
          }
          if (state.libMultiSelect) {
            toggleSelectPageId(pageObj.id);
            return;
          }
          state.currentPageIndex = idx;
          resetStageZoom();
          syncControlsFromPage(getCurrentPage());
          renderPageList();
          renderStage();
        });
      }

      function getScaledExportCanvas(page) {
        if (!page.processedCanvas) updateGeometryAndProcess(page);
        const src = page.processedCanvas;
        const scale = parseFloat(el.exportScale.value) || 1;
        const outW = Math.round(src.width * scale);
        const outH = Math.round(src.height * scale);
        const hasNote = page.note && page.note.trim().length > 0;

        if (Math.abs(scale - 1) < 0.01 && !hasNote) return src;

        const out = document.createElement("canvas");
        out.width = outW;
        out.height = outH;
        const ctx = out.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(src, 0, 0, outW, outH);

        if (hasNote) {
          drawNoteOverlayOnCanvas(ctx, outW, outH, page, false);
        }
        return out;
      }

      function generatePdfBlobFromPages(pagesToExport, quality) {
        const enc = new TextEncoder();
        const chunks = [];
        let offset = 0;
        const xref = [0];

        function pushStr(str) {
          const bytes = enc.encode(str);
          chunks.push(bytes);
          offset += bytes.length;
        }
        function pushBytes(bytes) {
          chunks.push(bytes);
          offset += bytes.length;
        }
        function startObj(id) {
          xref[id] = offset;
          pushStr(`${id} 0 obj\n`);
        }
        function endObj() {
          pushStr(`\nendobj\n`);
        }

        pushStr("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");

        const numPages = pagesToExport.length;
        startObj(1);
        pushStr(`<< /Type /Catalog /Pages 2 0 R >>`);
        endObj();

        const kidsRefs = pagesToExport.map((_, i) => `${3 + i * 3} 0 R`).join(" ");
        startObj(2);
        pushStr(`<< /Type /Pages /Kids [ ${kidsRefs} ] /Count ${numPages} >>`);
        endObj();

        for (let i = 0; i < numPages; i++) {
          const p = pagesToExport[i];
          const expCanvas = getScaledExportCanvas(p);
          const flat = document.createElement("canvas");
          flat.width = expCanvas.width;
          flat.height = expCanvas.height;
          const fctx = flat.getContext("2d");
          fctx.fillStyle = "#ffffff";
          fctx.fillRect(0, 0, flat.width, flat.height);
          fctx.drawImage(expCanvas, 0, 0);

          const dataUrl = flat.toDataURL("image/jpeg", quality);
          const b64 = dataUrl.split(",")[1];
          const binStr = atob(b64);
          const jpgBytes = new Uint8Array(binStr.length);
          for (let k = 0; k < binStr.length; k++) jpgBytes[k] = binStr.charCodeAt(k);

          const ptW = 595.28;
          const ptH = Math.round((flat.height / flat.width) * 595.28 * 100) / 100;

          const pageObjId = 3 + i * 3;
          const contentObjId = 4 + i * 3;
          const imgObjId = 5 + i * 3;

          const contentCmd = `q\n${ptW} 0 0 ${ptH} 0 0 cm\n/Im${i} Do\nQ\n`;

          startObj(pageObjId);
          pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im${i} ${imgObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>`);
          endObj();

          startObj(contentObjId);
          pushStr(`<< /Length ${contentCmd.length} >>\nstream\n${contentCmd}endstream`);
          endObj();

          startObj(imgObjId);
          pushStr(`<< /Type /XObject /Subtype /Image /Width ${flat.width} /Height ${flat.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgBytes.length} >>\nstream\n`);
          pushBytes(jpgBytes);
          pushStr(`\nendstream`);
          endObj();
        }

        const totalObjs = 3 + numPages * 3;
        const startXrefOffset = offset;
        pushStr(`xref\n0 ${totalObjs}\n0000000000 65535 f \n`);
        for (let id = 1; id < totalObjs; id++) {
          const offStr = String(xref[id]).padStart(10, "0");
          pushStr(`${offStr} 00000 n \n`);
        }
        pushStr(`trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${startXrefOffset}\n%%EOF`);

        return new Blob(chunks, { type: "application/pdf" });
      }

      function generateTiffBlob(canvas, dpi) {
        const w = canvas.width;
        const h = canvas.height;
        const ctx = canvas.getContext("2d");
        const rgba = ctx.getImageData(0, 0, w, h).data;
        const rgbLen = w * h * 3;
        const headerAndIfdSize = 8 + 2 + 12 * 12 + 4 + 16 + 6;
        const buf = new ArrayBuffer(headerAndIfdSize + rgbLen);
        const view = new DataView(buf);
        const bytes = new Uint8Array(buf);

        view.setUint16(0, 0x4949, true);
        view.setUint16(2, 42, true);
        view.setUint32(4, 8, true);

        const numEntries = 12;
        view.setUint16(8, numEntries, true);
        let pos = 10;
        function writeTag(tag, type, count, valOrOffset) {
          view.setUint16(pos, tag, true);
          view.setUint16(pos + 2, type, true);
          view.setUint32(pos + 4, count, true);
          view.setUint32(pos + 8, valOrOffset, true);
          pos += 12;
        }

        const extraOffset = 10 + numEntries * 12 + 4;
        const stripOffset = headerAndIfdSize;

        view.setUint16(extraOffset + 16, 8, true);
        view.setUint16(extraOffset + 18, 8, true);
        view.setUint16(extraOffset + 20, 8, true);

        view.setUint32(extraOffset, dpi, true);
        view.setUint32(extraOffset + 4, 1, true);
        view.setUint32(extraOffset + 8, dpi, true);
        view.setUint32(extraOffset + 12, 1, true);

        writeTag(256, 4, 1, w);
        writeTag(257, 4, 1, h);
        writeTag(258, 3, 3, extraOffset + 16);
        writeTag(259, 3, 1, 1);
        writeTag(262, 3, 1, 2);
        writeTag(273, 4, 1, stripOffset);
        writeTag(277, 3, 1, 3);
        writeTag(278, 4, 1, h);
        writeTag(279, 4, 1, rgbLen);
        writeTag(282, 5, 1, extraOffset);
        writeTag(283, 5, 1, extraOffset + 8);
        writeTag(296, 3, 1, 2);

        view.setUint32(pos, 0, true);

        let dst = stripOffset;
        for (let i = 0; i < w * h; i++) {
          const si = i * 4;
          const a = rgba[si + 3] / 255;
          bytes[dst++] = Math.round(rgba[si] * a + 255 * (1 - a));
          bytes[dst++] = Math.round(rgba[si + 1] * a + 255 * (1 - a));
          bytes[dst++] = Math.round(rgba[si + 2] * a + 255 * (1 - a));
        }

        return new Blob([buf], { type: "image/tiff" });
      }

      function generateSvgBlob(canvas) {
        const pngUrl = canvas.toDataURL("image/png");
        const svgContent = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${canvas.width} ${canvas.height}" width="${canvas.width}" height="${canvas.height}">\n  <image href="${pngUrl}" width="${canvas.width}" height="${canvas.height}" />\n</svg>`;
        return new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
      }

      function formatByteSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
      }

      function triggerBlobDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 500);
      }

      function downloadSinglePageObj(page, overrideFmt, customBaseName) {
        if (!page) return;
        const fmt = overrideFmt || el.exportFormat.value;
        const q = Math.max(0.5, Math.min(1.0, (parseInt(el.exportQualitySlider.value, 10) || 94) / 100));
        const baseName = (customBaseName || page.name || "ScanhoahocABC").trim();
        const expCanvas = getScaledExportCanvas(page);

        if (fmt === "pdf") {
          const blob = generatePdfBlobFromPages([page], q);
          triggerBlobDownload(blob, `${baseName}.pdf`);
          showToast(`Đã lưu PDF (${formatByteSize(blob.size)})!`);
          return;
        }
        if (fmt === "tiff") {
          const scale = parseFloat(el.exportScale.value) || 1;
          const dpi = scale >= 2 ? 600 : scale >= 1.5 ? 300 : 200;
          const blob = generateTiffBlob(expCanvas, dpi);
          triggerBlobDownload(blob, `${baseName}.tif`);
          showToast(`Đã lưu TIFF ${dpi} DPI!`);
          return;
        }
        if (fmt === "svg") {
          const blob = generateSvgBlob(expCanvas);
          triggerBlobDownload(blob, `${baseName}.svg`);
          showToast(`Đã lưu SVG!`);
          return;
        }

        let targetCanvas = expCanvas;
        if (fmt === "jpeg") {
          const flat = document.createElement("canvas");
          flat.width = expCanvas.width;
          flat.height = expCanvas.height;
          const fctx = flat.getContext("2d");
          fctx.fillStyle = "#ffffff";
          fctx.fillRect(0, 0, flat.width, flat.height);
          fctx.drawImage(expCanvas, 0, 0);
          targetCanvas = flat;
        }

        const mime = fmt === "png" ? "image/png" : fmt === "webp" ? "image/webp" : "image/jpeg";
        const ext = fmt === "png" ? "png" : fmt === "webp" ? "webp" : "jpg";
        targetCanvas.toBlob((blob) => {
          if (!blob) return;
          triggerBlobDownload(blob, `${baseName}.${ext}`);
          showToast(`Đã lưu ${baseName}.${ext}!`);
        }, mime, q);
      }
